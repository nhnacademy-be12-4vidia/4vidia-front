<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="utf-8">
    <title>4VIDIA - 도서 쇼핑몰</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        /* ------------------------------------------------ */
        /* 공통 레이아웃 정리 */
        /* ------------------------------------------------ */

        .row {
            display: flex;
            flex-wrap: wrap !important;
            justify-content: center;
        }

        /* ------------------------------------------------ */
        /* 카드 Wrapper */
        /* ------------------------------------------------ */
        .book-card-wrapper {
            flex-shrink: 0;
            width: 250px;
            padding: 0 0.75rem;
            margin-bottom: 2.5rem;
        }

        /* ------------------------------------------------ */
        /* 카드 디자인 */
        /* ------------------------------------------------ */
        .book-card {
            border: none;
            border-radius: 0.5rem;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 0.25rem 1.25rem rgba(0,0,0,0.12);
            transition: all 0.25s ease;
        }

        .book-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 0.75rem 2rem rgba(0,0,0,0.18);
        }

        /* 이미지 hover 확대 */
        .card-img-wrapper {
            position: relative;
            overflow: hidden;
        }

        .card-img-wrapper img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            transition: transform 0.35s ease;
        }

        .book-card:hover .card-img-wrapper img {
            transform: scale(1.07);
        }

        /* ------------------------------------------------ */
        /* 뱃지(NEW, BEST) */
        /* ------------------------------------------------ */
        .badge-new,
        .badge-best {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 5;
            padding: 5px 10px;
            border-radius: 0.35rem;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-new {
            background-color: #1cc88a;
            color: white;
        }

        .badge-best {
            background-color: #e74a3b;
            color: white;
        }

        /* ------------------------------------------------ */
        /* 좋아요 버튼 */
        /* ------------------------------------------------ */
        .btn-heart {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 5;
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            background: rgba(255,255,255,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 3px 8px rgba(0,0,0,0.18);
            transition: background 0.15s, transform 0.2s;
        }

        .btn-heart:hover {
            background: #ffe5e5;
            transform: scale(1.08);
        }

        .btn-heart i {
            font-size: 1.1rem;
            color: #777;
        }

        .btn-heart i.fas {
            color: #e74a3b;
        }

        /* ------------------------------------------------ */
        /* 텍스트 영역 */
        /* ------------------------------------------------ */
        .card-body {
            padding: 1rem;
        }

        .category-badge {
            color: #4e73df;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 700;
        }

        /* 평점 */
        .rating {
            color: #f6c23e;
            font-size: 0.9rem;
        }

        /* 가격 */
        .price-original {
            text-decoration: line-through;
            color: #858796;
            font-size: 0.9rem;
        }

        .price-current {
            color: #4e73df;
            font-weight: 700;
            font-size: 1.15rem;
        }

        /* ------------------------------------------------ */
        /* 버튼 스타일 */
        /* ------------------------------------------------ */
        .book-card .card-body form {
            margin-bottom: 0.6rem;
        }

        .book-card .card-body form:last-child {
            margin-bottom: 0;
        }

        .btn-block {
            width: 100%;
            padding: 0.55rem 0;
            font-weight: 600;
            border-radius: 0.35rem;
        }

        .btn-primary {
            background: #4e73df;
            border: none;
        }

        .btn-primary:hover {
            background: #365acb;
        }

        .btn-secondary {
            background: #858796;
            border: none;
        }

        .btn-secondary:hover {
            background: #6c6f7a;
        }

        /* ------------------------------------------------ */
        /* 카테고리 Pill */
        /* ------------------------------------------------ */
        .category-pill {
            padding: 0.5rem 1.3rem;
            border-radius: 30px;
            border: 1px solid #d8dce6;
            background: white;
            color: #61636b;
            font-size: 0.85rem;
            font-weight: 600;
            margin-right: 0.4rem;
            margin-bottom: 0.5rem;
            display: inline-block;
            transition: all 0.2s ease;
        }

        .category-pill:hover {
            background: #4e73df;
            border-color: #4e73df;
            color: white;
        }

        .category-pill.active {
            background: #4e73df;
            color: white;
        }

        /* ------------------------------------------------ */
        /* 반응형 디자인 */
        /* ------------------------------------------------ */
        @media (max-width: 992px) {
            .book-card-wrapper {
                width: 45%;
            }
        }

        @media (max-width: 576px) {
            .book-card-wrapper {
                width: 90%;
            }
            .card-img-wrapper img {
                height: 260px;
            }
        }

    </style>
    <script th:src="@{/js/askMoveCart.js}"></script>
    <script>
        // 좋아요/찜하기 토글 (AJAX/Fetch API 사용)
        function toggleLike(button) {
            const bookId = button.getAttribute('data-book-id');
            const icon = button.querySelector('i');
            const isLiked = icon.classList.contains('fas');

            let method = isLiked ? 'DELETE' : 'POST';
            let url = `/mypage/like/test?bookId=${bookId}`;

            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                }
            })
                .then(response => {
                    if (response.ok) {
                        icon.classList.toggle('far');
                        icon.classList.toggle('fas');
                        alert(isLiked ? `[${bookId}] 찜 취소되었습니다.` : `[${bookId}] 찜 등록되었습니다!`);
                    } else if (response.status === 401) {
                        alert('처리 실패: 로그인이 필요합니다.');
                    } else {
                        alert('처리 실패: 서버 오류이거나 잘못된 요청입니다. (상태: ' + response.status + ')');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('요청 중 네트워크 오류가 발생했습니다.');
                });
        }

        // **TODO: askMoveCart.js 파일의 addToCartAndConfirmMove 함수가 필요합니다.**
        function addToCartAndConfirmMove(bookId, quantity) {
            // 장바구니 추가 로직 실행 후 이동 여부 묻는 팝업을 띄우는 함수 (백엔드 구현 필요)
            console.log(`장바구니에 상품 ${bookId}를 ${quantity}개 추가했습니다. (askMoveCart.js 대체)`);
            if (confirm("장바구니에 상품을 추가했습니다. 지금 장바구니로 이동하시겠습니까?")) {
                location.href = '/cart'; // 실제 장바구니 페이지 URL로 변경 필요
            }
        }
    </script>
</head>


<body>
<div layout:fragment="content">
    <div class="container">

        <div class="d-sm-flex align-items-center justify-content-center mb-4 text-center w-100">
            <div>
                <h1 class="h3 mb-2 text-gray-800">베스트셀러 도서</h1>
                <p class="mb-0 text-gray-600">4VIDIA에서 가장 인기있는 도서들을 만나보세요</p>
            </div>
        </div>

        <div class="mb-4 text-center">
            <a href="#" class="category-pill active" data-category="all">전체</a>
            <a href="#" class="category-pill" data-category="문학">문학</a>
            <a href="#" class="category-pill" data-category="소설">소설</a>
            <a href="#" class="category-pill" data-category="에세이">에세이</a>
            <a href="#" class="category-pill" data-category="자기계발">자기계발</a>
            <a href="#" class="category-pill" data-category="교육">교육</a>
            <a href="#" class="category-pill" data-category="여행">여행</a>
        </div>

        <div class="row justify-content-center">

            <div th:if="${#lists.isEmpty(books)}" class="col-12 text-center py-5">
                <i class="fas fa-book-open fa-3x text-secondary mb-3"></i>
                <p class="text-gray-600 font-weight-bold mb-0">도서가 없습니다.</p>
            </div>

            <div th:unless="${#lists.isEmpty(books)}" th:each="book : ${books}" class="book-card-wrapper">
                <div class="card book-card">
                    <a th:href="@{/books/{bookId}(bookId=${book.bookId()})}" style="text-decoration: none; color: inherit;">
                        <div class="card-img-wrapper">

<!--                            <span th:if="${book.isBest()}" class="badge badge-danger badge-best">BEST</span>-->
<!--                            <span th:unless="${book.isBest()}" th:if="${book.isNew()}" class="badge badge-success badge-new">NEW</span>-->

                            <button type="button"
                                    class="btn-heart"
                                    th:attr="data-book-id=${book.bookId()}"
                                    onclick="toggleLike(this)">
                                <i th:classappend="${book.isLiked() ? 'fas' : 'far'}" class="fa-heart"></i>
                            </button>

                            <img class="card-img-top" th:src="${book.bookImageUrl()}" th:alt="${book.title()}">
                        </div>
                    </a>
                    <div class="card-body">

                        <div class="category-badge mb-1" th:text="${book.categoryName()}">카테고리</div>

                        <a th:href="@{/books/{bookId}(bookId=${book.bookId()})}" style="text-decoration: none; color: inherit;">
                            <h5 class="card-title mb-1" th:text="${book.title()}">책제목</h5>
                        </a>

                        <p class="text-muted small mb-2" th:text="${book.author()}">저자미상</p>

                        <div class="mb-2">
                            <span class="rating"><i class="fas fa-star"></i> <span th:text="${book.rating()}">별점</span></span>
                            <span class="text-muted small">(<span th:text="${book.reviewCount()}">리뷰개수</span>)</span>
                        </div>

                        <div class="mb-3">
                            <span class="price-original"
                                  th:text="${#numbers.formatDecimal(book.originalPrice(), 0, 'COMMA', 0, 'POINT') + '원'}">정가</span>
                            <span class="price-current ml-2"
                                  th:text="${#numbers.formatDecimal(book.currentPrice(), 0, 'COMMA', 0, 'POINT') + '원'}">현재가격</span>
                        </div>

                        <form th:action="@{/cart/add}" method="post">
                            <input type="hidden" name="bookId" th:value="${book.bookId()}">
                            <input type="hidden" name="quantity" value="1">
                            <button class="btn btn-primary btn-block"
                                    th:onclick="|addToCartAndConfirmMove('${book.bookId()}', '1'); return false;|">
                                <i class="fas fa-shopping-cart mr-1"></i> 장바구니
                            </button>
                        </form>

                        <form th:action="@{/orders}" method="post">
                            <input type="hidden" name="bookId" th:value="${book.bookId()}">
                            <input type="hidden" name="quantity" value="1">
                            <button type="submit" class="btn btn-secondary btn-block">
                                바로 구매
                            </button>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    // **참고:** 이 스크립트 블록은 Thymeleaf를 사용하는 서버 환경에서는 불필요하며,
    // 기존 HTML의 하드코딩된 JavaScript 예시를 제거하기 위한 용도로 남겨둡니다.
    // 레이아웃 스크립트는 서버에서 정상적으로 처리된다고 가정합니다.

    // 페이지별 이벤트 리스너 추가 (필요시)
    function initPageScripts() {
        // 여기에 페이지 로드 후 실행할 추가적인 JavaScript 코드를 넣을 수 있습니다.
    }
</script>
</body>
</html>
