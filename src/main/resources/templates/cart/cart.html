<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>장바구니</title>
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">

    <style>
        .cart-item-card {
            transition: box-shadow 0.2s ease, transform 0.1s ease;
        }
        .cart-item-card:hover {
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,.15);
            transform: translateY(-2px);
        }
        .cart-left {
            padding-left: 1.5rem;
        }

        .cart-book-thumb {
            width: 80px;
            height: 110px;
            border-radius: 4px;
            background-color: #f1f1f1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9c9c9c;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .cart-book-title {
            font-size: 1rem;
            font-weight: 600;
            color: #4e73df;
            margin-bottom: 0.25rem;
        }

        .cart-book-price {
            font-size: 0.9rem;
            color: #4e4e4e;
        }

        .cart-empty-box {
            border-radius: 0.75rem;
            background-color: #f8f9fc;
            padding: 3rem 2rem;
        }

        .cart-bottom-summary {
            border-top: 1px solid #e3e6f0;
            padding-top: 1rem;
            margin-top: 1.5rem;
        }
        /* Chrome/Safari/Edge → number input 스피너 항상 보이도록 */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            opacity: 1 !important;
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="container-fluid">

        <div class="d-sm-flex align-items-center justify-content-between mb-4">
            <h1 class="h3 mb-0 text-gray-800">장바구니</h1>
        </div>

        <div class="row">
            <div th:if="${cart == null or #lists.isEmpty(cart.items)}"
                 class="col-12 d-flex justify-content-center mt-5">
                <div class="text-center cart-empty-box">
                    <h4 class="text-gray-600 mb-3">장바구니가 비었습니다.</h4>
                    <p class="text-gray-500 mb-4">원하는 도서를 장바구니에 담아보세요.</p>
                    <a href="/" class="btn btn-primary">
                        계속 쇼핑하기
                    </a>
                </div>
            </div>

            <div th:if="${cart != null and !#lists.isEmpty(cart.items)}"
                 class="col-12 col-xl-10">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="selectAll">
                        <label class="form-check-label text-gray-700" for="selectAll">
                            전체 선택
                        </label>
                    </div>
                    <form id="clearCartForm" th:action="@{/cart/items}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-danger btn-sm">
                            선택한 아이템 삭제
                        </button>

                        <input type="hidden" name="_method" value="delete">

                        <div id="selectedItemsContainer">
                        </div>
                    </form>
                </div>

                <div th:each="item : ${cart.items}" class="mb-3">
                    <div class="card cart-item-card shadow-sm">
                        <div class="card-body">

                            <div class="row align-items-center cart-item-row"
                                 th:attr="data-unit-price=${item.book.priceStandard}">

                                <div class="col-md-7 d-flex align-items-center cart-left">

                                    <div class="mr-3">
                                        <input type="checkbox"
                                               class="form-check-input cart-item-checkbox"
                                               name="selectedItems"
                                               th:value="${item.book.id}"
                                               style="transform: scale(1.3);">
                                    </div>

                                    <div class="mr-3">
                                        <a th:href="@{/books/{bookId}(bookId=${item.book.id})}" style="text-decoration: none;">
                                            <div th:if="${item.book.imageUrl == null}" class="cart-book-thumb">
                                                이미지
                                            </div>
                                            <div th:if="${item.book.imageUrl != null}">
                                                <img th:src="${item.book.imageUrl}"
                                                     alt="도서 이미지"
                                                     style="width: 80px; height: 110px; object-fit: cover; border-radius: 4px;">
                                            </div>
                                        </a>
                                    </div>

                                    <div class="flex-fill">
                                        <a th:href="@{/books/{bookId}(bookId=${item.book.id})}" style="text-decoration: none;">
                                            <div class="cart-book-title"
                                                 th:text="${item.book.title}">
                                                책 제목
                                            </div>
                                        </a>
                                        <div class="cart-book-price mb-1">
                                            <span class="text-gray-600">가격&nbsp;</span>
                                            <span th:text="${#numbers.formatInteger(item.book.priceStandard, 0, 'COMMA')} + '원'">
                                                10,000원
                                            </span>
                                        </div>
                                    </div>

                                </div>

                                <div class="col-md-5 mt-3 mt-md-0 d-flex justify-content-end">
                                    <div class="d-flex align-items-center">

                                        <div class="d-flex align-items-center mr-4">
                                            <span class="text-xs font-weight-bold text-gray-700 mr-2">수량</span>
                                            <form th:action="@{'/cart/items/' + ${item.book.id}}"
                                                  method="post"
                                                  class="m-0">
                                                <input type="hidden" name="_method" value="put">
                                                <input name="quantity"
                                                       type="number"
                                                       min="1"
                                                       class="form-control form-control-sm text-center cart-qty-input"
                                                       th:value="${item.quantity}"
                                                       style="width: 70px;">
                                            </form>
                                        </div>

                                        <div class="text-right mr-4">
                                            <span class="small text-gray-600 d-block">상품 금액</span>
                                            <span class="line-total-text"
                                                  th:text="${#numbers.formatInteger(item.book.priceStandard * item.quantity, 0, 'COMMA')} + '원'">
                                                0원
                                            </span>
                                        </div>

                                        <div class="d-flex">
                                            <form th:action="@{'/cart/items/' + ${item.book.id}}"
                                                  method="post"
                                                  class="m-0">
                                                <input type="hidden" name="_method" value="delete">
                                                <button class="btn btn-outline-danger btn-sm">
                                                    삭제
                                                </button>
                                            </form>
                                        </div>

                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="cart-bottom-summary d-flex justify-content-between align-items-center">
                    <div class="text-gray-700">
                        선택한 상품 금액
                    </div>
                    <div class="text-right">
                        <div class="h5 mb-0 font-weight-bold text-success" id="selectedTotalAmount">
                            0원
                        </div>
                        <form id="orderForm" th:action="@{/orders}" method="post" style="display: none;">
                        </form>
                        <button type="button"
                                class="btn btn-primary btn-sm mt-2"
                                onclick="submitOrder()">
                            주문하기
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{cart/cart-guest-merge :: mergeModal}"></div>
    <script th:inline="javascript">
        const LOGGED_IN = /*[[${loggedIn}]]*/ false;
    </script>
    <script th:src="@{/customJs/cart.js}"></script>
    <script th:src="@{/customJs/cart-guest-merge.js}"></script>
</div>
</body>
</html>
