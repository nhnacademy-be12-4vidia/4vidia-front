<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>주소 수정</title>
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <script th:inline="javascript">
        function searchPostcode() {
            window.open("/mypage/address/jusoPopup", "pop",
                "width=570,height=420,scrollbars=yes,resizable=yes");
        }

        function jusoCallBack(roadAddrPart1, addrDetail, zipNo) {
            document.getElementById("zipNo").value = zipNo;
            document.getElementById("roadAddrPart1").value = roadAddrPart1;
            document.getElementById("addrDetail").value = addrDetail;
            document.getElementById("addrDetail").focus();
        }

        async function updateAddress(e) {
            e.preventDefault(); // 폼의 기본 제출(새로고침) 막기

            if(!confirm("주소를 수정하시겠습니까?")) return;

            const form = document.getElementById("editAddressForm");
            const url = form.getAttribute("action");
            const formData = new FormData(form);
            const csrfToken = getCsrfToken(); // get-cookie.js 필요

            try {
                const res = await fetch(url + "?_method=PUT", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {
                        'X-XSRF-TOKEN': csrfToken
                    },
                    body: formData
                });

                if (res.ok) {
                    alert("주소가 수정되었습니다.");
                    // 성공 시 목록 페이지로 이동
                    location.href = "/mypage/address";
                } else {
                    alert("수정 실패: " + res.status);
                }

            } catch (error) {
                console.error(error);
                alert("수정 중 오류가 발생했습니다.");
            }
        }
    </script>
</head>

<body>
<div layout:fragment="content">
    <div class="container mt-5" style="max-width: 700px;">
        <h2 class="text-center mb-5">주소 수정</h2>

        <form th:action="@{/mypage/address/{addressId}(addressId=${address.addressId()})}"
              method="post"
              id="editAddressForm"
              onsubmit="updateAddress(event)">

            <input type="hidden" name="_method" value="put">

            <div class="form-group mb-3">
                <label>별칭*</label>
                <input type="text" name="alias" class="form-control"
                       th:value="${address.alias}" required>
            </div>

            <div class="form-group mb-3">
                <label>우편번호*</label>
                <div class="d-flex">
                    <input type="text" id="zipNo" name="zipCode" class="form-control me-2"
                           th:value="${address.zipCode}" readonly required>
                    <button type="button" class="btn btn-secondary"
                            onclick="searchPostcode()">우편번호 찾기</button>
                </div>
            </div>

            <div class="form-group mb-3">
                <label>도로명 주소*</label>
                <input type="text" id="roadAddrPart1" name="roadAddress" class="form-control"
                       th:value="${address.roadAddress}" readonly required>
            </div>

            <div class="form-group mb-3">
                <label>상세 주소*</label>
                <input type="text" id="addrDetail" name="addressDetail" class="form-control"
                       th:value="${address.addressDetail}" required>
            </div>

            <div class="d-flex justify-content-end mt-4">
                <button type="submit" class="btn btn-primary me-2">수정 완료</button>
                <a href="/mypage/address" class="btn btn-secondary">취소</a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
