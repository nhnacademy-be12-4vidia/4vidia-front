<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="mergeModal">
    <div class="modal fade" id="guestCartMergeModal" tabindex="-1" role="dialog" aria-labelledby="guestCartMergeLabel"
         aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="guestCartMergeLabel">비회원 장바구니 불러오기</h5>
                </div>
                <div class="modal-body">
                    비회원으로 이용하실 때 담아둔 장바구니가 있습니다.<br>
                    <strong>비회원 장바구니를 회원 장바구니에 불러오시겠습니까?</strong><br>
                    (중복된 도서는 비회원 장바구니 수량이 적용됩니다.)
                </div>
                <div class="modal-footer">
                    <button type="button" id="guestCartNoBtn" class="btn btn-outline-secondary">
                        아니오
                    </button>
                    <button type="button" id="guestCartYesBtn" class="btn btn-primary">
                        예
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
