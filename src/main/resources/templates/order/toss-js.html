<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>토스 결제 요청</title>
    <script src="https://js.tosspayments.com/v2/standard"></script>
    <meta charset="UTF-8">
</head>
<body>

<div style="text-align: center; padding-top: 100px;">
    <h1>결제창을 로딩 중입니다...</h1>
    <p>잠시만 기다려주세요.</p>
</div>

<script th:inline="javascript">
    // Controller에서 전달받은 정보
    const clientKey = /*[[${tossClientKey}]]*/ 'test_client_key'; // **서버에서 전달받은 토스 클라이언트 키**
    const orderId = /*[[${orderId}]]*/ 1;      // **기본 orderId (성공시 사용)**
    const sendOrderId = /*[[${sendOrderId}]]*/ '1234567890';               // **서버에서 생성된 주문 ID**
    const finalAmount = /*[[${payPrice}]]*/ 10000; // **서버에서 조회한 최종 결제 금액**
    const paymentMethod = /*[[${paymentMethod}]]*/ 'CARD'; // **서버에서 조회한 결제 수단**
    const orderName = /*[[${orderName}]]*/ "책 1권 이상 등";
    const customerEmail = /*[[${customerEmail}]]*/ "";
    const customerName = /*[[${customerName}]]*/ "";
    const customerKey =  /*[[${customerKey}]]*/ "wowString";

    // 토스페이먼츠 객체 생성
    const tossPayments = TossPayments(clientKey);
    const payment = tossPayments.payment({ customerKey });

    const successUrl = window.location.origin + "/payments/success?id=" + orderId;
    const failUrl = window.location.origin + "/payments/fail";

    /**
     * 토스페이먼츠 결제를 요청합니다.
     */
    async function requestPayment() {
        const finalAmountObj = {
            currency: "KRW",
            value: finalAmount
        };

        try {
            switch (paymentMethod) {
                case "CARD":
                    await payment.requestPayment({
                        method: "CARD",
                        amount: finalAmountObj,
                        orderId: sendOrderId,
                        orderName: orderName,
                        customerEmail: customerEmail,
                        customerName: customerName,
                        successUrl: successUrl,
                        failUrl: failUrl,
                    });
                    break;
                case "VIRTUAL_ACCOUNT":
                    await payment.requestPayment({
                        method: "VIRTUAL_ACCOUNT",
                        amount: finalAmountObj,
                        orderId: sendOrderId,
                        orderName: orderName,
                        customerEmail: customerEmail,
                        customerName: customerName,
                        successUrl: successUrl,
                        failUrl: failUrl,
                    });
                    break;
                case "CULTURE_GIFT_CERTIFICATE":
                    await payment.requestPayment({
                        method: "CULTURE_GIFT_CERTIFICATE",
                        amount: finalAmountObj,
                        orderId: sendOrderId,
                        orderName: orderName,
                        customerEmail: customerEmail,
                        customerName: customerName,
                        successUrl: successUrl,
                        failUrl: failUrl,
                    });
                    break;
                default:
                    alert("선택된 결제 수단이 유효하지 않습니다: " + paymentMethod);
                    console.error("Unknown payment method:", paymentMethod);
            }
        } catch (error) {
