<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경</title>
</head>

<body>

<div layout:fragment="content" class="container mt-5" style="max-width: 480px;">

    <h3 class="mb-4 fw-bold">비밀번호 변경</h3>

    <!-- ✅ 컨트롤러에서 내려준 비즈니스 에러 메시지 -->
    <div th:if="${errorMessage}"
         class="alert alert-danger"
         th:text="${errorMessage}">
    </div>

    <!-- ✅ PUT 요청 (Hidden Method 방식) -->
    <form th:action="@{/mypage/profile/password}"
          th:object="${changePasswordRequest}"
          method="post">

        <input type="hidden" name="_method" value="put"/>

        <!-- 현재 비밀번호 -->
        <div class="form-group mb-3">
            <label class="form-label">현재 비밀번호</label>
            <input type="password"
                   th:field="*{currentPassword}"
                   class="form-control"
                   placeholder="현재 비밀번호 입력"
                   required/>
            <small class="text-danger"
                   th:if="${#fields.hasErrors('currentPassword')}"
                   th:errors="*{currentPassword}">
            </small>
        </div>

        <!-- 새 비밀번호 -->
        <div class="form-group mb-3">
            <label class="form-label">새 비밀번호</label>
            <input type="password"
                   th:field="*{newPassword}"
                   class="form-control"
                   placeholder="새 비밀번호 입력"
                   required/>
            <small class="text-danger"
                   th:if="${#fields.hasErrors('newPassword')}"
                   th:errors="*{newPassword}">
            </small>
        </div>

        <!-- 새 비밀번호 확인 -->
        <div class="form-group mb-4">
            <label class="form-label">새 비밀번호 확인</label>
            <input type="password"
                   th:field="*{confirmPassword}"
                   class="form-control"
                   placeholder="새 비밀번호 다시 입력"
                   required/>
            <small class="text-danger"
                   th:if="${#fields.hasErrors('confirmPassword')}"
                   th:errors="*{confirmPassword}">
            </small>
        </div>

        <!-- 버튼 -->
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-fill">
                변경하기
            </button>
            <a th:href="@{/mypage/profile}"
               class="btn btn-secondary flex-fill">
                마이페이지로 돌아가기
            </a>
        </div>

    </form>

</div>

</body>
</html>
