<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>반품 조회</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        .fixed-content-area {
            width: 650px;
            margin: 0 auto;
        }
        .status-tab {
            text-align: center;
            padding: 1rem 0.5rem;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            color: #6c757d;
            text-decoration: none;
            flex-grow: 1;
        }
        .status-tab.active {
            border-bottom-color: #5b5b9e;
            font-weight: bold;
            color: #5b5b9e !important;
        }
        .tab-count {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .return-item-card:hover {
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15);
        }
        .detail-box {
            background-color: #f8f9fa;
            border-radius: 0.5rem;
            padding: 1rem;
        }
    </style>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(function () {
            $('.detail-toggle-btn').click(function () {
                const target = $(this).data('target');
                $('#' + target).slideToggle();
            });
        });
    </script>
</head>

<body>
<div layout:fragment="content">
    <div class="container">

        <h1 class="h3 mb-4 text-center">반품 조회</h1>

        <!-- ================= 상태 탭 ================= -->
        <div class="fixed-content-area mb-4">
            <div class="d-flex text-center border-bottom">
                <a th:href="@{/mypage/refund-history(status='ALL')}"
                   th:classappend="${currentStatus == 'ALL' ? 'active' : ''}"
                   class="status-tab">
                    <div class="tab-count" th:text="${totalReturns}">0</div>
                    <div>전체</div>
                </a>

                <a th:href="@{/mypage/refund-history(status='PROCESS')}"
                   th:classappend="${currentStatus == 'PROCESS' ? 'active' : ''}"
                   class="status-tab">
                    <div class="tab-count" th:text="${statusCounts['PROCESS']}">0</div>
                    <div>반품신청</div>
                </a>

                <a th:href="@{/mypage/refund-history(status='APPROVED')}"
                   th:classappend="${currentStatus == 'APPROVED' ? 'active' : ''}"
                   class="status-tab">
                    <div class="tab-count" th:text="${statusCounts['APPROVED']}">0</div>
                    <div>반품완료</div>
                </a>

                <a th:href="@{/mypage/refund-history(status='REJECTED')}"
                   th:classappend="${currentStatus == 'REJECTED' ? 'active' : ''}"
                   class="status-tab">
                    <div class="tab-count" th:text="${statusCounts['REJECTED']}">0</div>
                    <div>반품거부</div>
                </a>
            </div>
        </div>

        <!-- ================= 리스트 ================= -->
        <div class="fixed-content-area">

            <div th:if="${#lists.isEmpty(returnList)}"
                 class="text-center py-5 bg-light border rounded">
                반품 내역이 없습니다.
            </div>

            <div th:each="item : ${returnList}"
                 class="bg-white rounded shadow-sm p-4 mb-4 border return-item-card">

                <!-- 상단 정보 -->
                <div class="mb-3 border-bottom pb-2">
                    <div class="fw-bold"
                         th:text="${#temporals.format(item.returnDate(), 'yyyy.MM.dd')} + ' 반품신청'">
                        날짜
                    </div>

                    <div class="small text-muted">
                        반품번호:
                        <span th:text="${item.refundId()}"></span>
                        |
                        주문번호:
                        <span th:text="${item.orderId()}"></span>
                        (
                        <span th:text="${#temporals.format(item.orderDate(), 'yyyy.MM.dd')}"></span>
                        )
                    </div>
                </div>

                <!-- 상품 정보 -->
                <div class="d-flex justify-content-between">
                    <div>
                        <h5 th:text="${item.title()}">도서 제목</h5>

                        <!-- ❌ author 없음 -->
                        <!-- <p th:text="${item.author()}"></p> -->

                        <span class="badge bg-light text-dark border"
                              th:text="${item.returnReason()}">반품 사유</span>

                        <div class="small text-muted mt-1"
                             th:text="'수량: ' + (${item.quantity()} ?: 0) + '개'">
                        </div>

                    </div>

                    <div class="fw-bold"
                         th:text="${#numbers.formatDecimal(item.price(), 0, 'COMMA', 0, 'POINT') + '원'}">
                        가격
                    </div>
                </div>

                <!-- 버튼 -->
                <div class="text-end mt-3">
                    <!-- ❌ 재구매, bookId 없음 -->
                    <!--
                    <button class="btn btn-outline-dark btn-sm">재구매</button>
                    -->

                    <button class="btn btn-link btn-sm detail-toggle-btn"
                            th:data-target="'detail-' + ${item.refundId()}">
                        상세보기
                    </button>
                </div>

                <!-- 상세 -->
                <div th:id="'detail-' + ${item.refundId()}"
                     style="display: none;"
                     class="mt-3 detail-box">

                    <div>
                        <strong>반품 사유</strong> :
                        <span th:text="${item.returnReason()}"></span>
                    </div>

                    <!-- ❌ 아래는 아직 데이터 없음 -->
                    <!--
                    <div>환불 금액</div>
                    <div>배송비</div>
                    <div>환불 계좌</div>
                    <div>거부 사유</div>
                    <div>운송장 번호</div>
                    -->
                </div>

            </div>
        </div>
    </div>
</div>
</body>
</html>
