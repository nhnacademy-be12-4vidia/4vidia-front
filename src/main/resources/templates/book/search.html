<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>4VIDIA - 도서 검색 결과</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        /* ------------------------------------------------ */
        /* 공통 레이아웃 */
        /* ------------------------------------------------ */
        .row {
            display: flex;
            flex-wrap: wrap !important;
            justify-content: center; /* 카드들을 중앙 정렬 */
        }

        /* ------------------------------------------------ */
        /* 카드 Wrapper (Grid 제어) */
        /* ------------------------------------------------ */
        .book-card-wrapper {
            flex-shrink: 0;
            width: 240px; /* 메인 페이지 디자인에 맞춰 폭 조정 */
            padding: 0 0.5rem;
            margin-bottom: 2rem;
        }

        /* ------------------------------------------------ */
        /* 카드 디자인 (메인 페이지 스타일 이식) */
        /* ------------------------------------------------ */
        .book-card {
            border: none;
            border-radius: 0.75rem;
            width: 100%;
            height: 100%; /* 카드 높이를 wrapper에 맞춤 */
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.25s ease;
            overflow: hidden;
        }
        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        /* 이미지 영역 (Contain 스타일) */
        .card-img-wrapper {
            position: relative;
            overflow: hidden;
            background-color: #f8f9fa; /* 빈 여백 색상 */
            text-align: center;
        }
        .card-img-wrapper img {
            width: 100%;
            height: 220px; /* 메인 페이지와 동일한 높이 */
            object-fit: contain; /* 이미지가 잘리지 않음 */
            transition: transform 0.35s ease;
            padding: 10px;
        }
        .book-card:hover .card-img-wrapper img {
            transform: scale(1.05);
        }

        /* ------------------------------------------------ */
        /* 좋아요 버튼 */
        /* ------------------------------------------------ */
        .btn-heart {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 5;
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: rgba(255,255,255,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            transition: background 0.15s, transform 0.2s;
        }
        .btn-heart:hover {
            background: #ffe5e5;
            transform: scale(1.08);
        }
        .btn-heart i {
            font-size: 1rem;
            color: #777;
        }
        .btn-heart i.fas {
            color: #e74a3b;
        }

        /* ------------------------------------------------ */
        /* 텍스트 및 가격 영역 */
        /* ------------------------------------------------ */
        .card-body {
            padding: 0.8rem;
            display: flex;
            flex-direction: column;
            color: #333;
        }
        .card-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 0.2rem !important;
            color: #2c3e50;
        }

        /* 가격 스타일 */
        .price-original-no-discount {
            color: #2c3e50;
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
        }
        .price-original {
            text-decoration: line-through;
            color: #858796;
            font-size: 0.8rem;
            margin-right: 0.3rem;
        }
        .price-current {
            color: #4e73df;
            font-weight: 700;
            font-size: 0.95rem;
        }

        /* ------------------------------------------------ */
        /* 버튼 스타일 (가로 배치) */
        /* ------------------------------------------------ */
        .btn-block {
            width: 100%;
            border-radius: 0.35rem;
            font-size: 0.9rem;
            padding: 0.3rem 0;
            font-weight: 600;
        }
        .btn-primary {
            background: #4e73df;
            border: none;
        }
        .btn-primary:hover {
            background: #365acb;
        }
        .btn-buy {
            background: #2c3e50;
            border: none;
            color: white;
        }
        .btn-buy:hover {
            background: #1a252f;
            color: white;
        }

        /* ------------------------------------------------ */
        /* 반응형 */
        /* ------------------------------------------------ */
        @media (max-width: 576px) {
            .book-card-wrapper {
                width: 48%; /* 모바일에서 2열 */
                padding: 0 0.25rem;
            }
            .card-img-wrapper img {
                height: 180px; /* 모바일 이미지 높이 조정 */
            }
        }
    </style>

    <script th:src="@{/customJs/askMoveCart.js}"></script>
    <script th:src="@{/customJs/like.js}"></script>
    <script th:inline="javascript">
        const CURRENT_SEARCH_PARAMS = {
            keyword: [[${keyword}]],
            page: [[${page}]],
            size: [[${size}]],
            useSemantic: [[${useSemantic}]]
        };
    </script>
</head>

<body>
<div layout:fragment="content">
    <div class="container-fluid mt-4">

        <div class="d-sm-flex align-items-center justify-content-between mb-4 px-2">
            <div>
                <h1 class="h4 mb-1 text-gray-800">
                    <span th:text="'검색 결과'">검색 결과</span>
                </h1>
                <p class="mb-0 text-gray-600">
                    <span th:if="${keyword != null}" th:text="'검색어: ' + ${keyword}">검색어: 자바</span>
                    <span th:if="${totalElements != null}"
                          th:text="' · 총 ' + ${totalElements} + '건'"> · 총 0건</span>
                    <span th:if="${useSemantic}" class="badge bg-primary ms-2">AI 검색 사용</span>
                </p>
            </div>
        </div>

        <div th:if="${message}" class="alert alert-info mx-2" th:text="${message}"></div>

        <div class="row" th:if="${#lists.isEmpty(books)}">
            <div class="col-12">
                <div class="alert alert-light border text-center py-5">
                    <i class="fas fa-search fa-3x text-gray-300 mb-3"></i>
                    <p class="mb-1 fw-bold">검색 결과가 없습니다.</p>
                    <p class="mb-0 text-muted small">
                        검색어를 조금 더 일반적으로 바꾸거나 철자를 확인해 주세요.
                    </p>
                </div>
            </div>
        </div>

        <div class="row" th:if="${!#lists.isEmpty(books)}">
            <div class="book-card-wrapper" th:each="book : ${books}">

                <div class="card book-card h-100">
                    <div class="card-img-wrapper">
                        <button type="button" class="btn-heart" th:attr="data-book-id=${book.id()}" onclick="toggleLike(event, this)">
                            <i class="fa-heart" th:classappend="${book.liked() ? 'fas' : 'far'}"></i>
                        </button>

                        <a th:href="@{/books/{bookId}(bookId=${book.id()})}" style="text-decoration: none; color: inherit;">
                            <img class="card-img-top" th:src="${book.imageUrl()}" th:alt="${book.title()}">
                        </a>
                    </div>

                    <div class="card-body">
                        <a th:href="@{/books/{bookId}(bookId=${book.id()})}" style="text-decoration: none; color: inherit;">
                            <h5 class="card-title text-truncate" th:text="${book.title()}">책제목</h5>
                        </a>

                        <p class="text-muted small mb-2 text-truncate" style="font-size: 0.75rem;"
                           th:text="${#lists.isEmpty(book.authorNames) ? '저자 정보 없음' : #strings.listJoin(book.authorNames, ', ')}">
                            저자
                        </p>

                        <div class="mb-2">
                            <span th:if="${book.priceStandard() > book.priceSales()}" class="price-current"
                                  th:text="${#numbers.formatDecimal(book.priceSales(), 0, 'COMMA', 0, 'POINT') + '원'}">현재가</span>

                            <span th:if="${book.priceStandard() > book.priceSales()}" class="price-original"
                                  th:text="${#numbers.formatDecimal(book.priceStandard(), 0, 'COMMA', 0, 'POINT') + '원'}">정가</span>

                            <span th:if="${book.priceStandard() <= book.priceSales()}" class="price-original-no-discount"
                                  th:text="${#numbers.formatDecimal(book.priceStandard(), 0, 'COMMA', 0, 'POINT') + '원'}">정가</span>

                            <span class="badge bg-danger ms-1" style="font-size: 0.7rem;"
                                  th:text="${book.priceStandard() == 0 ? '' : #numbers.formatDecimal((book.priceStandard() - book.priceSales()) * 100 / book.priceStandard(), 0, 'COMMA', 0, 'POINT') + '%'}">
                            </span>
                        </div>

                        <div class="mt-auto d-flex gap-2">
                            <form th:action="@{/cart/add}" method="post" class="flex-grow-1">
                                <input type="hidden" name="bookId" th:value="${book.id()}">
                                <button class="btn btn-primary btn-block" title="장바구니"
                                        th:onclick="|addToCartAndConfirmMove('${book.id()}', '1'); return false;|">
                                    <i class="fas fa-shopping-cart"></i>
                                </button>
                            </form>
                            <form th:action="@{/orders/checkout-temp}" method="post" class="flex-grow-1">
                                <input type="hidden" name="bookId" th:value="${book.id()}">
                                <input type="hidden" name="quantity" value="1">
                                <button type="submit" class="btn btn-buy btn-block" title="구매">
                                    <i class="fas fa-credit-card"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <nav th:if="${totalPages > 1}" class="mt-4 pb-5">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${page == 0} ? ' disabled'">
                    <a class="page-link"
                       th:href="@{/books/search(keyword=${keyword}, page=${page - 1}, size=${size}, useSemantic=${useSemantic} ? ${useSemantic} : null)}"
                       onclick="handleDelayedRefresh(event)">
                        이전
                    </a>
                </li>

                <li class="page-item"
                    th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    th:classappend="${i == page} ? ' active'">
                    <a class="page-link"
                       th:text="${i + 1}"
                       th:href="@{/books/search(keyword=${keyword}, page=${i}, size=${size}, useSemantic=${useSemantic} ? ${useSemantic} : null)}"
                       onclick="handleDelayedRefresh(event)">
                    </a>
                </li>

                <li class="page-item"
                    th:classappend="${page + 1 >= totalPages} ? ' disabled'">
                    <a class="page-link"
                       th:href="@{/books/search(keyword=${keyword}, page=${page + 1}, size=${size}, useSemantic=${useSemantic} ? ${useSemantic} : null)}"
                       onclick="handleDelayedRefresh(event)">
                        다음
                    </a>
                </li>
            </ul>
        </nav>

    </div>
</div>
</body>
</html>
