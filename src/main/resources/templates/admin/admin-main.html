<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>4VIDIA Admin Console</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet">

    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Nunito', sans-serif;
            background-color: #f8f9fc;
            overflow: hidden; /* 스크롤 방지 */
        }

        /* 전체 화면 중앙 정렬 */
        .full-screen-center {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* 상단 로고 & 텍스트 */
        .admin-header {
            margin-bottom: 4rem;
        }

        .main-logo {
            max-height: 80px;
            margin-bottom: 1.5rem;
        }

        .main-title {
            font-size: 2.8rem;
            font-weight: 800;
            color: #4e73df;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
        }

        .main-subtitle {
            color: #858796;
            font-size: 1.2rem;
            font-weight: 600;
        }

        /* 버튼 그룹 */
        .button-group {
            display: flex;
            gap: 25px;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
        }

        .menu-btn {
            flex: 1;
            max-width: 260px;
            background: #ffffff;
            border: 1px solid #e3e6f0;
            border-radius: 20px;
            padding: 3.5rem 1.5rem;
            text-decoration: none !important;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.05);
        }

        .menu-btn:hover {
            transform: translateY(-15px);
            border-color: #4e73df;
            box-shadow: 0 1.5rem 3rem rgba(78, 115, 223, 0.15) !important;
        }

        .btn-icon {
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
            display: block;
        }

        .btn-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: #4a5568;
            display: block;
        }

        /* 아이콘 색상 */
        .icon-user { color: #4e73df; }
        .icon-book { color: #1cc88a; }
        .icon-truck { color: #36b9cc; }
        .icon-coin { color: #f6c23e; }

        /* 하단 링크 */
        .bottom-link {
            position: absolute;
            bottom: 40px;
        }

        .btn-home {
            background-color: white;
            color: #858796;
            border: 1px solid #e3e6f0;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.2s;
        }

        .btn-home:hover {
            background-color: #f8f9fc;
            color: #4e73df;
        }
    </style>
</head>
<body>

<div class="full-screen-center">
    <header class="admin-header">
        <img src="/img/final_logo.png" alt="4VIDIA" class="main-logo">
        <h1 class="main-title">4VIDIA ADMIN CENTER</h1>
        <p class="main-subtitle">관리 업무를 시작하려면 항목을 선택하세요.</p>
    </header>

    <div class="button-group">
        <a href="/admin/users" class="menu-btn">
            <i class="fas fa-users-cog btn-icon icon-user"></i>
            <span class="btn-text">회원 관리</span>
        </a>

        <a href="/admin/books" class="menu-btn">
            <i class="fas fa-book btn-icon icon-book"></i>
            <span class="btn-text">도서 관리</span>
        </a>

        <a href="/admin/delivery" class="menu-btn">
            <i class="fas fa-truck-moving btn-icon icon-truck"></i>
            <span class="btn-text">배송 관리</span>
        </a>

        <a href="/admin/coupons/policies" class="menu-btn">
            <i class="fas fa-coins btn-icon icon-coin"></i>
            <span class="btn-text">혜택/마케팅 관리</span>
        </a>
    </div>

    <div class="bottom-link">
        <a href="/" class="btn-home shadow-sm">
            <i class="fas fa-home me-2"></i>메인 쇼핑몰 바로가기
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
