<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/admin-layout}">

<head>
    <meta charset="utf-8">
    <title>등급 적립률 관리</title>
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">

    <style>
        /* 테이블 스타일 */
        .table thead th {
            background-color: #f8f9fc !important;
            font-weight: 600;
            font-size: 0.9rem;
            border-bottom: 2px solid #e3e6f0;
            text-align: center;
            vertical-align: middle;
        }
        .table td {
            vertical-align: middle;
            padding: 12px 10px;
            font-size: 0.9rem;
        }
        .table-hover tbody tr {
            border-bottom: 1px solid #e9ecef;
        }

        /* 수정 폼 박스 스타일 */
        .form-box {
            background: #fdfdfd;
            border: 1px solid #e8e8e8;
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }

        .form-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #5a5c69;
            margin-bottom: 4px;
        }

        .rate-input {
            text-align: right;
        }
    </style>
</head>

<body>
<div layout:fragment="pageContent">

    <h1 class="h3 mb-3 text-gray-800">등급 적립률 관리</h1>

    <div th:if="${success != null}">
        <script th:if="${success}" th:inline="javascript">
            /*<![CDATA[*/ alert("정상적으로 수정되었습니다."); /*]]>*/
        </script>
        <script th:if="${!success}" th:inline="javascript">
            /*<![CDATA[*/ alert("수정에 실패했습니다."); /*]]>*/
        </script>
    </div>

    <div class="d-flex flex-column gap-3" style="min-height: calc(100vh - 300px);">

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th style="width: 80px;">ID</th>
                        <th style="width: 200px;">등급 이름</th>
                        <th>적립률 설정</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:if="${#lists.isEmpty(grades)}">
                        <td colspan="3" class="text-center py-4 text-muted">
                            등록된 등급 정책이 없습니다.
                        </td>
                    </tr>

                    <tr th:each="g : ${grades}">

                        <td class="text-center text-gray-800 font-weight-bold" th:text="${g.gradeId()}">1</td>

                        <td class="text-center">
                            <span class="badge badge-info px-3 py-2" style="font-size: 0.9rem;" th:text="${g.gradeName()}">ROYAL</span>
                        </td>

                        <td>
                            <form th:action="@{'/admin/grades/' + ${g.gradeId()}}"
                                  method="post" class="form-box mx-auto" style="max-width: 500px;">

                                <input type="hidden" name="gradeName" th:value="${g.gradeName()}"/>
                                <input type="hidden" value="put" name="_method"/>

                                <div class="row align-items-end">
                                    <div class="col-9">
                                        <label class="form-label">구매 적립률</label>
                                        <div class="input-group input-group-sm">
                                            <input type="number" name="pointRate"
                                                   th:value="${g.pointRate()}"
                                                   min="0"
                                                   step="1"
                                                   class="form-control rate-input"
                                                   placeholder="0">
                                            <span class="input-group-text">%</span>
                                        </div>
                                    </div>
                                    <div class="col-3 text-end">
                                        <button type="submit" class="btn btn-primary btn-sm w-100">
                                            <i class="fas fa-edit fa-sm text-white-50 mr-1"></i> 수정
                                        </button>
                                    </div>
                                </div>

                            </form>
                        </td>

                    </tr>

                    </tbody>
                </table>
            </div>
        </div>

    </div>

</div>
</body>
</html>
