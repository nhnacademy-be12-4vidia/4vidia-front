<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="utf-8">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>관리자 페이지</title>

    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet">
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">

    <style>
        /* 1. 푸터 고정을 위한 레이아웃 핵심 설정 */
        html, body {
            height: 100%; /* 전체 높이 확보 */
            margin: 0;
            background-color: #f8f9fc !important;
        }

        body {
            display: flex;
            flex-direction: column; /* 세로 정렬 */
            min-height: 100vh; /* 화면 전체 높이 사용 */
        }

        /* 2. 네비바 */
        .admin-navbar {
            background-color: #ffffff !important;
            border-bottom: 1px solid #e3e6f0;
            padding: 0 1.5rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075) !important;
            z-index: 1030; /* 푸터보다 위에 있도록 */
        }

        .brand-4vidia {
            font-size: 1.4rem; font-weight: 800; color: #4e73df !important;
            letter-spacing: 0.5px; text-transform: uppercase;
        }

        .navbar-light .navbar-nav .nav-link {
            color: #6e707e; font-weight: 700;
            padding: 1.5rem 1.2rem !important;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

        .navbar-light .navbar-nav .nav-link:hover,
        .navbar-light .navbar-nav .nav-item.show .nav-link {
            color: #4e73df !important; background-color: #f8f9fc;
        }

        .navbar-light .navbar-nav .nav-item.active .nav-link {
            color: #4e73df !important; border-bottom: 3px solid #4e73df;
        }

        /* 3. 드롭다운 Hover */
        @media (min-width: 992px) {
            .nav-item.dropdown:hover .dropdown-menu { display: block; opacity: 1; visibility: visible; transform: translateY(0); }
            .dropdown-menu {
                display: block; opacity: 0; visibility: hidden; transition: all 0.2s ease;
                transform: translateY(10px); border: 1px solid #e3e6f0;
                box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
            }
        }

        /* 4. 컨텐츠 영역: 여기가 핵심입니다 */
        #content-wrapper {
            flex: 1 0 auto; /* 남은 공간을 모두 차지하여 푸터를 바닥으로 밀어냄 */
            background-color: #f8f9fc !important;
            padding: 2rem 0;
            width: 100%;
        }

        /* 5. 푸터: 고정 및 디자인 */
        footer.sticky-footer {
            flex-shrink: 0; /* 푸터가 찌그러지지 않게 함 */
            background-color: #ffffff !important;
            border-top: 1px solid #e3e6f0;
            padding: 1.5rem 0;
            width: 100%;
        }
    </style>
</head>

<body id="page-top">

<nav class="navbar navbar-expand-lg navbar-light admin-navbar sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <img src="/img/final_logo.png" style="max-height: 40px;" alt="logo" class="me-2">
            <span class="brand-4vidia">4VIDIA</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="adminNavbarContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item" th:classappend="${currentUri != null && currentUri.startsWith('/admin/users')} ? 'active'">
                    <a class="nav-link" href="/admin/users"><i class="fas fa-users fa-sm me-1"></i> 회원 관리</a>
                </li>
                <li class="nav-item dropdown" th:classappend="${currentUri != null && (currentUri.startsWith('/admin/books') or currentUri.startsWith('/admin/reviews') or currentUri.startsWith('/admin/categories') or currentUri.startsWith('/admin/discount-policies'))} ? 'active'">
                    <a class="nav-link dropdown-toggle" href="#" id="bookDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-book fa-sm me-1"></i> 도서 관리
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/admin/books">도서 등록</a></li>
                        <li><a class="dropdown-item" href="/admin/discount-policies">도서 할인 정책</a></li>
                        <li><a class="dropdown-item" href="/admin/categories">카테고리 관리</a></li>
                        <li><a class="dropdown-item" href="/admin/reviews">리뷰 관리</a></li>
                    </ul>
                </li>
                <li class="nav-item dropdown" th:classappend="${currentUri != null && (currentUri.startsWith('/admin/delivery') or currentUri.startsWith('/admin/refunds'))} ? 'active'">
                    <a class="nav-link dropdown-toggle" href="#" id="deliveryDropdown" role="button" data-bs-toggle="dropdown">
                        <i class="fas fa-truck fa-sm me-1"></i> 배송 관리
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/admin/delivery">배송 현황 관리</a></li>
                        <li><a class="dropdown-item" href="/admin/refunds">반품 요청 관리</a></li>
                    </ul>
                </li>
                <li class="nav-item dropdown" th:classappend="${currentUri != null && (currentUri.startsWith('/admin/points') or currentUri.startsWith('/admin/grades') or currentUri.startsWith('/admin/coupons'))} ? 'active'">
                    <a class="nav-link dropdown-toggle" href="#" id="marketingDropdown" role="button" data-bs-toggle="dropdown">
                        <i class="fas fa-coins fa-sm me-1"></i> 혜택/마케팅 관리
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/admin/points">포인트 관리</a></li>
                        <li><a class="dropdown-item" href="/admin/grades">등급 적립률 관리</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="/admin/coupons/policies">쿠폰 정책 관리</a></li>
                        <li><a class="dropdown-item" href="/admin/coupons/policies/category">카테고리/전체 쿠폰 정책 관리</a></li>
                        <li><a class="dropdown-item" href="/admin/coupons/policies/book">도서 쿠폰 정책 관리</a></li>
                    </ul>
                </li>
            </ul>
            <div class="d-flex align-items-center">
                <span class="badge bg-white text-primary border border-primary px-3 py-2">ADMIN MODE</span>
            </div>
        </div>
    </div>
</nav>

<div id="content-wrapper">
    <div class="container-fluid">
        <div layout:fragment="pageContent"></div>
        <div layout:fragment="pageScript"></div>
    </div>
</div>

<footer class="sticky-footer">
    <div class="container my-auto">
        <div class="copyright text-center my-auto font-weight-bold">
            <span>© 2025 Team4 4VIDIA | NHN Academy Project</span>
        </div>
    </div>
</footer>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
<script th:src="@{/js/sb-admin-2.min.js}"></script>

<script>
    $(document).ready(function() {
        $('.nav-item.dropdown').on('mouseleave', function() {
            $(this).find('.dropdown-menu').removeClass('show');
            $(this).find('.dropdown-toggle').attr('aria-expanded', 'false');
        });
    });
</script>
</body>
</html>
