<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <!-- ✅ 모바일 축소 방지 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>주소 관리</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* ✅ 고정폭 제거 -> 반응형 */
        .address-wrap{
            max-width: 900px;
            margin: 0 auto;
            padding-left: 12px;
            padding-right: 12px;
        }

        /* ✅ 테이블 가독성 */
        .address-table th, .address-table td {
            vertical-align: middle;
        }

        /* ✅ 모바일 적응형: 테이블을 카드형처럼 보이게 */
        @media (max-width: 576px) {

            .address-wrap {
                padding-left: 10px;
                padding-right: 10px;
            }

            /* 상단 버튼 영역: 왼쪽 정렬 */
            .address-top-actions{
                justify-content: flex-start !important;
            }

            /* ✅ 테이블 헤더 숨김 */
            .address-table thead {
                display: none;
            }

            /* ✅ 테이블/행을 블록 카드처럼 */
            .address-table,
            .address-table tbody,
            .address-table tr,
            .address-table td {
                display: block;
                width: 100%;
            }

            /* 각 행(주소 1개)을 카드로 */
            .address-table tbody tr {
                border: 1px solid #e9ecef;
                border-radius: 14px;
                padding: 12px;
                margin-bottom: 12px;
                background: #fff;
            }

            /* td는 라벨+값 형태 */
            .address-table td {
                border: none !important;
                padding: 8px 4px !important;
                text-align: left !important;
            }

            /* 선택 체크박스 영역 */
            .address-td-select {
                display: flex !important;
                align-items: center;
                justify-content: flex-start;
                gap: 10px;
                padding-top: 4px !important;
            }

            /* 주소 텍스트 줄바꿈 */
            .address-td-address span {
                word-break: break-word;
            }

            /* 수정/삭제 버튼 영역: 오른쪽 아래 */
            .address-td-actions{
                display: flex !important;
                gap: 6px;
                justify-content: flex-end;   /* 오른쪽 정렬 */
                align-items: center;
                padding-top: 8px !important;
            }

            /* 버튼 크기 축소 + 균일 */
            .address-td-actions a,
            .address-td-actions button{
                width: auto;                /* ❌ 100% 제거 */
                min-width: 56px;            /* 버튼 폭 통일 */
                height: 32px;               /* 버튼 높이 통일 */
                padding: 0 10px;            /* 안쪽 여백 */
                font-size: 0.75rem;         /* 글자 크기 줄이기 */
                line-height: 1;
                margin: 0 !important;       /* me-2 제거 */
                display: inline-flex;
                align-items: center;
                justify-content: center;
                white-space: nowrap;
            }

            /* 하단 버튼(기본 설정/선택 삭제)도 세로로 */
            .address-bulk-actions {
                flex-direction: column;
                gap: 10px;
            }
            .address-bulk-actions button {
                width: 100%;
            }

            /* 모달도 모바일에서 꽉 차게 */
            .modal-dialog {
                margin: 0.75rem;
            }
        }
    </style>

    <script th:src="@{/customJs/get-cookie.js}"></script>

    <script>
        function getSelectedAddresses() {
            return Array.from(document.querySelectorAll("input[name='selectedAddress']:checked"))
                .map(chk => chk.value);
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("setDefaultBtn")?.addEventListener("click", setDefaultSelectedAddress);
            document.getElementById("deleteSelectedBtn")?.addEventListener("click", deleteSelectedAddresses);
        });

        async function setDefaultSelectedAddress() {
            const selected = getSelectedAddresses();
            if (selected.length !== 1) {
                alert("기본 주소는 하나만 선택해야 합니다.");
                return;
            }

            const addressId = selected[0];
            const csrfToken = getCsrfToken();

            try {
                const res = await fetch(`/mypage/address/default/${addressId}`, {
                    method: "PUT",
                    credentials: "same-origin",
                    headers: { 'X-XSRF-TOKEN': csrfToken },
                });

                if (res.ok) {
                    alert("기본 주소가 변경되었습니다.");
                    location.reload();
                } else {
                    alert(`기본 주소 설정 실패: ${res.status}`);
                }
            } catch (error) {
                console.error(error);
                alert("통신 중 오류가 발생했습니다.");
            }
        }

        async function deleteSelectedAddresses() {
            const selected = getSelectedAddresses();
            const csrfToken = getCsrfToken();

            if (selected.length === 0) {
                alert("삭제할 주소를 선택하세요.");
                return;
            }

            if (!confirm("선택한 주소를 모두 삭제하시겠습니까?")) return;

            try {
                const results = await Promise.all(
                    selected.map(id =>
                        fetch(`/mypage/address/${id}?_method=DELETE`, {
                            method: "POST",
                            credentials: "same-origin",
                            headers: { 'X-XSRF-TOKEN': csrfToken },
                        })
                    )
                );

                const failed = results.find(r => !r.ok);
                if (failed) {
                    alert(`삭제 실패: ${failed.status}`);
                    return;
                }

                alert("선택한 주소가 삭제되었습니다.");
                location.reload();

            } catch (error) {
                console.error(error);
                alert("삭제 중 오류가 발생했습니다.");
            }
        }

        async function submitAddress(e) {
            e.preventDefault();

            const form = document.getElementById("addAddressForm");
            const submitBtn = document.getElementById("saveAddressBtn");

            if (submitBtn) {
                if (submitBtn.disabled) return;
                submitBtn.disabled = true;
                submitBtn.innerText = "저장 중...";
            }

            const formData = new FormData(form);
            const csrfToken = getCsrfToken();

            try {
                const res = await fetch("/mypage/address", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: { 'X-XSRF-TOKEN': csrfToken },
                    body: formData
                });

                if (res.ok) {
                    location.reload();
                    return;
                }

                const text = await res.text().catch(() => "");
                console.error("주소 저장 실패:", res.status, text);
                alert(`주소 저장 실패: ${res.status}`);

                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerText = "저장하기";
                }

            } catch (error) {
                console.error("네트워크 오류:", error);
                alert("저장 중 오류가 발생했습니다.");

                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerText = "저장하기";
                }
            }
        }

        async function deleteOneAddress(addressId) {
            if (!confirm("정말 이 주소를 삭제하시겠습니까?")) return;

            const csrfToken = getCsrfToken();

            try {
                const res = await fetch(`/mypage/address/${addressId}?_method=DELETE`, {
                    method: "POST",
                    credentials: "same-origin",
                    headers: { 'X-XSRF-TOKEN': csrfToken },
                });

                if (res.ok) {
                    alert("주소가 삭제되었습니다.");
                    location.reload();
                } else {
                    alert(`삭제 실패: ${res.status}`);
                }
            } catch (error) {
                console.error(error);
                alert("오류가 발생했습니다.");
            }
        }
    </script>

    <!-- 우편번호 팝업 콜백은 opener에서 호출됨 -->
    <script>
        function searchPostcode() {
            window.open("/mypage/address/jusoPopup", "pop",
                "width=570,height=420,scrollbars=yes,resizable=yes");
        }

        function jusoCallBack(roadAddrPart1, addrDetail, zipNo) {
            document.getElementById("zipNo").value = zipNo;
            document.getElementById("roadAddrPart1").value = roadAddrPart1;
            document.getElementById("addrDetail").value = addrDetail;
            document.getElementById("addrDetail").focus();
        }
    </script>
</head>

<body>
<div layout:fragment="content">
    <div class="container mt-4 address-wrap">

        <h2 class="mt-4 mb-4 text-primary fw-bold">📦 주소 관리</h2>

        <div class="d-flex justify-content-end mb-3 address-top-actions">
            <button class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#addressModal"
                    th:disabled="${addressList.size() >= 10}">
                + 새 주소 추가
            </button>
        </div>

        <div th:if="${defaultAddress == null and not #lists.isEmpty(addressList)}"
             class="alert alert-warning text-center" role="alert">
            🚨 <b>기본 주소를 설정해주세요!</b>
        </div>

        <table class="table table-bordered text-center align-middle address-table">
            <thead class="table-light">
            <tr>
                <th style="width: 70px;">선택</th>
                <th style="width: 200px;">별칭</th>
                <th style="width: 470px;">주소</th>
                <th style="width: 160px;">수정/삭제</th>
            </tr>
            </thead>

            <tbody id="addressTableBody">

            <tr th:if="${#lists.isEmpty(addressList)}">
                <td colspan="4" class="text-center text-muted py-4">
                    등록된 주소가 없습니다. 새 주소를 추가해 주세요.
                </td>
            </tr>

            <!-- ✅ 기본 주소 -->
            <tr th:if="${defaultAddress != null}" th:with="addr=${defaultAddress}" class="table-primary">
                <td class="address-td-select"></td>

                <td>
                    <strong th:text="${addr.alias}"></strong>
                    <span class="badge bg-primary ms-1">기본</span>
                </td>

                <td class="text-start address-td-address">
                    <span th:text="|(${addr.zipCode}) ${addr.roadAddress}, ${addr.addressDetail}|"></span>
                </td>

                <td class="address-td-actions">
                    <a th:href="@{/mypage/address/{addressId}/edit(addressId=${addr.addressId()})}"
                       class="btn btn-sm btn-outline-primary">수정</a>
                </td>
            </tr>

            <!-- ✅ 일반 주소 -->
            <th:block th:each="addr : ${addressList}"
                      th:with="isDefault=${defaultAddress != null and defaultAddress.addressId() == addr.addressId()}">
                <tr th:unless="${isDefault}">
                    <td class="address-td-select">
                        <input type="checkbox" name="selectedAddress" th:value="${addr.addressId}">
                    </td>

                    <td>
                        <strong th:text="${addr.alias}"></strong>
                    </td>

                    <td class="text-start address-td-address">
                        <span th:text="|(${addr.zipCode}) ${addr.roadAddress}, ${addr.addressDetail}|"></span>
                    </td>

                    <td class="address-td-actions">
                        <a th:href="@{/mypage/address/{addressId}/edit(addressId=${addr.addressId})}"
                           class="btn btn-sm btn-outline-primary">수정</a>

                        <button type="button"
                                class="btn btn-sm btn-outline-danger"
                                th:onclick="'deleteOneAddress(' + ${addr.addressId} + ')'">
                            삭제
                        </button>
                    </td>
                </tr>
            </th:block>

            </tbody>
        </table>

        <th:block th:with="nonDefaultAddresses=${#lists.size(addressList) - (#bools.isTrue(defaultAddress != null) ? 1 : 0)}">
            <div class="d-flex justify-content-between mt-3 address-bulk-actions" th:if="${nonDefaultAddresses > 0}">
                <button id="setDefaultBtn" class="btn btn-outline-primary">기본 주소로 설정</button>
                <button id="deleteSelectedBtn" class="btn btn-outline-danger">선택한 주소 삭제</button>
            </div>
        </th:block>

        <p class="text-danger mt-2 text-end"
           th:if="${addressList.size() >= 10}">
            주소는 최대 10개까지만 등록할 수 있습니다.
        </p>
    </div>

    <!-- 주소 추가 모달 -->
    <div class="modal fade" id="addressModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-body">
                    <form id="addAddressForm"
                          method="post"
                          th:action="@{/mypage/address}"
                          onsubmit="submitAddress(event)">

                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="form-group mb-3">
                            <label>별칭*</label>
                            <input type="text" name="alias" class="form-control" required>
                        </div>

                        <div class="form-group mb-3">
                            <label>우편번호*</label>
                            <div class="d-flex">
                                <input type="text" id="zipNo" name="zipCode" class="form-control me-2" readonly required>
                                <button type="button" class="btn btn-secondary" onclick="searchPostcode()">
                                    우편번호 찾기
                                </button>
                            </div>
                        </div>

                        <div class="form-group mb-3">
                            <label>도로명 주소*</label>
                            <input type="text" id="roadAddrPart1" name="roadAddress" class="form-control" readonly required>
                        </div>

                        <div class="form-group mb-3">
                            <label>상세 주소*</label>
                            <input type="text" id="addrDetail" name="addressDetail" class="form-control" required>
                        </div>

                    </form>
                </div>

                <div class="modal-footer">
                    <button type="submit" id="saveAddressBtn" form="addAddressForm" class="btn btn-primary">저장하기</button>
                    <button class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- ✅ 부트스트랩 JS (모달 동작) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
