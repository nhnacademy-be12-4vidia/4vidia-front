<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="utf-8">
    <title>4VIDIA - 도서 쇼핑몰</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        /* ------------------------------------------------ */
        /*  공통 레이아웃 정리 */
        /* ------------------------------------------------ */

        .row {
            display: flex;
            flex-wrap: wrap !important;
            justify-content: center;
        }

        /* ------------------------------------------------ */
        /* 카드 Wrapper */
        /* ------------------------------------------------ */
        .book-card-wrapper {
            flex-shrink: 0;
            width: 250px;
            padding: 0 0.75rem;
            margin-bottom: 2.5rem;
        }

        /* ------------------------------------------------ */
        /* 카드 디자인 */
        /* ------------------------------------------------ */
        .book-card {
            border: none;
            border-radius: 0.5rem;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 0.25rem 1.25rem rgba(0,0,0,0.12);
            transition: all 0.25s ease;
        }

        .book-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 0.75rem 2rem rgba(0,0,0,0.18);
        }

        /* 이미지 hover 확대 */
        .card-img-wrapper {
            position: relative;
            overflow: hidden;
        }

        .card-img-wrapper img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            transition: transform 0.35s ease;
        }

        .book-card:hover .card-img-wrapper img {
            transform: scale(1.07);
        }

        /* ------------------------------------------------ */
        /* 뱃지(NEW, BEST) */
        /* ------------------------------------------------ */
        .badge-new,
        .badge-best {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 5;
            padding: 5px 10px;
            border-radius: 0.35rem;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-new {
            background-color: #1cc88a;
            color: white;
        }

        .badge-best {
            background-color: #e74a3b;
            color: white;
        }

        /* ------------------------------------------------ */
        /* 좋아요 버튼 */
        /* ------------------------------------------------ */
        .btn-heart {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 5;
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            background: rgba(255,255,255,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 3px 8px rgba(0,0,0,0.18);
            transition: background 0.15s, transform 0.2s;
        }

        .btn-heart:hover {
            background: #ffe5e5;
            transform: scale(1.08);
        }

        .btn-heart i {
            font-size: 1.1rem;
            color: #777;
        }

        .btn-heart i.fas {
            color: #e74a3b;
        }

        /* ------------------------------------------------ */
        /* 텍스트 영역 */
        /* ------------------------------------------------ */
        .card-body {
            padding: 1rem;
        }

        .category-badge {
            color: #4e73df;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 700;
        }

        /* 평점 */
        .rating {
            color: #f6c23e;
            font-size: 0.9rem;
        }

        /* 가격 */
        .price-original {
            text-decoration: line-through;
            color: #858796;
            font-size: 0.9rem;
        }

        .price-current {
            color: #4e73df;
            font-weight: 700;
            font-size: 1.15rem;
        }

        /* ------------------------------------------------ */
        /* 버튼 스타일 */
        /* ------------------------------------------------ */
        .book-card .card-body form {
            margin-bottom: 0.6rem;
        }

        .book-card .card-body form:last-child {
            margin-bottom: 0;
        }

        .btn-block {
            width: 100%;
            padding: 0.55rem 0;
            font-weight: 600;
            border-radius: 0.35rem;
        }

        .btn-primary {
            background: #4e73df;
            border: none;
        }

        .btn-primary:hover {
            background: #365acb;
        }

        .btn-secondary {
            background: #858796;
            border: none;
        }

        .btn-secondary:hover {
            background: #6c6f7a;
        }

        /* ------------------------------------------------ */
        /* 카테고리 Pill */
        /* ------------------------------------------------ */
        .category-pill {
            padding: 0.5rem 1.3rem;
            border-radius: 30px;
            border: 1px solid #d8dce6;
            background: white;
            color: #61636b;
            font-size: 0.85rem;
            font-weight: 600;
            margin-right: 0.4rem;
            margin-bottom: 0.5rem;
            display: inline-block;
            transition: all 0.2s ease;
        }

        .category-pill:hover {
            background: #4e73df;
            border-color: #4e73df;
            color: white;
        }

        .category-pill.active {
            background: #4e73df;
            color: white;
        }

        /* ------------------------------------------------ */
        /* 반응형 디자인 */
        /* ------------------------------------------------ */
        @media (max-width: 992px) {
            .book-card-wrapper {
                width: 45%;
            }
        }

        @media (max-width: 576px) {
            .book-card-wrapper {
                width: 90%;
            }
            .card-img-wrapper img {
                height: 260px;
            }
        }

    </style>

    <script>
        // 좋아요/찜하기 토글 (AJAX/Fetch API 사용)
        function toggleLike(button) {
            const bookId = button.getAttribute('data-book-id');
            const icon = button.querySelector('i');
            const isLiked = icon.classList.contains('fas');

            let method = isLiked ? 'DELETE' : 'POST';
            let url = `/mypage/like/test?bookId=${bookId}`;

            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                }
            })
                .then(response => {
                    if (response.ok) {
                        icon.classList.toggle('far');
                        icon.classList.toggle('fas');
                        alert(isLiked ? `[${bookId}] 찜 취소되었습니다.` : `[${bookId}] 찜 등록되었습니다!`);
                    } else if (response.status === 401) {
                        alert('처리 실패: 로그인이 필요합니다.');
                    } else {
                        alert('처리 실패: 서버 오류이거나 잘못된 요청입니다. (상태: ' + response.status + ')');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('요청 중 네트워크 오류가 발생했습니다.');
                });
        }
    </script>

<script>
    // 페이지가 로드되면 레이아웃을 불러옵니다
    window.addEventListener('DOMContentLoaded', function() {
        // ... (레이아웃 로드 스크립트는 변경 없음) ...
        fetch('layout.html')
            .then(response => response.text())
            .then(html => {
                // 임시 div에 레이아웃 HTML을 넣습니다
                const temp = document.createElement('div');
                temp.innerHTML = html;

                // 현재 페이지의 내용을 저장합니다
                const pageContent = document.body.innerHTML;

                // body의 내용을 레이아웃으로 교체합니다
                document.body.innerHTML = temp.querySelector('body').innerHTML;

                // head의 스타일도 추가합니다
                const layoutHead = temp.querySelector('head');
                const currentHead = document.head;

                // 레이아웃의 모든 링크와 스타일을 현재 head에 추가
                Array.from(layoutHead.children).forEach(child => {
                    if (child.tagName === 'LINK' || child.tagName === 'STYLE') {
                        currentHead.appendChild(child.cloneNode(true));
                    }
                });

                // 페이지 컨텐츠를 #page-content에 삽입합니다
                const pageContentDiv = document.getElementById('page-content');
                if (pageContentDiv) {
                    pageContentDiv.innerHTML = pageContent;
                }

                // 레이아웃의 스크립트들을 실행합니다
                const scripts = temp.querySelectorAll('script');
                scripts.forEach(script => {
                    const newScript = document.createElement('script');
                    if (script.src) {
                        newScript.src = script.src;
                    } else {
                        newScript.textContent = script.textContent;
                    }
                    document.body.appendChild(newScript);
                });

                // 페이지별 이벤트 리스너 추가
                initPageScripts();
            })
            .catch(error => {
                console.error('레이아웃을 불러오는데 실패했습니다:', error);
            });
    });
</script>
