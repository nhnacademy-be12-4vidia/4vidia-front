<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/admin-layout}">
<head>
    <meta charset="UTF-8">
    <title>반품 상세</title>
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">

    <style>
        .badge-status {
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 0.85rem;
        }

        .status-PROCESS { background: #f0ad4e; color: #fff; } /* 신청 */
        .status-APPROVED { background: #198754; color: #fff; } /* 승인 */
        .status-REJECTED  { background: #dc3545; color: #fff; } /* 거절 */

    </style>
</head>

<body>
<div layout:fragment="pageContent">

    <div class="d-flex justify-content-between mb-3">
        <h1 class="h3 text-gray-800 mb-0">반품 상세내역</h1>
        <a th:href="@{/admin/refunds(refundStatus=${refund.refundStatus}, page=${page})}"
           class="btn btn-outline-secondary btn-sm">← 목록으로</a>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">

            <table class="table table-bordered mb-4">
                <tbody>
                <tr>
                    <th class="bg-light" style="width: 200px;">반품번호</th>
                    <td th:text="${refund.orderId}"></td>
                </tr>

                <tr>
                    <th class="bg-light" style="width: 200px;">주문번호</th>
                    <td th:text="${refund.orderId}"></td>
                </tr>

                <tr>
                    <th class="bg-light" style="width: 200px;">이메일</th>
                    <td th:text="${refund.email}"></td>
                </tr>

                <tr>
                    <th class="bg-light" style="width: 200px;">이름</th>
                    <td th:text="${refund.name}"></td>
                </tr>

                <tr>
                    <th class="bg-light" style="width: 200px;">반품 사유</th>
                    <td th:text="${refund.description}"></td>
                </tr>

                <tr>
                    <th class="bg-light">반품 상태</th>
                    <td>
                        <span class="badge-status"
                              th:text="${refund.refundStatus}"
                              th:classappend="' status-' + ${refund.refundStatus}">
                        </span>
                    </td>
                </tr>
                <tr>
                    <th class="bg-light">반품 신청일</th>
                    <td th:text="${#temporals.format(refund.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                </tr>

                <tr>
                    <th class="bg-light">반품 아이템</th>
                    <td>
                        <div class="card-body">

                            <div th:each="item : ${refund.items}"
                                 class="row mb-4 border-bottom pb-4 align-items-start">

                                <!-- 이미지 -->
                                <div class="col-md-2 text-center">
                                    <img th:if="${item.bookImgUrl != null}"
                                         th:src="${item.bookImgUrl}"
                                         class="img-fluid rounded border"
                                         style="max-height: 100px;">
                                    <div th:unless="${item.bookImgUrl != null}" class="bg-light rounded p-3">
                                        <i class="fas fa-book fa-2x text-gray-300"></i>
                                    </div>
                                </div>

                                <!-- 상품 정보 -->
                                <div class="col-md-5">
                                    <h5 class="font-weight-bold mb-1"
                                        th:text="${item.bookTitle}"></h5>

                                    <div class="text-sm text-gray-700 mb-2">
                                        <span th:text="|${#numbers.formatInteger(item.salePrice, 0, 'COMMA')}원|"></span>
                                        · <span th:text="|${item.quantity}권|"></span>
                                    </div>

                                    <!-- 아이템 상태 -->
                                    <span class="badge-status"
                                          th:text="${item.refundStatus}"
                                          th:classappend="' status-' + ${item.refundStatus}">
                                    </span>
                                </div>

                                <!-- ✅ 아이템별 승인 / 거절 -->
                                <div class="col-md-5"
                                     th:if="${item.refundStatus == 'PROCESS'}">

                                    <!-- 승인 -->
                                    <form th:action="@{/admin/refunds/{id}(id=${item.refundItemId})}"
                                          method="post"
                                          class="d-inline-block mr-2">

                                        <input type="hidden" name="refundStatus" value="APPROVED">
                                        <input type="hidden" name="page" th:value="${page}">

                                        <button type="submit"
                                                class="btn btn-sm btn-success"
                                                onclick="return confirm('이 아이템을 승인하시겠습니까?');">
                                            승인
                                        </button>
                                    </form>

                                    <!-- 거절 -->
                                    <form th:action="@{/admin/refunds/{id}(id=${item.refundItemId})}"
                                          method="post"
                                          class="mt-2">

                                        <input type="hidden" name="refundStatus" value="REJECTED">
                                        <input type="hidden" name="page" th:value="${page}">

                                        <textarea name="rejectDetail"
                                                  class="form-control form-control-sm mb-2"
                                                  rows="2"
                                                  placeholder="거절 사유를 입력하세요"
                                                  required></textarea>

                                        <button type="submit"
                                                class="btn btn-sm btn-danger"
                                                onclick="return confirm('이 아이템을 거절하시겠습니까?');">
                                            거절
                                        </button>
                                    </form>

                                </div>
                            </div>

                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
