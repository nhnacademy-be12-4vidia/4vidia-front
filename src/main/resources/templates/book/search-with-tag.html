<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>4VIDIA - 태그로 도서 검색</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        /* ==========================
           공통 레이아웃
        ========================== */
        .page-wrap {
            max-width: 1180px;
            margin: 0 auto;
        }

        /* ==========================
           태그 검색 컨트롤 패널
        ========================== */
        .tag-panel {
            border: 1px solid rgba(78,115,223,0.22);
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(78,115,223,0.08), rgba(28,200,138,0.08));
            box-shadow: 0 0.45rem 1.25rem rgba(0,0,0,0.06);
            padding: 16px;
            position: relative;
            overflow: hidden;
        }
        .tag-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 12% 18%, rgba(78,115,223,0.14), transparent 48%),
            radial-gradient(circle at 88% 30%, rgba(28,200,138,0.14), transparent 48%);
            pointer-events: none;
        }
        .tag-panel__header {
            position: relative;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }
        .tag-panel__title {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .tag-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(78,115,223,0.14);
            border: 1px solid rgba(78,115,223,0.22);
            color: #2e59d9;
            font-weight: 800;
            font-size: 0.82rem;
            white-space: nowrap;
        }
        .tag-panel__sub {
            position: relative;
            margin: 6px 0 0 0;
            font-size: 0.92rem;
            color: #5a5c69;
        }

        /* 태그 칩(현재 선택된 태그들 표시) */
        .tag-chip-list {
            position: relative;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .tag-chip-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 999px;
            background: #fff;
            border: 1px solid rgba(0,0,0,0.08);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            font-weight: 700;
            font-size: 0.9rem;
            color: #2c3e50;
        }
        .tag-chip-item button {
            border: none;
            background: transparent;
            color: #888;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }
        .tag-chip-item button:hover {
            color: #e74a3b;
        }

        /* ==========================
           결과 그리드(세련되게)
        ========================== */
        .result-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 18px;
        }

        @media (max-width: 1200px) {
            .result-grid { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 992px) {
            .result-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 576px) {
            .result-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
        }

        .book-card {
            border: 1px solid rgba(0,0,0,0.06);
            border-radius: 14px;
            background: #fff;
            overflow: hidden;
            box-shadow: 0 0.35rem 1.2rem rgba(0,0,0,0.08);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            height: 100%;
        }
        .book-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 0.65rem 1.6rem rgba(0,0,0,0.14);
        }

        .img-wrap {
            position: relative;
            background: #f8f9fa;
            text-align: center;
        }
        .img-wrap img {
            width: 100%;
            height: 190px;
            object-fit: contain;
            padding: 10px;
        }

        /* 좋아요 버튼(기존 검색 페이지 스타일 느낌 유지) */
        .btn-heart {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 5;
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: rgba(255,255,255,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            transition: background 0.15s, transform 0.2s;
        }
        .btn-heart:hover { background: #ffe5e5; transform: scale(1.08); }
        .btn-heart i { font-size: 1rem; color: #777; }
        .btn-heart i.fas { color: #e74a3b; }

        .body {
            padding: 12px 12px 14px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .title {
            font-size: 0.95rem;
            font-weight: 800;
            color: #2c3e50;
            line-height: 1.25;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin: 0;
        }
        .meta {
            font-size: 0.82rem;
            color: #6c757d;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .meta .publisher {
            color: #4e73df;
            font-weight: 800;
        }

        .prices {
            margin-top: 2px;
        }
        .price-original-no-discount {
            color: #2c3e50;
            font-size: 0.95rem;
            font-weight: 800;
            text-decoration: none;
        }
        .price-original {
            text-decoration: line-through;
            color: #858796;
            font-size: 0.82rem;
            margin-left: 6px;
        }
        .price-current {
            color: #4e73df;
            font-weight: 800;
            font-size: 0.95rem;
        }

        /* ==========================
           페이징
        ========================== */
        .pagination .page-link {
            border-radius: 10px;
        }
    </style>

    <script th:src="@{/customJs/like.js}"></script>

    <script>
        // 태그 추가 / 삭제 / 모드 토글을 AJAX 없이 GET으로 처리
        function submitWithParams(extraParams) {
            const form = document.getElementById('tagSearchForm');
            const url = new URL(form.action, window.location.origin);

            // 현재 폼 값 반영
            const formData = new FormData(form);
            for (const [k, v] of formData.entries()) {
                if (v === null || v === undefined) continue;
                if (String(v).trim() === '') continue;
                url.searchParams.append(k, v);
            }

            // 추가 파라미터 반영
            if (extraParams) {
                Object.entries(extraParams).forEach(([k, v]) => {
                    url.searchParams.append(k, v);
                });
            }

            startLoading(); // 추가
            window.location.href = url.toString();
        }

        function addTag() {
            const input = document.getElementById('tagInput');
            const raw = (input.value || '').trim();
            if (!raw) return;

            // 쉼표로 여러 개 입력 가능
            const parts = raw.split(',').map(s => s.trim()).filter(s => s.length > 0);
            if (parts.length === 0) return;

            // 현재 쿼리스트링의 tags + 새 tags를 합쳐서 이동
            const url = new URL(window.location.href);
            parts.forEach(t => url.searchParams.append('tagNameList', t));

            // page는 0으로 리셋
            url.searchParams.set('page', '0');

            startLoading(); // 추가
            window.location.href = url.toString();
        }

        function removeTag(tagValue) {
            const url = new URL(window.location.href);
            const all = url.searchParams.getAll('tagNameList');
            url.searchParams.delete('tagNameList');

            all.filter(t => t !== tagValue).forEach(t => url.searchParams.append('tagNameList', t));

            // page는 0으로 리셋
            url.searchParams.set('page', '0');

            startLoading(); // 추가
            window.location.href = url.toString();
        }

        function changeMode(mode) {
            const url = new URL(window.location.href);
            url.searchParams.set('mode', mode);
            url.searchParams.set('page', '0');

            startLoading(); // 추가
            window.location.href = url.toString();
        }

        function goPage(pageNo) {
            startLoading(); // 추가
            const url = new URL(window.location.href);
            url.searchParams.set('page', String(pageNo));
            // keep size/mode/tagNameList as-is in current URL
            window.location.href = url.toString();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const tagForm = document.getElementById('tagSearchForm');
            if (tagForm) {
                tagForm.addEventListener('submit', () => {
                    startLoading();
                });
            }
        });
    </script>

<!--    <link rel="stylesheet" th:href="@{/css/loading.css}">-->
<!--    <script th:src="@{/customJs/loading.js}"></script>-->
</head>

<body>
<div layout:fragment="content">
    <div id="global-loader" class="loader-container"></div>

    <div class="container-fluid mt-4 page-wrap">

        <!-- 헤더 -->
        <div class="d-sm-flex align-items-center justify-content-between mb-3 px-1">
            <div>
                <h1 class="h4 mb-1 text-gray-800">태그 검색 결과</h1>
                <p class="mb-0 text-gray-600">
                    <span th:text="' · 총 ' + ${totalElements} + '건'"> · 총 0건</span>
                </p>
            </div>
        </div>

        <!-- 상단 조작 패널 -->
        <section class="tag-panel mb-3">
            <div class="tag-panel__header">
                <div>
                    <div class="tag-panel__title">
                        <h3 class="h5 m-0">태그 조건</h3>
                        <span class="tag-chip"><i class="fas fa-tags"></i> TAG SEARCH</span>
                    </div>
                    <p class="tag-panel__sub">
                        태그를 추가하고 AND/OR 조건을 바꿔가며 검색할 수 있습니다. (페이지는 자동으로 1페이지로 초기화됩니다)
                    </p>
                </div>
            </div>

            <!-- GET 폼: 태그/모드/페이징 유지용 -->
            <form id="tagSearchForm" th:action="@{/books/search/tags}" method="get" class="row g-2 align-items-center position-relative">
                <!-- size 유지 -->
                <input type="hidden" name="size" th:value="${size}">
                <!-- page 유지(사용자가 적용 버튼 누를 때는 그대로, 태그/모드 변경 시 JS에서 0으로 리셋) -->
                <input type="hidden" name="page" th:value="${page}">

                <!-- 기존 tags 유지: request에서 꺼낼 수 있으면 그걸 쓰고, 아니면 param에서 유지 -->
                <div th:if="${tagRequest != null and tagRequest.tagNameList() != null}">
                    <input type="hidden" name="tagNameList" th:each="t : ${tagRequest.tagNameList()}" th:value="${t}">
                </div>
                <div th:if="${tagRequest == null or tagRequest.tagNameList() == null}">
                    <input type="hidden" name="tagNameList" th:each="t : ${param.tagNameList}" th:value="${t}">
                </div>

                <!-- mode 유지 -->
                <input type="hidden" name="mode"
                       th:value="${tagRequest != null ? tagRequest.mode() : (param.mode != null ? param.mode[0] : 'AND')}">

                <div class="col-12 col-lg-6">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-plus"></i></span>
                        <input id="tagInput" type="text" class="form-control"
                               placeholder="태그 입력 (쉼표로 여러 개 가능) 예: 스프링, 자바, JPA">
                        <button type="button" class="btn btn-primary" onclick="addTag()">
                            태그 추가
                        </button>
                    </div>
                </div>

                <div class="col-12 col-lg-4">
                    <div class="btn-group w-100" role="group" aria-label="Match mode">
                        <button type="button"
                                class="btn btn-outline-primary"
                                th:classappend="${(tagRequest != null ? tagRequest.mode().toString() : (param.mode != null ? param.mode[0] : 'AND')) == 'AND'} ? ' active' : ''"
                                onclick="changeMode('AND')">
                            AND (모두 포함)
                        </button>
                        <button type="button"
                                class="btn btn-outline-primary"
                                th:classappend="${(tagRequest != null ? tagRequest.mode().toString() : (param.mode != null ? param.mode[0] : 'AND')) == 'OR'} ? ' active' : ''"
                                onclick="changeMode('OR')">
                            OR (하나라도 포함)
                        </button>
                    </div>
                </div>

                <div class="col-12 col-lg-2 d-grid">
                    <button type="submit" class="btn btn-dark">
                        적용 <i class="fas fa-search ms-1"></i>
                    </button>
                </div>

                <!-- 현재 태그 칩 표시 -->
                <div class="col-12">
                    <div class="tag-chip-list">
                        <!-- tagRequest.tagNameList()가 있으면 그걸 표시 -->
                        <div th:if="${tagRequest != null and tagRequest.tagNameList() != null}">
                            <span class="tag-chip-item" th:each="t : ${tagRequest.tagNameList()}">
                                <span th:text="${t}">태그</span>
                                <button type="button" th:attr="onclick=|removeTag('${t}')|" title="삭제">
                                    <i class="fas fa-times"></i>
                                </button>
                            </span>
                        </div>

                        <!-- 없으면 param.tagNameList로 표시 -->
                        <div th:if="${tagRequest == null or tagRequest.tagNameList() == null}">
                            <span class="tag-chip-item" th:each="t : ${param.tagNameList}">
                                <span th:text="${t}">태그</span>
                                <button type="button" th:attr="onclick=|removeTag('${t}')|" title="삭제">
                                    <i class="fas fa-times"></i>
                                </button>
                            </span>
                        </div>

                        <span th:if="${(tagRequest == null or tagRequest.tagNameList() == null) and (param.tagNameList == null or #lists.isEmpty(param.tagNameList))}"
                              class="text-muted small">
                            아직 태그가 없습니다. 위에서 태그를 추가해 주세요.
                        </span>
                    </div>
                </div>
            </form>
        </section>

        <!-- 결과 없음 -->
        <div class="row" th:if="${#lists.isEmpty(books)}">
            <div class="col-12">
                <div class="alert alert-light border text-center py-5">
                    <i class="fas fa-search fa-3x text-gray-300 mb-3"></i>
                    <p class="mb-1 fw-bold">검색 결과가 없습니다.</p>
                    <p class="mb-0 text-muted small">
                        태그 조합을 바꾸거나 태그 철자를 확인해 주세요.
                    </p>
                </div>
            </div>
        </div>

        <!-- 결과 그리드 -->
        <div th:if="${!#lists.isEmpty(books)}" class="result-grid mb-4">
            <div th:each="book : ${books}">
                <div class="book-card h-100">
                    <div class="img-wrap">
                        <button type="button"
                                class="btn-heart"
                                th:attr="data-book-id=${book.id()}"
                                onclick="toggleLike(event, this)">
                            <i class="fa-heart" th:classappend="${book.liked() ? 'fas' : 'far'}"></i>
                        </button>

                        <a th:href="@{/books/{bookId}(bookId=${book.id()})}" style="text-decoration:none; color:inherit;">
                            <img th:src="${book.imageUrl() != null ? book.imageUrl() : '/img/default-book-cover.png'}" th:alt="${book.title()}">
                        </a>
                    </div>

                    <div class="body">
                        <a th:href="@{/books/{bookId}(bookId=${book.id()})}" style="text-decoration:none; color:inherit;">
                            <p class="title" th:text="${book.title()}">책 제목</p>
                        </a>

                        <div class="meta">
                            <span class="publisher" th:text="${book.publisherName()}">출판사</span>
                            <span th:text="${#lists.isEmpty(book.authorNames()) ? '저자 정보 없음' : #strings.listJoin(book.authorNames(), ', ')}">저자</span>
                        </div>

                        <div class="prices">
                            <span th:if="${book.priceStandard() > book.priceSales()}"
                                  class="price-current"
                                  th:text="${#numbers.formatDecimal(book.priceSales(), 0, 'COMMA', 0, 'POINT') + '원'}">할인가</span>

                            <span th:if="${book.priceStandard() > book.priceSales()}"
                                  class="price-original"
                                  th:text="${#numbers.formatDecimal(book.priceStandard(), 0, 'COMMA', 0, 'POINT') + '원'}">정가</span>

                            <span th:if="${book.priceStandard() <= book.priceSales()}"
                                  class="price-original-no-discount"
                                  th:text="${#numbers.formatDecimal(book.priceStandard(), 0, 'COMMA', 0, 'POINT') + '원'}">정가</span>

                            <span class="badge bg-danger ms-1" style="font-size: 0.72rem;"
                                  th:if="${book.priceStandard() > book.priceSales()}"
                                  th:text="${book.priceStandard() == 0 ? '' : #numbers.formatDecimal((book.priceStandard() - book.priceSales()) * 100 / book.priceStandard(), 0, 'COMMA', 0, 'POINT') + '%'}">
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 페이징: tags/mode 유지 -->
        <nav th:if="${totalPages != null and totalPages > 1}" class="mt-3 pb-5">
            <ul class="pagination justify-content-center"
                th:with="blockSize=${T(java.lang.Integer).valueOf(10)},
                         p=${T(java.lang.Integer).valueOf(page)},
                         hasContent=${!#lists.isEmpty(books)},
                         computedLast=${T(java.lang.Integer).valueOf(totalPages - 1)},
                         effectiveLast=${hasContent ? computedLast : (p - 1)},
                         lastIndex=${effectiveLast < 0 ? 0 : effectiveLast},
                         start=${p - (p % blockSize)}">

                <!-- 맨앞 -->
                <li class="page-item" th:classappend="${page == 0} ? ' disabled'">
                    <a class="page-link" href="javascript:void(0)" th:attr="onclick=|goPage(0)|" aria-label="First">
                        <i class="fas fa-angle-double-left"></i>
                    </a>
                </li>

                <!-- 이전 블록 (start-1) -->
                <li class="page-item" th:classappend="${start == 0} ? ' disabled'">
                    <a class="page-link" href="javascript:void(0)" th:attr="onclick=|goPage(${start - 1})|" aria-label="Prev block">
                        <i class="fas fa-angle-left"></i>
                    </a>
                </li>

                <!-- 현재 블록(최대 10개) -->
                <th:block th:if="${start <= lastIndex}"
                          th:with="end=${(lastIndex < (start + blockSize - 1)) ? lastIndex : (start + blockSize - 1)}">
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(start, end)}"
                        th:classappend="${i == page} ? ' active'">
                        <a class="page-link" href="javascript:void(0)"
                           th:text="${i + 1}"
                           th:attr="onclick=|goPage(${i})|"></a>
                    </li>
                </th:block>

                <!-- 다음 블록 (start+blockSize) -->
                <li class="page-item" th:classappend="${start + blockSize > lastIndex} ? ' disabled'">
                    <a class="page-link" href="javascript:void(0)" th:attr="onclick=|goPage(${start + blockSize})|" aria-label="Next block">
                        <i class="fas fa-angle-right"></i>
                    </a>
                </li>

                <!-- 맨뒤 -->
                <li class="page-item" th:classappend="${page >= lastIndex} ? ' disabled'">
                    <a class="page-link" href="javascript:void(0)" th:attr="onclick=|goPage(${lastIndex})|" aria-label="Last">
                        <i class="fas fa-angle-double-right"></i>
                    </a>
                </li>
            </ul>
        </nav>

    </div>
</div>
</body>
</html>
