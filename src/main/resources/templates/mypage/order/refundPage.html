<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="utf-8">
    <title>반품 신청</title>
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
    <style>
        .form-section { margin-bottom: 1.2rem; }
        .order-summary .list-group-item {
            display: flex;
            justify-content: space-between;
            gap: .5rem;
            align-items: center;
        }
        .item-check-wrap { display:flex; align-items:center; gap: .75rem; }
        .item-check-wrap .book-title { font-weight:600; color:#333; }
        .item-check-wrap .book-qty { color:#6c757d; font-size:.9rem; }
        @media (max-width: 576px) { .item-check-wrap { gap: .5rem; } }
        .d-none { display: none !important; }
    </style>
</head>
<body>
<div layout:fragment="content" class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 text-gray-800 mb-0">반품 신청서</h1>
        <a th:href="@{/orders/{id}(id=${order.orderId})}" class="btn btn-outline-secondary btn-sm">주문 상세로</a>
    </div>

    <div class="row g-4">
        <!-- 왼쪽: 폼 -->
        <div class="col-12 col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <form id="returnForm" th:action="@{/refunds}" method="post" novalidate>
                        <input type="hidden" name="orderId" th:value="${order.orderId}"/>

                        <!-- reason 섹션 (항상 보이도록 변경) -->
                        <div class="form-section">
                            <label for="reason" class="form-label fw-bold">반품 사유</label>
                            <textarea id="reason" name="reason" class="form-control" rows="5"
                                      placeholder="반품 사유를 작성해 주세요 (선택사항)"></textarea>
                            <div class="form-text text-muted">파손/불량일 경우 상세히 적어주시면 처리에 도움이 됩니다.</div>
                        </div>

                        <div class="form-section">
                            <label class="form-label fw-bold d-block">반품 유형</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="damaged" id="typeSimple" value="false" checked>
                                <label class="form-check-label" for="typeSimple">단순 변심</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="damaged" id="typeDamaged" value="true">
                                <label class="form-check-label" for="typeDamaged">파손/불량</label>
                            </div>
                            <div class="form-text text-muted mt-1">파손으로 선택 시 관리자가 추가 확인을 요청할 수 있습니다.</div>
                        </div>

                        <div class="d-flex justify-content-end mt-3">
                            <a th:href="@{/mypage/order}" class="btn btn-outline-secondary mr-2">취소</a>
                            <button type="submit" class="btn btn-primary">반품 신청하기</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- 오른쪽: 주문 항목 체크박스 -->
        <div class="col-12 col-lg-4">
            <div class="card order-summary shadow-sm">
                <div class="card-body">
                    <h6 class="mb-2">주문 항목</h6>
                    <ul class="list-group mb-3">
                        <li class="list-group-item" th:each="it : ${order.orderItems}">
                            <div class="item-check-wrap">
                                <input type="checkbox"
                                       class="form-check-input item-checkbox"
                                       name="orderItemIds"
                                       form="returnForm"
                                th:id="${'item-' + it.orderItemId}"
                                th:value="${it.orderItemId}">
                                <div>
                                    <div class="book-title" th:text="${it.bookTitle}">책 제목</div>
                                    <div class="book-qty" th:text="'수량: ' + ${it.quantity}">수량: 1</div>
                                </div>
                            </div>
                        </li>

                        <li class="list-group-item text-center text-muted" th:if="${#lists.isEmpty(order.orderItems)}">주문 항목이 없습니다.</li>
                    </ul>

                    <div class="d-grid gap-2">
                        <a th:href="@{/orders/{id}(id=${order.orderId})}" class="btn btn-outline-primary btn-sm">주문 상세보기</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 간단한 검증 스크립트: 최소 하나 선택했는지 확인 -->
<script th:inline="javascript">
    (function(){
        function initReturnForm() {
            const form = document.getElementById('returnForm');
            if (!form) return;

            form.addEventListener('submit', function(e) {
                // 체크된 항목 수집 (체크박스에 name="orderItemIds"가 있으므로 hidden 생성 불필요)
                const selected = Array.from(document.querySelectorAll('input.item-checkbox'))
                    .filter(cb => cb.checked)
                    .map(cb => cb.value);

                if (selected.length === 0) {
                    e.preventDefault();
                    alert('반품할 항목을 하나 이상 선택해 주세요.');
                    return;
                }

            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initReturnForm);
        } else {
            initReturnForm();
        }
    })();
</script>
</body>
</html>
