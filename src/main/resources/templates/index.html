<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="utf-8">
    <title>4VIDIA - 도서 쇼핑몰</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .book-card {
            border: none;
            border-radius: 0.35rem;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
            transition: transform 0.2s, box-shadow 0.2s;
            height: 100%;
        }

        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0.5rem 2rem 0 rgba(58, 59, 69, 0.25);
        }

        .book-card img {
            border-top-left-radius: 0.35rem;
            border-top-right-radius: 0.35rem;
            height: 300px;
            object-fit: cover;
        }

        .badge-new {
            background-color: #1cc88a;
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1;
        }

        .badge-best {
            background-color: #e74a3b;
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1;
        }

        .badge-new.with-best {
            top: 40px;
        }

        .btn-heart {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 1;
        }

        .btn-heart:hover {
            background-color: #ffe5e5;
        }

        .btn-heart i {
            color: #666;
        }

        /* 좋아요가 눌렸을 때의 상태 */
        .btn-heart i.fas {
            color: #e74a3b;
        }

        .btn-heart:hover i {
            color: #e74a3b;
        }

        .price-original {
            text-decoration: line-through;
            color: #858796;
            font-size: 0.9rem;
        }

        .price-current {
            color: #4e73df;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .category-badge {
            color: #4e73df;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .rating {
            color: #f6c23e;
        }

        .category-pill {
            padding: 0.5rem 1.25rem;
            border-radius: 50px;
            border: 1px solid #e3e6f0;
            background: white;
            color: #5a5c69;
            text-decoration: none;
            display: inline-block;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
            transition: all 0.2s;
        }

        .category-pill:hover,
        .category-pill.active {
            background: #4e73df;
            color: white;
            border-color: #4e73df;
            text-decoration: none;
        }

        .card-img-wrapper {
            position: relative;
            overflow: hidden;
        }

        .card-img-wrapper img {
            transition: transform 0.3s ease;
        }

        .book-card:hover .card-img-wrapper img {
            transform: scale(1.05);
        }
    </style>
    <script>
        // 좋아요/찜하기 토글 (AJAX/Fetch API 사용)
        function toggleLike(button) {
            const bookId = button.getAttribute('data-book-id');
            const icon = button.querySelector('i');
            const isLiked = icon.classList.contains('fas');

            let method = isLiked ? 'DELETE' : 'POST';
            let url = `/mypage/like/test?bookId=${bookId}`;

            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                }
            })
                .then(response => {
                    if (response.ok) {
                        icon.classList.toggle('far');
                        icon.classList.toggle('fas');
                        alert(isLiked ? `[${bookId}] 찜 취소되었습니다.` : `[${bookId}] 찜 등록되었습니다!`);
                    } else if (response.status === 401) {
                        alert('처리 실패: 로그인이 필요합니다.');
                    } else {
                        alert('처리 실패: 서버 오류이거나 잘못된 요청입니다. (상태: ' + response.status + ')');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('요청 중 네트워크 오류가 발생했습니다.');
                });
        }
    </script>
</head>


<body>
<div layout:fragment="content">
    <div class="container-fluid">
        <div class="d-sm-flex align-items-center justify-content-between mb-4">
            <div>
                <h1 class="h3 mb-2 text-gray-800">베스트셀러 도서</h1>
                <p class="mb-0 text-gray-600">4VIDIA에서 가장 인기있는 도서들을 만나보세요</p>
            </div>
        </div>

        <div class="mb-4">
            <a href="#" class="category-pill active" data-category="all">전체</a>
            <a href="#" class="category-pill" data-category="문학">문학</a>
            <a href="#" class="category-pill" data-category="소설">소설</a>
            <a href="#" class="category-pill" data-category="에세이">에세이</a>
            <a href="#" class="category-pill" data-category="자기계발">자기계발</a>
            <a href="#" class="category-pill" data-category="교육">교육</a>
            <a href="#" class="category-pill" data-category="여행">여행</a>
        </div>

        <div class="row">
            <div class="col-xl-3 col-lg-4 col-md-6 mb-4">
                <div class="card book-card">
                    <div class="card-img-wrapper">
                        <span class="badge badge-danger badge-best">BEST</span>
                        <button type="button"
                                class="btn-heart"
                                data-book-id="1"
                                onclick="toggleLike(this)">
                            <i class="far fa-heart"></i>
                        </button>
                        <img class="card-img-top" src="https://image.aladin.co.kr/product/25433/80/cover/e572537345_1.jpg?w=400" alt="클래식 문학">
                    </div>
                    <div class="card-body">
                        <div class="category-badge mb-1">문학</div>
                        <h5 class="card-title mb-1">책제목1</h5>
                        <p class="text-muted small mb-2">세계문학전집</p>
                        <div class="mb-2">
                            <span class="rating"><i class="fas fa-star"></i> 4.8</span>
                            <span class="text-muted small">(128)</span>
                        </div>
                        <div class="mb-3">
                            <span class="price-original">18,000원</span>
                            <span class="price-current ml-2">15,000원</span>
                        </div>
                        <div class="d-flex justify-content-between">

                            <form th:action="@{/cart/add}" method="post" class="w-50 mr-1">
                                <input type="hidden" name="bookId" th:value="${1}">
                                <button class="btn btn-primary btn-block">
                                    <i class="fas fa-shopping-cart mr-1"></i> 장바구니 담기
                                </button>
                            </form>

                            <form th:action="@{/orders}" method="post" class="w-50 ml-1">
                                <input type="hidden" name="bookId" th:value="${1}">
                                <input type="hidden" name="quantity" value="1">
                                <button type="submit" class="btn btn-secondary btn-block">
                                    바로 구매
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-xl-3 col-lg-4 col-md-6 mb-4">
                <div class="card book-card">
                    <div class="card-img-wrapper">
                        <span class="badge badge-success badge-new">NEW</span>
                        <button type="button"
                                class="btn-heart"
                                data-book-id="5"
                                onclick="toggleLike(this)">
                            <i class="far fa-heart"></i>
                        </button>
                        <img class="card-img-top" src="https://image.aladin.co.kr/product/27983/44/cover/k032734221_1.jpg?w=400" alt="독서의 즐거움">
                    </div>
                    <div class="card-body">
                        <div class="category-badge mb-1">에세이</div>
                        <h5 class="card-title mb-1">책제목2</h5>
                        <p class="text-muted small mb-2">박지원</p>
                        <div class="mb-2">
                            <span class="rating"><i class="fas fa-star"></i> 4.5</span>
                            <span class="text-muted small">(128)</span>
                        </div>
                        <div class="mb-3">
                            <span class="price-original">15,000원</span>
                            <span class="price-current">5,000원</span>
                        </div>
                        <div class="d-flex justify-content-between">

                            <form th:action="@{/cart/add}" method="post" class="w-50 mr-1">
                                <input type="hidden" name="bookId" th:value="${5}">
                                <button class="btn btn-primary btn-block">
                                    <i class="fas fa-shopping-cart mr-1"></i> 장바구니 담기
                                </button>
                            </form>

                            <form th:action="@{/orders}" method="post" class="w-50 ml-1">
                                <input type="hidden" name="bookId" th:value="${5}">
                                <input type="hidden" name="quantity" value="1">
                                <button type="submit" class="btn btn-secondary btn-block">
                                    바로 구매
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-xl-3 col-lg-4 col-md-6 mb-4">
                <div class="card book-card">
                    <div class="card-img-wrapper">
                        <button type="button"
                                class="btn-heart"
                                data-book-id="8"
                                onclick="toggleLike(this)">
                            <i class="far fa-heart"></i>
                        </button>
                        <img class="card-img-top" src="https://image.aladin.co.kr/product/28383/37/cover/k652835711_1.jpg?w=400" alt="현대 교육학">
                    </div>
                    <div class="card-body">
                        <div class="category-badge mb-1">교육</div>
                        <h5 class="card-title mb-1">책제목3</h5>
                        <p class="text-muted small mb-2">김교수</p>
                        <div class="mb-2">
                            <span class="rating"><i class="fas fa-star"></i> 4.6</span>
                            <span class="text-muted small">(128)</span>
                        </div>
                        <div class="mb-3">
                            <span class="price-original">38,000원</span>
                            <span class="price-current ml-2">32,000원</span>
                        </div>

                        <div class="d-flex justify-content-between">

                            <form th:action="@{/cart/add}" method="post" class="w-50 mr-1">
                                <input type="hidden" name="bookId" th:value="${8}">
                                <button class="btn btn-primary btn-block">
                                    <i class="fas fa-shopping-cart mr-1"></i> 장바구니 담기
                                </button>
                            </form>

                            <form th:action="@{/orders}" method="post" class="w-50 ml-1">
                                <input type="hidden" name="bookId" th:value="${8}">
                                <input type="hidden" name="quantity" value="1">
                                <button type="submit" class="btn btn-secondary btn-block">
                                    바로 구매
                                </button>
                            </form>
                        </div>

                        </div>
                    </div>
                </div>
            </div>

            <div class="col-xl-3 col-lg-4 col-md-6 mb-4">
                <div class="card book-card">
                    <div class="card-img-wrapper">
                        <span class="badge badge-success badge-new">NEW</span>
                        <button type="button"
                                class="btn-heart"
                                data-book-id="99"
                                onclick="toggleLike(this)">
                            <i class="far fa-heart"></i>
                        </button>
                        <img class="card-img-top" src="https://images.unsplash.com/photo-1558210834-473f430c09ac?w=400" alt="커피와 독서">
                    </div>
                    <div class="card-body">
                        <div class="category-badge mb-1">라이프스타일</div>
                        <h5 class="card-title mb-1">X</h5>
                        <p class="text-muted small mb-2">X</p>
                        <div class="mb-2">
                            <span class="rating"><i class="fas fa-star"></i> 4.7</span>
                            <span class="text-muted small">(128)</span>
                        </div>
                        <div class="mb-3">
                            <span class="price-current">0원</span>
                        </div>
                        <button class="btn btn-primary btn-block">장바구니 담기X</button>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
<script>
    // 페이지가 로드되면 레이아웃을 불러옵니다
    window.addEventListener('DOMContentLoaded', function() {
        fetch('layout.html')
            .then(response => response.text())
            .then(html => {
                // 임시 div에 레이아웃 HTML을 넣습니다
                const temp = document.createElement('div');
                temp.innerHTML = html;

                // 현재 페이지의 내용을 저장합니다
                const pageContent = document.body.innerHTML;

                // body의 내용을 레이아웃으로 교체합니다
                document.body.innerHTML = temp.querySelector('body').innerHTML;

                // head의 스타일도 추가합니다
                const layoutHead = temp.querySelector('head');
                const currentHead = document.head;

                // 레이아웃의 모든 링크와 스타일을 현재 head에 추가
                Array.from(layoutHead.children).forEach(child => {
                    if (child.tagName === 'LINK' || child.tagName === 'STYLE') {
                        currentHead.appendChild(child.cloneNode(true));
                    }
                });

                // 페이지 컨텐츠를 #page-content에 삽입합니다
                const pageContentDiv = document.getElementById('page-content');
                if (pageContentDiv) {
                    pageContentDiv.innerHTML = pageContent;
                }

                // 레이아웃의 스크립트들을 실행합니다
                const scripts = temp.querySelectorAll('script');
                scripts.forEach(script => {
                    const newScript = document.createElement('script');
                    if (script.src) {
                        newScript.src = script.src;
                    } else {
                        newScript.textContent = script.textContent;
                    }
                    document.body.appendChild(newScript);
                });

                // 페이지별 이벤트 리스너 추가
                initPageScripts();
            })
            .catch(error => {
                console.error('레이아웃을 불러오는데 실패했습니다:', error);
            });
    });

    // 페이지별 스크립트 초기화
    function initPageScripts() {
        // jQuery가 로드될 때까지 기다립니다
        const waitForJQuery = setInterval(function() {
            if (typeof jQuery !== 'undefined') {
                clearInterval(waitForJQuery);

                // 카테고리 필터
                jQuery('.category-pill').on('click', function(e) {
                    e.preventDefault();
                    jQuery('.category-pill').removeClass('active');
                    jQuery(this).addClass('active');
                });

                // --- 중요: 기존의 좋아요 버튼 jQuery 로직은 제거 (toggleLike 함수와 충돌 방지) ---

                // 장바구니 담기
                jQuery('.btn-primary').on('click', function(e) {
                    // 장바구니 담기 버튼만 처리 (X 버튼이 아닌 경우)
                    const buttonText = jQuery(this).text().trim();
                    if (buttonText === '장바구니 담기') {
                        // 실제 Thymeleaf 폼을 사용하는 경우, 폼 제출은 계속 진행
                        alert('장바구니에 담겼습니다! (서버 요청)');
                        // 폼 제출을 막지 않음
                    } else if (buttonText === '장바구니 담기X') {
                        e.preventDefault(); // 하드코딩된 X 버튼은 동작 방지
                        alert('장바구니 담기X 버튼');
                    }
                });
            }
        }, 100);
    }
</script>
</body>
</html>
