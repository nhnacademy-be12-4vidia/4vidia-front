<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 찾기</title>
</head>

<body>
<div layout:fragment="content">
    <div class="fixed-container" style="max-width: 500px; margin: 0 auto;">
        <h2 class="mt-5 mb-4 text-center fw-bold">비밀번호 찾기</h2>

        <div class="card shadow-sm">
            <div class="card-body p-4">

                <form method="post" th:action="@{/auth/find-password}">
                    <!-- 이메일 -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">이메일(아이디)</label>
                        <input type="email" id="email" class="form-control"
                               name="email" placeholder="example@domain.com" required>
                    </div>

                    <!-- 이름 -->
                    <div class="mb-3">
                        <label for="name" class="form-label fw-bold">이름</label>
                        <input type="text" id="name" class="form-control"
                               name="name" placeholder="이름을 입력해주세요" required>
                    </div>

                    <!-- 전화번호 -->
                    <div class="mb-4">
                        <label for="phone" class="form-label fw-bold">전화번호</label>
                        <input type="tel" id="phone" class="form-control"
                               name="phone" placeholder="예: 01012345678"
                               pattern="01[016789][0-9]{7,8}"
                               title="숫자만 입력해주세요. 예: 01012345678" required>
                    </div>

                    <div class="d-grid gap-2 mb-3">
                        <button type="submit" class="btn btn-primary btn-lg">임시 비밀번호 발급</button>
                    </div>

                    <div class="mt-3 text-center d-flex justify-content-between px-2">
                        <a th:href="@{/auth/login}" class="text-decoration-none text-secondary small">로그인으로 돌아가기</a>
                        <a th:href="@{/auth/find-id}" class="text-decoration-none text-secondary small">아이디 찾기</a>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <th:block layout:fragment="script">
        <script th:if="${success}">
            alert("[[${success}]]");
            window.location.href = "/auth/login";
        </script>

        <script th:if="${error}">
            alert("[[${error}]]");
        </script>
    </th:block>
</div>

</body>
</html>
