<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>주문 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div layout:fragment="content">
        <div class="container-fluid">

            <h1 class="h3 mb-4 text-gray-800">📦 주문 관리</h1>

            <div class="space-y-4">
                <div th:each="order : ${orders}" class="bg-white rounded-lg shadow-sm p-6 mb-4 border border-gray-200">

                    <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom border-gray-200">
                        <div class="d-flex align-items-center gap-4">
                            <span class="text-gray-900" th:text="${order.createdAt()}"><!--2025.11.25--></span>
                            <span class="text-gray-400">|</span>
<!--                            <span class="text-gray-600" th:text="${order.id}">ORD-2025-001</span>-->
                        </div>

                        <span th:classappend="${order.deliveryStatus() == 'DELIVERED' ? 'text-success bg-success-light' :
                                                (order.deliveryStatus() == 'SHIPPING' ? 'text-info bg-info-light' :
                                                (order.deliveryStatus() == 'WAITING' ? 'text-warning bg-warning-light' :
                                                'text-secondary bg-secondary-light'))}"
                              class="px-3 py-1 rounded-pill small font-weight-bold d-inline-flex align-items-center"
                              style="--bs-bg-opacity: .1; padding: .25rem .75rem;">

                            <i th:classappend="${order.deliveryStatus() == 'DELIVERED' ? 'fa-check-circle text-success' :
                                               (order.deliveryStatus() == 'SHIPPING' ? 'fa-truck text-info' :
                                               (order.deliveryStatus() == 'WAITING' ? 'fa-box-open text-warning' :
                                               'fa-box text-secondary'))}"
                               class="fas fa-sm mr-2"></i>

                            <span th:text="${order.deliveryStatus() == 'DELIVERED' ? '배송 완료' :
                                            (order.deliveryStatus() == 'SHIPPING' ? '배송 중' :
                                            (order.deliveryStatus() == 'WAITING' ? '배송 준비중' : '취소됨'))}">
                            </span>
                        </span>
                    </div>

                    <div class="space-y-4">
                        <div th:each="book, bookStat : ${order.orderItems()}" class="d-flex gap-4 mb-3">

                            <img th:src="${book.bookImageUrl()}" th:alt="${book.bookTitle()}"
                                 class="rounded shadow-sm" style="width: 80px; height: 112px; object-fit: cover;">

                            <div class="flex-grow-1">
                                <h4 class="text-gray-900 mb-1" th:text="${book.bookTitle()}" style="font-size: 1rem; font-weight: 600;"><!--클린 코드--></h4>
                                <p class="text-gray-500 small mb-2" th:text="${book.bookAuthor()}"><!--로버트 C. 마틴--></p>
                                <div class="d-flex align-items-center justify-content-between">
                                    <span class="text-gray-600 small" th:text="'수량: ' + ${book.quantity()}">수량: 1</span>
                                    <span class="text-gray-900 font-weight-bold" th:text="${#numbers.formatDecimal(book.salePrice(), 0, 'COMMA', 0, 'POINT') + '원'}">33,000원</span>
                                </div>
                            </div>
                        </div>
                    </div>

<!--                    <div class="mt-4 pt-3 border-top border-gray-200 d-flex align-items-center justify-content-between">-->
<!--                        <span class="text-gray-900 font-weight-bold">총 주문 금액</span>-->
<!--                        <span class="text-primary font-weight-bold" th:text="${#numbers.formatDecimal(order.total, 0, 'COMMA', 0, 'POINT') + '원'}" style="font-size: 1.1rem;">33,000원</span>-->
<!--                    </div>-->

                    <div class="mt-4 d-flex gap-2">
                        <a th:href="@{/orders/{orderId}(orderId=${order.orderId()})}"
                           class="btn btn-light text-gray-700 flex-grow-1 hover-shadow" style="flex: 1;">
                            주문 상세
                        </a>

                        <button th:if="${order.deliveryStatus() == 'DELIVERED'}"
                                class="btn btn-primary text-white flex-grow-1" style="flex: 1;">
                            리뷰 작성
                        </button>

                    </div>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
