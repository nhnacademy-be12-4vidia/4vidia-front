<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>토스 결제 요청</title>
    <script src="https://js.tosspayments.com/v2/standard"></script>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <script th:src="@{/customJs/get-cookie.js}"></script>
</head>
<body>

<div style="text-align: center; padding-top: 100px;">
    <h1>결제창을 로딩 중입니다...</h1>
    <p>잠시만 기다려주세요.</p>
</div>

<script th:inline="javascript">
    // Controller에서 전달받은 정보
    const clientKey = /*[[${tossClientKey}]]*/ 'test_client_key';
    const orderId = /*[[${orderId}]]*/ 1;
    const sendOrderId = /*[[${sendOrderId}]]*/ '1234567890';
    const finalAmount = /*[[${payPrice}]]*/ 10000;
    const paymentMethod = /*[[${paymentMethod}]]*/ 'CARD';
    const orderName = /*[[${orderName}]]*/ "책 1권 이상 등";
    const customerEmail = /*[[${customerEmail}]]*/ "";
    const customerName = /*[[${customerName}]]*/ "";
    const customerKey =  /*[[${customerKey}]]*/ "wowString";

    const tossPayments = TossPayments(clientKey);
    const payment = tossPayments.payment({ customerKey });
    const successUrl = window.location.origin + "/payments/success?id=" + orderId;
    const failUrl = window.location.origin + "/payments/fail";

    // 롤백 필요 여부 플래그
    let isRollbackNeeded = true;

    // 뒤로가기 방지용 히스토리 스택 추가
    history.pushState(null, null, location.href);

    //  뒤로가기 감지 이벤트 (popstate)
    window.onpopstate = function(event) {
        if (isRollbackNeeded) {
            handleRollback("Back Button Detected");
            alert("결제 과정에서 뒤로가기가 감지되어 주문이 취소되었습니다.");
            window.location.href = failUrl;
        }
    };

    // 롤백 요청 함수
    const handleRollback = (reason) => {
        if (!isRollbackNeeded) return;
        isRollbackNeeded = false; // 중복 실행 방지

        console.log("Rollback Triggered by:", reason);

        const rollbackUrl = window.location.origin + "/payments/rollback";
        const csrfToken = getCsrfToken();

        fetch(rollbackUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-XSRF-TOKEN': csrfToken
            },
            body: JSON.stringify({
                orderId: orderId,
                message: "User cancelled payment (" + reason + ")"
            }),
            keepalive: true // 페이지 이동 중에도 요청 유지
        }).catch(err => {
            console.error("Rollback failed:", err);
        });
    };

    async function requestPayment() {
        const finalAmountObj = {
            currency: "KRW",
            value: finalAmount
        };

        try {
            // 결제 요청
            await payment.requestPayment({
                method: paymentMethod,
                amount: finalAmountObj,
                orderId: sendOrderId,
                orderName: orderName,
                customerEmail: customerEmail,
                customerName: customerName,
                successUrl: successUrl,
                failUrl: failUrl,
            });

        } catch (error) {
            // 3. 결제창 내부의 'X' 버튼이나 '취소' 버튼을 눌렀을 때 (USER_CANCEL)
            if (error.code === 'USER_CANCEL') {
                handleRollback("User Closed Payment Window");
                alert("결제가 취소되었습니다.");
                window.location.href = failUrl;
            } else {
                // 그 외 결제 모듈 에러
                console.error("Payment Error:", error);
                alert("결제 중 오류가 발생했습니다: " + error.message);
            }
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        requestPayment();
    });

</script>
</body>
</html>
