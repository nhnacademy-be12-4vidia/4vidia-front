<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
  <meta charset="UTF-8">
  <title>4VIDIA - 도서 검색 결과</title>

  <!-- 인덱스 페이지와 맞추기 위한 카드 스타일 (공통 CSS로 빼도 됩니다) -->
  <style>
    .book-card {
      border: none;
      border-radius: 0.35rem;
      box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
      transition: transform 0.2s, box-shadow 0.2s;
      height: 100%;
    }

    .book-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0.5rem 2rem 0 rgba(58, 59, 69, 0.25);
    }

    .card-img-wrapper {
      position: relative;
      overflow: hidden;
    }

    .card-img-wrapper img {
      border-top-left-radius: 0.35rem;
      border-top-right-radius: 0.35rem;
      height: 300px;
      object-fit: cover;
      transition: transform 0.3s ease;
      width: 100%;
    }

    .book-card:hover .card-img-wrapper img {
      transform: scale(1.05);
    }

    .btn-heart {
      position: absolute;
      top: 10px;
      right: 10px;
      background: white;
      border: none;
      border-radius: 50%;
      width: 35px;
      height: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 1;
    }

    .btn-heart:hover {
      background-color: #ffe5e5;
    }

    .btn-heart i {
      color: #666;
    }

    .btn-heart i.fas {
      color: #e74a3b;
    }

    .price-current {
      color: #4e73df;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .category-badge {
      color: #4e73df;
      font-size: 0.75rem;
      font-weight: 600;
    }
  </style>
    <script>
        // 좋아요/찜하기 토글 (AJAX/Fetch API 사용)
        function toggleLike(button) {
            const bookId = button.getAttribute('data-book-id');
            const icon = button.querySelector('i');
            const isLiked = icon.classList.contains('fas');

            let method = isLiked ? 'DELETE' : 'POST';
            let url = `/mypage/like/test?bookId=${bookId}`;

            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                }
            })
                .then(response => {
                    if (response.ok) {
                        icon.classList.toggle('far');
                        icon.classList.toggle('fas');
                        alert(isLiked ? `[${bookId}] 찜 취소되었습니다.` : `[${bookId}] 찜 등록되었습니다!`);
                    } else if (response.status === 401) {
                        alert('처리 실패: 로그인이 필요합니다.');
                    } else {
                        alert('처리 실패: 서버 오류이거나 잘못된 요청입니다. (상태: ' + response.status + ')');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('요청 중 네트워크 오류가 발생했습니다.');
                });
        }
    </script>
</head>

<body>
<div layout:fragment="content">
  <div class="container-fluid">

    <!-- 상단 제목 / 검색어 / 결과 개수 / AI 검색 여부 -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
      <div>
        <h1 class="h4 mb-1 text-gray-800">
          <span th:text="'검색 결과'">검색 결과</span>
        </h1>
        <p class="mb-0 text-gray-600">
          <span th:if="${keyword != null}" th:text="'검색어: ' + ${keyword}">검색어: 자바</span>
          <span th:if="${totalElements != null}"
                th:text="' · 총 ' + ${totalElements} + '건'"> · 총 0건</span>
          <span th:if="${useSemantic}" class="badge bg-primary ms-2">AI 검색 사용</span>
        </p>
      </div>
    </div>

    <!-- 상단 메시지 (예: 유효성 에러, 안내문) -->
    <div th:if="${message}" class="alert alert-info" th:text="${message}"></div>

    <!-- 검색 결과 없음 -->
    <div class="row" th:if="${#lists.isEmpty(books)}">
      <div class="col-12">
        <div class="alert alert-light border">
          <p class="mb-1">검색 결과가 없습니다.</p>
          <p class="mb-0 text-muted small">
            검색어를 조금 더 일반적으로 바꾸거나 철자를 확인해 주세요.
          </p>
        </div>
      </div>
    </div>

    <!-- 검색 결과 카드 리스트 -->
    <div class="row" th:if="${!#lists.isEmpty(books)}">
      <div class="col-xl-3 col-lg-4 col-md-6 mb-4"
           th:each="book : ${books}">
        <div class="card book-card">
          <div class="card-img-wrapper">
              <!-- 좋아요 버튼 -->
            <!-- 좋아요 버튼 -->
            <button type="button"
                    class="btn-heart"
                    th:classappend="${book.liked} ? ' liked' : ''"
                    th:attr="data-book-id=${book.id},data-liked=${book.liked}"
                    onclick="toggleLike(this)">
              <i class="fa-heart"
                 th:classappend="${book.liked} ? ' fas' : ' far'"></i>
            </button>

              <img class="card-img-top"
                 th:src="${book.imageUrl}"
                 alt="표지 이미지">
          </div>
          <div class="card-body d-flex flex-column">
            <!-- 출판사 -->
            <div class="category-badge mb-1"
                 th:text="${book.publisherName}">출판사명
            </div>

            <!-- 제목 -->
            <h5 class="card-title mb-1 text-truncate"
                th:text="${book.title}">책 제목</h5>

            <!-- 저자 목록 -->
            <p class="text-muted small mb-2"
               th:text="${#lists.isEmpty(book.authorNames)
                                     ? '저자 정보 없음'
                                     : #strings.listJoin(book.authorNames, ', ')}">
              저자
            </p>

            <!-- 가격 -->
            <div class="mb-3">
                            <span class="price-current"
                                  th:text="${#numbers.formatInteger(book.priceSales, 0, 'COMMA')} + '원'">
                                0원
                            </span>
            </div>

            <!-- 장바구니 담기 -->
            <form th:action="@{/cart/add}" method="post" class="mt-auto">
              <input type="hidden" name="bookId" th:value="${book.id}">
              <button class="btn btn-primary btn-block" type="submit">
                <i class="fas fa-shopping-cart mr-1"></i> 장바구니 담기
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- 페이지네이션 -->
    <nav th:if="${totalPages > 1}">
      <ul class="pagination justify-content-center">
        <!-- 이전 페이지 -->
        <li class="page-item" th:classappend="${page == 0} ? ' disabled'">
          <a class="page-link"
             th:href="@{/books/search(keyword=${keyword}, page=${page - 1}, size=${size}, useSemantic=${useSemantic})}">
            이전
          </a>
        </li>

        <!-- 페이지 번호 -->
        <li class="page-item"
            th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
            th:classappend="${i == page} ? ' active'">
          <a class="page-link"
             th:text="${i + 1}"
             th:href="@{/books/search(keyword=${keyword}, page=${i}, size=${size}, useSemantic=${useSemantic})}">
          </a>
        </li>

        <!-- 다음 페이지 -->
        <li class="page-item"
            th:classappend="${page + 1 >= totalPages} ? ' disabled'">
          <a class="page-link"
             th:href="@{/books/search(keyword=${keyword}, page=${page + 1}, size=${size}, useSemantic=${useSemantic})}">
            다음
          </a>
        </li>
      </ul>
    </nav>

  </div>
</div>
</body>
</html>
