<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>4VIDIA - 리뷰 작성</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

    <style>
        /* ------------------------- */
        /* 컨테이너 */
        /* ------------------------- */
        .fixed-content-area {
            max-width: 650px;
            width: 100%;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* ------------------------- */
        /* 별점 */
        /* ------------------------- */
        .rating-group {
            display: inline-flex;
            flex-direction: row-reverse;
        }

        .rating-group input {
            display: none;
        }

        .rating-group label {
            cursor: pointer;
            font-size: 1.6rem;
            color: #ddd;
            margin: 0 2px;
            transition: color 0.2s;
        }

        .rating-group input:checked ~ label,
        .rating-group label:hover,
        .rating-group label:hover ~ label {
            color: #f6c23e;
        }

        /* ------------------------- */
        /* 이미지 미리보기 */
        /* ------------------------- */
        .preview-list {
            display: flex;
            flex-wrap: wrap;
        }

        .preview-list img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 0.35rem;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
            box-shadow: 0 0.15rem 0.5rem rgba(0,0,0,0.15);
            transition: transform 0.2s;
        }

        .preview-list img:hover {
            transform: scale(1.05);
        }

        /* ------------------------- */
        /* 버튼 그룹 */
        /* ------------------------- */
        .form-buttons {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        /* ------------------------- */
        /* 반응형 */
        /* ------------------------- */
        @media (max-width: 768px) {
            .fixed-content-area {
                padding: 0 10px;
            }

            .rating-group label {
                font-size: 1.3rem;
            }

            .preview-list img {
                width: 60px;
                height: 60px;
            }

            .form-buttons {
                flex-direction: column;
            }

            .form-buttons a,
            .form-buttons button {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }

            .fixed-content-area {
                padding: 0 8px;
            }

            .rating-group label {
                font-size: 1.2rem;
            }

            .preview-list img {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="container-fluid">
        <div class="fixed-content-area">

            <!-- 페이지 타이틀 -->
            <div class="d-sm-flex align-items-center justify-content-between mt-4 mb-3">
                <div>
                    <h1 class="h3 mb-1 text-gray-800">리뷰 작성</h1>
                    <p class="mb-0 text-muted small">
                        구매하신 상품에 대한 솔직한 리뷰를 남겨주세요.
                    </p>
                </div>
            </div>

            <!-- 리뷰 작성 폼 -->
            <div class="card shadow-sm mb-4">
                <div class="card-body">

                    <form th:action="@{/books/{bookId}/reviews(bookId=${request.bookId})}"
                          method="post"
                          enctype="multipart/form-data">

                        <!-- hidden 필드 -->
                        <input type="hidden" name="bookId" th:value="${request.bookId}">
                        <input type="hidden" name="orderItemId" th:value="${request.orderItemId}">

                        <!-- 별점 -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">별점</label>
                            <div class="rating-group">
                                <input type="radio" id="star5" name="rating" value="5" th:checked="${request.rating == 5}">
                                <label for="star5"><i class="fas fa-star"></i></label>

                                <input type="radio" id="star4" name="rating" value="4" th:checked="${request.rating == 4}">
                                <label for="star4"><i class="fas fa-star"></i></label>

                                <input type="radio" id="star3" name="rating" value="3" th:checked="${request.rating == 3}">
                                <label for="star3"><i class="fas fa-star"></i></label>

                                <input type="radio" id="star2" name="rating" value="2" th:checked="${request.rating == 2}">
                                <label for="star2"><i class="fas fa-star"></i></label>

                                <input type="radio" id="star1" name="rating" value="1" th:checked="${request.rating == 1}">
                                <label for="star1"><i class="fas fa-star"></i></label>
                            </div>
                            <div class="form-text text-muted small">
                                1점(최악) ~ 5점(최고) 중 선택해 주세요.
                            </div>
                        </div>

                        <!-- 리뷰 내용 -->
                        <div class="mb-3">
                            <label for="content" class="form-label fw-bold">리뷰 내용</label>
                            <textarea id="content"
                                      name="content"
                                      class="form-control"
                                      rows="6"
                                      placeholder="상품을 사용해보신 느낌을 자세히 작성해 주세요."
                                      th:text="${request.content}"></textarea>
                            <div class="form-text text-muted small">
                                최소 한 줄 이상 작성해 주시면 다른 이용자들에게 큰 도움이 됩니다.
                            </div>
                        </div>

                        <!-- 이미지 업로드 -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">사진 첨부 (선택)</label>
                            <input type="file"
                                   name="images"
                                   class="form-control"
                                   accept="image/*"
                                   multiple
                                   onchange="previewImages(this)">
                            <div class="form-text text-muted small">
                                여러 장 선택이 가능합니다. (용량/확장자 제한은 백엔드 정책에 따릅니다.)
                            </div>

                            <div class="preview-list mt-2" id="imagePreviewContainer"></div>
                        </div>

                        <!-- 하단 버튼 -->
                        <div class="form-buttons mt-4">
                            <a th:href="@{/mypage/order}" class="btn btn-outline-secondary">목록으로</a>
                            <button type="submit" class="btn btn-primary">리뷰 등록</button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script th:inline="javascript">
    /* 이미지 미리보기 */
    function previewImages(input) {
        const container = document.getElementById('imagePreviewContainer');
        container.innerHTML = '';

        if (!input.files || input.files.length === 0) return;

        Array.from(input.files).forEach(file => {
            if (!file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.createElement('img');
                img.src = e.target.result;
                container.appendChild(img);
            };
            reader.readAsDataURL(file);
        });
    }
</script>
</body>
</html>
