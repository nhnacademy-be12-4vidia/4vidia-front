<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>4VIDIA - 도서 검색 결과</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        /* ------------------------------------------------ */
        /* 공통 레이아웃 */
        /* ------------------------------------------------ */
        .book-list-row {
            display: flex;
            flex-wrap: wrap;
            margin-right: -0.5rem;
            margin-left: -0.5rem;
            justify-content: flex-start;
        }

        /* ------------------------------------------------ */
        /* 메인 목록 카드 Wrapper (반응형 Grid) */
        /* ------------------------------------------------ */
        .book-card-wrapper {
            flex-shrink: 0;
            width: 240px; /* 데스크탑 고정 폭 */
            padding: 0 0.5rem;
            margin-bottom: 2rem;
        }

        /* ------------------------------------------------ */
        /* ★ AI 추천 전용 가로 스크롤 Wrapper ★ */
        /* ------------------------------------------------ */
        .ai-scroll-container {
            display: flex;
            flex-wrap: nowrap;       /* 줄바꿈 방지 */
            overflow-x: auto;        /* 가로 스크롤 허용 */
            gap: 1rem;               /* 카드 사이 간격 */
            padding-bottom: 1rem;    /* 스크롤바 공간 확보 */
            -webkit-overflow-scrolling: touch; /* 모바일 부드러운 스크롤 */
            margin-left: -0.5rem;    /* 좌우 여백 보정 */
            margin-right: -0.5rem;
            padding-left: 0.5rem;
            padding-right: 0.5rem;
        }

        /* 스크롤바 스타일링 */
        .ai-scroll-container::-webkit-scrollbar { height: 8px; }
        .ai-scroll-container::-webkit-scrollbar-thumb {
            background: rgba(78,115,223,0.3);
            border-radius: 4px;
        }
        .ai-scroll-container::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
            border-radius: 4px;
        }

        .ai-card-wrapper-scroll {
            flex: 0 0 auto;          /* 크기 고정 (줄어들지 않음) */
            width: 240px;            /* 메인 카드와 동일한 폭 */
            /* margin-bottom 없음 (스크롤이므로) */
        }

        /* ------------------------------------------------ */
        /* 카드 디자인 (공통 사용) */
        /* ------------------------------------------------ */
        .book-card {
            border: none;
            border-radius: 0.75rem;
            width: 100%;
            height: 100%;
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.25s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        /* 이미지 영역 */
        .card-img-wrapper {
            position: relative;
            overflow: hidden;
            background-color: #f8f9fa;
            text-align: center;
        }
        .card-img-wrapper img {
            width: 100%;
            height: 220px; /* 고정 높이 */
            object-fit: contain;
            transition: transform 0.35s ease;
            padding: 10px;
        }
        .book-card:hover .card-img-wrapper img {
            transform: scale(1.05);
        }

        /* ------------------------------------------------ */
        /* 좋아요 버튼 */
        /* ------------------------------------------------ */
        .btn-heart {
            position: absolute;
            top: 8px; right: 8px; z-index: 5;
            width: 32px; height: 32px; border: none; border-radius: 50%;
            background: rgba(255,255,255,0.95);
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            transition: background 0.15s, transform 0.2s;
        }
        .btn-heart:hover { background: #ffe5e5; transform: scale(1.08); }
        .btn-heart i { font-size: 1rem; color: #777; }
        .btn-heart i.fas { color: #e74a3b; }

        /* ------------------------------------------------ */
        /* 텍스트 및 버튼 영역 */
        /* ------------------------------------------------ */
        .card-body {
            padding: 0.8rem;
            display: flex;
            flex-direction: column;
            color: #333;
            flex-grow: 1;
        }
        .card-title {
            font-size: 0.95rem; font-weight: 700; margin-bottom: 0.2rem !important; color: #2c3e50;
        }

        .price-original-no-discount { color: #2c3e50; font-size: 0.95rem; font-weight: 700; text-decoration: none; }
        .price-original { text-decoration: line-through; color: #858796; font-size: 0.8rem; margin-right: 0.3rem; }
        .price-current { color: #4e73df; font-weight: 700; font-size: 0.95rem; }

        .btn-block { width: 100%; border-radius: 0.35rem; font-size: 0.9rem; padding: 0.3rem 0; font-weight: 600; }
        .btn-primary { background: #4e73df; border: none; }
        .btn-primary:hover { background: #365acb; }
        .btn-buy { background: #2c3e50; border: none; color: white; }
        .btn-buy:hover { background: #1a252f; color: white; }

        /* ------------------------------------------------ */
        /* 반응형 (모바일) */
        /* ------------------------------------------------ */
        @media (max-width: 576px) {
            /* 메인 목록: 2열 배치 */
            .book-list-row {
                justify-content: space-between;
                padding: 0 0.5rem;
            }
            .book-card-wrapper {
                width: 48%;
                padding: 0;
                margin-bottom: 1rem;
            }

            /* AI 스크롤 목록: 모바일에서도 적절한 크기 유지 (스크롤 유도) */
            .ai-card-wrapper-scroll {
                width: 180px; /* 모바일에서는 카드를 약간 작게 하여 더 많이 보이게 */
            }

            /* 이미지 높이 조정 */
            .card-img-wrapper img {
                height: 170px;
            }

            /* 필터 반응형 */
            .filter-shell{ padding: 10px; }
            .filter-bar{ justify-content: flex-start; }
            .filter-group{ width: 100%; justify-content: space-between; }
            .filter-input{ width: 45%; }
            .filter-select{ width: 100%; }
            .filter-actions{ width: 100%; justify-content: flex-end; }
        }

        /* ------------------------------------------------ */
        /* AI 추천 영역 스타일 */
        /* ------------------------------------------------ */
        .ai-suggestions {
            border: 1px solid rgba(78,115,223,0.25);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 2rem;
            background: linear-gradient(135deg, rgba(78,115,223,0.10), rgba(246,194,62,0.10));
            box-shadow: 0 0.35rem 1.25rem rgba(78,115,223,0.12);
            position: relative;
            overflow: hidden;
        }
        .ai-suggestions::before {
            content: ""; position: absolute; inset: 0;
            background: radial-gradient(circle at 12% 18%, rgba(78,115,223,0.18), transparent 45%),
            radial-gradient(circle at 85% 30%, rgba(246,194,62,0.18), transparent 45%);
            pointer-events: none;
        }

        .ai-suggestions__header {
            position: relative; display: flex; align-items: flex-start; justify-content: space-between;
            gap: 12px; margin-bottom: 15px;
        }
        .ai-suggestions__title { display: flex; align-items: center; gap: 10px; }
        .ai-chip {
            display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
            border-radius: 999px; background: rgba(78,115,223,0.14);
            border: 1px solid rgba(78,115,223,0.22); color: #2e59d9;
            font-weight: 800; font-size: 0.82rem; white-space: nowrap;
        }
        .ai-suggestions__header h3 { margin: 0; }
        .ai-suggestions__sub { margin: 6px 0 0 0; font-size: 0.9rem; color: #5a5c69; }

        .ai-rank-badge {
            position: absolute; top: 10px; left: 10px; z-index: 5;
            padding: 4px 10px; border-radius: 999px;
            background: linear-gradient(135deg, rgba(60, 130, 246, 0.95), rgba(246, 194, 62, 0.92));
            color: #fff; font-weight: 700; font-size: 0.85rem;
            box-shadow: 0 3px 8px rgba(0,0,0,0.18);
        }

        /* ------------------------------------------------ */
        /* 필터/정렬 바 */
        /* ------------------------------------------------ */
        .filter-shell{
            background: rgba(255,255,255,0.92); border: 1px solid rgba(0,0,0,0.08); border-radius: 14px;
            padding: 10px 12px; box-shadow: 0 0.35rem 1.05rem rgba(0,0,0,0.06); backdrop-filter: blur(6px);
            margin-top: 6px;
        }
        .filter-bar{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:flex-end; }
        .filter-group{
            display:flex; align-items:center; gap:8px; padding: 6px 8px; border-radius: 12px;
            background: rgba(78,115,223,0.06); border: 1px solid rgba(78,115,223,0.12);
        }
        .filter-chip{
            display:inline-flex; align-items:center; padding: 4px 10px; border-radius: 999px;
            background: rgba(78,115,223,0.14); border: 1px solid rgba(78,115,223,0.22); color: #2e59d9;
            font-weight: 800; font-size: 0.78rem; white-space: nowrap;
        }
        .filter-select, .filter-input{
            height: 36px; border: 1px solid rgba(0,0,0,0.12); border-radius: 12px; padding: 0 12px;
            background: #fff; outline: none; font-weight: 700; color: #2c3e50;
        }
        .filter-input{ width: 110px; }
        .filter-select{ width: 180px; }
        .filter-select:focus, .filter-input:focus{
            border-color: rgba(78,115,223,0.55); box-shadow: 0 0 0 3px rgba(78,115,223,0.18);
        }
        .tilde{ color:#9aa0a6; font-weight: 800; }
        .unit{ color:#6c757d; font-weight: 800; font-size: 0.85rem; }
        .filter-actions{ display:flex; gap:8px; align-items:center; }
        .filter-btn{
            height: 36px; padding: 0 14px; border-radius: 12px; border: 1px solid #4e73df;
            background: #4e73df; color: #fff; font-weight: 900; cursor: pointer;
            display:inline-flex; align-items:center; gap:8px;
        }
        .filter-btn.ghost{ background: #fff; color: #4e73df; }
        .filter-btn:hover{ filter: brightness(0.96); }

    </style>

    <script th:src="@{/customJs/askMoveCart.js}"></script>
    <script th:src="@{/customJs/like.js}"></script>
    <script th:inline="javascript">
        const CURRENT_SEARCH_PARAMS = {
            keyword: [[${keyword}]],
            page: [[${page}]],
            size: [[${size}]],
            useSemantic: [[${useSemantic}]]
        };
    </script>
    <script th:inline="javascript">
        function goPage(p) {
            const params = new URLSearchParams(window.location.search);
            params.set('page', p);
            const sizeFromModel = /*[[${size}]]*/ 20;
            if (!params.get('size')) params.set('size', sizeFromModel);
            startLoading();
            window.location.href = '/books/search?' + params.toString();
        }
    </script>
    <script>
        function setSort(sortValue){
            const sel = document.getElementById('sortSelect');
            if (sel && typeof sortValue === 'string') sel.value = sortValue;
        }

        function applyFilters(){
            const url = new URL(window.location.href);
            const minV = document.getElementById('minPriceInput')?.value?.trim();
            const maxV = document.getElementById('maxPriceInput')?.value?.trim();
            const sortV = document.getElementById('sortSelect')?.value;

            if (minV && maxV) {
                const minN = Number(minV);
                const maxN = Number(maxV);
                if (!Number.isNaN(minN) && !Number.isNaN(maxN) && minN > maxN) {
                    alert('최저가가 최고가보다 클 수 없습니다.');
                    return;
                }
            }
            if (minV) url.searchParams.set('minPrice', minV); else url.searchParams.delete('minPrice');
            if (maxV) url.searchParams.set('maxPrice', maxV); else url.searchParams.delete('maxPrice');
            if (sortV) url.searchParams.set('sort', sortV); else url.searchParams.delete('sort');
            url.searchParams.set('page', '0');

            if (!url.searchParams.get('size')) {
                const size = document.getElementById('pageSizeHolder')?.value;
                if (size) url.searchParams.set('size', size);
            }
            startLoading();
            window.location.href = url.toString();
        }

        function resetFilters(){
            const url = new URL(window.location.href);
            url.searchParams.delete('minPrice');
            url.searchParams.delete('maxPrice');
            url.searchParams.delete('sort');
            url.searchParams.set('page', '0');
            if (!url.searchParams.get('size')) {
                const size = document.getElementById('pageSizeHolder')?.value;
                if (size) url.searchParams.set('size', size);
            }
            startLoading();
            window.location.href = url.toString();
        }
    </script>
</head>

<body>
<div layout:fragment="content">
    <div id="global-loader" class="loader-container"></div>

    <div class="container-fluid mt-4">

        <div class="d-sm-flex align-items-center justify-content-between mb-4 px-2">
            <div>
                <h1 class="h4 mb-1 text-gray-800">
                    <span th:text="'검색 결과'">검색 결과</span>
                </h1>
                <p class="mb-0 text-gray-600">
                    <span th:if="${keyword != null}" th:text="'검색어: ' + ${keyword}">검색어: 자바</span>
                    <span th:if="${totalElements != null}"
                          th:text="' · 총 ' + ${totalElements} + '건'"> · 총 0건</span>
                    <span th:if="${useSemantic}" class="badge bg-primary ms-2">AI 검색 사용</span>
                </p>
            </div>
        </div>

        <div class="filter-shell mt-2 mx-2">
            <div class="filter-bar">
                <div class="filter-group">
                    <span class="filter-chip">가격</span>
                    <input id="minPriceInput" name="minPrice" type="number" min="0" step="100"
                           class="filter-input" placeholder="최저"
                           th:value="${param.minPrice}">
                    <span class="tilde">~</span>
                    <input id="maxPriceInput" name="maxPrice" type="number" min="0" step="100"
                           class="filter-input" placeholder="최고"
                           th:value="${param.maxPrice}">
                    <span class="unit">원</span>
                </div>

                <div class="filter-group">
                    <span class="filter-chip">정렬</span>
                    <select id="sortSelect" class="filter-select">
                        <option value="" th:selected="${param.sort == null or param.sort[0] == ''}">기본</option>
                        <option value="PUBLISHED_DESC" th:selected="${param.sort != null and param.sort[0] == 'PUBLISHED_DESC'}">신상품순</option>
                        <option value="PUBLISHED_ASC" th:selected="${param.sort != null and param.sort[0] == 'PUBLISHED_ASC'}">오래된순</option>
                        <option value="PRICE_ASC" th:selected="${param.sort != null and param.sort[0] == 'PRICE_ASC'}">최저가순</option>
                        <option value="PRICE_DESC" th:selected="${param.sort != null and param.sort[0] == 'PRICE_DESC'}">최고가순</option>
                        <option value="RATING_DESC" th:selected="${param.sort != null and param.sort[0] == 'RATING_DESC'}">평점순</option>
                    </select>
                </div>

                <div class="filter-actions">
                    <button type="button" class="filter-btn" onclick="applyFilters()">
                        <i class="fas fa-check"></i> 적용
                    </button>
                    <button type="button" class="filter-btn ghost" onclick="resetFilters()">
                        <i class="fas fa-undo"></i> 초기화
                    </button>
                </div>
            </div>
        </div>

        <div th:if="${message}" class="alert alert-info mx-2" th:text="${message}"></div>

        <div class="row" th:if="${#lists.isEmpty(books)}">
            <div class="col-12">
                <div class="alert alert-light border text-center py-5">
                    <i class="fas fa-search fa-3x text-gray-300 mb-3"></i>
                    <p class="mb-1 fw-bold">검색 결과가 없습니다.</p>
                    <p class="mb-0 text-muted small">
                        검색어를 조금 더 일반적으로 바꾸거나 철자를 확인해 주세요.
                    </p>
                </div>
            </div>
        </div>

        <section class="ai-suggestions"
                 th:if="${aiCacheResponseList != null and !#lists.isEmpty(aiCacheResponseList)}">

            <div class="ai-suggestions__header">
                <div>
                    <div class="ai-suggestions__title">
                        <h3>AI 추천 도서</h3>
                        <span class="ai-chip"><i class="fas fa-magic"></i> AI 추천</span>
                    </div>
                    <p class="ai-suggestions__sub">
                        현재 검색어를 바탕으로 AI가 추천한 결과입니다.
                    </p>
                </div>
            </div>

            <div class="ai-scroll-container">
                <div class="ai-card-wrapper-scroll" th:each="s : ${aiCacheResponseList}">

                    <div class="card book-card h-100">
                        <div class="card-img-wrapper">
                            <div class="ai-rank-badge" th:text="'#' + ${s.rank()}">#1</div>

                            <a th:href="@{/books/{bookId}(bookId=${s.id()})}" style="text-decoration: none; color: inherit;">
                                <img class="card-img-top" th:src="${s.imageUrl() != null ? s.imageUrl() : '/img/default-book-cover.png'}" th:alt="${s.title()}" />
                            </a>
                        </div>

                        <div class="card-body">
                            <a th:href="@{/books/{bookId}(bookId=${s.id()})}" style="text-decoration: none; color: inherit;">
                                <h5 class="card-title text-truncate" th:text="${s.title()}">책 제목</h5>
                            </a>

                            <p class="text-muted small mb-2 text-truncate" style="font-size: 0.75rem;"
                               th:text="${#lists.isEmpty(s.authorNames()) ? '저자 정보 없음' : #strings.listJoin(s.authorNames(), ', ')}">
                                저자
                            </p>

                            <div class="mb-2">
                                <span th:if="${s.priceStandard() > s.priceSales()}" class="price-current"
                                      th:text="${#numbers.formatDecimal(s.priceSales(), 0, 'COMMA', 0, 'POINT') + '원'}">현재가격</span>

                                <span th:if="${s.priceStandard() > s.priceSales()}" class="price-original"
                                      th:text="${#numbers.formatDecimal(s.priceStandard(), 0, 'COMMA', 0, 'POINT') + '원'}">정가</span>

                                <span th:if="${s.priceStandard() <= s.priceSales()}" class="price-original-no-discount"
                                      th:text="${#numbers.formatDecimal(s.priceStandard(), 0, 'COMMA', 0, 'POINT') + '원'}">정가</span>

                                <span class="badge bg-danger ms-1" style="font-size: 0.7rem;"
                                      th:if="${s.priceStandard() > s.priceSales()}"
                                      th:text="${s.priceStandard() == 0 ? '' : #numbers.formatDecimal((s.priceStandard() - s.priceSales()) * 100 / s.priceStandard(), 0, 'COMMA', 0, 'POINT') + '%'}">
                                </span>
                            </div>

                            <div class="mt-auto d-flex gap-2">
                                <form th:action="@{/cart/add}" method="post" class="flex-grow-1">
                                    <input type="hidden" name="bookId" th:value="${s.id()}">
                                    <button class="btn btn-primary btn-block" title="장바구니"
                                            th:onclick="|addToCartAndConfirmMove('${s.id()}', '1'); return false;|">
                                        <i class="fas fa-shopping-cart"></i>
                                    </button>
                                </form>
                                <form th:action="@{/orders/checkout-temp}" method="post" class="flex-grow-1">
                                    <input type="hidden" name="bookId" th:value="${s.id()}">
                                    <input type="hidden" name="quantity" value="1">
                                    <button type="submit" class="btn btn-buy btn-block" title="구매">
                                        <i class="fas fa-credit-card"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <div th:if="${!#lists.isEmpty(books)}" class="book-list-row">
            <div class="book-card-wrapper" th:each="book : ${books}">

                <div class="card book-card h-100">
                    <div class="card-img-wrapper">
                        <button type="button" class="btn-heart" th:attr="data-book-id=${book.id()}" onclick="toggleLike(event, this)">
                            <i class="fa-heart" th:classappend="${book.liked() ? 'fas' : 'far'}"></i>
                        </button>

                        <a th:href="@{/books/{bookId}(bookId=${book.id()})}" style="text-decoration: none; color: inherit;">
                            <img class="card-img-top" th:src="${book.imageUrl() != null ? book.imageUrl() : '/img/default-book-cover.png'}" th:alt="${book.title()}">
                        </a>
                    </div>

                    <div class="card-body">
                        <a th:href="@{/books/{bookId}(bookId=${book.id()})}" style="text-decoration: none; color: inherit;">
                            <h5 class="card-title text-truncate" th:text="${book.title()}">책제목</h5>
                        </a>

                        <p class="text-muted small mb-2 text-truncate" style="font-size: 0.75rem;"
                           th:text="${#lists.isEmpty(book.authorNames) ? '저자 정보 없음' : #strings.listJoin(book.authorNames, ', ')}">
                            저자
                        </p>

                        <div class="mb-2">
                            <span th:if="${book.priceStandard() > book.priceSales()}" class="price-current"
                                  th:text="${#numbers.formatDecimal(book.priceSales(), 0, 'COMMA', 0, 'POINT') + '원'}">현재가</span>

                            <span th:if="${book.priceStandard() > book.priceSales()}" class="price-original"
                                  th:text="${#numbers.formatDecimal(book.priceStandard(), 0, 'COMMA', 0, 'POINT') + '원'}">정가</span>

                            <span th:if="${book.priceStandard() <= book.priceSales()}" class="price-original-no-discount"
                                  th:text="${#numbers.formatDecimal(book.priceStandard(), 0, 'COMMA', 0, 'POINT') + '원'}">정가</span>

                            <span class="badge bg-danger ms-1" style="font-size: 0.7rem;"
                                  th:text="${book.priceStandard() == 0 ? '' : #numbers.formatDecimal((book.priceStandard() - book.priceSales()) * 100 / book.priceStandard(), 0, 'COMMA', 0, 'POINT') + '%'}">
                            </span>
                        </div>

                        <div class="mt-auto d-flex gap-2">
                            <form th:action="@{/cart/add}" method="post" class="flex-grow-1">
                                <input type="hidden" name="bookId" th:value="${book.id()}">
                                <button class="btn btn-primary btn-block" title="장바구니"
                                        th:onclick="|addToCartAndConfirmMove('${book.id()}', '1'); return false;|">
                                    <i class="fas fa-shopping-cart"></i>
                                </button>
                            </form>
                            <form th:action="@{/orders/checkout-temp}" method="post" class="flex-grow-1">
                                <input type="hidden" name="bookId" th:value="${book.id()}">
                                <input type="hidden" name="quantity" value="1">
                                <button type="submit" class="btn btn-buy btn-block" title="구매">
                                    <i class="fas fa-credit-card"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <nav th:if="${totalPages != null and totalPages > 1}" class="mt-3 pb-5">
            <ul class="pagination justify-content-center"
                th:with="blockSize=${T(java.lang.Integer).valueOf(10)},
                         p=${T(java.lang.Integer).valueOf(page)},
                         hasContent=${!#lists.isEmpty(books)},
                         computedLast=${T(java.lang.Integer).valueOf(totalPages - 1)},
                         effectiveLast=${hasContent ? computedLast : (p - 1)},
                         lastIndex=${effectiveLast < 0 ? 0 : effectiveLast},
                         start=${p - (p % blockSize)}">

                <li class="page-item" th:classappend="${page == 0} ? ' disabled'">
                    <a class="page-link" href="javascript:void(0)" th:attr="onclick=|goPage(0)|" aria-label="First">
                        <i class="fas fa-angle-double-left"></i>
                    </a>
                </li>

                <li class="page-item" th:classappend="${start == 0} ? ' disabled'">
                    <a class="page-link" href="javascript:void(0)" th:attr="onclick=|goPage(${start - 1})|" aria-label="Prev block">
                        <i class="fas fa-angle-left"></i>
                    </a>
                </li>

                <th:block th:if="${start <= lastIndex}"
                          th:with="end=${(lastIndex < (start + blockSize - 1)) ? lastIndex : (start + blockSize - 1)}">
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(start, end)}"
                        th:classappend="${i == page} ? ' active'">
                        <a class="page-link" href="javascript:void(0)"
                           th:text="${i + 1}"
                           th:attr="onclick=|goPage(${i})|"></a>
                    </li>
                </th:block>

                <li class="page-item" th:classappend="${start + blockSize > lastIndex} ? ' disabled'">
                    <a class="page-link" href="javascript:void(0)" th:attr="onclick=|goPage(${start + blockSize})|" aria-label="Next block">
                        <i class="fas fa-angle-right"></i>
                    </a>
                </li>

                <li class="page-item" th:classappend="${page >= lastIndex} ? ' disabled'">
                    <a class="page-link" href="javascript:void(0)" th:attr="onclick=|goPage(${lastIndex})|" aria-label="Last">
                        <i class="fas fa-angle-double-right"></i>
                    </a>
                </li>
            </ul>
        </nav>

    </div>
</div>
</body>
</html>
