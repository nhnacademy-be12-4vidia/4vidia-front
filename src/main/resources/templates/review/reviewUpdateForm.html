<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
  <meta charset="UTF-8">
  <title>4VIDIA - 리뷰 수정</title>

  <style>
    .fixed-content-area {
      width: 650px;
      margin: 0 auto;
    }

    .rating-group {
      display: inline-flex;
      flex-direction: row-reverse;
    }

    .rating-group input {
      display: none;
    }

    .rating-group label {
      cursor: pointer;
      font-size: 1.6rem;
      color: #ddd;
      margin: 0 2px;
    }

    .rating-group input:checked ~ label {
      color: #f6c23e;
    }

    .rating-group label:hover,
    .rating-group label:hover ~ label {
      color: #f6c23e;
    }

    .preview-list img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 0.35rem;
      margin-right: 0.5rem;
      margin-bottom: 0.5rem;
      box-shadow: 0 0.15rem 0.5rem rgba(0,0,0,0.15);
    }
  </style>
</head>

<body>
<div layout:fragment="content">
  <div class="container-fluid">

    <div class="fixed-content-area">

      <!-- 페이지 타이틀 -->
      <div class="d-sm-flex align-items-center justify-content-between mt-4 mb-3">
        <div>
          <h1 class="h3 mb-1 text-gray-800">리뷰 수정</h1>
          <p class="mb-0 text-muted small">
            작성하신 리뷰를 수정해 주세요.
          </p>
        </div>
      </div>

      <!-- 알림 / 검증 메시지 자리 (필요 시 사용) -->
<!--      <div th:if="${message}" class="alert alert-info" th:text="${message}"></div>-->

      <!-- 리뷰 작성 폼 -->
      <div class="card shadow-sm mb-4">
        <div class="card-body">

          <form th:action="@{/books/{bookId}/reviews/{reviewId}/update(bookId=${request.bookId}, reviewId=${request.reviewId})}"
                method="post"
                enctype="multipart/form-data">

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <input type="hidden" name="bookId" th:value="${request.bookId}">
            <input type="hidden" name="reviewId" th:value="${request.reviewId}">

            <!-- 별점 -->
            <div class="mb-3">
              <label class="form-label fw-bold">별점</label>
              <div class="rating-group">
                <!-- 5점부터 1점까지 (radio) -->
                <input type="radio" id="star5" name="rating" value="5"
                       th:checked="${request.rating != null and request.rating == 5}">
                <label for="star5"><i class="fas fa-star"></i></label>

                <input type="radio" id="star4" name="rating" value="4"
                       th:checked="${request.rating != null and request.rating == 4}">
                <label for="star4"><i class="fas fa-star"></i></label>

                <input type="radio" id="star3" name="rating" value="3"
                       th:checked="${request.rating != null and request.rating == 3}">
                <label for="star3"><i class="fas fa-star"></i></label>

                <input type="radio" id="star2" name="rating" value="2"
                       th:checked="${request.rating != null and request.rating == 2}">
                <label for="star2"><i class="fas fa-star"></i></label>

                <input type="radio" id="star1" name="rating" value="1"
                       th:checked="${request.rating != null and request.rating == 1}">
                <label for="star1"><i class="fas fa-star"></i></label>
              </div>
              <div class="form-text text-muted small">
                1점(최악) ~ 5점(최고) 중 선택해 주세요.
              </div>
            </div>

            <!-- 리뷰 내용 -->
            <div class="mb-3">
              <label for="content" class="form-label fw-bold">리뷰 내용</label>
              <textarea id="content"
                        name="content"
                        class="form-control"
                        rows="6"
                        placeholder="상품을 사용해보신 느낌을 자세히 작성해 주세요."
                        th:text="${request.content}"></textarea>
              <div class="form-text text-muted small">
                최소 한 줄 이상 작성해 주시면 다른 이용자들에게 큰 도움이 됩니다.
              </div>
            </div>

            <!-- 이미지 업로드 -->
            <div class="mb-3">
              <label class="form-label fw-bold">사진 첨부 (선택)</label>
              <input type="file"
                     name="images"
                     class="form-control"
                     accept="image/*"
                     multiple
                     onchange="previewImages(this)">
              <div class="form-text text-muted small">
                여러 장 선택이 가능합니다. (용량/확장자 제한은 백엔드 정책에 따릅니다.)
              </div>

              <!-- 간단한 미리보기 영역 -->
              <div class="preview-list mt-2" id="imagePreviewContainer"></div>
            </div>

            <!-- 하단 버튼 -->
            <div class="d-flex justify-content-between mt-4">
              <a th:href="@{/books/{bookId}(bookId=${request.bookId})}" class="btn btn-outline-secondary">
                도서 상세로
              </a>
              <div>
                <button type="submit" class="btn btn-primary">
                  리뷰 수정
                </button>
              </div>
            </div>

          </form>
        </div>
      </div>

    </div>

  </div>
</div>

<script th:inline="javascript">
  /* 간단한 이미지 미리보기 */
  function previewImages(input) {
    const container = document.getElementById('imagePreviewContainer');
    container.innerHTML = '';

    if (!input.files || input.files.length === 0) {
      return;
    }

    Array.from(input.files).forEach(file => {
      if (!file.type.startsWith('image/')) {
        return;
      }
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = document.createElement('img');
        img.src = e.target.result;
        container.appendChild(img);
      };
      reader.readAsDataURL(file);
    });
  }
</script>
</body>
</html>
