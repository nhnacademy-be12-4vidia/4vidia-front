<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>좋아요 리스트</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        .fixed-content-area {
            width: 800px; /* 리스트의 고정 너비를 800px로 지정 (원하는 크기로 변경 가능) */
            margin: 0 auto; /* 중앙 정렬 */
        }

        @media (max-width: 830px) {
            .container {
                padding: 0; /* Bootstrap 컨테이너의 좌우 패딩 제거 */
            }
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script th:src="@{/customJs/askMoveCart.js}"></script>
</head>
<body>
<div layout:fragment="content">

    <div class="container">

        <div class="fixed-content-area py-3">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h4 text-gray-800">좋아요 리스트</h1>
                <span th:if="${not #lists.isEmpty(likes)}"
                      class="text-gray-500" th:text="${#lists.size(likes)} + '개 상품'"></span>
            </div>

            <div th:if="${#lists.isEmpty(likes)}" class="text-center py-5">
                <i class="fas fa-exclamation-circle fa-3x text-light mb-3"></i>
                <p class="text-dark font-weight-bold mb-1">찜한 상품이 없습니다.</p>
                <p class="text-muted small mb-4">비디아의 다양한 상품과 콘텐츠를 둘러보세요!</p>

                <a th:href="@{/}" class="btn text-white"
                   style="background-color: #5b5b9e; border-color: #5b5b9e;">
                    계속 쇼핑하기
                </a>
            </div>
            <div th:if="${not #lists.isEmpty(likes)}" class="card shadow-sm">
                <div class="card-body p-0">

                    <div class="list-group list-group-flush">

                        <div class="p-4 border-bottom" th:each="item : ${likes}">
                            <div class="d-flex gap-4">

                                <div class="position-relative">
                                    <a th:href="@{/books/{bookId}(bookId=${item.bookId()})}" style="text-decoration: none;">
                                        <img th:src="${item.bookImage()}"
                                             th:alt="${item.bookTitle()}"
                                             class="rounded"
                                             style="width: 110px; height: 160px; object-fit: cover;">
                                    </a>
                                </div>

                                <div class="flex-grow-1">
                                    <div class="d-flex justify-content-between align-items-start mb-2">

                                        <div>
                                            <a th:href="@{/books/{bookId}(bookId=${item.bookId()})}" style="text-decoration: none;">
                                                <h5 class="text-dark mb-1" th:text="${item.bookTitle()}">책 제목</h5>
                                            </a>
                                            <div class="text-muted small" th:text="${item.authorName()}">저자</div>
                                        </div>

                                        <form th:action="@{/mypage/like}" method="post">
                                            <input type="hidden" name="_method" value="delete">
                                            <input type="hidden" name="bookId" th:value="${item.bookId()}">
                                            <button class="btn btn-link text-gray-400 p-0"
                                                    style="font-size: 18px;"
                                                    onclick="return confirm('좋아요 목록에서 삭제하시겠습니까?')">
                                                <i class="fas fa-times"></i>
                                            </button>
                                        </form>
                                    </div>

                                    <div class="mb-3">
                                        <div th:if="${item.priceStandard() > item.priceSales()}"
                                             class="d-flex align-items-center gap-2">
                                            <span class="text-dark font-weight-bold"
                                                  th:text="${#numbers.formatInteger(item.priceSales(), 1, 'COMMA')} + '원'">
                                            </span>

                                            <span class="text-muted small"
                                                  style="text-decoration: line-through;"
                                                  th:text="${#numbers.formatInteger(item.priceStandard(), 1, 'COMMA')} + '원'">
                                            </span>

                                            <span class="badge bg-danger">
                                                <span th:with="discountRate=${(item.priceStandard() - item.priceSales()) * 100 / item.priceStandard()}"
                                                      th:text="${#numbers.formatDecimal(discountRate, 0, 'COMMA', 0, 'POINT')} + '%'">
                                                </span>
                                            </span>
                                        </div>

                                        <div th:if="${item.priceStandard() == item.priceSales()}">
                                            <span class="text-dark font-weight-bold"
                                                  th:text="${#numbers.formatInteger(item.priceStandard(), 1, 'COMMA')} + '원'">
                                                </span>
                                        </div>
                                    </div>

                                    <div class="d-flex gap-2">

                                        <div th:if="${item.stockStatus() == 'IN_STOCK' or item.stockStatus() == 'PRE_ORDER'}" class="w-100 d-flex gap-2">

                                            <form th:action="@{/cart/add}" method="post" class="flex-fill">
                                                <input type="hidden" name="bookId" th:value="${item.bookId()}">
                                                <button class="btn btn-primary btn-block"
                                                        th:onclick="|addToCartAndConfirmMove('${item.bookId()}', '1'); return false;|">
                                                    <i class="fas fa-shopping-cart mr-1"></i> 장바구니 담기
                                                </button>
                                            </form>

                                            <form th:action="@{/orders}" method="post">
                                                <input type="hidden" name="bookId" th:value="${item.bookId()}">
                                                <input type="hidden" name="quantity" value=1>
                                                <button type="submit" class="btn btn-secondary">
                                                    바로 구매
                                                </button>
                                            </form>
                                        </div>

                                        <div th:if="${item.stockStatus() == 'OUT_OF_STOCK'}" class="w-100">
                                            <button class="btn btn-light w-100 text-gray-500 bg-light rounded" disabled>
                                                일시 품절
                                            </button>
                                        </div>

                                        <div th:if="${item.stockStatus() == 'OUT_OF_PRINT'}" class="w-100">
                                            <button class="btn btn-light w-100 text-gray-500 bg-light rounded" disabled>
                                                절판
                                            </button>
                                        </div>

                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
