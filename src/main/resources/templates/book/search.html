<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>4VIDIA - 도서 검색 결과</title>

    <style>
        .book-card {
            border: none;
            border-radius: 0.35rem;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
            transition: transform 0.2s, box-shadow 0.2s;
            height: 100%;
        }

        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0.5rem 2rem 0 rgba(58, 59, 69, 0.25);
        }

        .card-img-wrapper {
            position: relative;
            overflow: hidden;
        }

        .card-img-wrapper img {
            border-top-left-radius: 0.35rem;
            border-top-right-radius: 0.35rem;
            height: 300px;
            object-fit: cover;
            transition: transform 0.3s ease;
            width: 100%;
        }

        .book-card:hover .card-img-wrapper img {
            transform: scale(1.05);
        }

        .btn-heart {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            z-index: 1;
        }

        .btn-heart:hover {
            background-color: #ffe5e5;
        }

        .btn-heart i {
            color: #666;
        }

        .btn-heart i.fas {
            color: #e74a3b;
        }

        .price-current {
            color: #4e73df;
            font-weight: 700;
            font-size: 1.05rem;
        }

        /* 할인이 적용된 정가 (취소선) */
        .price-original-discounted {
            text-decoration: line-through;
            color: #858796;
            font-size: 0.9rem;
        }

        /* 할인이 없는 정가 (취소선 없음) */
        .price-original {
            color: #666; /* 기본 정가 색상 */
            font-size: 0.9rem;
        }

        .category-badge {
            color: #4e73df;
            font-size: 0.75rem;
            font-weight: 600;
        }
    </style>
    <script th:src="@{/customJs/askMoveCart.js}"></script>
    <script th:src="@{/customJs/like.js}"></script>
    <script th:inline="javascript">
        // 이 변수들은 페이지네이션 링크 구성 시 사용되며, 좋아요 로직의 새로고침 기능은 제거되었습니다.
        const CURRENT_SEARCH_PARAMS = {
            keyword: [[${keyword}]],
            page: [[${page}]],
            size: [[${size}]],
            useSemantic: [[${useSemantic}]]
        };
    </script>
</head>

<body>
<div layout:fragment="content">
    <div class="container-fluid">

        <div class="d-sm-flex align-items-center justify-content-between mb-4">
            <div>
                <h1 class="h4 mb-1 text-gray-800">
                    <span th:text="'검색 결과'">검색 결과</span>
                </h1>
                <p class="mb-0 text-gray-600">
                    <span th:if="${keyword != null}" th:text="'검색어: ' + ${keyword}">검색어: 자바</span>
                    <span th:if="${totalElements != null}"
                          th:text="' · 총 ' + ${totalElements} + '건'"> · 총 0건</span>
                    <span th:if="${useSemantic}" class="badge bg-primary ms-2">AI 검색 사용</span>
                </p>
            </div>
        </div>

        <div th:if="${message}" class="alert alert-info" th:text="${message}"></div>

        <div class="row" th:if="${#lists.isEmpty(books)}">
            <div class="col-12">
                <div class="alert alert-light border">
                    <p class="mb-1">검색 결과가 없습니다.</p>
                    <p class="mb-0 text-muted small">
                        검색어를 조금 더 일반적으로 바꾸거나 철자를 확인해 주세요.
                    </p>
                </div>
            </div>
        </div>

        <div class="row" th:if="${!#lists.isEmpty(books)}">
            <div class="col-xl-3 col-lg-4 col-md-6 mb-4"
                 th:each="book : ${books}">
                <div class="card book-card">

                    <div class="card-img-wrapper">
                        <button type="button"
                                class="btn-heart"
                                th:attr="data-book-id=${book.id()}"
                                onclick="toggleLike(event, this)">
                            <i class="fa-heart" th:classappend="${book.liked() ? 'fas' : 'far'}"></i>
                        </button>

                        <a th:href="@{/books/{bookId}(bookId=${book.id()})}" style="text-decoration: none; color: inherit;">
                            <img class="card-img-top" th:src="${book.imageUrl()}" th:alt="${book.title()}">
                        </a>
                    </div>

                    <div class="card-body d-flex flex-column">
                        <div class="category-badge mb-1"
                             th:text="${book.publisherName}">출판사명
                        </div>

                        <a th:href="@{/books/{bookId}(bookId=${book.id})}" style="text-decoration: none; color: inherit;">
                            <h5 class="card-title mb-1" th:text="${book.title}">책제목</h5>
                        </a>

                        <p class="text-muted small mb-2"
                           th:text="${#lists.isEmpty(book.authorNames)
                                     ? '저자 정보 없음'
                                     : #strings.listJoin(book.authorNames, ', ')}">
                            저자
                        </p>

                        <div class="mb-3">
                            <span th:class="${book.priceStandard() > book.priceSales()} ? 'price-original-discounted' : 'price-original'"
                                  th:text="${#numbers.formatDecimal(book.priceStandard(), 0, 'COMMA', 0, 'POINT') + '원'}">정가</span>

                            <span class="price-current ml-2"
                                  th:text="${#numbers.formatDecimal(book.priceSales(), 0, 'COMMA', 0, 'POINT') + '원'}">현재가격</span>
                        </div>

                        <form th:action="@{/cart/add}" method="post" class="mt-auto">
                            <input type="hidden" name="bookId" th:value="${book.id}">
                            <button class="btn btn-primary btn-block"
                                    th:onclick="|addToCartAndConfirmMove('${book.id}', '1'); return false;|">
                                <i class="fas fa-shopping-cart mr-1"></i> 장바구니 담기
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <nav th:if="${totalPages > 1}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${page == 0} ? ' disabled'">
                    <a class="page-link"
                       th:href="@{/books/search(keyword=${keyword}, page=${page - 1}, size=${size}, useSemantic=${useSemantic} ? ${useSemantic} : null)}"
                       onclick="handleDelayedRefresh(event)">
                        이전
                    </a>
                </li>

                <li class="page-item"
                    th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    th:classappend="${i == page} ? ' active'">
                    <a class="page-link"
                       th:text="${i + 1}"
                       th:href="@{/books/search(keyword=${keyword}, page=${i}, size=${size}, useSemantic=${useSemantic} ? ${useSemantic} : null)}"
                       onclick="handleDelayedRefresh(event)">
                    </a>
                </li>

                <li class="page-item"
                    th:classappend="${page + 1 >= totalPages} ? ' disabled'">
                    <a class="page-link"
                       th:href="@{/books/search(keyword=${keyword}, page=${page + 1}, size=${size}, useSemantic=${useSemantic} ? ${useSemantic} : null)}"
                       onclick="handleDelayedRefresh(event)">
                        다음
                    </a>
                </li>
            </ul>
        </nav>

    </div>
</div>
</body>
</html>
