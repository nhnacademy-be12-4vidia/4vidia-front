<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>반품 조회</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .fixed-content-area {
            max-width: 650px;
            width: 100%;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* 상태 탭 */
        .status-tab {
            text-align: center;
            padding: 0.8rem 0.5rem;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            color: #6c757d;
            text-decoration: none;
            flex-grow: 1;
            transition: all 0.2s ease;
        }

        .status-tab.active {
            border-bottom-color: #5b5b9e;
            font-weight: bold;
            color: #5b5b9e !important;
        }

        .tab-count {
            font-size: 1.5rem;
            font-weight: bold;
        }

        /* 카드 */
        .refund-card {
            transition: box-shadow 0.3s ease;
        }

        .refund-card:hover {
            box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .15);
        }

        .detail-box {
            background-color: #f8f9fa;
            border-radius: 0.5rem;
            padding: 1rem;
        }

        .badge-status {
            font-size: 0.85rem;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: nowrap; /* 데스크톱에서는 무조건 한 줄 */
        }

        .item-left {
            flex: 1 1 auto;
            min-width: 0; /* text-truncate 동작 */
            margin-right: 15px;
        }

        .item-left .text-truncate {
            display: block;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .item-right {
            flex: 0 0 auto;
            text-align: right;
            white-space: nowrap; /* 가격/배지 줄바꿈 방지 */
        }

        @media (max-width: 768px) {
            .status-tab { padding: 0.6rem 0.3rem; font-size: 0.85rem; }
            .tab-count { font-size: 1.2rem; }
            .detail-box { padding: 0.8rem; }

            .item-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }

            .item-right { text-align: left; }
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.5rem; }
            .fixed-content-area { padding: 0 10px; }
            .status-tab .tab-count { font-size: 1rem; }
            .status-tab div { font-size: 0.75rem; }
        }
    </style>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(function () {
            $('.detail-toggle-btn').click(function () {
                const target = $(this).data('target');
                $('#' + target).slideToggle();
            });
        });
    </script>
</head>

<body>
<div layout:fragment="content">
    <div class="container py-4">

        <h1 class="h3 mb-4 text-center text-gray-800">반품 조회</h1>

        <!-- 상태 탭 -->
        <div class="fixed-content-area mb-4">
            <div class="d-flex text-center border-bottom flex-wrap">
                <a th:href="@{/mypage/refund-history(status='ALL', page=0, size=${size})}"
                   th:classappend="${currentStatus == 'ALL' ? 'active' : ''}"
                   class="status-tab">
                    <div class="tab-count" th:text="${totalReturns}">0</div>
                    <div>전체</div>
                </a>

                <a th:href="@{/mypage/refund-history(status='PROCESS', page=0, size=${size})}"
                   th:classappend="${currentStatus == 'PROCESS' ? 'active' : ''}"
                   class="status-tab">
                    <div class="tab-count" th:text="${statusCounts['PROCESS']}">0</div>
                    <div>반품신청</div>
                </a>

                <a th:href="@{/mypage/refund-history(status='APPROVED', page=0, size=${size})}"
                   th:classappend="${currentStatus == 'APPROVED' ? 'active' : ''}"
                   class="status-tab">
                    <div class="tab-count" th:text="${statusCounts['APPROVED']}">0</div>
                    <div>반품처리완료</div>
                </a>
            </div>
        </div>

        <div class="fixed-content-area">

            <div th:if="${#lists.isEmpty(returnList)}"
                 class="text-center py-5 bg-light border rounded">
                반품 내역이 없습니다.
            </div>

            <div th:each="refund : ${returnList}"
                 class="bg-white rounded shadow-sm p-4 mb-4 border refund-card">

                <div class="mb-3 border-bottom pb-2 d-flex justify-content-between align-items-center flex-wrap">
                    <div>
                        <div class="fw-bold"
                             th:text="${#temporals.format(refund.refundDate, 'yyyy.MM.dd')} + ' 반품신청'">
                            날짜
                        </div>
                        <div class="small text-muted">
                            반품번호:
                            <span th:text="${refund.refundId}"></span>
                            |
                            주문번호:
                            <span th:text="${refund.orderId}"></span>
                        </div>
                    </div>
                    <span class="badge badge-status mt-2 mt-md-0"
                          th:classappend="${refund.refundStatus.colorClass}"
                          th:text="${refund.refundStatus().description}">
                    </span>
                </div>

                <!-- 반품 아이템 목록 -->
                <div th:each="item : ${refund.items}"
                     class="border rounded p-3 mb-2">

                    <div class="item-row">
                        <div class="item-left">
                            <div class="fw-bold text-truncate" th:text="${item.title}">도서명</div>
                            <div class="small text-muted"
                                 th:text="'수량: ' + ${item.quantity} + '개'"></div>
                        </div>

                        <div class="item-right">
                            <div class="fw-bold"
                                 th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT') + '원'}">
                            </div>
                            <span class="badge"
                                  th:classappend="${item.refundItemStatus().colorClass}"
                                  th:text="${item.refundItemStatus().description}">
                                </span>
                        </div>
                    </div>

                    <!-- 거절 사유 -->
                    <div th:if="${item.refundItemStatus.name() == 'REJECTED'}"
                         class="mt-2 text-danger small">
                        거절 사유 :
                        <span th:text="${item.rejectDetail}"></span>
                    </div>
                </div>

                <!-- 상세 토글 -->
                <div class="text-end mt-3">
                    <button class="btn btn-link btn-sm detail-toggle-btn"
                            th:data-target="'detail-' + ${refund.refundId}">
                        상세보기
                    </button>
                </div>

                <div th:id="'detail-' + ${refund.refundId}"
                     style="display:none"
                     class="detail-box mt-3">
                    <div class="mb-3">
                        <strong>반품 사유</strong> :
                        <span th:text="${refund.refundReason}"></span>
                    </div>

                    <div>
                        <strong>총 환불 금액</strong> :
                        <span th:text="${#numbers.formatDecimal(refund.totalRefundPrice, 0, 'COMMA', 0, 'POINT') + '원'}"></span>
                    </div>
                </div>
            </div>

            <!-- 페이지네이션 -->
            <nav th:if="${totalPages > 1}" class="mt-4">
                <ul class="pagination justify-content-center flex-wrap">

                    <li class="page-item" th:classappend="${isFirst} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/mypage/refund-history(status=${currentStatus}, page=${page - 1}, size=${size})}">
                            &laquo;
                        </a>
                    </li>

                    <li class="page-item disabled" th:if="${page > 2}">
                        <span class="page-link">…</span>
                    </li>

                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(T(java.lang.Math).max(0, page - 2), T(java.lang.Math).min(totalPages - 1, page + 2))}"
                        th:classappend="${i == page} ? 'active'">
                        <a class="page-link"
                           th:text="${i + 1}"
                           th:href="@{/mypage/refund-history(status=${currentStatus}, page=${i}, size=${size})}">
                        </a>
                    </li>

                    <li class="page-item disabled" th:if="${page < totalPages - 3}">
                        <span class="page-link">…</span>
                    </li>

                    <li class="page-item" th:classappend="${isLast} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/mypage/refund-history(status=${currentStatus}, page=${page + 1}, size=${size})}">
                            &raquo;
                        </a>
                    </li>

                </ul>
            </nav>

        </div>
    </div>
</div>
</body>
</html>
