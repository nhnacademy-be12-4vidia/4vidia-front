<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/admin-layout}">
<head>
    <meta charset="utf-8">
    <title>관리자 - 반품 관리</title>
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
    <style>
        .tab-btn { cursor: pointer; }
        .status-badge { border-radius: 999px; padding: 4px 10px; font-size:0.85rem; }
        .status-REQUEST { background:#f0ad4e; color:white; } /* 신청 */
        .status-APPROVED { background:#198754; color:white; } /* 승인 */
        .status-REJECTED { background:#dc3545; color:white; } /* 거절 */
    </style>
</head>
<body>
<div layout:fragment="pageContent" class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 text-gray-800 mb-0">반품 관리</h1>
    </div>

    <!-- 탭: 신청 / 승인 / 거절 -->
    <div class="btn-group" role="group">
        <a th:href="@{/admin/refunds(refundStatus='PROCESS')}"
           th:classappend="${status == 'PROCESS'} ? ' btn btn-primary' : ' btn btn-outline-primary'"
           class="btn">신청</a>

        <a th:href="@{/admin/refunds(refundStatus='ACCEPT')}"
           th:classappend="${status == 'ACCEPT'} ? ' btn btn-primary' : ' btn btn-outline-primary'"
           class="btn">승인</a>

        <a th:href="@{/admin/refunds(refundStatus='REJECT')}"
           th:classappend="${status == 'REJECT'} ? ' btn btn-primary' : ' btn btn-outline-primary'"
           class="btn">거절</a>
    </div>


    <!-- 검색 폼 (status 유지) -->
    <div class="row mb-3">
        <div class="col-md-8">
            <form th:action="@{/admin/refunds}" method="get" class="d-inline-flex mt-2">
                <input type="hidden" name="refundStatus" th:value="${status}"/>
                <input type="text" name="keyword" class="form-control form-control-sm me-2"
                       style="width: 260px;" placeholder="주문ID / 회원이메일 검색" th:value="${keyword}">
                <button class="btn btn-sm btn-primary">검색</button>
            </form>

        </div>

        <!-- 페이지 크기 선택 -->
        <div class="col-md-4 text-end">
            <form th:action="@{/admin/refunds}" method="get" class="d-inline-flex">
                <input type="hidden" name="status" th:value="${status}"/>
                <input type="hidden" name="keyword" th:value="${keyword}"/>
                <select name="size" class="form-select form-select-sm me-2" style="width:100px;">
                    <option th:selected="${refundsPage.size()==10}" value="10">10</option>
                    <option th:selected="${refundsPage.size()==20}" value="20">20</option>
                    <option th:selected="${refundsPage.size()==50}" value="50">50</option>
                </select>
                <button class="btn btn-sm btn-outline-primary">적용</button>
            </form>
        </div>
    </div>

    <!-- 리스트 -->
    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="thead-light">
                    <tr>
                        <th>반품번호</th>
                        <th>주문번호</th>
                        <th>회원이메일 / 회원이름</th>
                        <th>신청일</th>
                        <th>상태</th>
                        <th style="width: 160px;">동작</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(refundsPage.content)}">
                        <td colspan="6" class="text-center py-4 text-muted">조회된 반품이 없습니다.</td>
                    </tr>

                    <tr th:each="r,iterStat : ${refundsPage.content}" th:data-id="${r.refundId}">
                        <td th:text="${r.refundId}">1</td>
                        <td th:text="${r.orderId}">ORD-1</td>

                        <td>
                            <strong class="text-muted small" th:text="${r.email}">user@example.com</strong>
                            <div class="text-muted small" th:text="${r.name}">회원이름</div>
                        </td>
                        <td th:text="${#temporals.format(r.createdAt, 'yyyy-MM-dd HH:mm')}">2025-01-01</td>

                        <td>
                            <span th:text="${r.refundStatus}" th:classappend="' status-badge status-' + r.refundStatus"></span>
                        </td>

                        <td>
                            <!-- 상세보기: 모달로 표시 (fragment 호출하지 않고 JS로 fetch) -->
                            <button type="button" class="btn btn-sm btn-outline-primary btn-view-detail"
                                    th:attr="data-refund-id=${r.refundId}">
                                상세보기
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- 새 페이지네이션 스타일 -->
            <nav th:if="${refundsPage.totalPages > 1}" class="mt-3">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${refundsPage.page == 0} ? ' disabled'">
                        <a class="page-link"
                           th:href="@{/admin/refunds(refundStatus=${status}, keyword=${keyword}, page=${refundsPage.page - 1}, size=${refundsPage.size})}">
                            이전
                        </a>
                    </li>

                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, refundsPage.totalPages - 1)}"
                        th:classappend="${i == refundsPage.page} ? ' active'">
                        <a class="page-link"
                           th:text="${i + 1}"
                           th:href="@{/admin/refunds(refundStatus=${status}, keyword=${keyword}, page=${i}, size=${refundsPage.size})}">
                        </a>
                    </li>

                    <li class="page-item" th:classappend="${refundsPage.size + 1 >= refundsPage.totalPages} ? ' disabled'">
                        <a class="page-link"
                           th:href="@{/admin/refunds(refundStatus=${status}, keyword=${keyword}, page=${refundsPage.size + 1}, size=${refundsPage.size})}">
                            다음
                        </a>
                    </li>
                </ul>
            </nav>

        </div>
    </div>

    <!-- 모달 프래그먼트 포함 -->
    <div th:replace="~{admin/admin-refund-detail::returnDetailModal}"></div>

</div>

</body>
</html>
