<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>반품 조회</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .fixed-content-area {
            width: 650px;
            margin: 0 auto;
        }
        .status-tab {
            text-align: center;
            padding: 1rem 0.5rem;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            color: #6c757d;
            text-decoration: none;
            flex-grow: 1;
        }
        .status-tab.active {
            border-bottom-color: #5b5b9e;
            font-weight: bold;
            color: #5b5b9e !important;
        }
        .tab-count {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .refund-card:hover {
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15);
        }
        .detail-box {
            background-color: #f8f9fa;
            border-radius: 0.5rem;
            padding: 1rem;
        }
        .badge-status {
            font-size: .85rem;
        }
    </style>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(function () {
            $('.detail-toggle-btn').click(function () {
                const target = $(this).data('target');
                $('#' + target).slideToggle();
            });
        });
    </script>
</head>

<body>
<div layout:fragment="content">
    <div class="container">

        <h1 class="h3 mb-4 text-center">반품 조회</h1>

        <!-- ================= 상태 탭 ================= -->
        <div class="fixed-content-area mb-4">
            <div class="d-flex text-center border-bottom">
                <!-- ✅ page=0,size 유지 -->
                <a th:href="@{/mypage/refund-history(status='ALL', page=0, size=${size})}"
                   th:classappend="${currentStatus == 'ALL' ? 'active' : ''}"
                   class="status-tab">
                    <div class="tab-count" th:text="${totalReturns}">0</div>
                    <div>전체</div>
                </a>


                <a th:href="@{/mypage/refund-history(status='PROCESS', page=0, size=${size})}"
                   th:classappend="${currentStatus == 'PROCESS' ? 'active' : ''}"
                   class="status-tab">
                    <div class="tab-count" th:text="${statusCounts['PROCESS']}">0</div>
                    <div>반품신청</div>
                </a>

                <a th:href="@{/mypage/refund-history(status='APPROVED', page=0, size=${size})}"
                   th:classappend="${currentStatus == 'APPROVED' ? 'active' : ''}"
                   class="status-tab">
                    <div class="tab-count" th:text="${statusCounts['APPROVED']}">0</div>
                    <div>반품처리완료</div>
                </a>
            </div>
        </div>

        <div class="fixed-content-area">

            <div th:if="${#lists.isEmpty(returnList)}"
                 class="text-center py-5 bg-light border rounded">
                반품 내역이 없습니다.
            </div>

            <div th:each="refund : ${returnList}"
                 class="bg-white rounded shadow-sm p-4 mb-4 border refund-card">

                <div class="mb-3 border-bottom pb-2 d-flex justify-content-between align-items-center">
                    <div>
                        <div class="fw-bold"
                             th:text="${#temporals.format(refund.refundDate, 'yyyy.MM.dd')} + ' 반품신청'">
                            날짜
                        </div>
                        <div class="small text-muted">
                            반품번호:
                            <span th:text="${refund.refundId}"></span>
                            |
                            주문번호:
                            <span th:text="${refund.orderId}"></span>
                        </div>
                    </div>
                    <span class="badge badge-status"
                          th:classappend="${refund.refundStatus.colorClass}"
                          th:text="${refund.refundStatus().description}">
                    </span>
                </div>

                <!-- 반품 아이템 목록 -->
                <div th:each="item : ${refund.items}"
                     class="border rounded p-3 mb-2">

                    <div class="d-flex justify-content-between">
                        <div>
                            <div class="fw-bold" th:text="${item.title}">도서명</div>
                            <div class="small text-muted"
                                 th:text="'수량: ' + ${item.quantity} + '개'"></div>
                        </div>

                        <div class="text-end">
                            <div class="fw-bold"
                                 th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT') + '원'}">
                            </div>
                                <span class="badge"
                                      th:classappend="${item.refundItemStatus().colorClass}"
                                      th:text="${item.refundItemStatus().description}">
                                </span>
                        </div>
                    </div>

                    <!-- 거절 사유 -->
                    <div th:if="${item.refundItemStatus.name() == 'REJECTED'}"
                         class="mt-2 text-danger small">
                        거절 사유 :
                        <span th:text="${item.rejectDetail}"></span>
                    </div>
                </div>

                <!-- 상세 토글 -->
                <div class="text-end mt-3">
                    <button class="btn btn-link btn-sm detail-toggle-btn"
                            th:data-target="'detail-' + ${refund.refundId}">
                        상세보기
                    </button>
                </div>


                <!-- ✅ refundId() -> refundId 로 통일 -->
                <div th:id="'detail-' + ${refund.refundId}"
                     style="display:none"
                     class="detail-box mt-3">
                    <!-- 반품 사유 -->
                    <div class="mb-3">
                        <strong>반품 사유</strong> :
                        <span th:text="${refund.refundReason}"></span>
                    </div>

                    <div>
                        <strong>총 환불 금액</strong> :
                        <span th:text="${#numbers.formatDecimal(refund.totalRefundPrice, 0, 'COMMA', 0, 'POINT') + '원'}"></span>
                    </div>
                </div>
            </div>
            <nav th:if="${totalPages > 1}" class="mt-4">
                <ul class="pagination justify-content-center">

                    <!-- 이전 -->
                    <li class="page-item" th:classappend="${isFirst} ? 'disabled'">
                    <a class="page-link"
                           th:href="@{/mypage/refund-history(status=${currentStatus}, page=${page - 1}, size=${size})}">
                            &laquo;
                        </a>
                    </li>

                    <!-- 앞쪽 ... -->
                    <li class="page-item disabled"
                        th:if="${page > 2}">
                        <span class="page-link">…</span>
                    </li>

                    <!-- 페이지 번호 (현재 기준 -2 ~ +2) -->
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(
                T(java.lang.Math).max(0, page - 2),
                T(java.lang.Math).min(totalPages - 1, page + 2)
            )}"
                        th:classappend="${i == page} ? 'active'">
                        <a class="page-link"
                           th:text="${i + 1}"
                           th:href="@{/mypage/refund-history(status=${currentStatus}, page=${i}, size=${size})}">
                        </a>
                    </li>

                    <!-- 뒤쪽 ... -->
                    <li class="page-item disabled"
                        th:if="${page < totalPages - 3}">
                        <span class="page-link">…</span>
                    </li>

                    <!-- 다음 -->
                    <li class="page-item" th:classappend="${isLast} ? 'disabled'">

                    <a class="page-link"
                           th:href="@{/mypage/refund-history(status=${currentStatus}, page=${page + 1}, size=${size})}">
                            &raquo;
                        </a>
                    </li>

                </ul>
            </nav>

        </div>
    </div>
</div>
</body>
</html>
