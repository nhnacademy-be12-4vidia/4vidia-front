<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>주소 관리</title>

    <!-- CSRF meta -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<div layout:fragment="content">

    <div class="container mt-5" style="width: 900px; margin: 0 auto;">
        <h2 class="text-center mb-5 text-primary">📦 주소 관리</h2>

        <div class="d-flex justify-content-end mb-3">
            <button class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#addressModal"
                    th:disabled="${addressList.size() >= 10}">
                + 새 주소 추가
            </button>
        </div>

        <div th:if="${defaultAddress == null and not #lists.isEmpty(addressList)}"
             class="alert alert-warning text-center" role="alert">
            🚨 <b>기본 주소를 설정해주세요!</b>
        </div>

        <table class="table table-bordered text-center align-middle">
            <thead class="table-light">
            <tr>
                <th style="width: 70px;">선택</th>
                <th style="width: 200px;">별칭</th>
                <th style="width: 470px;">주소</th>
                <th style="width: 160px;">수정/삭제</th>
            </tr>
            </thead>

            <tbody id="addressTableBody">

            <tr th:if="${#lists.isEmpty(addressList)}">
                <td colspan="4" class="text-center text-muted py-4">
                    등록된 주소가 없습니다. 새 주소를 추가해 주세요.
                </td>
            </tr>

            <tr th:if="${defaultAddress != null}" th:with="addr=${defaultAddress}" class="table-primary">
                <td></td>
                <td>
                    <strong th:text="${addr.alias}"></strong>
                    <span class="badge bg-primary ms-1">기본</span>
                </td>
                <td class="text-start">
                    <span th:text="|(${addr.zipCode}) ${addr.roadAddress}, ${addr.addressDetail}|"></span>
                </td>
                <td>
                    <a th:href="@{/mypage/address/{addressId}/edit(addressId=${addr.addressId()})}"
                       class="btn btn-sm btn-outline-primary me-2">수정</a>
                </td>
            </tr>

            <th:block th:each="addr : ${addressList}"
                      th:with="isDefault=${defaultAddress != null and defaultAddress.addressId() == addr.addressId()}">
                <tr th:unless="${isDefault}">
                    <td>
                        <input type="checkbox" name="selectedAddress"
                               th:value="${addr.addressId}">
                    </td>

                    <td>
                        <strong th:text="${addr.alias}"></strong>
                    </td>

                    <td class="text-start">
                        <span th:text="|(${addr.zipCode}) ${addr.roadAddress}, ${addr.addressDetail}|"></span>
                    </td>

                    <td>
                        <a th:href="@{/mypage/address/{addressId}/edit(addressId=${addr.addressId})}"
                           class="btn btn-sm btn-outline-primary me-2">수정</a>

                        <!-- form 방식 삭제(DELETE)도 유지 가능. CSRF hidden 추가 -->
                        <form th:action="@{/mypage/address/{addressId}(addressId=${addr.addressId})}"
                              method="post" style="display:inline;"
                              onsubmit="return confirm('정말 이 주소를 삭제하시겠습니까?');">
                            <input type="hidden" name="_method" value="DELETE"/>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
                        </form>
                    </td>
                </tr>
            </th:block>

            </tbody>
        </table>

        <th:block th:with="nonDefaultAddresses=${#lists.size(addressList) - (#bools.isTrue(defaultAddress != null) ? 1 : 0)}">
            <div class="d-flex justify-content-between mt-3" th:if="${nonDefaultAddresses > 0}">
                <button id="setDefaultBtn" class="btn btn-outline-primary">기본 주소로 설정</button>
                <button id="deleteSelectedBtn" class="btn btn-outline-danger">선택한 주소 삭제</button>
            </div>
        </th:block>

        <p class="text-danger mt-2 text-end"
           th:if="${addressList.size() >= 10}">
            주소는 최대 10개까지만 등록할 수 있습니다.
        </p>
    </div>

    <!-- 주소 추가 모달 -->
    <div class="modal fade" id="addressModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-body">
                    <form id="addAddressForm"
                          method="post"
                          th:action="@{/mypage/address}"
                          onsubmit="submitAddress(event)">

                        <!-- form submit 방식도 가능하게 hidden 남겨둠 -->
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="form-group mb-3">
                            <label>별칭*</label>
                            <input type="text" name="alias" class="form-control" required>
                        </div>

                        <div class="form-group mb-3">
                            <label>우편번호*</label>
                            <div class="d-flex">
                                <input type="text" id="zipNo" name="zipCode" class="form-control me-2" readonly required>
                                <button type="button" class="btn btn-secondary" onclick="searchPostcode()">
                                    우편번호 찾기
                                </button>
                            </div>
                        </div>

                        <div class="form-group mb-3">
                            <label>도로명 주소*</label>
                            <input type="text" id="roadAddrPart1" name="roadAddress" class="form-control" readonly required>
                        </div>

                        <div class="form-group mb-3">
                            <label>상세 주소*</label>
                            <input type="text" id="addrDetail" name="addressDetail" class="form-control" required>
                        </div>

                    </form>
                </div>

                <div class="modal-footer">
                    <button type="submit" form="addAddressForm" class="btn btn-primary">저장하기</button>
                    <button class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 우편번호 팝업 콜백은 opener에서 호출됨 -->
    <script>
        function searchPostcode() {
            window.open("/mypage/address/jusoPopup", "pop",
                "width=570,height=420,scrollbars=yes,resizable=yes");
        }

        function jusoCallBack(roadAddrPart1, addrDetail, zipNo) {
            document.getElementById("zipNo").value = zipNo;
            document.getElementById("roadAddrPart1").value = roadAddrPart1;
            document.getElementById("addrDetail").value = addrDetail;
            document.getElementById("addrDetail").focus();
        }
    </script>

</div>

<!-- =========================
     JS (CSRF + fetch handlers)
     ========================= -->
<script>
    // cookie(XSRF-TOKEN) 우선, meta fallback
    function getCookie(name) {
        return document.cookie
            .split("; ")
            .find(row => row.startsWith(name + "="))
            ?.split("=")[1];
    }

    function csrfHeaders() {
        const cookieToken = getCookie("XSRF-TOKEN");
        if (cookieToken) {
            return { "X-XSRF-TOKEN": decodeURIComponent(cookieToken) };
        }

        const token = document.querySelector('meta[name="_csrf"]')?.content;
        const headerName = document.querySelector('meta[name="_csrf_header"]')?.content;
        if (token && headerName) {
            return { [headerName]: token };
        }

        console.warn("CSRF token not found (cookie/meta 둘 다 없음)");
        return {};
    }

    function getSelectedAddresses() {
        return Array.from(document.querySelectorAll("input[name='selectedAddress']:checked"))
            .map(chk => chk.value);
    }

    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("setDefaultBtn")?.addEventListener("click", setDefaultSelectedAddress);
        document.getElementById("deleteSelectedBtn")?.addEventListener("click", deleteSelectedAddresses);
    });

    async function setDefaultSelectedAddress() {
        const selected = getSelectedAddresses();
        if (selected.length !== 1) {
            alert("기본 주소는 하나만 선택해야 합니다.");
            return;
        }

        const addressId = selected[0];

        const res = await fetch(`/mypage/address/default/${addressId}`, {
            method: "PUT",
            credentials: "same-origin",
            headers: { ...csrfHeaders() }
        });

        if (res.ok) location.reload();
        else alert(`기본 주소 설정 실패: ${res.status}`);
    }

    async function deleteSelectedAddresses() {
        const selected = getSelectedAddresses();
        if (selected.length === 0) {
            alert("삭제할 주소를 선택하세요.");
            return;
        }
        if (!confirm("선택한 주소를 모두 삭제하시겠습니까?")) return;

        const headers = { ...csrfHeaders() };

        const results = await Promise.all(
            selected.map(id =>
                fetch(`/mypage/address/${id}`, {
                    method: "DELETE",
                    credentials: "same-origin",
                    headers
                })
            )
        );

        const failed = results.find(r => !r.ok);
        if (failed) {
            alert(`삭제 실패: ${failed.status}`);
            return;
        }
        location.reload();
    }

    async function submitAddress(e) {
        e.preventDefault();

        const form = document.getElementById("addAddressForm");
        const formData = new FormData(form);

        const res = await fetch("/mypage/address", {
            method: "POST",
            credentials: "same-origin",
            headers: { ...csrfHeaders() },
            body: formData
        });

        if (res.ok) {
            location.reload();
            return;
        }

        const text = await res.text().catch(() => "");
        console.error("주소 저장 실패:", res.status, text);
        alert(`주소 저장 실패: ${res.status}`);
    }
</script>

</body>
</html>
