<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/admin-layout}">

<head>
    <meta charset="UTF-8">
    <title>쿠폰 정책 관리</title>
</head>

<body>
<div layout:fragment="pageContent">

    <!-- ====== 헤더 ====== -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 text-gray-800">쿠폰 정책 관리</h1>
        <div>
            <a href="/admin/coupons/policies/category" class="btn btn-primary btn-sm">+ 카테고리/전체 정책 생성</a>
            <a href="/admin/coupons/policies/book" class="btn btn-success btn-sm">+ 도서 정책 생성</a>
        </div>
    </div>

    <!-- ====== 검색 폼 ====== -->
    <form method="get" th:action="@{/admin/coupons/policies}" class="card card-body mb-3">
        <div class="row g-2 align-items-end">

            <div class="col-md-3">
                <label class="form-label">정책명</label>
                <input type="text" name="keyword" class="form-control"
                       th:value="${keyword}">
            </div>

            <div class="col-md-2">
                <label class="form-label">상태</label>
                <select name="status" class="form-select">
                    <option value="ALL" th:selected="${status == 'ALL'}">전체</option>
                    <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">활성</option>
                    <option value="INACTIVE" th:selected="${status == 'INACTIVE'}">비활성</option>
                </select>
            </div>

            <div class="col-md-2">
                <label class="form-label">대상</label>
                <select name="targetType" class="form-select">
                    <option value="ALL" th:selected="${targetType == 'ALL'}">전체</option>
                    <option value="CATEGORY" th:selected="${targetType == 'CATEGORY'}">카테고리</option>
                    <option value="BOOK" th:selected="${targetType == 'BOOK'}">도서</option>
                </select>
            </div>

            <div class="col-md-2">
                <label class="form-label">페이지 크기</label>
                <select name="size" class="form-select">
                    <option value="10" th:selected="${size == 10}">10</option>
                    <option value="20" th:selected="${size == 20}">20</option>
                    <option value="50" th:selected="${size == 50}">50</option>
                </select>
            </div>

            <input type="hidden" name="page" value="0"/>

            <div class="col-md-3">
                <button class="btn btn-dark w-100">검색</button>
            </div>
        </div>
    </form>

    <!-- ====== 테이블 ====== -->
    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle text-center">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>정책명</th>
                <th>할인</th>
                <th>대상</th>
                <th>유효기간</th>
                <th>발급현황</th>
                <th>상태</th>
                <th>관리</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="p : ${policies}">
                <td th:text="${p.policyId}"></td>

                <td class="fw-semibold" th:text="${p.policyName}"></td>

                <td>
                    <span th:if="${p.discountType == 'PRICE'}"
                          th:text="${p.discountValue} + '원'"></span>
                    <span th:if="${p.discountType == 'RATE'}"
                          th:text="${p.discountValue} + '% (최대 ' + ${p.maxDiscountAmount} + '원)'"></span>
                </td>

                <td th:text="${p.discountTargetType}"></td>

                <td>
                    <span th:if="${p.validityType == 'RELATIVE'}"
                          th:text="'발급 후 ' + ${p.validDays} + '일'"></span>

                    <span th:if="${p.validityType == 'ABSOLUTE'}"
                          th:text="${#temporals.format(p.startDate, 'yyyy-MM-dd HH:mm')}
                                   + ' ~ ' +
                                   ${#temporals.format(p.endDate, 'yyyy-MM-dd HH:mm')}"></span>
                </td>

                <td th:text="${p.issueStatus}"></td>

                <td>
                    <span class="badge"
                          th:classappend="${p.isActivation} ? 'bg-primary' : 'bg-secondary'"
                          th:text="${p.isActivation} ? 'ACTIVE' : 'INACTIVE'"></span>
                </td>

                <td>
                    <form th:action="@{'/admin/coupons/policies/' + ${p.policyId} + '/toggle'}"
                          method="post">
                        <input type="hidden" name="_method" value="patch"/>
                        <button type="submit"
                                class="btn btn-sm"
                                th:classappend="${p.isActivation} ? 'btn-danger' : 'btn-success'"
                                th:text="${p.isActivation} ? '비활성화' : '활성화'">
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- ====== 페이징 ====== -->
    <nav th:if="${page.totalPages > 1}">
        <ul class="pagination justify-content-center">

            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/coupons/policies(
                        page=${page.number - 1},
                        size=${size},
                        keyword=${keyword},
                        status=${status},
                        targetType=${targetType})}">
                    이전
                </a>
            </li>

            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                th:classappend="${i == page.number} ? 'active'">
                <a class="page-link"
                   th:text="${i + 1}"
                   th:href="@{/admin/coupons/policies(
                        page=${i},
                        size=${size},
                        keyword=${keyword},
                        status=${status},
                        targetType=${targetType})}">
                </a>
            </li>

            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/coupons/policies(
                        page=${page.number + 1},
                        size=${size},
                        keyword=${keyword},
                        status=${status},
                        targetType=${targetType})}">
                    다음
                </a>
            </li>

        </ul>
    </nav>

</div>
</body>
</html>
