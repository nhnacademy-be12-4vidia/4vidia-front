<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>4VIDIA - 태그 도서 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        .page-wrap { max-width: 1180px; margin: 0 auto; position: relative; }

        /* ------------------------------------------------ */
        /* 공통 레이아웃 (반응형 수정 핵심) */
        /* ------------------------------------------------ */
        .row-flex {
            display: flex;
            flex-wrap: wrap !important;
            justify-content: center; /* 왼쪽 정렬하되 자연스럽게 흐르도록 */
            margin-right: -0.5rem;
            margin-left: -0.5rem;
        }

        /* 카드 Wrapper */
        .book-card-wrapper {
            flex-shrink: 0;
            width: calc(20% - 1rem);
            padding: 0 0.5rem;
            margin-bottom: 2rem;
        }

        /* ------------------------------------------------ */
        /* 상단 소개 (Tag Hero) */
        /* ------------------------------------------------ */
        .tag-hero {
            border: 1px solid rgba(78,115,223,0.22);
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(78,115,223,0.10), rgba(246,194,62,0.10));
            box-shadow: 0 0.45rem 1.25rem rgba(0,0,0,0.06);
            padding: 16px;
            position: relative;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }
        .tag-hero::before{
            content:"";
            position:absolute; inset:0;
            background:
                    radial-gradient(circle at 12% 18%, rgba(78,115,223,0.16), transparent 48%),
                    radial-gradient(circle at 90% 35%, rgba(246,194,62,0.18), transparent 48%);
            pointer-events:none;
        }
        .tag-hero__top{
            position:relative;
            display:flex;
            flex-wrap:wrap;
            align-items:flex-start;
            justify-content:space-between;
            gap:14px;
        }
        .tag-hero__left{ flex: 1 1 auto; }
        .tag-hero__title{ display:flex; align-items:center; gap:10px; }
        .tag-chip{
            display:inline-flex; align-items:center; gap:6px; padding:4px 10px;
            border-radius:999px; background:rgba(78,115,223,0.14);
            border:1px solid rgba(78,115,223,0.22); color:#2e59d9;
            font-weight:800; font-size:0.82rem; white-space:nowrap;
        }
        .tag-hero__sub{ position:relative; margin:8px 0 0 0; color:#5a5c69; font-size:0.92rem; }

        /* ------------------------------------------------ */
        /* 카드 디자인 (검색 결과 페이지 스타일 적용) */
        /* ------------------------------------------------ */
        .book-card {
            border: none;
            border-radius: 0.75rem;
            width: 100%;
            height: 100%;
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.25s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .card-img-wrapper {
            position: relative;
            overflow: hidden;
            background-color: #f8f9fa;
            text-align: center;
        }
        .card-img-wrapper img {
            width: 100%;
            height: 220px;
            object-fit: contain;
            transition: transform 0.35s ease;
            padding: 10px;
        }
        .book-card:hover .card-img-wrapper img { transform: scale(1.05); }

        .btn-heart {
            position: absolute; top: 8px; right: 8px; z-index: 5;
            width: 32px; height: 32px; border: none; border-radius: 50%;
            background: rgba(255,255,255,0.95);
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            transition: background 0.15s, transform 0.2s;
        }
        .btn-heart:hover { background: #ffe5e5; transform: scale(1.08); }
        .btn-heart i { font-size: 1rem; color: #777; }
        .btn-heart i.fas { color: #e74a3b; }

        .card-body {
            padding: 0.8rem;
            display: flex;
            flex-direction: column;
            color: #333;
            flex-grow: 1;
        }
        .card-title {
            font-size: 0.95rem; font-weight: 700; margin-bottom: 0.2rem !important; color: #2c3e50;
        }

        .price-original-no-discount { color: #2c3e50; font-size: 0.95rem; font-weight: 700; text-decoration: none; }
        .price-original { text-decoration: line-through; color: #858796; font-size: 0.8rem; margin-right: 0.3rem; }
        .price-current { color: #4e73df; font-weight: 700; font-size: 0.95rem; }

        .btn-block { width: 100%; border-radius: 0.35rem; font-size: 0.9rem; padding: 0.3rem 0; font-weight: 600; }
        .btn-primary { background: #4e73df; border: none; }
        .btn-primary:hover { background: #365acb; }
        .btn-buy { background: #2c3e50; border: none; color: white; }
        .btn-buy:hover { background: #1a252f; color: white; }

        /* ------------------------------------------------ */
        /* 반응형 (모바일 최적화) */
        /* ------------------------------------------------ */
        @media (max-width: 700px) {
            .row-flex {
                justify-content: center; /* 모바일에서는 중앙 정렬 */
            }
            .book-card-wrapper {
                width: 48%; /* 모바일에서 2열 배치 */
                padding: 0 0.25rem;
            }
            .card-img-wrapper img {
                height: 180px;
            }
            .filter-shell { padding: 10px; }
            .filter-bar { justify-content: flex-start; }
            .filter-group { width: 100%; justify-content: space-between; }
            .filter-input { width: 45%; }
            .filter-select { width: 100%; }
            .filter-actions { width: 100%; justify-content: flex-end; }
        }

        /* ------------------------------------------------ */
        /* 필터/정렬 바 */
        /* ------------------------------------------------ */
        .filter-shell{
            margin-top: 6px;
            background: rgba(255,255,255,0.62);
            border: 1px solid rgba(78,115,223,0.18);
            border-radius: 16px;
            padding: 12px 12px;
            box-shadow: 0 0.25rem 0.95rem rgba(0,0,0,0.05);
            backdrop-filter: blur(10px);
            max-width: 100%;
        }
        .filter-bar{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:flex-end; }
        .filter-group{
            display:flex; align-items:center; gap:8px; padding: 6px 8px;
            border-radius: 14px; background: rgba(255,255,255,0.70);
            border: 1px solid rgba(0,0,0,0.08);
        }
        .filter-chip{
            display:inline-flex; align-items:center; padding: 4px 10px;
            border-radius: 999px; background: rgba(78,115,223,0.10);
            border: 1px solid rgba(78,115,223,0.18); color:#2e59d9;
            font-weight: 900; font-size: 0.78rem; white-space: nowrap;
        }
        .filter-select, .filter-input{
            height: 36px; border: 1px solid rgba(0,0,0,0.12); border-radius: 12px;
            padding: 0 12px; background: #fff; outline: none; font-weight: 750; color:#2c3e50;
        }
        .filter-input{ width: 110px; }
        .filter-select{ width: 180px; }
        .filter-select:focus, .filter-input:focus{
            border-color: rgba(78,115,223,0.55); box-shadow: 0 0 0 3px rgba(78,115,223,0.18);
        }
        .tilde{ color:#9aa0a6; font-weight: 900; }
        .unit{ color:#6c757d; font-weight: 900; font-size: 0.85rem; }
        .filter-actions{ display:flex; gap:8px; align-items:center; }
        .filter-btn{
            height: 36px; padding: 0 14px; border-radius: 12px;
            border: 1px solid #2e59d9; background: #2e59d9; color: #fff;
            font-weight: 900; cursor: pointer; display:inline-flex; align-items:center; gap:8px;
        }
        .filter-btn.ghost{ background: #fff; color: #2e59d9; }
        .filter-btn:hover{ filter: brightness(0.96); }
        .floating-filters{ display:flex; justify-content:flex-end; align-items:flex-start; max-width: 100%; margin-bottom: 12px; }

        @media (max-width: 768px) {
            .floating-filters{ width: 100%; justify-content: flex-start; margin-bottom: 10px; }
        }

        .pagination .page-link{ border-radius:10px; }
    </style>

    <script th:src="@{/customJs/like.js}"></script>
    <script th:src="@{/customJs/askMoveCart.js}"></script> <script>
    function goPage(pageNo){
        const url = new URL(window.location.href);
        url.searchParams.set('page', String(pageNo));
        if (!url.searchParams.get('size')) {
            const size = document.getElementById('pageSizeHolder')?.value;
            if (size) url.searchParams.set('size', size);
        }
        startLoading();
        window.location.href = url.toString();
    }

    document.addEventListener('DOMContentLoaded', () => {
        const url = new URL(window.location.href);
        const sort = url.searchParams.get('sort');
        const sel = document.getElementById('sortSelect');
        if (sel && sort) sel.value = sort;
    });

    function applyFilters(){
        const url = new URL(window.location.href);
        const minV = document.getElementById('minPriceInput')?.value?.trim();
        const maxV = document.getElementById('maxPriceInput')?.value?.trim();
        const sortV = document.getElementById('sortSelect')?.value;

        if (minV && maxV) {
            const minN = Number(minV);
            const maxN = Number(maxV);
            if (!Number.isNaN(minN) && !Number.isNaN(maxN) && minN > maxN) {
                alert('최저가가 최고가보다 클 수 없습니다.');
                return;
            }
        }
        if (minV) url.searchParams.set('minPrice', minV); else url.searchParams.delete('minPrice');
        if (maxV) url.searchParams.set('maxPrice', maxV); else url.searchParams.delete('maxPrice');
        if (sortV) url.searchParams.set('sort', sortV); else url.searchParams.delete('sort');
        url.searchParams.set('page', '0');

        if (!url.searchParams.get('size')) {
            const size = document.getElementById('pageSizeHolder')?.value;
            if (size) url.searchParams.set('size', size);
        }
        startLoading();
        window.location.href = url.toString();
    }

    function resetFilters(){
        const url = new URL(window.location.href);
        url.searchParams.delete('minPrice');
        url.searchParams.delete('maxPrice');
        url.searchParams.delete('sort');
        url.searchParams.set('page', '0');
        if (!url.searchParams.get('size')) {
            const size = document.getElementById('pageSizeHolder')?.value;
            if (size) url.searchParams.set('size', size);
        }
        startLoading();
        window.location.href = url.toString();
    }
</script>
</head>

<body>
<div layout:fragment="content">
    <div id="global-loader" class="loader-container"></div>

    <div class="container-fluid mt-4 page-wrap">

        <div class="floating-filters">
            <div class="filter-shell">
                <div class="filter-bar">
                    <div class="filter-group">
                        <span class="filter-chip">가격</span>
                        <input id="minPriceInput" name="minPrice" type="number" min="0" step="100"
                               class="filter-input" placeholder="최저"
                               th:value="${param.minPrice != null ? param.minPrice[0] : ''}">
                        <span class="tilde">~</span>
                        <input id="maxPriceInput" name="maxPrice" type="number" min="0" step="100"
                               class="filter-input" placeholder="최고"
                               th:value="${param.maxPrice != null ? param.maxPrice[0] : ''}">
                        <span class="unit">원</span>
                    </div>

                    <div class="filter-group">
                        <span class="filter-chip">정렬</span>
                        <select id="sortSelect" class="filter-select">
                            <option value="" th:selected="${(param.sort != null ? param.sort[0] : (sort != null ? sort.name() : '')) == ''}">기본</option>
                            <option value="PUBLISHED_DESC" th:selected="${(param.sort != null ? param.sort[0] : (sort != null ? sort.name() : '')) == 'PUBLISHED_DESC'}">신상품순</option>
                            <option value="PUBLISHED_ASC" th:selected="${(param.sort != null ? param.sort[0] : (sort != null ? sort.name() : '')) == 'PUBLISHED_ASC'}">오래된순</option>
                            <option value="PRICE_ASC" th:selected="${(param.sort != null ? param.sort[0] : (sort != null ? sort.name() : '')) == 'PRICE_ASC'}">최저가순</option>
                            <option value="PRICE_DESC" th:selected="${(param.sort != null ? param.sort[0] : (sort != null ? sort.name() : '')) == 'PRICE_DESC'}">최고가순</option>
                            <option value="RATING_DESC" th:selected="${(param.sort != null ? param.sort[0] : (sort != null ? sort.name() : '')) == 'RATING_DESC'}">평점순</option>
                        </select>
                    </div>

                    <div class="filter-actions">
                        <button type="button" class="filter-btn" onclick="applyFilters()">
                            <i class="fas fa-check"></i>
                            적용
                        </button>
                        <button type="button" class="filter-btn ghost" onclick="resetFilters()">
                            <i class="fas fa-undo"></i>
                            초기화
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <section class="tag-hero">
            <div class="tag-hero__top">
                <div class="tag-hero__left">
                    <div class="tag-hero__title">
                        <h1 class="h4 m-0 text-gray-800" th:text="${tagName}">이 태그에 속한 도서들</h1>
                        <span class="tag-chip"><i class="fas fa-tag"></i> CATEGORY</span>
                    </div>
                    <p class="tag-hero__sub">
                        <span class="me-2">선택한 카테고리에 해당하는 도서를 모아 보여드립니다.</span>
                        <span th:text="'· 총 ' + ${totalElements} + '건'">· 총 0건</span>
                    </p>
                </div>
            </div>
        </section>

        <input type="hidden" id="pageSizeHolder" th:value="${size}">

        <div class="row" th:if="${#lists.isEmpty(books)}">
            <div class="col-12">
                <div class="alert alert-light border text-center py-5 mt-4">
                    <i class="fas fa-book fa-3x text-gray-300 mb-3"></i>
                    <p class="mb-1 fw-bold">이 태그에 해당하는 도서가 없습니다.</p>
                    <p class="mb-0 text-muted small">다른 태그를 선택하거나 태그 조합 검색을 이용해 보세요.</p>
                </div>
            </div>
        </div>

        <div th:if="${!#lists.isEmpty(books)}" class="row-flex">
            <div class="book-card-wrapper" th:each="book : ${books}">
                <div class="card book-card h-100">
                    <div class="card-img-wrapper">
                        <button type="button"
                                class="btn-heart"
                                th:attr="data-book-id=${book.id()}"
                                onclick="toggleLike(event, this)">
                            <i class="fa-heart" th:classappend="${book.liked()} ? 'fas' : 'far'"></i>
                        </button>

                        <a th:href="@{/books/{bookId}(bookId=${book.id()})}" style="text-decoration:none; color:inherit;">
                            <img th:src="${book.imageUrl() != null ? book.imageUrl() : '/img/default-book-cover.png'}" th:alt="${book.title()}">
                        </a>
                    </div>

                    <div class="card-body">
                        <a th:href="@{/books/{bookId}(bookId=${book.id()})}" style="text-decoration:none; color:inherit;">
                            <h5 class="card-title text-truncate" th:text="${book.title()}">책 제목</h5>
                        </a>

                        <p class="text-muted small mb-2 text-truncate" style="font-size: 0.75rem;"
                           th:text="${#lists.isEmpty(book.authorNames()) ? '저자 정보 없음' : #strings.listJoin(book.authorNames(), ', ')}">
                            저자
                        </p>

                        <div class="mb-2">
                            <span th:if="${book.priceStandard() > book.priceSales()}"
                                  class="price-current"
                                  th:text="${#numbers.formatDecimal(book.priceSales(), 0, 'COMMA', 0, 'POINT') + '원'}">할인가</span>

                            <span th:if="${book.priceStandard() > book.priceSales()}"
                                  class="price-original"
                                  th:text="${#numbers.formatDecimal(book.priceStandard(), 0, 'COMMA', 0, 'POINT') + '원'}">정가</span>

                            <span th:if="${book.priceStandard() <= book.priceSales()}"
                                  class="price-original-no-discount"
                                  th:text="${#numbers.formatDecimal(book.priceStandard(), 0, 'COMMA', 0, 'POINT') + '원'}">정가</span>

                            <span class="badge bg-danger ms-1" style="font-size: 0.72rem;"
                                  th:if="${book.priceStandard() > book.priceSales()}"
                                  th:text="${book.priceStandard() == 0 ? '' : #numbers.formatDecimal((book.priceStandard() - book.priceSales()) * 100 / book.priceStandard(), 0, 'COMMA', 0, 'POINT') + '%'}"></span>
                        </div>

                        <div class="mt-auto d-flex gap-2">
                            <form th:action="@{/cart/add}" method="post" class="flex-grow-1">
                                <input type="hidden" name="bookId" th:value="${book.id()}">
                                <button class="btn btn-primary btn-block" title="장바구니"
                                        th:onclick="|addToCartAndConfirmMove('${book.id()}', '1'); return false;|">
                                    <i class="fas fa-shopping-cart"></i>
                                </button>
                            </form>
                            <form th:action="@{/orders/checkout-temp}" method="post" class="flex-grow-1">
                                <input type="hidden" name="bookId" th:value="${book.id()}">
                                <input type="hidden" name="quantity" value="1">
                                <button type="submit" class="btn btn-buy btn-block" title="구매">
                                    <i class="fas fa-credit-card"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <nav th:if="${totalPages != null and totalPages > 1}" class="mt-3 pb-5">
            <ul class="pagination justify-content-center"
                th:with="blockSize=${T(java.lang.Integer).valueOf(10)},
                         p=${T(java.lang.Integer).valueOf(page)},
                         hasContent=${!#lists.isEmpty(books)},
                         computedLast=${T(java.lang.Integer).valueOf(totalPages - 1)},
                         effectiveLast=${hasContent ? computedLast : (p - 1)},
                         lastIndex=${effectiveLast < 0 ? 0 : effectiveLast},
                         start=${p - (p % blockSize)}">

                <li class="page-item" th:classappend="${page == 0} ? ' disabled'">
                    <a class="page-link" href="javascript:void(0)" th:attr="onclick=|goPage(0)|" aria-label="First">
                        <i class="fas fa-angle-double-left"></i>
                    </a>
                </li>

                <li class="page-item" th:classappend="${start == 0} ? ' disabled'">
                    <a class="page-link" href="javascript:void(0)" th:attr="onclick=|goPage(${start - 1})|" aria-label="Prev block">
                        <i class="fas fa-angle-left"></i>
                    </a>
                </li>

                <th:block th:if="${start <= lastIndex}"
                          th:with="end=${(lastIndex < (start + blockSize - 1)) ? lastIndex : (start + blockSize - 1)}">
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(start, end)}"
                        th:classappend="${i == page} ? ' active'">
                        <a class="page-link" href="javascript:void(0)"
                           th:text="${i + 1}"
                           th:attr="onclick=|goPage(${i})|"></a>
                    </li>
                </th:block>

                <li class="page-item" th:classappend="${start + blockSize > lastIndex} ? ' disabled'">
                    <a class="page-link" href="javascript:void(0)" th:attr="onclick=|goPage(${start + blockSize})|" aria-label="Next block">
                        <i class="fas fa-angle-right"></i>
                    </a>
                </li>

                <li class="page-item" th:classappend="${page >= lastIndex} ? ' disabled'">
                    <a class="page-link" href="javascript:void(0)" th:attr="onclick=|goPage(${lastIndex})|" aria-label="Last">
                        <i class="fas fa-angle-double-right"></i>
                    </a>
                </li>
            </ul>
        </nav>

    </div>
</div>
</body>
</html>
