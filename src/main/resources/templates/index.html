<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="utf-8">
    <title>4VIDIA - 도서 쇼핑몰</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        /* ------------------------------------------------ */
        /* 공통 레이아웃 정리 */
        /* ------------------------------------------------ */

        .row {
            display: flex;
            flex-wrap: wrap !important;
            justify-content: center;
        }

        /* ------------------------------------------------ */
        /* 카드 Wrapper */
        /* ------------------------------------------------ */
        .book-card-wrapper {
            flex-shrink: 0;
            width: 250px;
            padding: 0 0.75rem;
            margin-bottom: 2.5rem;
        }

        /* ------------------------------------------------ */
        /* 카드 디자인 */
        /* ------------------------------------------------ */
        .book-card {
            border: none;
            border-radius: 0.5rem;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 0.25rem 1.25rem rgba(0,0,0,0.12);
            transition: all 0.25s ease;
        }

        .book-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 0.75rem 2rem rgba(0,0,0,0.18);
        }

        /* 이미지 hover 확대 */
        .card-img-wrapper {
            position: relative;
            overflow: hidden;
        }

        .card-img-wrapper img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            transition: transform 0.35s ease;
        }

        .book-card:hover .card-img-wrapper img {
            transform: scale(1.07);
        }

        /* ------------------------------------------------ */
        /* 좋아요 버튼 */
        /* ------------------------------------------------ */
        .btn-heart {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 5;
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            background: rgba(255,255,255,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 3px 8px rgba(0,0,0,0.18);
            transition: background 0.15s, transform 0.2s;
        }

        .btn-heart:hover {
            background: #ffe5e5;
            transform: scale(1.08);
        }

        .btn-heart i {
            font-size: 1.1rem;
            color: #777;
        }

        .btn-heart i.fas {
            color: #e74a3b;
        }

        /* ------------------------------------------------ */
        /* 텍스트 영역 */
        /* ------------------------------------------------ */
        .card-body {
            padding: 1rem;
        }

        .category-badge {
            color: #4e73df;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 700;
        }

        /* 평점 */
        .rating {
            color: #f6c23e;
            font-size: 0.9rem;
        }

        /* 가격 */
        /* 할인이 없는 경우의 정가 스타일 (취소선 없음) */
        .price-original-no-discount {
            color: initial;
            font-size: 1.15rem;
            font-weight: 700;
            text-decoration: none;
        }

        /* 할인이 있는 경우의 정가 스타일 (취소선 있음) */
        .price-original {
            text-decoration: line-through;
            color: #858796;
            font-size: 0.9rem;
            margin-right: 0.5rem;
        }

        .price-current {
            color: #4e73df;
            font-weight: 700;
            font-size: 1.15rem;
        }

        /* ------------------------------------------------ */
        /* 버튼 스타일 */
        /* ------------------------------------------------ */
        .book-card .card-body form {
            margin-bottom: 0.6rem;
        }

        .book-card .card-body form:last-child {
            margin-bottom: 0;
        }

        .btn-block {
            width: 100%;
            padding: 0.55rem 0;
            font-weight: 600;
            border-radius: 0.35rem;
        }

        .btn-primary {
            background: #4e73df;
            border: none;
        }

        .btn-primary:hover {
            background: #365acb;
        }

        .btn-secondary {
            background: #858796;
            border: none;
        }

        .btn-secondary:hover {
            background: #6c6f7a;
        }

        /* ------------------------------------------------ */
        /* 카테고리 Pill */
        /* ------------------------------------------------ */
        .category-pill {
            padding: 0.5rem 1.3rem;
            border-radius: 30px;
            border: 1px solid #d8dce6;
            background: white;
            color: #61636b;
            font-size: 0.85rem;
            font-weight: 600;
            margin-right: 0.4rem;
            margin-bottom: 0.5rem;
            display: inline-block;
            transition: all 0.2s ease;
        }

        .category-pill:hover {
            background: #4e73df;
            border-color: #4e73df;
            color: white;
        }

        .category-pill.active {
            background: #4e73df;
            color: white;
        }

        /* ------------------------------------------------ */
        /* 반응형 디자인 */
        /* ------------------------------------------------ */
        @media (max-width: 992px) {
            .book-card-wrapper {
                width: 45%;
            }
        }

        @media (max-width: 576px) {
            .book-card-wrapper {
                width: 90%;
            }
            .card-img-wrapper img {
                height: 260px;
            }
        }

    </style>
    <script th:src="@{/customJs/askMoveCart.js}"></script>
    <script th:src="@{/customJs/like.js}"></script>
    <script th:inline="javascript">
        const CURRENT_SEARCH_PARAMS = {
            keyword: null,
            page: 0,
            size: 20,
            useSemantic: false
        };
    </script>
</head>


<body>
<div layout:fragment="content">
    <div class="container">

        <div class="d-sm-flex align-items-center justify-content-center mb-4 text-center w-100">
            <div>
                <h1 class="h3 mb-2 text-gray-800">베스트셀러 도서</h1>
                <p class="mb-0 text-gray-600">4VIDIA에서 가장 인기있는 도서들을 만나보세요</p>
            </div>
        </div>

        <div class="mb-4 text-center">
            <a href="#" class="category-pill active" data-category="all">전체</a>
            <a href="#" class="category-pill" data-category="문학">문학</a>
            <a href="#" class="category-pill" data-category="소설">소설</a>
            <a href="#" class="category-pill" data-category="에세이">에세이</a>
            <a href="#" class="category-pill" data-category="자기계발">자기계발</a>
            <a href="#" class="category-pill" data-category="교육">교육</a>
            <a href="#" class="category-pill" data-category="여행">여행</a>
        </div>

        <div class="row justify-content-center">

            <div th:if="${#lists.isEmpty(bestSellerBook)}" class="col-12 text-center py-5">
                <i class="fas fa-book-open fa-3x text-secondary mb-3"></i>
                <p class="text-gray-600 font-weight-bold mb-0">도서가 없습니다.</p>
            </div>

            <div th:unless="${#lists.isEmpty(bestSellerBook)}" th:each="book : ${bestSellerBook}" class="book-card-wrapper">
                <div class="card book-card">
                    <div class="card-img-wrapper">
                        <button type="button"
                                class="btn-heart"
                                th:attr="data-book-id=${book.id()}"
                                onclick="toggleLike(event, this)">
                            <i class="fa-heart" th:classappend="${book.liked() ? 'fas' : 'far'}"></i>
                        </button>

                        <a th:href="@{/books/{bookId}(bookId=${book.id()})}" style="text-decoration: none; color: inherit;">
                            <img class="card-img-top" th:src="${book.imageUrl()}" th:alt="${book.title()}">
                        </a>
                    </div>

                    <div class="card-body">

                        <a th:href="@{/books/{bookId}(bookId=${book.id()})}" style="text-decoration: none; color: inherit;">
                            <h5 class="card-title mb-1" th:text="${book.title()}">책제목</h5>
                        </a>

                        <p class="text-muted small mb-2"
                           th:text="${#lists.isEmpty(book.authorNames)
                                     ? '저자 정보 없음'
                                     : #strings.listJoin(book.authorNames, ', ')}">
                            저자
                        </p>

                        <div class="mb-3">
                            <span th:if="${book.priceStandard() > book.priceSales()}"
                                  class="price-current"
                                  th:text="${#numbers.formatDecimal(book.priceSales(), 0, 'COMMA', 0, 'POINT') + '원'}">현재가격</span>

                            <span th:if="${book.priceStandard() > book.priceSales()}"
                                  class="price-original"
                                  th:text="${#numbers.formatDecimal(book.priceStandard(), 0, 'COMMA', 0, 'POINT') + '원'}">정가</span>

                            <span th:if="${book.priceStandard() <= book.priceSales()}"
                                  class="price-original-no-discount"
                                  th:text="${#numbers.formatDecimal(book.priceStandard(), 0, 'COMMA', 0, 'POINT') + '원'}">정가</span>

                            <span class="badge bg-danger"
                                  th:text="${book.priceStandard() == 0 ? '' :
                                  #numbers.formatDecimal(
                                    (book.priceStandard() - book.priceSales()) * 100 / book.priceStandard(),
                                    0, 'COMMA', 0, 'POINT'
                                  ) + '%'}">
                            </span>
                        </div>

                        <form th:action="@{/cart/add}" method="post" class="mt-auto">
                            <input type="hidden" name="bookId" th:value="${book.id}">
                            <button class="btn btn-primary btn-block"
                                    th:onclick="|addToCartAndConfirmMove('${book.id}', '1'); return false;|">
                                <i class="fas fa-shopping-cart mr-1"></i> 장바구니 담기
                            </button>
                        </form>

                        <form th:action="@{/orders/checkout-temp}" method="post">
                            <input type="hidden" name="bookId" th:value="${book.id()}">
                            <input type="hidden" name="quantity" value="1">
                            <button type="submit" class="btn btn-secondary btn-block">
                                바로 구매
                            </button>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    // 페이지별 이벤트 리스너 추가 (필요시)
    function initPageScripts() {
        // 여기에 페이지 로드 후 실행할 추가적인 JavaScript 코드를 넣을 수 있습니다.
    }
</script>
</body>
</html>
