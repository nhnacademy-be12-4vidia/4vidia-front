<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<body>

<div layout:fragment="content" class="container mt-5">

    <h3 class="mb-4">비밀번호 변경</h3>

    <!-- API/비즈니스 에러 메시지 (model.addAttribute("errorMessage", "...")로 내려오는 값) -->
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <!-- ✅ 폼 바인딩을 위해 th:object 추가 -->
    <form th:action="@{/mypage/profile/password}"
          th:object="${changePasswordRequest}"
          method="post">
        <input type="hidden" name="_method" value="put">

        <div class="form-group mb-3">
            <label>현재 비밀번호</label>
            <!-- ✅ name 대신 th:field 사용 -->
            <input type="password" th:field="*{currentPassword}" class="form-control" required/>
            <!-- ✅ Validation 에러(예: @NotBlank) 표시 -->
            <small class="text-danger" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></small>
        </div>

        <div class="form-group mb-3">
            <label>수정할 비밀번호</label>
            <input type="password" th:field="*{newPassword}" class="form-control" required/>
            <small class="text-danger" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></small>
        </div>

        <div class="form-group mb-4">
            <label>수정할 비밀번호 확인</label>
            <input type="password" th:field="*{confirmPassword}" class="form-control" required/>
            <small class="text-danger" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></small>
        </div>

        <button type="submit" class="btn btn-primary">변경하기</button>
        <a class="btn btn-secondary" th:href="@{/mypage/profile}">마이페이지로 돌아가기</a>
    </form>

</div>

</body>
</html>
