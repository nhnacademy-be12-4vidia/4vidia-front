<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/admin-layout}">
<head>
    <meta charset="UTF-8">
    <title>도서 쿠폰 정책 생성</title>

    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">

    <style>
        .result-card {
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .result-card:hover {
            background: #f8f9ff;
            border-color: #4e73df;
        }
    </style>
</head>

<body>
<div layout:fragment="pageContent">

    <h1 class="h3 mb-4">도서 쿠폰 정책 생성</h1>

    <!-- 검색 -->
    <div class="row mb-3">
        <div class="col-md-9">
            <input id="keyword" class="form-control" placeholder="도서 제목 검색">
        </div>
        <div class="col-md-3">
            <button class="btn btn-primary w-100" onclick="searchBook()">검색</button>
        </div>
    </div>

    <!-- 검색 결과 -->
    <div id="searchResult"></div>

</div>
<th:block layout:fragment="pageScript">
    <script>
        function searchBook() {
            const keyword = document.getElementById("keyword").value;

            if (!keyword.trim()) {
                alert("검색어를 입력하세요.");
                return;
            }

            fetch(`/admin/books/search-simple?keyword=${encodeURIComponent(keyword)}`)
                .then(res => res.json())
                .then(renderSearchResult)
                .catch(() => alert("검색 실패"));

        }

        function renderSearchResult(list) {
            const result = document.getElementById("searchResult");
            result.innerHTML = "";

            if (!list || list.length === 0) {
                result.innerHTML = "<p class='text-muted'>검색 결과가 없습니다.</p>";
                return;
            }

            list.forEach(book => {
                const card = document.createElement("div");
                card.className = "result-card";
                card.innerHTML = `
                    <strong>${book.title}</strong><br>
                    <span class="text-muted">ISBN: ${book.isbn}</span><br>
                    <span class="text-muted">BOOK ID: ${book.id}</span>
                `;

                card.onclick = () => {
                    location.href = `/admin/coupons/policies/book/create?bookId=${book.id}`;
                };

                result.appendChild(card);
            });
        }
    </script>
</th:block>
</body>
</html>
