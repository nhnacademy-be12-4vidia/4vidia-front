<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/admin-layout}">

<head>
    <meta charset="UTF-8">
    <title>쿠폰 정책 관리</title>

    <style>
        .panel-title {
            font-weight: 700;
            margin-bottom: 10px;
        }
        .mini-table td, .mini-table th {
            padding: 8px;
            font-size: 0.9rem;
        }
        .sticky-panel {
            position: sticky;
            top: 16px;
        }
        .truncate {
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: inline-block;
            vertical-align: bottom;
        }
    </style>
</head>

<body>
<div layout:fragment="pageContent">

    <div class="mb-3">
        <h1 class="h3 text-gray-800">쿠폰 정책 관리</h1>
    </div>
    <!-- =========================
         정책 리스트
    ========================== -->
    <div class="row">
        <div class="col-lg-12">

            <!-- 검색 -->
            <form method="get" th:action="@{/admin/coupons/policies}"
                  class="card card-body mb-3">
                <div class="row g-2 align-items-end">

                    <div class="col-md-3">
                        <label class="form-label">정책명</label>
                        <input type="text" name="keyword"
                               class="form-control"
                               th:value="${keyword}">
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">상태</label>
                        <select name="status" class="form-select">
                            <option value="ALL" th:selected="${status == 'ALL'}">전체</option>
                            <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">활성</option>
                            <option value="INACTIVE" th:selected="${status == 'INACTIVE'}">비활성</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">대상</label>
                        <select name="targetType" class="form-select">
                            <option value="ALL" th:selected="${targetType == 'ALL'}">전체</option>
                            <option value="CATEGORY" th:selected="${targetType == 'CATEGORY'}">카테고리</option>
                            <option value="BOOK" th:selected="${targetType == 'BOOK'}">도서</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">페이지 크기</label>
                        <select name="size" class="form-select">
                            <option value="10" th:selected="${size == 10}">10</option>
                            <option value="20" th:selected="${size == 20}">20</option>
                            <option value="50" th:selected="${size == 50}">50</option>
                        </select>
                    </div>

                    <input type="hidden" name="page" value="0">
                    <input type="hidden" name="userId" th:value="${userId}">

                    <div class="col-md-3">
                        <button class="btn btn-dark w-100">검색</button>
                    </div>
                </div>
            </form>

            <!-- 정책 리스트 -->
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle text-center">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>정책명</th>
                        <th>정책대상</th> <!-- ✅ 추가 -->
                        <th>할인</th>
                        <th>대상</th>
                        <th>유효기간</th>
                        <th>발급현황</th>
                        <th>상태</th>
                        <th>관리</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${policies}"
                        th:attr="data-policy-id=${p.policyId}, data-policy-type=${p.policyType}">
                        <td th:text="${p.policyId}"></td>
                        <td th:text="${p.policyName}"></td>

                        <!-- ✅ 정책대상 출력 -->
                        <td>
                            <span class="badge bg-info"
                                  th:text="${p.policyType}">
                            </span>
                        </td>

                        <td>
                            <span th:if="${p.discountType == 'PRICE'}"
                                  th:text="${p.discountValue} + '원'"></span>
                            <span th:if="${p.discountType == 'RATE'}"
                                  th:text="${p.discountValue} + '% (최대 ' + ${p.maxDiscountAmount} + '원)'"></span>
                        </td>
                        <td th:text="${p.discountTargetType}"></td>
                        <td>
                            <span th:if="${p.validityType == 'RELATIVE'}"
                                  th:text="'발급 후 ' + ${p.validDays} + '일'"></span>
                            <span th:if="${p.validityType == 'ABSOLUTE'}"
                                  th:text="${#temporals.format(p.startDate,'yyyy-MM-dd')}
                                       + ' ~ ' +
                                       ${#temporals.format(p.endDate,'yyyy-MM-dd')}"></span>
                        </td>
                        <td th:text="${p.issueStatus}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${p.isActivation} ? 'bg-primary' : 'bg-secondary'"
                                  th:text="${p.isActivation} ? 'ACTIVE' : 'INACTIVE'"></span>
                        </td>
                        <td>
                            <form th:action="@{'/admin/coupons/policies/' + ${p.policyId} + '/toggle'}"
                                  method="post">
                                <input type="hidden" name="_method" value="patch">
                                <input type="hidden" name="userId" th:value="${userId}">
                                <input type="hidden" name="keyword" th:value="${keyword}">
                                <input type="hidden" name="status" th:value="${status}">
                                <input type="hidden" name="targetType" th:value="${targetType}">
                                <input type="hidden" name="page" th:value="${page.number}">
                                <input type="hidden" name="size" th:value="${size}">
                                <button type="submit"
                                        class="btn btn-sm"
                                        th:classappend="${p.isActivation} ? 'btn-danger' : 'btn-success'"
                                        th:text="${p.isActivation} ? '비활성화' : '활성화'">
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>


            <!-- 페이지네이션 -->
            <nav th:if="${page.totalPages > 1}" aria-label="Page navigation">
                <ul class="pagination justify-content-center mt-3">

                    <!-- 이전 -->
                    <li class="page-item"
                        th:classappend="${page.first} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/coupons/policies(
                    page=${page.number - 1},
                    size=${size},
                    keyword=${keyword},
                    status=${status},
                    targetType=${targetType},
                    userId=${userId}
               )}">
                            이전
                        </a>
                    </li>

                    <!-- 페이지 번호 -->
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                        th:classappend="${i == page.number} ? 'active'">
                        <a class="page-link"
                           th:text="${i + 1}"
                           th:href="@{/admin/coupons/policies(
                    page=${i},
                    size=${size},
                    keyword=${keyword},
                    status=${status},
                    targetType=${targetType},
                    userId=${userId}
               )}">
                        </a>
                    </li>

                    <!-- 다음 -->
                    <li class="page-item"
                        th:classappend="${page.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/coupons/policies(
                    page=${page.number + 1},
                    size=${size},
                    keyword=${keyword},
                    status=${status},
                    targetType=${targetType},
                    userId=${userId}
               )}">
                            다음
                        </a>
                    </li>

                </ul>
            </nav>



        </div>
    </div>

</div>
</body>
</html>
