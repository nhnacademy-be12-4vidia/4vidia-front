<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>포인트 내역</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* ===== Layout / Card ===== */
        .point-card {
            border-radius: 16px;
            padding: 28px;
        }

        .remain-box {
            background: #2D64F6;
            color: #fff;
        }

        .expire-box {
            background: #FFF8E8;
            border: 2px solid #F7A93B;
            color: #E38912;
        }

        .benefit-card {
            background: #F6F8FA;
            border-radius: 14px;
            padding: 18px;
        }

        .remain-label {
            opacity: 0.8;
            margin-top: 4px;
        }

        /* ===== History List ===== */
        .history-item {
            border-bottom: 1px solid #EEE;
            padding: 20px 5px;
        }
        .history-item:last-child {
            margin-bottom: 24px;
        }


        .text-plus {
            color: #05944F;
            font-weight: 600;
        }

        .text-minus {
            color: #CC2B2B;
            font-weight: 600;
        }

        .text-zero {
            color: #343193;
            font-weight: 600;
        }

        /* ===== Expire Tag ===== */
        .expire-tag {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 10px;
            background-color: #f1f3f5;
            color: #666;
            display: inline-flex;
            align-items: center;
            margin-top: 6px;
        }

        /* (옵션) 만료 임박 강조용 */
        .expire-warning {
            color: #E38912;
            background-color: #FFF8E8;
            font-weight: 500;
        }
    </style>

</head>

<body>
<div layout:fragment="content">
    <div class="container mt-5 page-wrap" style="max-width: 900px;">

        <div class="row g-3">
            <div class="col-md-8">
                <div class="point-card remain-box">
                    <div class="fw-semibold">보유 포인트</div>
                    <div class="display-6 fw-bold" th:text="${remain != null ? remain : 0} + 'P'"></div>
                    <div class="remain-label">사용 가능한 포인트</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="point-card expire-box">
                    <div class="fw-semibold">소멸 예정 포인트</div>
                    <div class="display-6 fw-bold"
                         th:text="${expireSoon != null ? expireSoon.expirePoint : 0} + 'P'"></div>
                    <div class="small"> ~ 7일 기준</div>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <h5 class="fw-bold mb-3">포인트 혜택</h5>
            <div class="d-flex gap-3 flex-wrap">
                <div class="benefit-card flex-fill text-center">
                    <div class="fw-bold">🛒 구매 적립</div>
                    <div class="small text-muted mt-1">도서 구매금액의 최대 5% 적립</div>
                </div>
                <div class="benefit-card flex-fill text-center">
                    <div class="fw-bold">⭐ 리뷰 적립</div>
                    <div class="small text-muted mt-1">리뷰 작성 시 최대 1000P 적립</div>
                </div>
                <div class="benefit-card flex-fill text-center">
                    <div class="fw-bold">🎁 이벤트</div>
                    <div class="small text-muted mt-1">다양한 이벤트 추가 적립</div>
                </div>
            </div>
        </div>

        <div class="mt-5">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-0">포인트 내역</h5>
                <!-- 기간 검색 폼 (GET) -->
                <form class="d-flex align-items-center gap-2 flex-wrap filter-form filter-row"
                      th:action="@{/mypage/point}" method="get">


                <!-- 현재 카테고리 유지 -->
                    <input type="hidden" name="category" th:value="${category != null ? category : 'ALL'}"/>

                    <input type="date" class="form-control form-control-sm"
                           name="from" th:value="${from}" style="width: 140px;"
                           max="9999-12-31">
                    <span class="small text-muted">~</span>
                    <input type="date" class="form-control form-control-sm"
                           name="to" th:value="${to}" style="width: 140px;"
                           max="9999-12-31">

                    <button type="submit" class="btn btn-sm btn-primary">조회</button>

                    <!-- 초기화 -->
                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/mypage/point(category=${category != null ? category : 'ALL'})}">
                        초기화
                    </a>
                </form>


                <div class="btn-group btn-group-sm" role="group">
                    <a class="btn"
                       th:classappend="${category == null or category == 'ALL'} ? ' btn-primary' : ' btn-outline-primary'"
                       th:href="@{/mypage/point(category='ALL', from=${from}, to=${to})}">전체</a>
                    <a class="btn"
                       th:classappend="${category == 'EARN'} ? ' btn-primary' : ' btn-outline-primary'"
                       th:href="@{/mypage/point(category='EARN', from=${from}, to=${to})}">적립</a>
                    <a class="btn"
                       th:classappend="${category == 'USE'} ? 'btn-primary' : 'btn-outline-primary'"
                       th:href="@{/mypage/point(category='USE',  from=${from}, to=${to})}">사용</a>
                </div>
            </div>

            <div th:if="${historyPage == null or historyPage.content.isEmpty()}" class="text-center text-muted py-5">
                포인트 내역이 없습니다.
            </div>

            <th:block th:if="${historyPage != null}">
                <div th:each="history : ${historyPage.content}" class="history-item">
                    <div class="d-flex justify-content-between align-items-start">
                        <div class="history-left">
                            <div class="fw-semibold d-flex align-items-center gap-2 history-title">

                            <span th:if="${history.policyName != null}" th:text="${history.policyName} + ' 적립'"></span>
                                <span th:unless="${history.policyName != null}" th:text="${history.reason}"></span>
                            </div>

                            <div class="text-muted mt-1" style="font-size: 0.85rem;"
                                 th:text="${#temporals.format(history.createdAt, 'yyyy-MM-dd HH:mm')}">
                            </div>
                        </div>

                        <div class="text-end">
                            <div th:if="${history.price > 0}" class="text-plus"
                                 th:text="'+' + ${history.price} + 'P'"></div>
                            <div th:if="${history.price < 0}" class="text-minus"
                                 th:text="${history.price} + 'P'"></div>

                            <div th:if="${history.expiredDate != null and history.price > 0}"
                                 class="expire-tag">
                                <span th:text="|${#temporals.format(history.expiredDate, 'yyyy-MM-dd')} 까지 사용 가능|"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </th:block>

        </div>

        <div class="d-flex justify-content-center pager-wrap"
             th:if="${historyPage != null and historyPage.totalPages > 1}">

        <nav>
                <ul class="pagination">
                    <li class="page-item" th:classappend="${historyPage.first} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/mypage/point(page=${historyPage.number - 1}, category=${category}, from=${from}, to=${to})}">
                            &laquo;
                        </a>

                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, historyPage.totalPages - 1)}"
                        th:classappend="${historyPage.number == i} ? 'active'">
                        <a class="page-link"
                           th:href="@{/mypage/point(page=${i}, category=${category}, from=${from}, to=${to})}"
                           th:text="${i + 1}">
                        </a>

                    </li>
                    <li class="page-item" th:classappend="${historyPage.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/mypage/point(page=${historyPage.number + 1}, category=${category}, from=${from}, to=${to})}">
                            &raquo;
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

    </div>
</div>
</body>
</html>
