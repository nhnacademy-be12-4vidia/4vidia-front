<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <!-- ✅ 모바일에서 작게 보이는 문제 해결 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>비밀번호 찾기</title>

    <!-- 파비콘 설정 -->
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">

    <style>
        /* ===== 공통 배경 ===== */
        body.light-bg {
            background-color: #f8fafc;
            min-height: 100vh;
        }

        /* ===== 카드 ===== */
        .card {
            background-color: #f8fafc;
            border: none !important;
            border-radius: 14px;
        }

        /* 그림자 제거 (로그인 페이지랑 통일) */
        .shadow-lg { box-shadow: none !important; }

        /* ===== 카드 내부 ===== */
        .card-body { padding: 3rem !important; }

        /* ===== 제목 ===== */
        h2.h3 {
            font-weight: 800;
            color: #1f2937;
        }

        /* ===== 라벨 ===== */
        .form-group label {
            font-size: 0.8rem;
            font-weight: 800;
            color: #6e707e;
        }

        /* ===== 입력 ===== */
        .form-control-user {
            height: 46px;
            border-radius: 0.6rem !important;
            font-size: 0.95rem;
        }

        /* ===== 버튼 공통 ===== */
        .btn-user {
            height: 46px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        /* ===== primary 버튼 (로그인과 동일) ===== */
        .btn-primary {
            background-color: #49689b !important;
            border-color: #49689b !important;
        }
        .btn-primary:hover {
            background-color: #324463 !important;
            border-color: #324463 !important;
        }

        /* ===== 하단 링크 ===== */
        .small a, .d-flex a {
            font-size: 0.85rem;
            font-weight: 700;
            color: #6e707e;
            text-decoration: none;
        }
        .small a:hover, .d-flex a:hover {
            color: #49689b;
            text-decoration: underline;
        }

        /* ✅ 모바일에서 더 크게 보이게 (로그인 페이지 느낌) */
        @media (max-width: 576px) {
            .card-body { padding: 2rem 1.5rem !important; }
            h2.h3 { font-size: 1.6rem; }

            .form-control-user {
                height: 52px;
                font-size: 1rem;
            }
            .btn-user {
                height: 52px;
                font-size: 1rem;
            }
        }
    </style>
</head>

<body class="light-bg">

<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100 py-4">
        <!-- ✅ 로그인 페이지랑 통일된 폭 -->
        <div class="col-lg-6 col-md-8 col-12">

            <div class="card shadow-lg border-0">
                <div class="card-body p-5">

                    <h2 class="h3 text-center text-gray-900 mb-4 fw-bold">
                        비밀번호 찾기
                    </h2>

                    <form method="post" th:action="@{/auth/find-password}">

                        <!-- 이메일 -->
                        <div class="form-group">
                            <label for="email" class="small font-weight-bold text-gray-700">이메일(아이디)</label>
                            <input type="email" id="email"
                                   class="form-control form-control-user"
                                   name="email" placeholder="example@domain.com"
                                   th:value="${email}"
                                   required>
                        </div>

                        <!-- 이름 -->
                        <div class="form-group">
                            <label for="name" class="small font-weight-bold text-gray-700">이름</label>
                            <input type="text" id="name"
                                   class="form-control form-control-user"
                                   name="name" placeholder="이름을 입력해주세요"
                                   th:value="${name}"
                                   required>
                        </div>

                        <!-- 전화번호 -->
                        <div class="form-group mb-4">
                            <label for="phone" class="small font-weight-bold text-gray-700">전화번호</label>
                            <input type="tel" id="phone"
                                   class="form-control form-control-user"
                                   name="phone" placeholder="예: 01012345678"
                                   pattern="01[016789][0-9]{7,8}"
                                   title="숫자만 입력해주세요. 예: 01012345678"
                                   th:value="${phone}"
                                   required>
                        </div>

                        <button type="submit" class="btn btn-primary btn-user btn-block">
                            임시 비밀번호 발급
                        </button>

                        <hr>

                        <div class="d-flex justify-content-between small">
                            <a th:href="@{/auth/login}">로그인으로</a>
                            <a th:href="@{/auth/find-id}">아이디 찾기</a>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script th:if="${success}">
    alert("[[${success}]]");
    window.location.href = "/auth/login";
</script>

<script th:if="${error}">
    alert("[[${error}]]");
</script>

</body>
</html>
