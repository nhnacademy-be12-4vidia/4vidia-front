<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>내 정보</title>
</head>

<body>
<div layout:fragment="content">

    <div class="fixed-container" style="width: 600px; margin: 0 auto;">
        <h2 class="mt-4 mb-4 text-primary fw-bold">내 정보</h2>

        <div class="card shadow-sm">
            <div class="card-body">

                <form method="post" th:action="@{/mypage/profile/edit}" th:object="${request}">
                    <input type="hidden" name="_method" value="patch">
                    <table class="table table-bordered mb-4">
                        <tbody>
                        <tr>
                            <th class="bg-light" style="width: 200px;">아이디</th>
                            <td th:text="${user.email}"></td>
                        </tr>
                        <tr>
                            <th class="bg-light" style="width: 200px;">별칭</th>
                            <td>
                                <input type="text" class="form-control"
                                       th:field="*{name}"
                                       placeholder="사용할 별칭 입력"
                                       required>
                                <div class="text-danger small mt-1" th:errors="*{name}"></div>
                            </td>
                        </tr>

                        <tr>
                            <th class="bg-light" style="width: 200px;">전화번호</th>
                            <td>
                                <input type="tel" class="form-control"
                                       th:field="*{phone}"
                                       placeholder="예: 010-1234-5678"
                                       minlength="8"
                                       maxlength="13"
                                       pattern="[0-9]{2,3}[\- ]?[0-9]{3,4}[\- ]?[0-9]{4}"
                                       required>
                                <div class="text-danger small mt-1" th:errors="*{phone}"></div>
                            </td>
                        </tr>

                        <tr>
                            <th class="bg-light" style="width: 200px;">생년월일</th>
                            <td th:text="${user.birthDate}"></td>
                        </tr>

                        <tr>
                            <th class="bg-light" style="width: 200px;">포인트</th>
                            <td th:text="${#numbers.formatDecimal(user.point(), 0, 'COMMA', 0, 'POINT')} + ' P'"></td>
                        </tr>

                        <tr>
                            <th class="bg-light" style="width: 200px;">등급</th>
                            <td th:text="${user.gradeName}"></td>
                        </tr>

                        <tr>
                            <th class="bg-light" style="width: 200px;">기본주소</th>
                            <td>
                                <th:block th:if="${user.defaultAddress() != null}">
                                    <div class="mb-1">
                                        **별칭:** <span th:text="${user.defaultAddress().alias()}"></span>
                                    </div>
                                    <div>
                                        **주소:** <span th:text="|(${user.defaultAddress().zipCode()}) ${user.defaultAddress().roadAddress()} ${user.defaultAddress().addressDetail()}|"></span>
                                    </div>
                                </th:block>

                                <th:block th:unless="${user.defaultAddress() != null}">
                                    <span class="text-muted">설정된 기본 주소가 없습니다.</span>
                                </th:block>
                            </td>
                        </tr>


                        </tbody>
                    </table>
                    <div class="d-flex justify-content-between">
                        <button type="submit" class="btn btn-primary">회원정보 수정</button>
                        <a class="btn btn-secondary" th:href="@{/mypage/profile/password}">비밀번호 변경</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
