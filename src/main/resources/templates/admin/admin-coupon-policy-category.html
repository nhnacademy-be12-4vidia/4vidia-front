<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/admin-layout}">
<head>
    <meta charset="UTF-8">
    <title>카테고리 쿠폰 정책 생성</title>

    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">

    <style>
        .hidden { display: none !important; }
    </style>
</head>

<body>

<div layout:fragment="pageContent">
    <h1 class="h3 mb-4">카테고리 쿠폰 정책 생성</h1>

    <form th:action="@{/admin/coupons/policies/category}" method="post" class="row g-3">

        <!-- 정책명 -->
        <div class="col-md-6">
            <label>정책명</label>
            <input type="text" name="policyName" class="form-control" required>
        </div>

        <!-- 정책 타입 -->
        <div class="col-md-3">
            <label>정책 타입</label>
            <select name="policyType" class="form-select" id="policyType">
                <option value="WELCOME">WELCOME</option>
                <option value="BIRTHDAY">BIRTHDAY</option>
                <option value="EVENT">EVENT</option>
            </select>
        </div>

        <!-- 할인 타입 -->
        <div class="col-md-3">
            <label>할인 타입</label>
            <select name="discountType" class="form-select" id="discountType">
                <option value="PRICE">PRICE</option>
                <option value="RATE">RATE</option>
            </select>
        </div>

        <!-- 할인값 -->
        <div class="col-md-3">
            <label id="discountValueLabel">할인 금액</label>
            <input type="number" name="discountValue" class="form-control" id="discountValue" required>
        </div>

        <!-- 한정 수량 -->
        <div class="col-md-3" id="limitedBox">
            <label>한정 수량</label>
            <input type="number"
                   name="limitedQuantity"
                   id="limitedQuantity"
                   class="form-control"
                   min="1">
        </div>

        <div class="col-md-3 hidden" id="unlimitedBox">
            <label>&nbsp;</label>
            <div class="form-check mt-2">
                <input class="form-check-input"
                       type="checkbox"
                       id="unlimitedCheck">
                <label class="form-check-label">
                    재고 무제한
                </label>
            </div>
        </div>


        <!-- RATE 전용 -->
        <div id="rateBox" class="row hidden">
            <div class="col-md-3">
                <label>최소 주문 금액</label>
                <input type="number" name="minOrderAmount" class="form-control" id="minOrderAmount">
            </div>
            <div class="col-md-3">
                <label>최대 할인 금액</label>
                <input type="number" name="maxDiscountAmount" class="form-control" id="maxDiscountAmount">
            </div>
        </div>

        <!-- 대상 선택 -->
        <div class="col-12">
            <label>대상 선택</label>
            <select name="discountTargetType" class="form-select" id="targetType">
                <option value="ALL">전체 적용</option>
                <option value="CATEGORY">카테고리 선택</option>
            </select>
        </div>

        <!-- 카테고리 -->
        <div class="col-12 hidden" id="categoryBox">
            <label>카테고리</label>
            <select name="categoryKdcId" class="form-select">
                <option value="">선택</option>
                <option value="0">총류</option>
                <option value="1">철학</option>
                <option value="2">종교</option>
                <option value="3">사회과학</option>
                <option value="4">자연과학</option>
                <option value="5">기술과학</option>
                <option value="6">예술</option>
                <option value="7">언어</option>
                <option value="8">문학</option>
                <option value="9">역사</option>
            </select>
        </div>

        <!-- 유효기간 타입 -->
        <div class="col-md-3">
            <label>유효기간 타입</label>
            <select name="validityType" class="form-select" id="validityType">
                <option value="RELATIVE">RELATIVE</option>
                <option value="ABSOLUTE">ABSOLUTE</option>
            </select>
        </div>

        <!-- RELATIVE -->
        <div class="col-md-3" id="relativeBox">
            <label>유효기간(일)</label>
            <input type="number" name="validDays" class="form-control" id="validDays">
        </div>

        <!-- ABSOLUTE -->
        <div class="col-md-3 hidden" id="absoluteStart">
            <label>시작일</label>
            <input type="date" name="startDate" class="form-control">
        </div>

        <div class="col-md-3 hidden" id="absoluteEnd">
            <label>종료일</label>
            <input type="date" name="endDate" class="form-control">
        </div>

        <div class="col-12 text-end mt-4">
            <button class="btn btn-primary" id="submitBtn">정책 생성</button>
        </div>
    </form>
</div>

<th:block layout:fragment="pageScript">
<script>
    const policyType = document.getElementById('policyType');
    const limitedQty = document.getElementById('limitedQuantity');

    const discountType = document.getElementById('discountType');
    const discountValue = document.getElementById('discountValue');
    const discountLabel = document.getElementById('discountValueLabel');
    const rateBox = document.getElementById('rateBox');
    const minOrder = document.getElementById('minOrderAmount');
    const maxDiscount = document.getElementById('maxDiscountAmount');

    const targetType = document.getElementById('targetType');
    const categoryBox = document.getElementById('categoryBox');

    const validityType = document.getElementById('validityType');
    const relativeBox = document.getElementById('relativeBox');
    const absoluteStart = document.getElementById('absoluteStart');
    const absoluteEnd = document.getElementById('absoluteEnd');
    const validDays = document.getElementById('validDays');

    const submitBtn = document.getElementById('submitBtn');

    /* 정책 타입 */
    function handlePolicyType() {
        if (policyType.value === 'WELCOME' || policyType.value === 'BIRTHDAY') {
            limitedQty.value = 0;
            limitedQty.disabled = true;
        } else {
            limitedQty.disabled = false;
        }
    }

    /* 할인 타입 */
    function handleDiscountType() {
        if (discountType.value === 'RATE') {
            discountLabel.innerText = '할인율 (%)';
            discountValue.min = 1;
            discountValue.max = 100;
            rateBox.classList.remove('hidden');
        } else {
            discountLabel.innerText = '할인 금액';
            discountValue.removeAttribute('min');
            discountValue.removeAttribute('max');
            rateBox.classList.add('hidden');
            minOrder.value = '';
            maxDiscount.value = '';
        }
    }

    /* 대상 */
    function handleTargetType() {
        categoryBox.classList.toggle('hidden', targetType.value !== 'CATEGORY');
    }

    /* 유효기간 */
    function handleValidityType() {
        const isRel = validityType.value === 'RELATIVE';
        relativeBox.classList.toggle('hidden', !isRel);
        absoluteStart.classList.toggle('hidden', isRel);
        absoluteEnd.classList.toggle('hidden', isRel);

        validDays.disabled = !isRel;
    }

    /* 최종 검증 */
    function validateForm() {
        let valid = true;

        if (discountType.value === 'RATE') {
            if (!minOrder.value || !maxDiscount.value) valid = false;
        }

        if (targetType.value === 'CATEGORY') {
            const cat = document.querySelector('select[name="categoryKdcId"]').value;
            if (!cat) valid = false;
        }

        submitBtn.disabled = !valid;
    }

    /* 이벤트 바인딩 */
    policyType.addEventListener('change', handlePolicyType);
    discountType.addEventListener('change', handleDiscountType);
    targetType.addEventListener('change', handleTargetType);
    validityType.addEventListener('change', handleValidityType);

    document.querySelectorAll('input, select').forEach(el => {
        el.addEventListener('input', validateForm);
        el.addEventListener('change', validateForm);
    });

    /* 초기 실행 */
    handlePolicyType();
    handleDiscountType();
    handleTargetType();
    handleValidityType();
    validateForm();

    const limitedInput = document.getElementById("limitedQuantity");
    const unlimitedBox = document.getElementById("unlimitedBox");
    const unlimitedCheck = document.getElementById("unlimitedCheck");

    function updateUnlimitedUI() {
        const isEvent = policyType.value === "EVENT";

        unlimitedBox.classList.toggle("hidden", !isEvent);

        if (!isEvent) {
            // EVENT 아니면 무조건 null
            limitedInput.value = "";
            limitedInput.disabled = true;
            limitedInput.required = false;
            unlimitedCheck.checked = false;
        }
    }

    policyType.addEventListener("change", updateUnlimitedUI);

    unlimitedCheck.addEventListener("change", () => {
        if (unlimitedCheck.checked) {
            limitedInput.value = "";
            limitedInput.disabled = true;
            limitedInput.required = false;
        } else {
            limitedInput.disabled = false;
            limitedInput.required = true;
        }
    });

    // 초기 로딩 시
    updateUnlimitedUI();
</script>
</th:block>
</body>
</html>
