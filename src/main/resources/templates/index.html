<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Test Page</title>
</head>
<body>
<h1>Test API Call</h1>

<form action="/test" method="get">

</form>

    <pre th:text="${testResponse.test}"></pre>
</div>

</body>
</html>
