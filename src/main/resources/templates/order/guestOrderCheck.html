<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout.html}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비회원 주문조회</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script type="module">
        import { createIcons, ArrowLeft, Package, Search, Truck, CheckCircle, MapPin, CreditCard, ChevronDown, ChevronUp, Loader2 } from 'https://cdn.skypack.dev/lucide@0.312.0';
        window.lucide = { createIcons, ArrowLeft, Package, Search, Truck, CheckCircle, MapPin, CreditCard, ChevronDown, ChevronUp, Loader2 };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
        }
        h1 {
            font-size: 1.875rem; /* text-3xl */
            font-weight: 700; /* font-bold */
            color: #1f2937; /* text-gray-900 */
        }
        h2 {
            font-size: 1.5rem; /* text-2xl */
            font-weight: 600; /* font-semibold */
            color: #1f2937; /* text-gray-900 */
        }
        h3 {
            font-size: 1.125rem; /* text-lg */
            font-weight: 600; /* font-semibold */
            color: #1f2937; /* text-gray-900 */
        }
        /* Hide the radio button visually but keep it focusable */
        input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            width: 1rem;
            height: 1rem;
            border: 2px solid #d1d5db; /* border-gray-300 */
            border-radius: 50%;
            display: inline-block;
            position: relative;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease-in-out;
        }
        input[type="radio"]:checked {
            border-color: #3b82f6; /* border-blue-600 */
        }
        input[type="radio"]:checked::after {
            content: '';
            width: 0.5rem;
            height: 0.5rem;
            background-color: #3b82f6; /* bg-blue-600 */
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .animate-spin-slow {
            animation: spin 1.5s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="p-4 sm:p-8">
<div layout:fragment="content">

    <div id="app" class="max-w-4xl mx-auto">
        <!-- Content will be rendered here by JavaScript -->
    </div>

    <script>
        // --- DEMO DATA (SIMULATED DATABASE) ---
        const demoOrders = [
            {
                id: 'ORD-20250115-001',
                date: '2025-01-15 14:30',
                ordererName: '김철수',
                ordererEmail: 'kim@email.com',
                status: '배송중',
                items: [
                    {
                        id: 1,
                        title: '코스모스',
                        author: '칼 세이건',
                        price: 18000,
                        quantity: 1,
                        image: 'book1'
                    },
                    {
                        id: 2,
                        title: '총, 균, 쇠',
                        author: '제레드 다이아몬드',
                        price: 22000,
                        quantity: 1,
                        image: 'book2'
                    }
                ],
                totalAmount: 40000,
                shippingInfo: {
                    recipient: '김철수',
                    phone: '010-1234-5678',
                    address: '서울특별시 강남구 테헤란로 123',
                    detailAddress: '456호',
                    zipcode: '06234',
                    memo: '문앞에 놓아주세요'
                },
                paymentInfo: {
                    method: '신용카드',
                    amount: 40000,
                    status: '결제완료'
                },
                trackingNumber: '123456789012'
            },
            {
                id: 'ORD-20250110-002',
                date: '2025-01-10 10:15',
                ordererName: '이영희',
                ordererEmail: 'lee@email.com',
                status: '배송준비중',
                items: [
                    {
                        id: 3,
                        title: '사피엔스',
                        author: '유발 하라리',
                        price: 24000,
                        quantity: 1,
                        image: 'book3'
                    }
                ],
                totalAmount: 24000,
                shippingInfo: {
                    recipient: '이영희',
                    phone: '010-9876-5432',
                    address: '서울특별시 서초구 서초대로 234',
                    detailAddress: '7층',
                    zipcode: '06543'
                },
                paymentInfo: {
                    method: '무통장입금',
                    amount: 24000,
                    status: '입금대기'
                },
                trackingNumber: undefined
            }
        ];

        // --- STATE MANAGEMENT ---
        let state = {
            orderNumber: '',
            ordererInfo: '',
            searchType: 'email', // 'email' | 'name'
            searchedOrder: null,
            error: '',
            isLoading: false, // New state for loading
            expandedSections: {
                items: true,
                shipping: false,
                payment: false,
                tracking: false
            }
        };

        const setState = (newState) => {
            state = { ...state, ...newState };
            render();
        };

        // --- UTILITY FUNCTIONS ---

        // Format currency (Korean Won)
        const formatCurrency = (amount) => {
            return amount.toLocaleString('ko-KR') + '원';
        };

        // Get status color classes
        const getStatusColor = (status) => {
            switch (status) {
                case '배송준비중': return 'bg-yellow-100 text-yellow-700';
                case '배송중': return 'bg-blue-100 text-blue-700';
                case '배송완료': return 'bg-green-100 text-green-700';
                case '취소됨': return 'bg-red-100 text-red-700';
                default: return 'bg-gray-100 text-gray-700';
            }
        };

        // Get status icon name
        const getStatusIcon = (status) => {
            switch (status) {
                case '배송준비중': return 'Package';
                case '배송중': return 'Truck';
                case '배송완료': return 'CheckCircle';
                case '취소됨': return 'Package';
                default: return 'Package';
            }
        };

        // Helper to create an element with classes
        const createElement = (tag, classes = '', content = '') => {
            const el = document.createElement(tag);
            if (classes) {
                el.className = classes;
            }
            if (content) {
                el.innerHTML = content;
            }
            return el;
        };

        // Helper to insert Lucide icon
        const createIconElement = (name, classes = 'w-5 h-5') => {
            const IconComponent = window.lucide[name];
            if (!IconComponent) return createElement('div');

            const iconEl = createElement('div', classes);
            iconEl.innerHTML = IconComponent.markup;
            // Apply size/classes to the SVG element
            const svg = iconEl.querySelector('svg');
            if (svg) {
                svg.setAttribute('width', '100%');
                svg.setAttribute('height', '100%');
                svg.classList.add(...classes.split(' '));
            }
            return iconEl;
        };


        // --- ASYNC DATA SIMULATION (REPLACE WITH REAL FETCH) ---

        /**
         * 실제 API 호출을 시뮬레이션합니다.
         * 이 함수를 실제 백엔드 API 호출로 대체해야 합니다.
         * 예: fetch('/api/guest-order/check', { method: 'POST', body: JSON.stringify({ orderNumber, ordererInfo, searchType }) })
         */
        const findOrderInBackend = (orderNumber, ordererInfo, searchType) => {
            return new Promise(resolve => {
                // 네트워크 지연 1초 시뮬레이션
                setTimeout(() => {
                    const found = demoOrders.find(order => {
                        const orderMatch = order.id === orderNumber.trim();
                        const infoMatch = searchType === 'email'
                            ? order.ordererEmail === ordererInfo.trim()
                            : order.ordererName === ordererInfo.trim();
                        return orderMatch && infoMatch;
                    });
                    resolve(found);
                }, 1000);
            });
        };


        // --- EVENT HANDLERS ---

        const handleSearch = async (e) => {
            e.preventDefault();

            const { orderNumber, ordererInfo, searchType } = state;

            if (!orderNumber.trim() || !ordererInfo.trim()) {
                setState({ error: '주문번호와 주문자 정보를 모두 입력해주세요.', searchedOrder: null });
                return;
            }

            setState({ isLoading: true, error: '', searchedOrder: null });

            try {
                // 실제 API 호출 부분 (위의 findOrderInBackend 함수를 실제 fetch 호출로 대체)
                const foundOrder = await findOrderInBackend(orderNumber, ordererInfo, searchType);

                if (foundOrder) {
                    setState({ searchedOrder: foundOrder, error: '', isLoading: false });
                } else {
                    setState({ error: '주문 정보를 찾을 수 없습니다. 입력하신 정보를 다시 확인해주세요.', searchedOrder: null, isLoading: false });
                }
            } catch (err) {
                console.error('API Error:', err);
                setState({ error: '주문 조회 중 서버 오류가 발생했습니다. 다시 시도해 주세요.', searchedOrder: null, isLoading: false });
            }
        };

        window.toggleSection = (section) => {
            const newExpanded = { ...state.expandedSections, [section]: !state.expandedSections[section] };
            setState({ expandedSections: newExpanded });
        };

        // Placeholder for back button (since this is a standalone file, we just clear the results)
        window.onBack = () => {
            setState({
                orderNumber: '',
                ordererInfo: '',
                searchType: 'email',
                searchedOrder: null,
                error: '',
                isLoading: false,
                expandedSections: {
                    items: true,
                    shipping: false,
                    payment: false,
                    tracking: false
                }
            });
        };


        // --- RENDERING FUNCTIONS ---

        const renderForm = () => {
            const formContainer = createElement('div', 'bg-white rounded-lg shadow-sm p-6 mb-6');

            const form = createElement('form', 'space-y-5');
            form.onsubmit = handleSearch;

            // Order Number Input
            const orderNumberDiv = createElement('div');
            orderNumberDiv.innerHTML = `
                    <label class="block text-sm text-gray-700 mb-2">
                        주문번호 <span class="text-red-600">*</span>
                    </label>
                    <input
                        type="text"
                        id="orderNumberInput"
                        value="${state.orderNumber}"
                        placeholder="예: ORD-20250115-001"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        ${state.isLoading ? 'disabled' : ''}
                    />
                    <p class="text-xs text-gray-500 mt-1">
                        주문번호는 주문 완료 시 발송된 이메일에서 확인하실 수 있습니다.
                    </p>
                `;
            const orderNumberInput = orderNumberDiv.querySelector('#orderNumberInput');
            orderNumberInput.oninput = (e) => setState({ orderNumber: e.target.value });
            form.appendChild(orderNumberDiv);

            // Orderer Info Input (Type Selection)
            const ordererInfoDiv = createElement('div');
            ordererInfoDiv.innerHTML = `
                    <label class="block text-sm text-gray-700 mb-2">
                        조회 방법 <span class="text-red-600">*</span>
                    </label>
                    <div class="flex gap-4 mb-3">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input
                                type="radio"
                                name="searchType"
                                value="email"
                                ${state.searchType === 'email' ? 'checked' : ''}
                                class="w-4 h-4 text-blue-600"
                                onclick="setState({ searchType: 'email', ordererInfo: '' })"
                                ${state.isLoading ? 'disabled' : ''}
                            />
                            <span class="text-sm text-gray-700">이메일로 조회</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input
                                type="radio"
                                name="searchType"
                                value="name"
                                ${state.searchType === 'name' ? 'checked' : ''}
                                class="w-4 h-4 text-blue-600"
                                onclick="setState({ searchType: 'name', ordererInfo: '' })"
                                ${state.isLoading ? 'disabled' : ''}
                            />
                            <span class="text-sm text-gray-700">이름으로 조회</span>
                        </label>
                    </div>
                    <input
                        type="${state.searchType === 'email' ? 'email' : 'text'}"
                        id="ordererInfoInput"
                        value="${state.ordererInfo}"
                        placeholder="${state.searchType === 'email' ? '주문 시 입력한 이메일' : '주문자명'}"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        ${state.isLoading ? 'disabled' : ''}
                    />
                `;
            const ordererInfoInput = ordererInfoDiv.querySelector('#ordererInfoInput');
            ordererInfoInput.oninput = (e) => setState({ ordererInfo: e.target.value });
            form.appendChild(ordererInfoDiv);

            // Error Message
            if (state.error) {
                const errorDiv = createElement('div', 'p-4 bg-red-50 border border-red-200 rounded-lg');
                errorDiv.innerHTML = `<p class="text-sm text-red-700">${state.error}</p>`;
                form.appendChild(errorDiv);
            }

            // Submit Button
            const submitButton = createElement('button', `w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition-colors flex items-center justify-center gap-2 ${state.isLoading ? 'opacity-70 cursor-not-allowed' : ''}`);
            submitButton.type = 'submit';
            submitButton.disabled = state.isLoading;

            if (state.isLoading) {
                // Show loading spinner
                submitButton.appendChild(createIconElement('Loader2', 'w-5 h-5 animate-spin-slow'));
                submitButton.appendChild(document.createTextNode('조회 중...'));
            } else {
                // Show search icon
                submitButton.appendChild(createIconElement('Search', 'w-5 h-5'));
                submitButton.appendChild(document.createTextNode('주문 조회하기'));
            }
            form.appendChild(submitButton);

            formContainer.appendChild(form);

            // Demo Info
            formContainer.innerHTML += `
                    <div class="mt-6 p-4 bg-blue-50 border border-blue-200 rounded-lg">
                        <h3 class="text-sm text-blue-900 mb-2 font-semibold">테스트용 주문 정보</h3>
                        <div class="text-xs text-blue-700 space-y-1">
                            <div>• 주문번호: ORD-20250115-001 / 이메일: kim@email.com</div>
                            <div>• 주문번호: ORD-20250110-002 / 이메일: lee@email.com</div>
                        </div>
                    </div>
                `;
            return formContainer;
        };

        const renderOrderDetails = (order) => {
            const container = createElement('div', 'space-y-4');

            // --- Order Status Block ---
            const statusBlock = createElement('div', 'bg-white rounded-lg shadow-sm p-6');
            const statusColor = getStatusColor(order.status);
            const statusIcon = getStatusIcon(order.status);

            statusBlock.innerHTML = `
                    <div class="flex items-center justify-between flex-wrap gap-4">
                        <div>
                            <h2 class="text-gray-900 mb-2 text-xl font-semibold">주문 정보</h2>
                            <div class="text-sm text-gray-600">
                                ${order.date} | ${order.id}
                            </div>
                        </div>
                        <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full font-medium ${statusColor}">
                            ${createIconElement(statusIcon, 'w-5 h-5').outerHTML}
                            <span>${order.status}</span>
                        </div>
                    </div>
                `;
            container.appendChild(statusBlock);

            // --- Collapsible Sections ---

            // Helper to render collapsible header
            const renderCollapsibleHeader = (section, title, iconName) => {
                const isExpanded = state.expandedSections[section];
                const header = createElement('button', 'w-full p-4 flex items-center justify-between hover:bg-gray-50 transition-colors');
                header.onclick = () => window.toggleSection(section);
                header.innerHTML = `
                        <div class="flex items-center gap-2">
                            ${createIconElement(iconName, 'w-5 h-5 text-gray-600').outerHTML}
                            <h3 class="text-gray-900">${title}</h3>
                        </div>
                        ${createIconElement(isExpanded ? 'ChevronUp' : 'ChevronDown', 'w-5 h-5 text-gray-400').outerHTML}
                    `;
                return header;
            };

            // 1. Order Items Section
            const itemsSection = createElement('div', 'bg-white rounded-lg shadow-sm overflow-hidden');
            itemsSection.appendChild(renderCollapsibleHeader('items', `주문 상품 (${order.items.length})`, 'Package'));

            if (state.expandedSections.items) {
                const itemsContent = createElement('div', 'p-4 border-t');
                let itemsListHtml = '<div class="space-y-4">';

                order.items.forEach(item => {
                    itemsListHtml += `
                            <div class="flex gap-4 border-b pb-4 last:border-b-0 last:pb-0">
                                <div class="w-20 h-28 bg-gradient-to-br from-blue-400 to-purple-500 rounded flex-shrink-0 flex items-center justify-center text-white text-xs text-center p-1 font-semibold break-all">
                                    ${item.title}
                                </div>
                                <div class="flex-1">
                                    <div class="text-gray-900 font-medium mb-1">${item.title}</div>
                                    <div class="text-sm text-gray-600 mb-2">${item.author}</div>
                                    <div class="flex items-center justify-between">
                                        <div class="text-sm text-gray-600">수량: ${item.quantity}개</div>
                                        <div class="text-blue-600 font-medium">${formatCurrency(item.price)}</div>
                                    </div>
                                </div>
                            </div>
                        `;
                });
                itemsListHtml += '</div>';
                itemsContent.innerHTML = itemsListHtml;

                // Total Summary
                itemsContent.innerHTML += `
                        <div class="border-t mt-4 pt-4 space-y-2">
                            <div class="flex items-center justify-between text-sm">
                                <span class="text-gray-600">상품금액</span>
                                <span class="text-gray-900">${formatCurrency(order.totalAmount)}</span>
                            </div>
                            <div class="flex items-center justify-between text-sm">
                                <span class="text-gray-600">배송비</span>
                                <span class="text-gray-900">무료</span>
                            </div>
                            <div class="flex items-center justify-between pt-2 border-t font-semibold">
                                <span class="text-gray-900">총 결제금액</span>
                                <span class="text-xl text-blue-600">${formatCurrency(order.totalAmount)}</span>
                            </div>
                        </div>
                    `;
                itemsSection.appendChild(itemsContent);
            }
            container.appendChild(itemsSection);

            // 2. Shipping Info Section
            const shippingSection = createElement('div', 'bg-white rounded-lg shadow-sm overflow-hidden');
            shippingSection.appendChild(renderCollapsibleHeader('shipping', '배송지 정보', 'MapPin'));

            if (state.expandedSections.shipping) {
                const shippingContent = createElement('div', 'p-4 border-t');
                const info = order.shippingInfo;
                shippingContent.innerHTML = `
                        <div class="space-y-3 text-sm">
                            <div class="flex">
                                <span class="text-gray-600 w-24 flex-shrink-0">수령인</span>
                                <span class="text-gray-900 font-medium">${info.recipient}</span>
                            </div>
                            <div class="flex">
                                <span class="text-gray-600 w-24 flex-shrink-0">연락처</span>
                                <span class="text-gray-900">${info.phone}</span>
                            </div>
                            <div class="flex">
                                <span class="text-gray-600 w-24 flex-shrink-0">주소</span>
                                <div class="text-gray-900">
                                    <div>(${info.zipcode})</div>
                                    <div>${info.address}</div>
                                    <div>${info.detailAddress}</div>
                                </div>
                            </div>
                            ${info.memo ? `
                            <div class="flex">
                                <span class="text-gray-600 w-24 flex-shrink-0">배송 메모</span>
                                <span class="text-gray-900">${info.memo}</span>
                            </div>
                            ` : ''}
                        </div>
                    `;
                shippingSection.appendChild(shippingContent);
            }
            container.appendChild(shippingSection);


            // 3. Payment Info Section
            const paymentSection = createElement('div', 'bg-white rounded-lg shadow-sm overflow-hidden');
            paymentSection.appendChild(renderCollapsibleHeader('payment', '결제 정보', 'CreditCard'));

            if (state.expandedSections.payment) {
                const paymentContent = createElement('div', 'p-4 border-t');
                const payment = order.paymentInfo;
                const statusClass = payment.status === '결제완료' ? 'text-green-600' : 'text-yellow-600';

                paymentContent.innerHTML = `
                        <div class="space-y-3 text-sm">
                            <div class="flex justify-between">
                                <span class="text-gray-600">결제 방법</span>
                                <span class="text-gray-900">${payment.method}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-gray-600">결제 금액</span>
                                <span class="text-gray-900">${formatCurrency(payment.amount)}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-gray-600">결제 상태</span>
                                <span class="${statusClass} font-medium">
                                    ${payment.status}
                                </span>
                            </div>
                        </div>
                    `;
                paymentSection.appendChild(paymentContent);
            }
            container.appendChild(paymentSection);


            // 4. Tracking Info Section (if tracking number exists)
            if (order.trackingNumber) {
                const trackingSection = createElement('div', 'bg-white rounded-lg shadow-sm overflow-hidden');
                trackingSection.appendChild(renderCollapsibleHeader('tracking', '배송 추적', 'Truck'));

                if (state.expandedSections.tracking) {
                    const trackingContent = createElement('div', 'p-4 border-t');

                    trackingContent.innerHTML = `
                            <div class="mb-4">
                                <div class="text-sm text-gray-600 mb-1">운송장 번호</div>
                                <div class="text-gray-900 font-medium">${order.trackingNumber}</div>
                            </div>

                            <div class="space-y-0.5">
                                <!-- Delivery Status Timeline - Dummy data based on original React component -->
                                <div class="flex gap-3">
                                    <div class="flex flex-col items-center">
                                        <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center flex-shrink-0">
                                            ${createIconElement('CheckCircle', 'w-5 h-5 text-white').outerHTML}
                                        </div>
                                        <div class="w-0.5 h-12 bg-blue-600"></div>
                                    </div>
                                    <div class="flex-1 pb-4">
                                        <div class="text-sm text-gray-900 font-medium mb-1">배송 중</div>
                                        <div class="text-xs text-gray-600">2025-01-16 09:30</div>
                                        <div class="text-xs text-gray-500">강남구 배송센터 출고</div>
                                    </div>
                                </div>

                                <div class="flex gap-3">
                                    <div class="flex flex-col items-center">
                                        <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center flex-shrink-0">
                                            ${createIconElement('CheckCircle', 'w-5 h-5 text-white').outerHTML}
                                        </div>
                                        <div class="w-0.5 h-12 bg-blue-600"></div>
                                    </div>
                                    <div class="flex-1 pb-4">
                                        <div class="text-sm text-gray-900 font-medium mb-1">배송 시작</div>
                                        <div class="text-xs text-gray-600">2025-01-15 18:00</div>
                                        <div class="text-xs text-gray-500">물류센터 출고</div>
                                    </div>
                                </div>

                                <div class="flex gap-3">
                                    <div class="flex flex-col items-center">
                                        <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center flex-shrink-0">
                                            ${createIconElement('CheckCircle', 'w-5 h-5 text-white').outerHTML}
                                        </div>
                                    </div>
                                    <div class="flex-1">
                                        <div class="text-sm text-gray-900 font-medium mb-1">상품 준비</div>
                                        <div class="text-xs text-gray-600">2025-01-15 14:30</div>
                                        <div class="text-xs text-gray-500">주문 접수 완료</div>
                                    </div>
                                </div>
                            </div>

                            <button onclick="alert('배송 상세 페이지로 이동합니다 (기능 미구현)');" class="w-full mt-4 py-2 border border-blue-600 text-blue-600 rounded-lg hover:bg-blue-50 transition-colors text-sm font-medium">
                                상세 배송 조회
                            </button>
                        `;
                    trackingSection.appendChild(trackingContent);
                }
                container.appendChild(trackingSection);
            }


            // Action Buttons
            const actionsBlock = createElement('div', 'bg-white rounded-lg shadow-sm p-4');
            let actionButtonsHtml = '<div class="flex gap-3">';

            if (order.status === '배송준비중') {
                actionButtonsHtml += `
                        <button onclick="alert('주문이 취소됩니다 (기능 미구현)');" class="flex-1 py-3 border border-red-300 text-red-600 rounded-lg hover:bg-red-50 transition-colors font-medium">
                            주문 취소
                        </button>
                    `;
            } else if (order.status === '배송완료') {
                actionButtonsHtml += `
                        <button onclick="alert('교환 신청 페이지로 이동합니다 (기능 미구현)');" class="flex-1 py-3 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors font-medium">
                            교환 신청
                        </button>
                        <button onclick="alert('반품 신청 페이지로 이동합니다 (기능 미구현)');" class="flex-1 py-3 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors font-medium">
                            반품 신청
                        </button>
                    `;
            }

            actionButtonsHtml += `
                    <button onclick="alert('1:1 문의 페이지로 이동합니다 (기능 미구현)');" class="flex-1 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium">
                        1:1 문의
                    </button>
                </div>`;
            actionsBlock.innerHTML = actionButtonsHtml;
            container.appendChild(actionsBlock);


            return container;
        };


        // --- MAIN RENDER FUNCTION ---

        const render = () => {
            const app = document.getElementById('app');
            if (!app) return;

            // Clear existing content
            app.innerHTML = '';

            // 1. Header
            const headerDiv = createElement('div', 'mb-8');
            headerDiv.innerHTML = `
                    <button
                        onclick="window.onBack()"
                        class="flex items-center gap-2 text-gray-600 hover:text-gray-900 mb-4 font-medium"
                    >
                        ${createIconElement('ArrowLeft', 'w-5 h-5').outerHTML}
                        <span>뒤로가기</span>
                    </button>
                    <h1>비회원 주문조회</h1>
                    <p class="text-gray-600 mt-2">주문번호와 주문자 정보로 주문 내역을 확인하실 수 있습니다.</p>
                `;
            app.appendChild(headerDiv);

            // 2. Search Form
            app.appendChild(renderForm());

            // 3. Order Result or Loading Indicator
            if (state.isLoading) {
                const loadingDiv = createElement('div', 'text-center py-12 bg-white rounded-lg shadow-sm');
                loadingDiv.innerHTML = `
                    <div class="flex justify-center items-center flex-col">
                        ${createIconElement('Loader2', 'w-8 h-8 text-blue-500 animate-spin-slow').outerHTML}
                        <p class="mt-4 text-gray-600">주문 정보를 조회하고 있습니다...</p>
                    </div>
                 `;
                app.appendChild(loadingDiv);
            } else if (state.searchedOrder) {
                app.appendChild(renderOrderDetails(state.searchedOrder));
            }

            // 4. Help Section
            const helpSection = createElement('div', 'mt-8 bg-gray-100 rounded-lg p-6');
            helpSection.innerHTML = `
                    <h3 class="text-gray-900 mb-4 font-semibold">주문 조회 관련 안내</h3>
                    <ul class="text-sm text-gray-600 space-y-2 list-disc pl-5">
                        <li>주문번호는 주문 완료 후 발송되는 이메일 또는 문자메시지에서 확인하실 수 있습니다.</li>
                        <li>주문 정보가 확인되지 않는 경우, 고객센터(1588-0000)로 문의해 주시기 바랍니다.</li>
                        <li>비회원 주문의 경우 주문 후 7일 이내에만 조회가 가능합니다.</li>
                        <li>회원 가입 시 더욱 편리하게 주문 내역을 관리하실 수 있습니다.</li>
                    </ul>
                `;
            app.appendChild(helpSection);
        };

        // Initialize the application
        document.addEventListener('DOMContentLoaded', () => {
            // Need a slight delay to ensure Lucide is loaded via the module script
            setTimeout(render, 100);
        });

    </script>
</div>
</body>
</html>
