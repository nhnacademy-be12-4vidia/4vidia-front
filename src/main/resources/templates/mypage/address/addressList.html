<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>주소 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <script>
        // DOMContentLoaded 이벤트 리스너를 사용하여 요소가 로드될 때까지 기다립니다.
        document.addEventListener('DOMContentLoaded', function() {
            // 1. 버튼 요소 가져오기
            const setDefaultBtn = document.getElementById('setDefaultBtn');
            const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');

            // 2. 이벤트 리스너 연결 (요소가 존재할 때만 실행)
            if (setDefaultBtn) {
                setDefaultBtn.addEventListener('click', setDefaultSelectedAddress);
            }
            if (deleteSelectedBtn) {
                deleteSelectedBtn.addEventListener('click', deleteSelectedAddresses);
            }
            // 참고: addressCallback 함수는 모달 내부에 인라인으로 남겨둡니다.
        });


        // --- Core JS Functions ---

        function getSelectedAddresses() {
            return Array.from(document.querySelectorAll("input[name='selectedAddress']:checked")).map(chk => chk.value);
        }

        function setDefaultSelectedAddress() {
            const selected = getSelectedAddresses();
            // ⭐ 이 경고 메시지가 나오는지 확인 ⭐
            if (selected.length !== 1) {
                alert("기본 주소는 (현재 기본 주소가 아닌 주소 중) 하나만 선택해야 합니다.");
                return;
            }

            const addressId = selected[0];

            fetch(`/mypage/addresses/default/${addressId}`, { method: "PUT" })
                .then(res => {
                    if (res.ok) {
                        location.reload();
                    } else {
                        if (res.status === 404) {
                            alert("주소를 찾을 수 없어 기본 주소 설정에 실패했습니다.");
                        } else if (res.status === 400) {
                            alert("잘못된 요청입니다. 기본 주소 설정에 실패했습니다.");
                        } else {
                            alert(`기본 주소 설정 실패. (오류 코드: ${res.status})`);
                        }
                    }
                })
                .catch(error => {
                    console.error("네트워크 오류:", error);
                    alert("네트워크 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.");
                });
        }

        function deleteSelectedAddresses() {
            const selected = getSelectedAddresses();
            // 이 경고 메시지가 나오는지 확인
            if (selected.length === 0) {
                alert("삭제할 주소를 선택하세요.");
                return;
            }
            if (!confirm("선택한 주소를 모두 삭제하시겠습니까?")) return;

            Promise.all(
                selected.map(id => fetch(`/mypage/addresses/${id}`, { method: "DELETE" }))
            ).then(() => location.reload())
                .catch(() => alert("삭제 중 오류 발생"));
        }
    </script>
</head>

<body>
<div layout:fragment="content">

    <div class="container mt-5" style="width: 900px; margin: 0 auto;">
        <h2 class="text-center mb-5 text-primary">📦 주소 관리</h2>

        <div class="d-flex justify-content-end mb-3">
            <button class="btn btn-primary"
                    data-toggle="modal"           data-target="#addressModal"   th:disabled="${addressList.size() >= 10}">
                + 새 주소 추가
            </button>
        </div>

        <div th:if="${defaultAddress == null and not #lists.isEmpty(addressList)}"
             class="alert alert-warning text-center" role="alert">
            🚨 **기본 주소를 설정해주세요!**
        </div>

        <table class="table table-bordered text-center align-middle">
            <thead class="table-light">
            <tr>
                <th style="width: 70px;">선택</th>
                <th style="width: 200px;">별칭</th>
                <th style="width: 470px;">주소</th>
                <th style="width: 160px;">수정/삭제</th>
            </tr>
            </thead>

            <tbody id="addressTableBody">

            <tr th:if="${#lists.isEmpty(addressList)}">
                <td colspan="4" class="text-center text-muted py-4">
                    등록된 주소가 없습니다. 새 주소를 추가해 주세요.
                </td>
            </tr>

            <tr th:if="${defaultAddress != null}" th:with="addr=${defaultAddress}" class="table-primary">
                <td>
                </td>

                <td>
                    <strong th:text="${addr.alias}"></strong>
                    <span class="badge bg-primary ms-1">기본</span>
                </td>

                <td class="text-start">
                    <span th:text="|(${addr.zipCode}) ${addr.roadAddress} ${addr.addressDetail}|"></span>
                </td>

                <td>
                    <a th:href="@{/mypage/addresses/{addressId}/edit(addressId=${addr.userAddressId()})}"
                       class="btn btn-sm btn-outline-primary me-2">수정</a>
                </td>
            </tr>


            <th:block th:each="addr : ${addressList}"
                      th:with="isDefault=${defaultAddress != null and defaultAddress.userAddressId() == addr.userAddressId()}">
                <tr th:unless="${isDefault}">

                    <td>
                        <input type="checkbox" name="selectedAddress"
                               th:value="${addr.userAddressId}">
                    </td>

                    <td>
                        <strong th:text="${addr.alias}"></strong>
                    </td>

                    <td class="text-start">
                        <span th:text="|(${addr.zipCode}) ${addr.roadAddress} ${addr.addressDetail}|"></span>
                    </td>

                    <td>
                        <a th:href="@{/mypage/addresses/{addressId}/edit(addressId=${addr.userAddressId})}"
                           class="btn btn-sm btn-outline-primary me-2">수정</a>

                        <form th:action="@{/mypage/addresses/{addressId}(addressId=${addr.userAddressId})}"
                              method="post" style="display:inline;"
                              onsubmit="return confirm('정말 이 주소를 삭제하시겠습니까?');">
                            <input type="hidden" name="_method" value="delete"/>
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                삭제
                            </button>
                        </form>
                    </td>
                </tr>
            </th:block>
            </tbody>
        </table>

        <th:block th:with="nonDefaultAddresses=${#lists.size(addressList) - (#bools.isTrue(defaultAddress != null) ? 1 : 0)}">
            <div class="d-flex justify-content-between mt-3" th:if="${nonDefaultAddresses > 0}">
                <button id="setDefaultBtn" class="btn btn-outline-primary">기본 주소로 설정</button>
                <button id="deleteSelectedBtn" class="btn btn-outline-danger">선택한 주소 삭제</button>
            </div>
        </th:block>

        <p id="limitMessage" class="text-danger mt-2 text-end"
           th:if="${addressList.size() >= 10}">
            주소는 최대 10개까지만 등록할 수 있습니다.
        </p>
    </div>

    <div class="modal fade" id="addressModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-body">
                    <form id="addAddressForm" method="post" th:action="@{/mypage/addresses}">
                        <div class="form-group mb-3">
                            <label>별칭*</label>
                            <input type="text" name="alias" class="form-control" required>
                        </div>

                        <script>
                            function searchPostcode() {
                                window.open("/addressPopup", "pop",
                                    "width=570,height=420,scrollbars=yes,resizable=yes");
                            }
                            function addressCallback(roadAddrPart1, addrDetail, zipNo) {
                                document.getElementById("zipNo").value = zipNo;
                                document.getElementById("roadAddrPart1").value = roadAddrPart1;
                                document.getElementById("addrDetail").value = addrDetail;
                                document.getElementById("addrDetail").focus();
                            }
                        </script>

                        <div class="form-group mb-3">
                            <label>우편번호*</label>
                            <div class="d-flex">
                                <input type="text" id="zipNo" name="zipCode" class="form-control me-2" readonly required>
                                <button type="button" class="btn btn-secondary" onclick="searchPostcode()">우편번호 찾기</button>
                            </div>
                        </div>
                        <div class="form-group mb-3">
                            <label>도로명 주소*</label>
                            <input type="text" id="roadAddrPart1" name="roadAddress" class="form-control" readonly required>
                        </div>
                        <div class="form-group mb-3">
                            <label>상세 주소*</label>
                            <input type="text" id="addrDetail" name="addressDetail" class="form-control" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="submit" form="addAddressForm" class="btn btn-primary">저장하기</button>
                    <button class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
