<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <title>로그인</title>
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link
            href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
            rel="stylesheet">

    <script th:src="@{/customJs/get-cookie.js}"></script>
    <style>
        .login-links a {
            color: #285fec;
            font-size: 0.85rem;
            text-decoration: none;
            font-weight: 500;
        }
        .login-links a:hover {
            text-decoration: underline;
        }
        /* 추가된 스타일 */
        .order-guest .h6 {
            font-weight: bold;
            color: #5a5c69;
            margin-bottom: 1rem;
            display: flex; /* 아이콘 배치를 위해 flex 사용 */
            justify-content: center;
            align-items: center;
        }
        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.2rem;
            color: #6e707e;
        }
        /* 클릭 가능한 제목 스타일 */
        .guest-order-toggle {
            cursor: pointer;
            user-select: none; /* 텍스트 선택 방지 */
            transition: color 0.2s;
        }
        .guest-order-toggle:hover {
            color: #4e73df !important; /* 호버 시 색상 변경 */
        }
        .guest-order-toggle .fas {
            margin-left: 0.5rem;
            font-size: 0.9em;
            transition: transform 0.3s;
        }
        /* 폼이 열렸을 때 아이콘 회전 */
        .guest-order-toggle.opened .fas {
            transform: rotate(180deg);
        }
    </style>
</head>

<body class="bg-gradient-primary">

<div class="container">

    <div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-lg-6 col-md-8">
        <div class="card o-hidden border-0 shadow-lg">

        <div class="card-body p-0">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="p-5">
                                <div class="text-center">
                                    <h1 class="h4 text-gray-900 mb-4">4VIDIA</h1>
                                    <p class="text-gray-600 mb-4">로그인하여 서비스를 이용하세요</p>

                                </div>
                                <form class="user" action="/auth/login" method="post">

                                    <div th:if="${loginError}" class="alert alert-danger text-center">
                                        <span th:text="${loginError}"></span>
                                    </div>
                                    <p th:if="${param.error != null and param.error != 'dormant'}"
                                       class="text-danger text-center">
                                        이메일 또는 비밀번호가 올바르지 않습니다.
                                    </p>

                                    <div class="form-group">
                                        <input type="email" name="email" class="form-control form-control-user"
                                               id="exampleInputEmail" aria-describedby="emailHelp"
                                               placeholder="Enter Email Address...">
                                    </div>
                                    <div class="form-group">
                                        <input type="password" name="password" class="form-control form-control-user"
                                               id="exampleInputPassword" placeholder="Password">
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-user btn-block">
                                        로그인
                                    </button>
                                    <a th:href="${paycoLoginUrl}" class="btn btn-warning btn-user btn-block">
                                        <i class="fas fa-sign-in-alt"></i> PAYCO 로그인
                                    </a>

                                    <a href="/" class="btn btn-secondary btn-user btn-block">
                                        메인 페이지로 돌아가기
                                    </a>

                                </form>
                                <div th:if="${param.error == 'dormant'}" class="alert alert-warning">
                                    휴면 계정입니다. 인증 후 이용해주세요.
                                </div>


                                <hr class="my-4">
                                <div class="text-center order-guest">
                                    <h6 class="h6 text-gray-900 mb-4 guest-order-toggle">
                                        비회원 주문 조회
                                        <i class="fas fa-chevron-down"></i>
                                    </h6>
                                </div>

                                <div id="guestOrderFormWrapper"
                                     th:style="${errorMessage} ? 'display: block;' : 'display: none;'">

                                    <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                                        <span th:text="${errorMessage}"></span>
                                    </div>

                                    <form class="order-guest" action="/orders/guest" method="post">
                                        <input type="hidden"
                                               th:name="${_csrf.parameterName}"
                                               th:value="${_csrf.token}" />
                                        <div class="form-group">
                                            <label for="orderId">주문 번호</label>
                                            <input type="text" name="orderId" class="form-control form-control-user"
                                                   id="orderId" placeholder="주문 번호를 입력하세요."
                                                   required
                                                   maxlength="30">
                                        </div>

                                        <div class="form-group">
                                            <label for="guestOrderPassword">비밀번호 (주문 시 설정한)</label>
                                            <input type="password" name="orderPassword" class="form-control form-control-user"
                                                   id="guestOrderPassword" placeholder="비밀번호를 입력하세요.">
                                        </div>

                                        <button type="submit" class="btn btn-info btn-user btn-block mt-3">
                                            비회원 주문 조회
                                        </button>
                                    </form>
                                </div>



                                <div class="text-center mt-4 login-links">
                                    <a href="/auth/find-id" class="small mx-2">아이디 찾기</a> |
                                    <a href="/auth/find-password" class="small mx-2">비밀번호 찾기</a> |
                                    <a href="/auth/signup" class="small mx-2">회원가입</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>

</div>

<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

<script src="/vendor/jquery-easing/jquery.easing.min.js"></script>

<script src="/js/sb-admin-2.min.js"></script>

<script>
    $(document).ready(function() {
        const $wrapper = $('#guestOrderFormWrapper');
        const $toggleElement = $('.guest-order-toggle');

        // 1. 초기 로딩 시, 오류 메시지가 있어서 폼이 열려 있다면 아이콘 상태를 'opened'로 설정
        if ($wrapper.is(':visible')) {
            $toggleElement.addClass('opened');
        }

        // 2. 비회원 주문 조회 제목 클릭 이벤트
        $toggleElement.on('click', function() {
            const isVisible = $wrapper.is(':visible');

            // 폼을 슬라이드 효과로 토글 (열거나 닫기)
            $wrapper.slideToggle(400, function() {
                // 토글 완료 후, 보이는 상태에 따라 클래스 변경
                if (!isVisible) { // 닫혀 있다가 열린 경우
                    $toggleElement.addClass('opened');
                } else { // 열려 있다가 닫힌 경우
                    $toggleElement.removeClass('opened');
                }
            });
        });
    });
</script>

</body>

</html>
