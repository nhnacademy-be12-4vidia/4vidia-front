<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout.html}">
<head>
  <meta charset="UTF-8">
  <title>결제 실패</title>
  <script th:src="@{/customJs/get-cookie.js}"></script>

</head>
<body>
<div layout:fragment="content">

  <div class="container-fluid">

    <div class="d-sm-flex align-items-center justify-content-between mb-4">
      <h1 class="h3 mb-0 text-gray-800">결제 결과</h1>
    </div>

    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">

        <div class="card shadow mb-4 border-left-danger">
          <div class="card-body text-center p-5">

            <div class="mb-4">
              <img width="120px" src="https://static.toss.im/lotties/error-spot-no-loop-space-apng.png" alt="Error Icon"/>
            </div>

            <h2 class="h4 text-gray-900 font-weight-bold mb-2">결제에 실패했습니다</h2>
            <p class="text-gray-600 mb-4">
              요청하신 결제 처리가 거절되었습니다.<br>
              아래 에러 사유를 확인해 주세요.
            </p>

            <div class="bg-gray-100 rounded p-4 mb-4 text-left">
              <div class="d-flex justify-content-between mb-2">
                <span class="font-weight-bold text-gray-700">에러 메시지</span>
                <span class="text-danger font-weight-bold" id="message"></span>
              </div>
              <div class="d-flex justify-content-between">
                <span class="font-weight-bold text-gray-700">에러 코드</span>
                <span class="text-gray-600" id="code"></span>
              </div>
            </div>

            <div class="row">
              <div class="col-6">
                <a href="/cart" class="btn btn-primary btn-block btn-lg">
                  <i class="fas fa-shopping-cart mr-2"></i>장바구니로
                </a>
              </div>
              <div class="col-6">
                <a href="/" class="btn btn-secondary btn-block btn-lg">
                  <i class="fas fa-home mr-2"></i>홈으로
                </a>
              </div>
            </div>

          </div>
        </div>

      </div>
    </div>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // URL의 쿼리 파라미터(?code=...&message=...)를 읽어옵니다.
      const urlParams = new URLSearchParams(window.location.search);

      const codeElement = document.getElementById("code");
      const messageElement = document.getElementById("message");

      // 값이 있으면 화면에 표시, 없으면 '알 수 없음' 표시
      const errorCode = urlParams.get("code");
      const errorMessage = urlParams.get("message");

      codeElement.textContent = errorCode || "UNKNOWN_ERROR";
      messageElement.textContent = errorMessage || "알 수 없는 이유로 결제가 실패했습니다.";
    });
  </script>

</div>
</body>
</html>
