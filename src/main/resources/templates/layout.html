<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="utf-8">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>4VIDIA Bookstore</title>

    <!-- 파비콘 설정 -->
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <!-- Fonts / Icons -->
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet">
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">

    <!-- SB Admin 2 -->
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">

    <!-- ✅ SB-Admin-2(부트스트랩4) 기반: Bootstrap5 CDN 제거 -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script th:inline="javascript">
        window.IS_LOGGED_IN = /*[[${isLoggedIn}]]*/ false;
    </script>

    <link rel="stylesheet" th:href="@{/css/loading.css}">

    <style>
        /* ===== Ridi-ish Theme Tokens ===== */
        :root{
            --ridi-bg: #f6f7fb;
            --ridi-white: #ffffff;
            --ridi-text: #111827;
            --ridi-muted: #6b7280;
            --ridi-line: #e5e7eb;

            --ridi-primary: #5b5ce6;
            --ridi-primary-2: #6f49ff;
            --ridi-primary-soft: rgba(91,92,230,.12);

            --radius-lg: 18px;
            --radius-pill: 999px;

            /* ✅ 헤더를 "가운데로" 모으는 폭 */
            --ridi-container: 1300px;
        }

        html, body {
            height: 100%;
            margin: 0;
            overflow-x: hidden;
            background: var(--ridi-bg);
            color: var(--ridi-text);
        }

        /* ✅ 사이드바 제거: 세로 레이아웃 */
        #wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        #content-wrapper {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: var(--ridi-bg);
        }
        #content { flex: 1; }

        /* ✅ 헤더 전용 가운데 정렬 컨테이너 */
        .ridi-container {
            max-width: var(--ridi-container);
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ===== Header (Ridi-style minimal) ===== */
        .ridi-header {
            background: var(--ridi-white);
            border-bottom: 1px solid var(--ridi-line);
            z-index: 1030;
        }

        /* main row */
        .ridi-main {
            padding: .85rem 0; /* 살짝 줄여서 덜 퍼져보이게 */
        }

        /* 로고/텍스트 */
        .brand-wrap {
            display:flex;
            align-items:center;
            gap:12px;
            min-width: 240px; /* 260 -> 240 */
            text-decoration:none !important;
        }
        .brand-logo { height: 60px; } /* 55 -> 52 (조금만 다이어트) */
        .brand-title {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            font-weight: 900;
            letter-spacing: .02rem;
            font-size: 1.35rem;
            margin: 0;
            color: var(--ridi-text);
            line-height: 1.05;
        }
        .brand-title b { color: var(--ridi-primary); }
        .brand-sub {
            margin-top: 3px;
            font-size: .80rem;
            color: var(--ridi-muted);
            line-height: 1;
        }

        /* search */
        .ridi-search {
            width: 100%;
            max-width: 640px; /* 780 -> 640 : 가운데로 모이는 핵심 */
            background: #f3f4f6;
            border: 1px solid #eef0f4;
            border-radius: var(--radius-pill);
            height: 52px;
            display:flex;
            align-items:center;
            padding: 0 .5rem 0 .85rem;
            gap: .65rem;
        }
        .ridi-search input {
            border: 0 !important;
            background: transparent !important;
            box-shadow: none !important;
            height: 48px;
            padding: 0 .25rem 0 .25rem;
            width: 100%;
            font-size: 1rem;
        }

        .ridi-search .btn-search {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-pill);
            border: 0;
            background: var(--ridi-primary-soft);
            color: var(--ridi-primary);
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .ridi-search .btn-search:hover {
            background: rgba(91,92,230,.18);
        }

        /* actions */
        .ridi-actions {
            display:flex;
            align-items:center;
            justify-content:flex-end;
            gap: .55rem;
            min-width: 200px; /* 250 -> 200 */
        }
        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-pill);
            border: 1px solid #eef0f4;
            background: #fff;
            color: #374151;
            display:flex;
            align-items:center;
            justify-content:center;
            text-decoration:none !important;
        }
        .icon-btn:hover {
            color: var(--ridi-primary);
            border-color: #e4e6ef;
            background: #fafbff;
        }
        .icon-badge { position: relative; }
        .icon-badge .badge {
            position:absolute;
            top:-6px; right:-6px;
            border-radius: var(--radius-pill);
            font-size:.72rem;
            padding:.25rem .4rem;
            background: var(--ridi-primary) !important;
        }

        /* nav row */
        .ridi-nav {
            border-top: 1px solid #f0f1f5;
            padding: .55rem 0;
        }
        .nav-chip {
            border-radius: var(--radius-pill);
            background: #fff;
            border: 1px solid #eef0f4;
            color: #374151;
            padding: .42rem .85rem;
            font-size: .88rem;
            text-decoration:none !important;
            display:inline-flex;
            align-items:center;
            gap:.45rem;
        }
        .nav-chip:hover {
            color: var(--ridi-primary);
            border-color: #e4e6ef;
            background: #fafbff;
        }

        /* category dropdown */
        .category-dropdown {
            min-width: 360px;
            max-height: 70vh;
            overflow: auto;
            padding: .35rem;
            border-radius: 14px;
        }
        .category-grid {
            display:grid;
            grid-template-columns: repeat(2, minmax(140px, 1fr));
            gap: .25rem .5rem;
            padding: .35rem;
        }
        .category-grid a.dropdown-item {
            border-radius: 12px;
            padding: .55rem .7rem;
            color: #374151;
        }
        .category-grid a.dropdown-item:hover {
            background: #f3f4ff;
            color: var(--ridi-primary);
        }

        .nav-links {
            display:flex;
            align-items:center;
            gap:.9rem;
            flex-wrap: wrap;
            margin-left: .4rem;
            color: var(--ridi-muted);
            font-size: .88rem;
        }
        .nav-links a {
            color: var(--ridi-muted);
            text-decoration:none;
        }
        .nav-links a:hover {
            color: var(--ridi-primary);
        }
        .nav-links .sep {
            color: #d1d5db;
        }

        /* right user area */
        .nav-user {
            display:flex;
            align-items:center;
            gap:.7rem;
            font-size: .88rem;
            color: var(--ridi-muted);
        }
        .nav-user strong {
            color: var(--ridi-text);
        }
        .nav-user .btn-link {
            padding: 0;
            font-size: .88rem;
            color: var(--ridi-muted);
            text-decoration:none;
        }
        .nav-user .btn-link:hover {
            color: var(--ridi-primary);
            text-decoration:none;
        }

        /* page content spacing */
        .content-container {
            padding-top: 1.2rem;
        }

        .footer {
            background-color: #fff;
            padding: 30px 40px;
            font-size: 14px;
            border-top: 1px solid var(--ridi-line);
        }

        .footer-container {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            align-items: center;
        }

        .footer-left p {
            margin: 4px 0;
        }

        .footer-right {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .footer-right a {
            color: gray;
            text-decoration: none;
        }

        .footer-right a:hover {
            text-decoration: underline;
        }

        /* 모바일 대응 */
        @media (max-width: 600px) {
            .footer-container {
                flex-direction: column;
                align-items: flex-start;
            }

            .footer-right {
                margin-top: 10px;
            }
        }

        /* responsive */
        @media (max-width: 992px) {
            .ridi-main .ridi-container {
                display: block;
            }
            .ridi-main .main-flex {
                flex-direction: column;
                align-items: stretch !important;
                gap: .75rem !important;
            }
            .brand-wrap, .ridi-actions {
                min-width: 0;
                justify-content: space-between;
            }
            .ridi-search {
                max-width: none;
            }
            .ridi-actions {
                justify-content: flex-start;
            }

            .ridi-nav .nav-flex {
                flex-direction: column;
                align-items: flex-start !important;
                gap: .7rem !important;
            }
            .nav-user {
                width: 100%;
                justify-content: flex-start;
            }
        }
    </style>
</head>

<body id="page-top">

<div id="global-loader" class="loader-container"></div>

<div id="wrapper">
    <div id="content-wrapper">

        <div id="content">

            <!-- ✅ RIDI-ish Header -->
            <header class="ridi-header sticky-top">

                <!-- main row -->
                <div class="ridi-main">
                    <div class="ridi-container">
                        <div class="d-flex align-items-center justify-content-between main-flex" style="gap: .85rem;">
                            <!-- brand -->
                            <a class="brand-wrap" href="/">
                                <img th:src="@{/img/final_logo.png}" class="brand-logo" alt="logo">
                                <div class="d-flex flex-column">
                                    <h1 class="brand-title"><b>4VIDIA</b> Bookstore</h1>
                                    <div class="brand-sub">읽는 즐거움, 더 스마트하게</div>
                                </div>
                            </a>

                            <!-- search -->
                            <form th:action="@{/books/search}" method="get" onsubmit="startLoading()" class="ridi-search">
                                <i class="fas fa-search" style="color: #9ca3af;"></i>

                                <input type="text"
                                       class="form-control"
                                       placeholder="작가, 제목, 키워드로 검색"
                                       name="keyword"
                                       th:value="${param.keyword}">

                                <div class="custom-control custom-switch ml-2" style="white-space: nowrap;">
                                    <input class="custom-control-input"
                                           type="checkbox"
                                           id="useSemanticCheck"
                                           name="useSemantic"
                                           value="true"
                                           th:checked="${param.useSemantic}">
                                    <label class="custom-control-label small mb-0" for="useSemanticCheck">
                                        AI 검색 사용
                                    </label>
                                </div>

                                <button class="btn-search" type="submit" title="검색">
                                    <i class="fas fa-arrow-right"></i>
                                </button>
                            </form>

                            <!-- actions -->
                            <div class="ridi-actions">
                                <a class="icon-btn need-login" th:href="@{/mypage/like}" title="좋아요">
                                    <i class="fas fa-heart"></i>
                                </a>

                                <a class="icon-btn icon-badge" th:href="@{/cart}" title="장바구니">
                                    <i class="fas fa-shopping-cart"></i>
                                    <span class="badge badge-danger badge-counter"
                                          th:if="${cartCount != null}"
                                          th:text="${cartCount}">0</span>
                                </a>

                                <div class="dropdown no-arrow" th:if="${isLoggedIn}">
                                    <a class="icon-btn dropdown-toggle" href="#" id="userDropdown" role="button"
                                       data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" title="내 계정">
                                        <i class="fas fa-user"></i>
                                    </a>

                                    <div class="dropdown-menu dropdown-menu-right shadow animated--grow-in" aria-labelledby="userDropdown">
                                        <a class="dropdown-item need-login" th:href="@{/mypage/profile}">
                                            <i class="fas fa-id-card fa-sm fa-fw mr-2 text-gray-400"></i> 내 정보
                                        </a>
                                        <a class="dropdown-item need-login" th:href="@{/mypage/order}">
                                            <i class="fas fa-truck fa-sm fa-fw mr-2 text-gray-400"></i> 주문내역
                                        </a>
                                        <a class="dropdown-item need-login" th:href="@{/mypage/coupons}">
                                            <i class="fas fa-ticket-alt fa-sm fa-fw mr-2 text-gray-400"></i> 쿠폰함
                                        </a>
                                        <a class="dropdown-item need-login" th:href="@{/mypage/point}">
                                            <i class="fas fa-coins fa-sm fa-fw mr-2 text-gray-400"></i> 포인트
                                        </a>
                                        <a class="dropdown-item need-login" th:href="@{/mypage/refund-history}">
                                            <i class="fas fa-coins fa-sm fa-fw mr-2 text-gray-400"></i> 반품내역
                                        </a>
                                        <div class="dropdown-divider"></div>
                                         <a class="dropdown-item need-login text-danger" th:href="@{/mypage/deactivate}">
                                            <i class="fas fa-user-times fa-sm fa-fw mr-2 text-gray-400"></i> 회원 탈퇴
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- nav row -->
                <div class="ridi-nav">
                    <div class="ridi-container">
                        <div class="d-flex align-items-center justify-content-between nav-flex" style="gap:.8rem;">
                            <div class="d-flex align-items-center" style="gap:.6rem; flex-wrap: wrap;">
                                <div class="dropdown">
                                    <a class="nav-chip dropdown-toggle" href="#" id="categoryMenu"
                                       data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                        <i class="fas fa-bars"></i> 전체 카테고리
                                    </a>

                                    <div class="dropdown-menu shadow animated--grow-in category-dropdown" aria-labelledby="categoryMenu">
                                        <div class="category-grid">
                                            <a class="dropdown-item" th:href="@{/books/search/tags/{tagId}(tagId=182, tagName='인문')}">인문</a>
                                            <a class="dropdown-item" th:href="@{/books/search/tags/{tagId}(tagId=36, tagName='역사')}">역사</a>
                                            <a class="dropdown-item" th:href="@{/books/search/tags/{tagId}(tagId=39, tagName='예술/대중문화')}">예술/대중문화</a>
                                            <a class="dropdown-item" th:href="@{/books/search/tags/{tagId}(tagId=226, tagName='에세이')}">에세이</a>
                                            <a class="dropdown-item" th:href="@{/books/search/tags/{tagId}(tagId=70, tagName='종교/역학')}">종교/역학</a>
                                            <a class="dropdown-item" th:href="@{/books/search/tags/{tagId}(tagId=427, tagName='과학')}">과학</a>
                                            <a class="dropdown-item" th:href="@{/books/search/tags/{tagId}(tagId=188, tagName='경제/경영')}">경제/경영</a>
                                            <a class="dropdown-item" th:href="@{/books/search/tags/{tagId}(tagId=119, tagName='자기계발')}">자기계발</a>
                                            <a class="dropdown-item" th:href="@{/books/search/tags/{tagId}(tagId=244, tagName='만화')}">만화</a>
                                            <a class="dropdown-item" th:href="@{/books/search/tags/{tagId}(tagId=103, tagName='라이트 노벨')}">라이트 노벨</a>
                                            <a class="dropdown-item" th:href="@{/books/search/tags/{tagId}(tagId=107, tagName='여행')}">여행</a>
                                            <a class="dropdown-item" th:href="@{/books/search/tags/{tagId}(tagId=1384, tagName='잡지')}">잡지</a>
                                            <a class="dropdown-item" th:href="@{/books/search/tags/{tagId}(tagId=284, tagName='어린이')}">어린이</a>
                                            <a class="dropdown-item" th:href="@{/books/search/tags/{tagId}(tagId=200, tagName='청소년')}">청소년</a>
                                            <a class="dropdown-item" th:href="@{/books/search/tags/{tagId}(tagId=176, tagName='요리/살림')}">요리/살림</a>
                                            <a class="dropdown-item" th:href="@{/books/search/tags/{tagId}(tagId=2696, tagName='육아')}">육아</a>
                                            <a class="dropdown-item" th:href="@{/books/search/tags/{tagId}(tagId=136, tagName='건강/취미')}">건강/취미</a>
                                            <a class="dropdown-item" th:href="@{/books/search/tags/{tagId}(tagId=14, tagName='컴퓨터/모바일')}">컴퓨터/모바일</a>
                                            <a class="dropdown-item" th:href="@{/books/search/tags/{tagId}(tagId=97, tagName='수험서/자격증')}">수험서/자격증</a>
                                        </div>
                                    </div>
                                </div>

                                <div class="nav-links">
                                    <a class="need-login" th:href="@{/mypage/order}">주문조회</a>
                                    <span class="sep">|</span>
                                    <a href="#" onclick="return false;">공지</a>
                                    <span class="sep">|</span>
                                    <a href="#" onclick="return false;">고객센터</a>
                                </div>

                                <a class="nav-chip" th:if="${isAdmin}" href="/admin">
                                    <i class="fas fa-cog"></i> 관리자
                                </a>
                            </div>

                            <div class="nav-user" th:if="${isLoggedIn}">
                                <span><strong th:text="${userName}">유저</strong>님</span>
                                <form th:action="@{/auth/logout}" method="post" class="m-0">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <button class="btn btn-link" type="submit">로그아웃</button>
                                </form>
                            </div>

                            <!-- ✅ 비로그인일 때: 로그인/회원가입 표시 -->
                            <div class="nav-user" th:if="${!isLoggedIn}">
                                <a th:href="@{/auth/login}" class="btn-link">로그인</a>
                                <span class="sep">|</span>
                                <!-- 회원가입 경로가 /auth/signup 이라면 이대로, 아니면 너 프로젝트 경로로 맞춰줘 -->
                                <a th:href="@{/auth/signup}" class="btn-link">회원가입</a>
                            </div>

                        </div>
                    </div>
                </div>

            </header>

            <!-- ✅ 본문 -->
            <div layout:fragment="content" class="content-container">
                <div class="container-fluid px-4">
                    <div class="row">
                        (여기는 기본 내용입니다)
                    </div>
                </div>
            </div>

        </div>

        <!-- ✅ 푸터 -->
        <footer class="footer">
            <div class="footer-container">
                <div class="footer-left">
                    <p>&copy; 2025 Team4 4VIDIA | NHN Academy Project</p>
                    <a href="/docs/index.html" target="_blank" class="text-gray-600 hover-primary">
                        <i class="fas fa-book mr-1"></i>REST API Docs
                    </a>
                </div>

                <div class="footer-right">
                    <a>개인정보처리방침</a>
                    <span>|</span>
                    <a>이용약관</a>
                    <span>|</span>
                    <a>문의하기</a>
                </div>
            </div>
        </footer>

    </div>
</div>

<a class="scroll-to-top rounded" href="#page-top">
    <i class="fas fa-angle-up"></i>
</a>

<script th:inline="javascript">
    window.IS_LOGGED_IN = /*[[${isLoggedIn}]]*/ false;
</script>

<!-- ✅ need-login 클릭 시 로그인 유도 -->
<script>
    document.addEventListener("click", (e) => {
        const link = e.target.closest("a.need-login");
        if (!link) return;

        if (!window.IS_LOGGED_IN) {
            e.preventDefault();
            e.stopPropagation();

            if (confirm("로그인이 필요한 서비스입니다.\n로그인 페이지로 이동하시겠습니까?")) {
                const next = encodeURIComponent(link.getAttribute("href"));
                window.location.href = `/auth/login?next=${next}`;
            }
        }
    });
</script>

<!-- 기존 스크립트 -->
<script th:src="@{/customJs/get-cookie.js}"></script>
<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
<script th:src="@{/js/sb-admin-2.min.js}"></script>
<script th:src="@{/customJs/loading.js}"></script>

</body>
</html>
