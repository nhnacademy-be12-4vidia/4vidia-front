<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>비밀번호 찾기</title>

    <!-- 파비콘 설정 -->
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">
</head>

<body class="bg-gradient-primary">

<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100 py-4">

        <div class="col-lg-8 col-md-10">


        <div class="card shadow-lg border-0">
                <div class="card-body p-5">

                    <h2 class="h3 text-center text-gray-900 mb-4 fw-bold">
                        비밀번호 찾기
                    </h2>

                    <form method="post" th:action="@{/auth/find-password}">

                        <!-- 이메일 -->
                        <div class="form-group">
                            <label for="email" class="small font-weight-bold text-gray-700">이메일(아이디)</label>
                            <input type="email" id="email"
                                   class="form-control form-control-user"
                                   name="email" placeholder="example@domain.com"
                                   th:value="${email}"
                                   required>
                        </div>

                        <!-- 이름 -->
                        <div class="form-group">
                            <label for="name" class="small font-weight-bold text-gray-700">이름</label>
                            <input type="text" id="name"
                                   class="form-control form-control-user"
                                   name="name" placeholder="이름을 입력해주세요"
                                   th:value="${name}"
                                   required>
                        </div>

                        <!-- 전화번호 -->
                        <div class="form-group mb-4">
                            <label for="phone" class="small font-weight-bold text-gray-700">전화번호</label>
                            <input type="tel" id="phone"
                                   class="form-control form-control-user"
                                   name="phone" placeholder="예: 01012345678"
                                   pattern="01[016789][0-9]{7,8}"
                                   title="숫자만 입력해주세요. 예: 01012345678"
                                   th:value="${phone}"
                                   required>
                        </div>

                        <button type="submit" class="btn btn-primary btn-user btn-block">
                            임시 비밀번호 발급
                        </button>

                        <hr>

                        <div class="d-flex justify-content-between small">
                            <a th:href="@{/auth/login}">로그인으로</a>
                            <a th:href="@{/auth/find-id}">아이디 찾기</a>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script th:if="${success}">
    alert("[[${success}]]");
    window.location.href = "/auth/login";
</script>

<script th:if="${error}">
    alert("[[${error}]]");
</script>

</body>
</html>
