name: 4vidia-front

on:
  push:
    branches:
      - dev
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build JAR
        run: mvn clean package -DskipTests -B

      - name: Docker login (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: baejongto
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/4vidia-front:latest .
          docker push ghcr.io/${{ github.repository_owner }}/4vidia-front:latest
          echo "Docker image pushed"

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.NEW_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TOSS_CLIENT_KEY: ${{ secrets.TOSS_CLIENT_KEY }}
        with:
          host: s2.java21.net
          username: be12-team4
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 8822
          envs: GH_TOKEN,GH_OWNER,ADMIN_ID,ADMIN_PASSWORD,REDIS_PASSWORD,JWT_SECRET,TOSS_CLIENT_KEY
          script_stop: true
          script: |

            echo $GH_TOKEN | docker login ghcr.io -u baejongto --password-stdin
            cd ~
            
            echo "Deploy 4vidia-discovery-1"
            docker compose pull 4vidia-front-1
            docker compose up -d 4vidia-front-1
            
            echo "Deploy 4vidia-discovery-2"
            docker compose pull 4vidia-front-2
            docker compose up -d 4vidia-front-2
