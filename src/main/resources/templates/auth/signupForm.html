<!DOCTYPE html>

<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>회원가입</title>

    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">

    <link href="/css/sb-admin-2.min.css" rel="stylesheet">

    <script src="/t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

    <meta name="_csrf" th:content="${_csrf.token}">

    <meta name="_csrf_header" th:content="${_csrf.headerName}">



    <style>

        /* ===== 기본 레이아웃 ===== */

        .form-group { display:flex; align-items:flex-start; margin-bottom:1.5rem; }

        label {

            font-weight:700; font-size:0.95rem; color:#343a40;

            display:block; width:120px; flex-shrink:0; margin-right:20px;

            line-height:calc(1.5em + .75rem + 2px);

        }

        .input-wrapper { flex-grow:1; max-width:520px; }



        /* ===== 공통 입력 필드 ===== */

        .form-control-user {

            margin-bottom:0 !important; border-radius:12px; height:46px;

            font-size:0.95rem; transition:all 0.2s ease;

        }

        .form-control-user:focus { border-color:#4e73df; box-shadow:0 0 0 0.15rem rgba(78,115,223,0.25); }

        input[type="date"] { font-size:1.1rem !important; }



        /* ===== 이메일 인증 영역 ===== */

        .email-check-wrapper{

            display:grid; grid-template-columns:1fr 110px; gap:14px; align-items:center;

            background:#f8f9fc; padding:12px; border-radius:14px;

        }

        .email-input { min-width:0; }

        .check-btn{

            height:34px; padding:0 0.6rem; font-size:0.85rem; border-radius:999px;

            font-weight:600; line-height:1;

        }

        #emailDupBtn{ background-color:#e9ecef; color:#495057; border:none; }



        /* 인증코드 입력 영역 */

        #codeBlock .check-btn { height:36px; padding:0.25rem 0.6rem; font-size:0.85rem; }



        /* ===== 피드백 문구 ===== */

        .email-feedback, .form-feedback{

            margin-top:6px; display:block; font-size:0.8rem; font-weight:600; padding-left:4px;

        }



        /* ===== 버튼 disabled ===== */

        .btn-primary:disabled{

            background-color:#8392a5 !important; border-color:#8392a5 !important;

            opacity:0.6; cursor:not-allowed;

        }



        /* ===== 비밀번호 체크 아이콘 ===== */

        .password-wrapper { position:relative; }

        .password-check-icon{

            position:absolute; right:14px; top:38%; transform:translateY(-50%);

            font-size:1.1rem; color:#1cc88a; display:none; pointer-events:none;

        }



        /* ===== 배경/카드/타이틀 ===== */

        body.bg-gradient-primary{ background:linear-gradient(135deg,#4e73df 0%,#224abe 100%); }

        .card{ border-radius:18px; }

        .card .p-5{ padding:3rem !important; }

        h1.h4{ font-weight:800; letter-spacing:-0.3px; }

        .signup-title{ text-align:center; font-weight:800; letter-spacing:-0.3px; }

        .signup-sub{ font-size:0.85rem; }

        hr{ margin:2rem 0; }



        /* ===== 타이머 UI ===== */

        .code-input-wrapper{ position:relative; flex:1; }

        .timer-badge{

            position:absolute; right:12px; top:50%; transform:translateY(-50%);

            font-size:0.75rem; font-weight:700; color:#6c757d; background:#f1f3f5;

            padding:4px 8px; border-radius:999px; pointer-events:none;

        }

        .timer-badge.danger{ color:#e03131; background:#fff5f5; }



        /* ===== 로그인 링크 ===== */

        a[href*="/auth/login"]{ font-size:0.85rem; color:#6c757d; text-decoration:none; }

        a[href*="/auth/login"]:hover{ color:#4e73df; text-decoration:underline; }



        /* ===== 반응형 ===== */

        @media (max-width: 991px){

            .form-group{ flex-direction:column; align-items:stretch; }

            label{ width:100%; margin-bottom:6px; line-height:1.4; }

            .input-wrapper{ width:100%; max-width:100%; }

            .email-check-wrapper{ grid-template-columns:1fr; }

            .email-check-wrapper .check-btn{ width:100%; height:40px; }

            #codeBlock .check-btn{ width:100%; margin-top:6px; }

            #signupButton{ height:46px; font-size:1rem; }

        }

    </style>

</head>



<body class="bg-gradient-primary">

<div class="container">

    <div class="card o-hidden border-0 shadow-lg my-5">

        <div class="card o-hidden border-0 mt-5 mb-5">

            <div class="row">

                <div class="col-lg-7 mx-auto">

                    <div class="p-5">

                        <h1 class="h3 text-gray-900 mb-3 signup-title">회원가입</h1>

                        <p class="text-center text-muted mb-4 signup-sub">4VIDIA의 회원이 되어보세요!</p>



                        <form class="user" th:action="@{/auth/signup}" method="post"

                              onsubmit="return validateForm(event)">



                            <div class="form-group">

                                <label for="name">이름</label>

                                <div class="input-wrapper">

                                    <input type="text" id="name" name="name"

                                           class="form-control form-control-user"

                                           placeholder="이름" required

                                           oninput="updateSignupButtonState()">

                                </div>

                            </div>



                            <div class="form-group">

                                <label for="phone">전화번호</label>

                                <div class="input-wrapper">

                                    <input type="tel" id="phone" name="phone"

                                           class="form-control form-control-user"

                                           placeholder="전화번호 (숫자만 입력)" maxlength="13" required

                                           oninput="handlePhoneInput(this)">

                                </div>

                            </div>



                            <!-- ✅ 이메일: 중복확인 + 인증코드 발송/확인 -->

                            <div class="form-group">

                                <label for="email">이메일</label>

                                <div class="input-wrapper">



                                    <div class="email-check-wrapper">

                                        <input type="email" id="email" name="email"

                                               class="form-control form-control-user email-input"

                                               placeholder="이메일" required

                                               oninput="resetEmailValidation()">



                                        <button type="button" class="btn btn-secondary check-btn"

                                                id="emailDupBtn" onclick="checkEmail()">중복확인</button>



                                        <button type="button" class="btn btn-outline-primary check-btn"

                                                id="sendOrResendBtn" onclick="sendEmailCode()" disabled>

                                            인증코드 발송

                                        </button>

                                    </div>



                                    <small id="emailFeedback" class="email-feedback"></small>



                                    <div class="email-check-wrapper mt-2" id="codeBlock" style="display:none;">

                                        <div class="code-input-wrapper">

                                            <input type="text" id="emailCode"

                                                   class="form-control form-control-user email-input"

                                                   placeholder="인증코드 6자리 입력"

                                                   maxlength="6"

                                                   oninput="updateSignupButtonState()">

                                            <span id="timerBadge" class="timer-badge">03:00</span>

                                        </div>



                                        <button type="button" class="btn btn-primary check-btn"

                                                id="verifyCodeBtn" onclick="verifyEmailCode()">인증확인</button>

                                    </div>



                                    <small id="codeFeedback" class="form-feedback"></small>

                                </div>

                            </div>



                            <div class="form-group">

                                <label for="password">비밀번호</label>

                                <div class="input-wrapper password-wrapper">

                                    <input type="password" id="password" name="password"

                                           class="form-control form-control-user"

                                           placeholder="비밀번호" required

                                           pattern="^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]{8,20}$"

                                           oninput="validatePassword(); updateSignupButtonState()">

                                    <i id="passwordCheckIcon" class="fas fa-check-circle password-check-icon"></i>

                                    <small class="text-muted" style="margin-top:4px; display:block;">

                                        영문, 숫자, 특수문자 포함 8~20자

                                    </small>

                                </div>

                            </div>



                            <!-- ✅ 생년월일: 미래 날짜만 막고, '만 14세 제한' 제거 -->

                            <div class="form-group">

                                <label for="birthDate">생년월일</label>

                                <div class="input-wrapper">

                                    <input type="date" id="birthDate" name="birthDate"
                                           class="form-control form-control-user"
                                           min="1900-01-01"
                                           required>
                                </div>

                            </div>



                            <button type="submit" id="signupButton"

                                    class="btn btn-primary btn-user btn-block" disabled>

                                회원가입하기

                            </button>

                        </form>



                        <hr>

                        <a th:href="@{/auth/login}">이미 계정이 있으신가요?</a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script>
    // ===== 상태 =====
    let emailValid = false;     // 중복확인 통과
    let emailVerified = false;  // 이메일 인증 완료

    let timerInterval = null;
    let remainingSeconds = 0;

    // ===== 유틸: CSRF + AJAX 표시 =====
    function csrfHeaders() {
        const token = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
        const header = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');

        const h = {
            "Content-Type": "application/json",
            "Accept": "application/json",
            "X-Requested-With": "XMLHttpRequest"
        };
        if (token && header) h[header] = token;
        return h;
    }

    function ajaxHeaders() {
        return {
            "Accept": "application/json",
            "X-Requested-With": "XMLHttpRequest"
        };
    }

    // ===== 공통: redirect/HTML 방어 + ApiResponse 파싱 =====
    async function safeReadJsonOrThrow(res, defaultMsg) {
        // ✅ 리다이렉트(302)로 login 보내는 경우도 방어
        if (res.redirected || res.status === 302) {
            throw Object.assign(new Error("로그인이 필요하거나 서버가 리다이렉트했습니다."), {
                errorCode: "REDIRECTED",
                status: res.status,
                redirectedUrl: res.url
            });
        }

        const ct = (res.headers.get("content-type") || "").toLowerCase();

        // ✅ JSON이 아니면 HTML/기타
        if (!ct.includes("application/json")) {
            const text = await res.text().catch(() => "");
            throw Object.assign(new Error("서버 응답이 올바르지 않습니다."), {
                errorCode: "NON_JSON",
                status: res.status,
                raw: text
            });
        }

        const data = await res.json().catch(() => null);

        if (!data || !data.header) {
            throw Object.assign(new Error(defaultMsg || "요청에 실패했습니다."), {
                errorCode: "INVALID_RESPONSE",
                status: res.status,
                response: data
            });
        }

        if (data.header.isSuccessful !== true) {
            throw Object.assign(new Error(data.header.resultMessage || defaultMsg), {
                errorCode: data.header.errorCode,
                status: data.header.resultCode ?? res.status,
                response: data
            });
        }

        return data; // ApiResponse
    }

    // ✅ check-email은 ApiResponse(data=true/false) or boolean(true/false) 둘 다 올 수 있음
    async function readBooleanOrApiResponse(res, defaultMsg) {
        if (res.redirected || res.status === 302) {
            throw Object.assign(new Error("로그인이 필요하거나 서버가 리다이렉트했습니다."), {
                errorCode: "REDIRECTED",
                status: res.status,
                redirectedUrl: res.url
            });
        }

        const ct = (res.headers.get("content-type") || "").toLowerCase();

        if (!ct.includes("application/json")) {
            const text = await res.text().catch(() => "");
            throw Object.assign(new Error("서버 응답이 올바르지 않습니다."), {
                errorCode: "NON_JSON",
                status: res.status,
                raw: text
            });
        }

        const data = await res.json().catch(() => null);

        // 1) ApiResponse 형태
        if (data && data.header) {
            if (data.header.isSuccessful !== true) {
                throw Object.assign(new Error(data.header.resultMessage || defaultMsg), {
                    errorCode: data.header.errorCode,
                    status: data.header.resultCode ?? res.status,
                    response: data
                });
            }
            return data.data === true; // boolean
        }

        // 2) 순수 boolean json
        if (typeof data === "boolean") return data;

        throw Object.assign(new Error(defaultMsg || "요청에 실패했습니다."), {
            errorCode: "INVALID_RESPONSE",
            status: res.status,
            response: data
        });
    }

    // ✅ errorCode 기준 메시지 매핑
    function mapEmailAuthError(errorCode, fallbackMsg) {
        switch (errorCode) {
            case "U501": return "인증시간이 만료되었습니다. 재발송을 눌러주세요.";
            case "U503": return "인증코드가 일치하지 않습니다. 다시 확인해주세요.";
            case "U601": return "메일 발송에 실패했습니다. 잠시 후 다시 시도해주세요.";
            case "AUTH_REQUIRED": return "로그인이 필요합니다. 새로고침 후 다시 시도해주세요.";
            case "REDIRECTED": return "로그인이 필요하거나 서버가 리다이렉트했습니다. 새로고침 후 다시 시도해주세요.";
            case "NON_JSON": return "서버 응답이 올바르지 않습니다. 새로고침 후 다시 시도해주세요.";
            default: return fallbackMsg || "요청에 실패했습니다.";
        }
    }

    // ===== 타이머 =====
    function startTimer(seconds) {
        stopTimer();
        remainingSeconds = seconds;

        const badge = document.getElementById('timerBadge');
        if (badge) badge.style.display = "inline-block";

        updateTimerUI();

        timerInterval = setInterval(() => {
            remainingSeconds--;
            updateTimerUI();

            if (remainingSeconds <= 0) {
                stopTimer();

                emailVerified = false;
                const codeFeedback = document.getElementById('codeFeedback');

                // ✅ 주석 풀었음 (중요!)
                codeFeedback.textContent = "인증시간이 만료되었습니다. 재발송을 눌러주세요.";
                codeFeedback.style.color = "red";

                document.getElementById('sendOrResendBtn').disabled = false;
                document.getElementById('verifyCodeBtn').disabled = true;

                updateSignupButtonState();
            }
        }, 1000);
    }

    function updateTimerUI() {
        const mm = String(Math.floor(remainingSeconds / 60)).padStart(2, "0");
        const ss = String(remainingSeconds % 60).padStart(2, "0");

        const badge = document.getElementById('timerBadge');
        if (!badge) return;

        badge.textContent = `${mm}:${ss}`;
        if (remainingSeconds <= 30) badge.classList.add('danger');
        else badge.classList.remove('danger');
    }

    function stopTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = null;
        remainingSeconds = 0;

        const badge = document.getElementById('timerBadge');
        if (badge) badge.style.display = "none";
    }

    // ===== 전화번호 =====
    function formatPhoneNumber(value) {
        if (!value) return "";
        value = value.replace(/[^0-9]/g, '');

        if (value.length > 3 && value.length <= 7) {
            return value.substring(0, 3) + '-' + value.substring(3);
        } else if (value.length > 7) {
            return value.substring(0, 3) + '-' + value.substring(3, 7) + '-' + value.substring(7, 11);
        }
        return value;
    }

    function handlePhoneInput(input) {
        input.value = formatPhoneNumber(input.value);
        updateSignupButtonState();
    }

    // ===== 버튼 상태 업데이트 =====
    function updateSignupButtonState() {
        const name = document.getElementById('name').value.trim();
        const phoneValue = document.getElementById('phone').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password');

        const rawPhone = phoneValue.replace(/[^0-9]/g, '');
        const isPhoneValid = rawPhone.length >= 10 && rawPhone.length <= 11;
        const isPasswordValid = password.checkValidity();

        const signupButton = document.getElementById('signupButton');
        const canSubmit = name && isPhoneValid && email && isPasswordValid && emailValid && emailVerified;

        signupButton.disabled = !canSubmit;
    }

    // ===== 이메일 중복확인 (통일 버전) =====
    async function checkEmail() {
        const email = document.getElementById('email').value.trim();
        const feedback = document.getElementById('emailFeedback');
        const sendBtn = document.getElementById('sendOrResendBtn');

        const emailPattern = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]*[A-Za-z][A-Za-z0-9.-]*\.[A-Za-z]{2,}$/;
        if (!emailPattern.test(email)) {
            feedback.textContent = "올바른 이메일 형식이 아닙니다.";
            feedback.style.color = "red";
            emailValid = false;
            emailVerified = false;
            sendBtn.disabled = true;
            document.getElementById('codeBlock').style.display = "none";
            updateSignupButtonState();
            return;
        }

        feedback.textContent = "중복확인 중...";
        feedback.style.color = "#495057";

        try {
            const res = await fetch(`/auth/check-email?email=${encodeURIComponent(email)}`, {
                method: "GET",
                credentials: "same-origin",
                headers: ajaxHeaders()
            });

            // exists=true면 이미 사용중
            const exists = await readBooleanOrApiResponse(res, "이메일 중복확인에 실패했습니다.");

            if (exists) {
                feedback.textContent = "이미 사용 중인 이메일입니다.";
                feedback.style.color = "red";
                emailValid = false;
                emailVerified = false;
                sendBtn.disabled = true;
                document.getElementById('codeBlock').style.display = "none";
            } else {
                feedback.textContent = "사용 가능한 이메일입니다! 인증을 진행해주세요.";
                feedback.style.color = "green";
                emailValid = true;
                emailVerified = false;

                sendBtn.disabled = false;
                sendBtn.textContent = "인증코드 발송";
                sendBtn.classList.remove("btn-outline-secondary");
                sendBtn.classList.add("btn-outline-primary");

                document.getElementById('codeBlock').style.display = "none";
            }

            updateSignupButtonState();

        } catch (e) {
            const msg = mapEmailAuthError(e.errorCode, e.message);
            feedback.textContent = msg;
            feedback.style.color = "red";

            emailValid = false;
            emailVerified = false;
            sendBtn.disabled = true;

            updateSignupButtonState();
        }
    }

    // ===== 이메일 코드 발송 =====
    async function sendEmailCode() {
        const email = document.getElementById('email').value.trim();
        const codeFeedback = document.getElementById('codeFeedback');
        const btn = document.getElementById('sendOrResendBtn');

        if (!emailValid) {
            codeFeedback.textContent = "먼저 이메일 중복확인을 완료해주세요.";
            codeFeedback.style.color = "red";
            return;
        }

        btn.disabled = true;
        codeFeedback.textContent = "인증코드를 발송 중입니다...";
        codeFeedback.style.color = "#495057";

        try {
            const res = await fetch(`/auth/email/send-code`, {
                method: "POST",
                credentials: "same-origin",
                headers: csrfHeaders(),
                body: JSON.stringify({ email })
            });

            await safeReadJsonOrThrow(res, "인증코드 발송에 실패했습니다.");

            document.getElementById('codeBlock').style.display = "flex";
            codeFeedback.textContent = "인증코드를 발송했어요. 메일함을 확인해주세요.";
            codeFeedback.style.color = "green";

            btn.textContent = "재발송";
            btn.disabled = false;

            document.getElementById('verifyCodeBtn').disabled = false;

            emailVerified = false;
            startTimer(180);
            updateSignupButtonState();

        } catch (e) {
            const msg = mapEmailAuthError(e.errorCode, e.message);
            codeFeedback.textContent = msg;
            codeFeedback.style.color = "red";

            btn.textContent = "재발송";
            btn.disabled = false;

            updateSignupButtonState();
        }
    }

    // ===== 인증코드 확인 =====
    async function verifyEmailCode() {
        const email = document.getElementById('email').value.trim();
        const code = document.getElementById('emailCode').value.trim();
        const codeFeedback = document.getElementById('codeFeedback');

        if (code.length !== 6) {
            codeFeedback.textContent = "인증코드 6자리를 입력해주세요.";
            codeFeedback.style.color = "red";
            return;
        }

        codeFeedback.textContent = "인증코드를 확인 중입니다...";
        codeFeedback.style.color = "#495057";

        try {
            const res = await fetch(`/auth/email/verify-code`, {
                method: "POST",
                credentials: "same-origin",
                headers: csrfHeaders(),
                body: JSON.stringify({ email, code })
            });

            await safeReadJsonOrThrow(res, "인증코드가 올바르지 않거나 만료되었습니다.");

            // ✅ 성공
            emailVerified = true;
            stopTimer();

            codeFeedback.textContent = "이메일 인증이 완료되었습니다!";
            codeFeedback.style.color = "green";

            const sendBtn = document.getElementById('sendOrResendBtn');
            sendBtn.textContent = "인증 완료";
            sendBtn.disabled = true;

            document.getElementById('verifyCodeBtn').disabled = true;
            document.getElementById('emailDupBtn').disabled = true;
            document.getElementById('email').readOnly = true;

            updateSignupButtonState();

        } catch (e) {
            emailVerified = false;

            const msg = mapEmailAuthError(e.errorCode, e.message);
            codeFeedback.textContent = msg;
            codeFeedback.style.color = "red";

            // ✅ 만료(U501)이면 타이머 끄고 재발송 유도
            if (e.errorCode === "U501") {
                stopTimer();
                document.getElementById('verifyCodeBtn').disabled = true;
            } else {
                document.getElementById('verifyCodeBtn').disabled = false;
            }

            const sendBtn = document.getElementById('sendOrResendBtn');
            sendBtn.textContent = "재발송";
            sendBtn.disabled = false;

            updateSignupButtonState();
        }
    }

    // ===== 비밀번호 체크 =====
    function validatePassword() {
        const passwordInput = document.getElementById("password");
        const checkIcon = document.getElementById("passwordCheckIcon");

        if (passwordInput.value && passwordInput.checkValidity()) checkIcon.style.display = "block";
        else checkIcon.style.display = "none";
    }

    // ===== 이메일 입력 변경 시 상태 초기화 =====
    function resetEmailValidation() {
        emailValid = false;
        emailVerified = false;

        stopTimer();

        document.getElementById('emailFeedback').textContent = "중복확인을 해주세요.";
        document.getElementById('emailFeedback').style.color = "orange";

        document.getElementById('codeFeedback').textContent = "";
        document.getElementById('codeBlock').style.display = "none";

        document.getElementById('sendOrResendBtn').disabled = true;

        // UI 잠금 해제
        document.getElementById('emailDupBtn').disabled = false;
        document.getElementById('verifyCodeBtn').disabled = false;
        document.getElementById('email').readOnly = false;

        updateSignupButtonState();
    }

    // ===== 최종 폼 제출 방어 =====
    function validateForm(event) {
        if (!emailValid) { alert("이메일 중복 확인을 완료해주세요."); return false; }
        if (!emailVerified) { alert("이메일 인증을 완료해주세요."); return false; }

        const phoneInput = document.getElementById('phone');
        phoneInput.value = phoneInput.value.replace(/-/g, '');
        return true;
    }

    document.addEventListener('DOMContentLoaded', () => {
        // ✅ 생년월일: 미래 날짜 선택 방지 (로컬 시간 기준)
        const d = new Date();
        const today = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

        document.getElementById("birthDate")?.setAttribute("max", today);
        updateSignupButtonState();
    });
</script>

</body>

</html>
