<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/admin-layout}">
<head>
    <meta charset="UTF-8">
    <title>회원 상세</title>
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">

    <style>
        .badge-status {
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
<div layout:fragment="pageContent">

    <!-- 상단 제목 + 뒤로가기 -->
    <div class="d-flex justify-content-between mb-3">
        <h1 class="h3 text-gray-800 mb-0">회원 상세</h1>
        <a th:href="@{/admin/users(page=${page}, keyword=${keyword}, status=${currentStatus})}"
           class="btn btn-outline-secondary btn-sm">
            ← 목록으로
        </a>
    </div>

    <!-- 회원 기본 정보 + 상태 변경 -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">

            <!-- 회원 정보 테이블 -->
            <table class="table table-bordered mb-4">
                <tbody>
                <tr>
                    <th class="bg-light" style="width: 200px;">회원 ID</th>
                    <td th:text="${user.userId()}">1</td>
                </tr>

                <tr>
                    <th class="bg-light">아이디(이메일)</th>
                    <td th:text="${user.email()}">user@example.com</td>
                </tr>

                <tr>
                    <th class="bg-light">이름</th>
                    <td th:text="${user.name()}">홍길동</td>
                </tr>

                <tr>
                    <th class="bg-light">전화번호</th>
                    <td th:text="${user.phone()}">010-0000-0000</td>
                </tr>

                <tr>
                    <th class="bg-light">생년월일</th>
                    <td th:text="${user.birthDate()}">2000-01-01</td>
                </tr>

                <tr>
                    <th class="bg-light">등급</th>
                    <td th:text="${user.gradeName() != null ? user.gradeName() : '-'}">BASIC</td>
                </tr>

                <tr>
                    <th class="bg-light">포인트</th>
                    <td th:text="${user.point()}">0</td>
                </tr>

                <tr>
                    <th class="bg-light">현재 상태</th>
                    <td>
                        <span class="badge-status"
                              th:text="${user.status()}"
                              th:classappend="${
                                    user.status() == 'ACTIVE'  ? ' bg-primary text-white' :
                                    (user.status() == 'DORMANT' ? ' bg-warning text-dark' : ' bg-danger text-white')
                              }">
                            ACTIVE
                        </span>
                    </td>
                </tr>

                <tr>
                    <th class="bg-light">가입일</th>
                    <td th:text="${user.joinedAt()}">2025-01-01T10:00:00</td>
                </tr>

                <tr>
                    <th class="bg-light">마지막 로그인</th>
                    <td th:text="${user.lastLoginAt()}">2025-01-02T09:00:00</td>
                </tr>
                </tbody>
            </table>

            <!-- 상태 변경 폼 (배송 상세 하단 버튼 스타일처럼) -->
            <div class="d-flex justify-content-end">

                <form th:action="@{|/admin/users/${user.userId()}/status|}"
                      method="post"
                      style="display:inline-block;">

                    <!-- 상태 선택 -->
                    <div class="d-flex align-items-center">
                        <select name="status" class="form-control form-control-sm mr-2">
                            <option value="ACTIVE" th:selected="${user.status() == 'ACTIVE'}">
                                ACTIVE (활성)
                            </option>
                            <option value="DORMANT" th:selected="${user.status() == 'DORMANT'}">
                                DORMANT (휴면)
                            </option>
                            <option value="DELETED" th:selected="${user.status() == 'DELETED'}">
                                DELETED (탈퇴)
                            </option>
                        </select>

                        <!-- hidden: 목록 검색/페이지 복원용 -->
                        <input type="hidden" name="page" th:value="${page}">
                        <input type="hidden" name="keyword" th:value="${keyword}">
                        <input type="hidden" name="currentStatus" th:value="${currentStatus}">

                        <button type="submit"
                                class="btn btn-danger btn-sm"
                                onclick="return confirm('회원 상태를 변경하시겠습니까?');">
                            상태 변경
                        </button>
                    </div>

                </form>

            </div>

        </div>
    </div>

</div>
</body>
</html>
