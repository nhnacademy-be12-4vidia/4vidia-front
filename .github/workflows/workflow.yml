name: 4vidia-front
on:
  push:
    branches:
      - dev
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'

      - name: Build JAR
        run: mvn clean package -DskipTests -B

      - name: 도커 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: baejongto
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 도커 이미지 빌드와 푸시
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/4vidia-front:latest .
          docker push ghcr.io/${{ github.repository_owner }}/4vidia-front:latest
          echo "빌드완료"

      - name: 서버 배포
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.NEW_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          REDIS_PASSWORD: ${{secrets.REDIS_PASSWORD}}
          JWT_SECRET: ${{secrets.JWT_SECRET}}
          TOSS_CLIENT_KEY: ${{secrets.TOSS_CLIENT_KEY}}
        with:
          host: s2.java21.net
          username: be12-team4
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 8822
          envs: GH_TOKEN,GH_OWNER,SSH_PRIVATE_KEY,ADMIN_ID,ADMIN_PASSWORD,REDIS_PASSWORD,JWT_SECRET,TOSS_CLIENT_KEY
          script_stop: true
          script: |
            echo $GH_TOKEN | docker login ghcr.io -u baejongto --password-stdin
            cd ~
            
            
             echo "Starting 4vidia-front-green..."
            docker compose up -d 4vidia-front-1-green

            # 3. Green Health Check
            HEALTH_CHECK_COUNT=0
            while [ $HEALTH_CHECK_COUNT -lt 12 ]; do
              STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:10461/actuator/health)
              if [ "$STATUS_CODE" -eq 200 ]; then
                APP_STATUS=$(curl -s http://localhost:10461/actuator/health | grep -o '"status":"[^"]*"' | cut -d':' -f2 | tr -d '"')
                if [ "$APP_STATUS" == "UP" ]; then
                  echo "4vidia-front-green is UP."
                  break
                fi
              fi
              echo "Health check attempt $((HEALTH_CHECK_COUNT+1)) failed. Retrying in 10s..."
              sleep 10
              HEALTH_CHECK_COUNT=$((HEALTH_CHECK_COUNT+1))
            done

            if [ $HEALTH_CHECK_COUNT -eq 12 ]; then
              echo "Green container failed. Aborting deployment."
              exit 1
            fi

            # 4. Blue 트래픽 드레인
            echo "Setting Blue container DOWN in Eureka..."
            curl -X PUT "http://admin:1234@4vidia-discovery-1:8761/eureka/v2/apps/4VIDIA-FRONT/4vidia-front-2/status?value=DOWN" || true
            sleep 30

            # 5. Blue 컨테이너 중지 및 새 버전 실행
            echo "Stopping 4vidia-front-blue..."
            docker compose stop 4vidia-front-2
            echo "Starting 4vidia-front-blue..."
            docker compose up -d 4vidia-front-2

            # 6. Blue Health Check
            HEALTH_CHECK_COUNT=0
            while [ $HEALTH_CHECK_COUNT -lt 12 ]; do
              STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:10462/actuator/health)
              if [ "$STATUS_CODE" -eq 200 ]; then
                APP_STATUS=$(curl -s http://localhost:10462/actuator/health | grep -o '"status":"[^"]*"' | cut -d':' -f2 | tr -d '"')
                if [ "$APP_STATUS" == "UP" ]; then
                  echo "4vidia-front-blue is UP."
                  break
                fi
              fi
              echo "Health check attempt $((HEALTH_CHECK_COUNT+1)) failed. Retrying in 10s..."
              sleep 10
              HEALTH_CHECK_COUNT=$((HEALTH_CHECK_COUNT+1))
            done

            # 7. 불필요한 이미지 정리
            docker image prune -f