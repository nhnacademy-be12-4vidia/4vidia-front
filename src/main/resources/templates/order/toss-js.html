<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>토스 결제 요청</title>
    <script src="https://js.tosspayments.com/v2/standard"></script>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <script th:src="@{/customJs/get-cookie.js}"></script>
</head>
<body>

<div style="text-align: center; padding-top: 100px;">
    <h1>결제창을 로딩 중입니다...</h1>
    <p>잠시만 기다려주세요.</p>
</div>

<script th:inline="javascript">
    // Controller에서 전달받은 정보
    const clientKey = /*[[${tossClientKey}]]*/ 'test_client_key';
    const orderId = /*[[${orderId}]]*/ 1;      // DB에 저장된 PK (롤백용)
    const sendOrderId = /*[[${sendOrderId}]]*/ '1234567890'; // 토스용 주문번호
    const finalAmount = /*[[${payPrice}]]*/ 10000;
    const paymentMethod = /*[[${paymentMethod}]]*/ 'CARD';
    const orderName = /*[[${orderName}]]*/ "책 1권 이상 등";
    const customerEmail = /*[[${customerEmail}]]*/ "";
    const customerName = /*[[${customerName}]]*/ "";
    const customerKey =  /*[[${customerKey}]]*/ "wowString";

    const tossPayments = TossPayments(clientKey);
    const payment = tossPayments.payment({ customerKey });
    const successUrl = window.location.origin + "/payments/success?id=" + orderId;
    const failUrl = window.location.origin + "/payments/fail";

    // 롤백이 필요한지 여부를 판단하는 플래그
    let isRollbackNeeded = true;

    // 뒤로가기 방지용 히스토리 스택 추가
    history.pushState(null, null, location.href);

    // 뒤로가기 감지 이벤트 (popstate)
    window.onpopstate = function(event) {
        if (isRollbackNeeded) {
            handleRollback(); // 롤백 요청 발송
            alert("결제 과정에서 뒤로가기가 감지되어 주문이 취소되었습니다.");
            window.location.href = failUrl;
        }
    };

    // 롤백 요청 함수 fetch keepalive 사용
    const handleRollback = () => {
        if (!isRollbackNeeded) return;
        isRollbackNeeded = false;

        const rollbackUrl = window.location.origin + "/payments/rollback";
        const csrfToken = getCsrfToken();

        // fetch에 keepalive: true를 주면 페이지가 닫히거나 이동해도 요청이 취소되지 않음
        fetch(rollbackUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-XSRF-TOKEN': csrfToken
            },
            body: JSON.stringify({
                orderId: orderId,
                message: "User pressed back button or closed window"
            }),
            keepalive: true
        }).catch(err => {
            console.error("Rollback failed:", err);
        });
    };

    // 창 닫기/새로고침 감지
    window.addEventListener('pagehide', handleRollback);

    async function requestPayment() {
        const finalAmountObj = {
            currency: "KRW",
            value: finalAmount
        };

        try {
            switch (paymentMethod) {
                case "CARD":
                case "VIRTUAL_ACCOUNT":
                case "CULTURE_GIFT_CERTIFICATE":
                    await payment.requestPayment({
                        method: paymentMethod,
                        amount: finalAmountObj,
                        orderId: sendOrderId,
                        orderName: orderName,
                        customerEmail: customerEmail,
                        customerName: customerName,
                        successUrl: successUrl,
                        failUrl: failUrl,
                    });
                    break;
                default:
                    alert("선택된 결제 수단이 유효하지 않습니다: " + paymentMethod);
            }
        } catch (error) {
            // 사용자가 결제창의 X버튼을 눌러서 취소한 경우
            if (error.code === 'USER_CANCEL') {
                const csrfToken = getCsrfToken();
                fetch(window.location.origin + "/payments/rollback", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-XSRF-TOKEN': csrfToken
                    },
                    body: JSON.stringify({
                        orderId: orderId
                    })
                }).then(() => {
                    alert("결제가 취소되었습니다.");
                    window.location.href = failUrl;
                });
                isRollbackNeeded = false;
            }
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        requestPayment();
    });

</script>
</body>
</html>
