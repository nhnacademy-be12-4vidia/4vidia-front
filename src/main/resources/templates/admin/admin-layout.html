<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <title>관리자 페이지</title>
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
    <link
            href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
            rel="stylesheet">

    <style>
        .sidebar-brand {
            font-weight: 700;
            font-size: 1.2rem;
        }

        .content-wrapper {
            padding: 2rem;
        }
    </style>
</head>

<body>
<div id="wrapper">

    <!-- 사이드바 -->
    <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">
        <a class="sidebar-brand d-flex align-items-center justify-content-center mt-3" href="/admin">
            <div class="sidebar-brand-icon">
                <img src="/img/logo.png" style="max-height: 65px;" alt="logo">
            </div>
            <div class="sidebar-brand-text mx-1" style="font-size: 1.3rem;">4VIDIA</div>
        </a>

        <hr class="sidebar-divider my-3">
        <div class="sidebar-heading">
            회원
        </div>
        <li class="nav-item">
            <a class="nav-link" href="">
                <span>회원 관리</span>
            </a>
        </li>

        <hr class="sidebar-divider my-3">
        <div class="sidebar-heading">
            도서
        </div>
        <li class="nav-item">
            <a class="nav-link" href="">
                <span>도서 관리</span>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="">
                <span>도서 할인 정책 관리</span>
            </a>
        </li>

        <hr class="sidebar-divider my-3">
        <div class="sidebar-heading">
            배송
        </div>
        <li class="nav-item">
            <a class="nav-link" href="/admin/shipping">
                <span>배송 관리</span>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="/admin/refund">
                <span>반품 관리</span>
            </a>
        </li>

        <hr class="sidebar-divider my-3">
        <div class="sidebar-heading">
            할인
        </div>
        <li class="nav-item">
            <a class="nav-link" href="/admin/points">
                <span>포인트 관리</span>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="/admin/grades">
                <span>등급 적립률 관리</span>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="">
                <span>쿠폰 관리</span>
            </a>
        </li>

        <hr class="sidebar-divider d-none d-md-block">
    </ul>

    <!-- 콘텐츠 영역 -->
    <div id="content-wrapper" class="d-flex flex-column">
        <div class="content-wrapper">
            <!-- 여기만 각 페이지에서 채워 넣음 -->
            <div layout:fragment="pageContent"></div>
        </div>
    </div>

</div>
</body>
</html>
