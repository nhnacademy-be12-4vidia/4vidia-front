<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>📦 주문/배송 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .fixed-content-area {
            width: 650px;
            margin: 0 auto;
        }

        .order-status-tab {
            text-align: center;
            padding: 1rem 0.5rem;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s, background-color 0.2s;
            color: #6c757d;
            text-decoration: none;
            flex-grow: 1;
        }

        .order-status-tab:hover {
            background-color: #f8f9fa;
        }

        .order-status-tab.all-default-bg {
            background-color: #f5f5f5;
        }

        .order-status-tab.all-default-bg:hover {
            background-color: #eee;
        }

        .order-status-tab.active {
            border-bottom-color: #5b5b9e;
            font-weight: bold;
            color: #5b5b9e !important;
        }

        .order-status-tab.all-default-bg.active {
            background-color: #f5f5f5;
        }

        .tab-item-count {
            font-size: 1.5rem;
            font-weight: bold;
            line-height: 1;
        }

        .tab-item-label {
            font-size: 0.8rem;
            margin-top: 0.25rem;
        }

        .order-actions .btn {
            flex: 1;
        }

        .order-item-row {
            padding: 0.5rem;
            border-radius: 0.25rem;
            transition: box-shadow 0.3s ease;
            box-shadow: 1px 1px 3px 0px rgba(0, 0, 0, 0.05);
        }

        .order-item-row:hover {
            box-shadow: 1px 1px 5px 0px rgba(0, 0, 0, 0.1);
        }

        /* 배송 상태 배지용 연한 배경색 */
        .bg-warning-light { background-color: rgba(255, 193, 7, 0.1) !important; }
        .bg-info-light { background-color: rgba(13, 202, 240, 0.1) !important; }
        .bg-success-light { background-color: rgba(25, 135, 84, 0.1) !important; }
        .bg-secondary-light { background-color: rgba(108, 117, 125, 0.1) !important; }
        .bg-danger-light { background-color: rgba(220, 53, 69, 0.1) !important; }
    </style>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const confirmAllUrlBase = /*[[@{/mypage/order/confirm-items}]]*/ '/mypage/order/confirm-items';

        // CSRF 토큰 가져오기 (layout이나 security 설정에 따라 메타 태그에서 가져옴)
        function getCsrfToken() {
            // 1. 메타 태그 확인 (<meta name="_csrf" ...>)
            const tokenTag = document.querySelector('meta[name="_csrf"]');
            if (tokenTag) {
                return tokenTag.getAttribute("content");
            }
            // 2. 없으면 쿠키 확인 (XSRF-TOKEN)
            const match = document.cookie.match(new RegExp('(^| )XSRF-TOKEN=([^;]+)'));
            if (match) {
                return match[2];
            }
            return '';
        }

        // CSRF 헤더 이름 가져오기
        function getCsrfHeaderName() {
            const headerTag = document.querySelector('meta[name="_csrf_header"]');
            // 헤더 설정이 없으면 기본적으로 자주 쓰이는 X-XSRF-TOKEN 사용
            return headerTag ? headerTag.getAttribute("content") : 'X-XSRF-TOKEN';
        }

        $(document).ready(function () {
            // '전체 구매 확정' 버튼 클릭 이벤트 핸들러
            $('.btn-confirm-all-purchase').on('click', async function (e) {
                e.preventDefault();

                const $this = $(this);
                const orderId = $this.data('order-id');

                if (confirm(`주문번호 ${orderId}의 모든 상품을 구매 확정하시겠습니까? \n구매 확정 시 반품/교환 신청이 불가능합니다.`)) {

                    const csrfToken = getCsrfToken();
                    const csrfHeader = getCsrfHeaderName();

                    $.ajax({
                        url: `${confirmAllUrlBase}?orderId=${orderId}`,
                        type: 'POST',
                        dataType: 'json',
                        beforeSend: function(xhr) {
                            if (csrfToken) {
                                xhr.setRequestHeader(csrfHeader, csrfToken);
                            }
                        },
                        success: function (response) {
                            if (response.success) {
                                alert(`구매가 확정되었습니다. ${response.message}`);
                                window.location.reload();
                            } else {
                                alert('구매 확정에 실패했습니다: ' + (response.message || '알 수 없는 오류'));
                            }
                        },
                        error: function (xhr, status, error) {
                            alert('서버 오류로 일괄 구매 확정에 실패했습니다.');
                            console.error(`AJAX Error for order ${orderId}: `, status, error);
                        }
                    });
                }
            });

            // 주문 취소 버튼 핸들러
            $('.btn-cancel-order').on('click', function (e) {
                e.preventDefault();

                const $this = $(this);
                const orderId = $this.data('order-id');

                const csrfToken = getCsrfToken();
                const csrfHeader = getCsrfHeaderName();

                if (confirm(`주문번호 ${orderId}번 주문을 정말로 취소하시겠습니까?`)) {
                    fetch("/orders/" + orderId + "/cancel", {
                        method: "PUT",
                        headers: {
                            [csrfHeader]: csrfToken
                        },
                    })
                        .then(res => {
                            if (res.ok) {
                                alert(`주문번호 ${orderId}번 주문이 취소되었습니다.`);
                                window.location.reload();
                            } else {
                                alert('주문 취소에 실패했습니다.');
                            }
                        })
                        .catch(error => {
                            alert('서버 오류로 주문 취소에 실패했습니다.');
                            console.error("Fetch Error (Cancel Order): ", error);
                        });
                }
            });
        });
        /*]]>*/
    </script>
</head>

<body>
<div layout:fragment="content">
    <div class="container">

        <h1 class="h3 mb-4 text-gray-800 text-center">주문/배송 목록</h1>

        <div class="fixed-content-area mb-4">

            <div class="border-bottom border-top border-gray-300 bg-white">
                <div class="d-flex text-center small text-nowrap" style="overflow-x: auto;">

                    <a th:href="@{/mypage/order(status='ALL')}"
                       th:classappend="${currentStatus == 'ALL' ? 'active' : ''}"
                       class="order-status-tab d-flex flex-column align-items-center justify-content-center all-default-bg">
                        <div class="tab-item-count" th:text="${counts.total()}">0</div>
                        <div class="tab-item-label">전체주문내역</div>
                    </a>

                    <a th:href="@{/mypage/order(status='WAITING')}"
                       th:classappend="${currentStatus == 'WAITING' ? 'active' : ''}"
                       class="order-status-tab d-flex flex-column align-items-center justify-content-center">
                        <div class="tab-item-count" th:text="${counts.waiting()}">0</div>
                        <div class="tab-item-label">준비중</div>
                    </a>

                    <a th:href="@{/mypage/order(status='SHIPPING')}"
                       th:classappend="${currentStatus == 'SHIPPING' ? 'active' : ''}"
                       class="order-status-tab d-flex flex-column align-items-center justify-content-center">
                        <div class="tab-item-count" th:text="${counts.shipping()}">0</div>
                        <div class="tab-item-label">배송중</div>
                    </a>

                    <a th:href="@{/mypage/order(status='DELIVERED')}"
                       th:classappend="${currentStatus == 'DELIVERED' ? 'active' : ''}"
                       class="order-status-tab d-flex flex-column align-items-center justify-content-center">
                        <div class="tab-item-count" th:text="${counts.delivered()}">0</div>
                        <div class="tab-item-label">배송완료</div>
                    </a>

                    <a th:href="@{/mypage/order(status='CANCELED')}"
                       th:classappend="${currentStatus == 'CANCELED' ? 'active' : ''}"
                       class="order-status-tab d-flex flex-column align-items-center justify-content-center">
                        <div class="tab-item-count" th:text="${counts.canceled()}">0</div>
                        <div class="tab-item-label">취소</div>
                    </a>

                </div>
            </div>


            <div class="fixed-content-area py-3">

                <div th:if="${#lists.isEmpty(orders)}" class="text-center py-5 border rounded-lg bg-light shadow-sm">
                    <i class="fas fa-exclamation-circle fa-2x text-warning mb-3"></i>
                    <p class="text-gray-600 font-weight-bold mb-0">해당 기간에 주문한 상품이 없습니다.</p>
                </div>

                <div th:each="order : ${orders}" class="bg-white rounded-lg shadow-sm p-4 mb-4 border border-gray-200">

                    <div class="d-flex align-items-center justify-content-between mb-3 pb-3 border-bottom border-gray-200">
                        <div class="d-flex align-items-center gap-4">
                            <span class="text-gray-900 font-weight-bold"
                                  th:text="${#temporals.format(order.createdAt(), 'yyyy.MM.dd (HH:mm:ss)')}"></span>
                            <span class="text-gray-400">|</span>
                            <span class="text-gray-700 small">주문번호: <strong th:text="${order.orderId()}"></strong></span>
                        </div>
                        <span th:classappend="${order.deliveryStatus().colorClass}"
                              class="px-3 py-1 rounded-pill small font-weight-bold d-inline-flex align-items-center">
                            <i th:classappend="${order.deliveryStatus().iconClass}" class="fas fa-sm mr-2"></i>
                            <span th:text="${order.deliveryStatus().description}">배송 상태</span>
                        </span>
                    </div>

                    <div class="space-y-4">
                        <div th:each="book : ${order.orderItems()}"
                             class="d-flex gap-4 mb-3 order-item-row"
                             th:data-order-item-id="${book.orderItemId()}"
                             th:data-book-id="${book.bookId()}">

                            <a th:href="@{/books/{bookId}(bookId=${book.bookId()})}" style="text-decoration: none; flex-shrink: 0;">
                                <img th:src="${book.bookImageUrl()}" th:alt="${book.bookTitle()}"
                                     class="rounded shadow-sm" style="width: 80px; height: 112px; object-fit: cover;">
                            </a>

                            <div class="flex-grow-1 p-1 d-flex flex-column justify-content-between">
                                <div>
                                    <a th:href="@{/books/{bookId}(bookId=${book.bookId()})}" style="text-decoration: none;">
                                        <h4 class="text-gray-900 mb-1" th:text="${book.bookTitle()}" style="font-size: 1rem; font-weight: 600;"></h4>
                                    </a>
                                    <p class="text-gray-500 small mb-2" th:text="${book.bookAuthor()}"></p>
                                </div>
                                <div class="d-flex align-items-center justify-content-between pr-1">
                                    <span class="text-gray-600 small" th:text="'수량: ' + ${book.quantity()}"></span>
                                </div>
                            </div>

                            <div class="d-flex flex-column justify-content-center align-items-end gap-1" style="width: 130px; flex-shrink: 0;">

                                <span th:if="${book.isRefundProcessing()}"
                                      class="text-warning small font-weight-bold">반품 진행중</span>

                                <span th:if="${book.isRefunded()}"
                                      class="text-danger small font-weight-bold">반품 완료</span>

                                <span th:if="${book.isRefundRejected()}"
                                      class="text-secondary small font-weight-bold">반품 거절됨</span>

                                <a th:if="${book.canWriteReview()}"
                                   th:href="@{/books/{id}/reviews(id=${book.bookId()}, orderItemId=${book.orderItemId()})}"
                                   class="btn btn-primary btn-sm text-white w-100" style="font-size: 0.8rem;">
                                    리뷰 작성
                                </a>

                                <span th:if="${book.isReviewCompleted()}"
                                      class="text-primary small font-weight-bold">리뷰 작성 완료</span>

                                <span class="text-gray-900 font-weight-bold mt-1"
                                      th:text="${#numbers.formatDecimal(book.salePrice(), 0, 'COMMA', 0, 'POINT') + ' 원/권'}"></span>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4 pt-3 border-top border-gray-200 d-flex gap-2 order-actions">

                        <a th:href="@{/orders/{orderId}(orderId=${order.orderId()})}"
                           class="btn btn-light text-gray-700 shadow-sm">
                            주문 상세 보기
                        </a>

                        <a th:if="${order.canCancel()}"
                           href="#"
                           th:data-order-id="${order.orderId()}"
                           class="btn btn-danger text-white btn-cancel-order">
                            주문 취소
                        </a>

                        <a th:if="${order.canRequestRefund()}"
                           th:href="@{/orders/{orderId}/refund(orderId=${order.orderId()})}"
                           class="btn btn-outline-secondary btn-return-request">
                            반품 신청
                        </a>

                        <a th:if="${order.canConfirmPurchase()}"
                           href="#"
                           th:data-order-id="${order.orderId()}"
                           class="btn btn-success text-white btn-confirm-all-purchase">
                            전체 구매 확정
                        </a>

                    </div>

                </div>

                <div class="py-3">
                    <p class="small text-muted border-top pt-2">
                        * 배송조회는 택배사로 상품 전달 후 조회 가능합니다.
                        <br>* '전체 구매 확정' 시 해당 주문 건에 대해 반품/교환 신청이 불가능해집니다.
                    </p>
                </div>
            </div>

            <div th:if="${pageResponse.totalElements > 0}" class="d-flex justify-content-center mt-5">
                <nav aria-label="Page navigation"
                     th:with="startPage=${(pageResponse.page / 10) * 10},
                  endPage=${(startPage + 9) < (pageResponse.totalPages - 1) ? (startPage + 9) : (pageResponse.totalPages - 1)}">
                    <ul class="pagination">

                        <li class="page-item" th:classappend="${pageResponse.page == 0} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/mypage/order(page=${pageResponse.page - 1}, status=${currentStatus})}"
                               aria-label="Previous">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>

                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(startPage, endPage)}"
                            th:classappend="${i == pageResponse.page} ? 'active'">
                            <a class="page-link"
                               th:href="@{/mypage/order(page=${i}, status=${currentStatus})}"
                               th:text="${i + 1}">1</a>
                        </li>

                        <li class="page-item" th:classappend="${pageResponse.page == (pageResponse.totalPages - 1)} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/mypage/order(page=${pageResponse.page + 1}, status=${currentStatus})}"
                               aria-label="Next">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>

                    </ul>
                </nav>
            </div>

        </div>

    </div>
</div>
</body>
</html>
