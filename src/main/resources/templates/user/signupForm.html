<!DOCTYPE html>
<html lang="ko">


<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">

    <script src="/t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
</head>

<body class="bg-gradient-primary">

<div class="container">

    <div class="card o-hidden border-0 shadow-lg my-5">
        <div class="card-body p-0">
            <div class="row">
                <div class="col-lg-7 mx-auto">
                    <div class="p-5">
                        <h1 class="h4 text-gray-900 mb-4">회원가입</h1>

                        <form class="user" action="/auth/signup" method="post">
                            <div class="form-group">
                                <input type="text" name="name" class="form-control form-control-user"
                                       placeholder="이름" required>
                            </div>

                            <div class="form-group">
                                <input type="tel" name="phone" class="form-control form-control-user"
                                       value="010" placeholder="예: 01012345678" required>
                            </div>

                            <div class="form-group">
                                <input type="email" name="email" class="form-control form-control-user"
                                       placeholder="이메일" required>
                            </div>

                            <div class="form-group">
                                <input type="password" name="password" class="form-control form-control-user"
                                       placeholder="비밀번호" required>
                            </div>

                            <div class="form-group">
                                <p>생년월일</p>
                                <input type="date" name="birthDate"
                                       class="form-control form-control-user"
                                       th:max="${T(java.time.LocalDate).now()}"
                                       required>
                            </div>

                            <hr>

                            <button class="btn btn-primary btn-user btn-block">
                                회원가입하기
                            </button>
                        </form>

                        <hr>
                        <a th:href="@{/auth/login}" class="small">이미 계정이 있으신가요?</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
