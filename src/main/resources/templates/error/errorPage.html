<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center; /* 세로 중앙 */
            align-items: center;     /* 가로 중앙 */
            height: 100vh;           /* 화면 전체 높이 사용 */
            margin: 0;
            background-color: #ffffff; /* 완전 흰색 배경 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #333333; /* 눈이 편한 진한 회색 */
        }

        h1 {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        p {
            font-size: 16px;
            color: #666666; /* 제목보다 연한 회색 */
            margin-bottom: 30px;
        }

        /* 텍스트 스타일의 '뒤로가기' 링크 */
        a {
            text-decoration: none;
            color: #000000;
            border-bottom: 1px solid #000000; /* 밑줄로 버튼 느낌 */
            padding-bottom: 2px;
            font-size: 14px;
            transition: opacity 0.3s;
        }

        a:hover {
            opacity: 0.6;
        }
    </style>
</head>
<body>

<h1>Oops!</h1>

<p th:text="${errorMessage}">요청을 처리하는 중 문제가 발생했습니다.</p>

<a href="javascript:history.back()">이전 페이지로 돌아가기</a>

</body>
</html>
