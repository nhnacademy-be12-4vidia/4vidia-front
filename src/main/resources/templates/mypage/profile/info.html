<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>내 정보</title>

    <style>
        .grade-strip { display:flex; gap:10px; align-items:flex-end; overflow-x:auto; padding-bottom:6px; -webkit-overflow-scrolling:touch; }
        .grade-item { flex:0 0 auto; width:84px; border-radius:14px; border:2px solid #e9ecef; background:#fff; cursor:pointer;
            transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease; position:relative; }
        .grade-item:hover { transform: translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.08); }
        .grade-item.active { border-color:#0d6efd; box-shadow:0 8px 22px rgba(13,110,253,.16); }
        .grade-bar { width:100%; border-radius:12px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:26px; height:96px; background:#fff; }
        .grade-label { text-align:center; margin-top:6px; font-size:.82rem; font-weight:700; padding-bottom:6px; white-space:nowrap; }
        @media (max-width:480px){ .grade-item{width:74px;} .grade-bar{height:86px;font-size:22px;} }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-auto">
            <div class="fixed-container" style="width: 600px; margin: 0 auto;">

                <h2 class="mt-4 mb-4 text-primary fw-bold">내 정보</h2>

                <div class="card shadow-sm">
                    <div class="card-body">

                        <form method="post" th:action="@{/mypage/profile}" th:object="${request}" onsubmit="return removeHyphenBeforeSubmit()">
                            <input type="hidden" name="_method" value="put">

                            <table class="table table-bordered mb-4">
                                <tbody>
                                <tr>
                                    <th class="bg-light" style="width: 200px;">아이디(email)</th>
                                    <td th:text="${user.email}"></td>
                                </tr>

                                <tr>
                                    <th class="bg-light" style="width: 200px;">이름</th>
                                    <td>
                                        <input type="text" class="form-control" th:field="*{name}" placeholder="사용할 별칭 입력" required>
                                        <div class="text-danger small mt-1" th:errors="*{name}"></div>
                                    </td>
                                </tr>

                                <tr>
                                    <th class="bg-light" style="width: 200px;">전화번호</th>
                                    <td>
                                        <script th:inline="javascript">
                                            const successMessage = /*[[${message}]]*/ null;
                                            if (successMessage) { alert(successMessage); }
                                        </script>

                                        <input type="tel" id="phone" class="form-control"
                                               th:field="*{phone}"
                                               placeholder="예: 010-1234-5678"
                                               maxlength="13"
                                               required
                                               pattern="010-\\d{4}-\\d{4}"
                                               oninput="handlePhoneInput(this)">
                                        <div class="text-danger small mt-1" th:errors="*{phone}"></div>
                                    </td>
                                </tr>

                                <tr>
                                    <th class="bg-light" style="width: 200px;">생년월일</th>
                                    <td th:text="${user.birthDate}"></td>
                                </tr>

                                <tr>
                                    <th class="bg-light" style="width: 200px;">포인트</th>
                                    <td th:text="${#numbers.formatDecimal(user.point(), 0, 'COMMA', 0, 'POINT')} + ' P'"></td>
                                </tr>

                                <tr>
                                    <th class="bg-light" style="width: 200px;">등급</th>
                                    <td>
                                        <!-- ✅ 부트스트랩이 모달을 직접 열게 (JS 죽어도 뜸) -->
                                        <a href="javascript:void(0);"
                                           id="gradeBadge"
                                           class="badge rounded-pill bg-info text-white"
                                           style="text-decoration:none; cursor:pointer; padding: 8px 12px;"
                                           th:attr="data-grade=${user.gradeName}"
                                           data-bs-toggle="modal"
                                           data-bs-target="#gradeInfoModal">
                                            <span th:text="${user.gradeName}">WELCOME</span>
                                        </a>
                                        <span class="text-muted ms-2" style="font-size: 0.9rem;">(클릭해서 등급 안내 보기)</span>
                                    </td>
                                </tr>

                                <tr>
                                    <th class="bg-light" style="width: 200px;">기본주소</th>
                                    <td>
                                        <th:block th:if="${user.defaultAddress() != null}">
                                            <div class="mb-1">
                                                별칭: <span th:text="${user.defaultAddress().alias()}"></span>
                                            </div>
                                            <div>
                                                주소:
                                                <span th:text="|(${user.defaultAddress().zipCode()}) ${user.defaultAddress().roadAddress()} ${user.defaultAddress().addressDetail()}|"></span>
                                            </div>
                                        </th:block>

                                        <th:block th:unless="${user.defaultAddress() != null}">
                                            <span class="text-muted">설정된 기본 주소가 없습니다.</span>
                                        </th:block>
                                    </td>
                                </tr>

                                </tbody>
                            </table>

                            <div class="d-flex justify-content-between">
                                <button type="submit" class="btn btn-primary">회원정보 수정</button>
                                <a class="btn btn-secondary" th:href="@{/mypage/profile/password}">비밀번호 변경</a>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>


    <!-- ✅ 등급 안내 모달 -->
    <div class="modal fade" id="gradeInfoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content shadow">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">
                        등급 혜택 안내 - <span id="gradeTitle" class="text-primary">WELCOME</span>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <div class="mb-2 badge bg-light text-dark border" id="gradeDesc"
                         style="font-size: 0.9rem; font-weight: normal; padding: 0.5em;">
                        기본 등급
                    </div>

                    <div class="grade-strip mb-3" id="gradeStrip"></div>

                    <div class="card border-0 shadow-sm mb-3" style="background:#f8f9fa;">
                        <div class="card-body py-3">
                            <div class="d-flex align-items-center justify-content-between mb-2">
                                <div class="fw-bold" style="font-size: 0.95rem;">
                                    선택 등급: <span id="gdName" class="text-primary">WELCOME</span>
                                </div>
                                <span class="badge bg-white text-dark border">
                                    적립률 <span id="gdRate" class="text-danger fw-bold">1</span>%
                                </span>
                            </div>

                            <div class="text-muted" style="font-size:0.85rem;">기준</div>
                            <div class="fw-semibold" id="gdRange" style="font-size:0.9rem;">0원 ~ 99,999원</div>

                            <div class="text-muted mt-2" style="font-size:0.85rem;">설명</div>
                            <div class="fw-semibold" id="gdDesc" style="font-size:0.9rem;">기본 등급</div>

                            <div class="text-muted mt-2" style="font-size:0.85rem;">혜택</div>
                            <div class="fw-semibold" id="gdBenefit" style="font-size:0.9rem;">
                                결제 시 순수 주문 금액의 1% 적립
                            </div>
                        </div>
                    </div>

                    <div class="p-3 bg-light rounded border">
                        <div class="fw-bold mb-2" style="font-size: 0.9rem;">💡 순수 주문 금액이란?</div>
                        <div style="font-size: 0.9rem; color: #555;">
                            <span class="fw-bold">총 주문 금액</span>에서 아래 항목을 제외한 금액
                        </div>
                        <div class="mt-2 fw-bold text-center border-top pt-2"
                             style="font-size: 0.9rem;">
                            (쿠폰 + 배송비 + 취소 금액 + 포장비)
                        </div>
                    </div>

                    <div class="mt-3 text-muted" style="font-size: 0.85rem;">
                        ※ 등급은 <strong>매월 1일</strong>, 최근 3개월 실적을 기준으로 갱신됩니다.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ✅ Bootstrap5 bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // ✅ 프론트 서버 endpoint로 정책을 받아오자 (Front Controller에서 BackendApiClient로 호출)
        // 너희가 만들 프론트 endpoint 예시: /mypage/grade/policies
        // (여기 URL만 네가 실제로 만든 경로로 맞추면 됨)
        const GRADE_POLICIES_URL = "/mypage/profile/grade/policies";


        const GRADE_COLOR = {
            WELCOME:  "#5bc0de",
            REGULAR:  "#ff6b6b",
            ROYAL:    "#ff922b",
            GOLD:     "#ffd43b",
            PLATINUM: "#adb5bd"
        };

        let GRADE_POLICY = {};
        let GRADE_ORDER = [];

        function formatWon(n) {
            return (n ?? 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",") + "원";
        }

        function rangeText(p) {
            return (p.max == null) ? `${formatWon(p.min)} 이상` : `${formatWon(p.min)} ~ ${formatWon(p.max)}`;
        }

        async function fetchPoliciesNoCache() {
            // ✅ 캐시 방지(관리자 수정 즉시 반영 목적)
            const res = await fetch(`${GRADE_POLICIES_URL}?t=${Date.now()}`, {
                method: "GET",
                headers: { "Accept": "application/json" },
                cache: "no-store"
            });

            if (!res.ok) {
                const txt = await res.text().catch(() => "");
                console.error("정책 조회 실패:", res.status, txt);
                throw new Error("정책 조회 실패");
            }
            return res.json();
        }

        function buildPolicyMap(list) {
            GRADE_POLICY = {};
            GRADE_ORDER = [];

            list.forEach(p => {
                GRADE_ORDER.push(p.gradeName);
                GRADE_POLICY[p.gradeName] = {
                    min: p.minNetAmount,
                    max: p.maxNetAmount,
                    rate: p.pointRate,
                    desc: p.desc
                };
            });
        }

        function renderGradeStrip(currentGrade) {
            const strip = document.getElementById("gradeStrip");
            if (!strip) return;

            strip.innerHTML = "";

            const baseHeight = 68;
            const step = 10;

            GRADE_ORDER.forEach((g, idx) => {
                const p = GRADE_POLICY[g];
                if (!p) return;

                const item = document.createElement("div");
                item.className = "grade-item" + (g === currentGrade ? " active" : "");
                item.dataset.grade = g;

                const bar = document.createElement("div");
                bar.className = "grade-bar";
                const color = GRADE_COLOR[g] || "#dee2e6";
                bar.style.border = `2px solid ${color}`;
                bar.style.color = color;
                bar.style.height = (baseHeight + step * idx) + "px";
                bar.textContent = g[0];

                const label = document.createElement("div");
                label.className = "grade-label";
                label.style.color = color;
                label.textContent = g;

                item.appendChild(bar);
                item.appendChild(label);

                item.addEventListener("click", () => selectGrade(g));
                strip.appendChild(item);
            });
        }

        function selectGrade(gradeName) {
            const policy = GRADE_POLICY[gradeName] || GRADE_POLICY["WELCOME"];
            if (!policy) return;

            document.getElementById("gradeTitle").innerText = gradeName;
            document.getElementById("gradeDesc").innerText = policy.desc;

            document.getElementById("gdName").innerText = gradeName;
            document.getElementById("gdRate").innerText = policy.rate;
            document.getElementById("gdRange").innerText = rangeText(policy);
            document.getElementById("gdDesc").innerText = policy.desc;
            document.getElementById("gdBenefit").innerText = `결제 시 순수 주문 금액의 ${policy.rate}% 적립`;

            renderGradeStrip(gradeName);
        }

        // ✅ 모달이 열릴 때마다 "항상 최신 정책"을 다시 받아서 반영
        const modalEl = document.getElementById("gradeInfoModal");
        modalEl.addEventListener("shown.bs.modal", async () => {
            const badge = document.getElementById("gradeBadge");
            const currentGrade = badge?.getAttribute("data-grade") || "WELCOME";

            try {
                const list = await fetchPoliciesNoCache();
                buildPolicyMap(list);
                selectGrade(currentGrade);
            } catch (e) {
                // 실패해도 모달은 떠있으니 안내만
                console.error(e);
                document.getElementById("gradeTitle").innerText = currentGrade;
                document.getElementById("gradeDesc").innerText = "등급 정책을 불러오지 못했어요.";
            }
        });
    </script>
</div>
</body>
</html>
