<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <title>4VIDIA Bookstore</title>

    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,500,600,700,800,900"
          rel="stylesheet">
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body id="page-top">

<div id="wrapper">

    <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">

        <a class="sidebar-brand d-flex align-items-center justify-content-center mt-3" href="/">
            <div class="sidebar-brand-icon">
                <img src="/img/logo.png" style="max-height: 65px;" alt="logo">
            </div>
            <div class="sidebar-brand-text mx-1" style="font-size: 1.3rem;">4VIDIA</div>
        </a>

        <hr class="sidebar-divider my-3">

        <div class="sidebar-heading">Interface</div>

        <li class="nav-item" th:classappend="${currentUri.startsWith('/mypage') ? 'active' : ''}">
            <a class="nav-link collapsed" href="#" data-toggle="collapse" data-target="#collapse1">
                <i class="fas fa-fw fa-user-cog"></i>
                <span>마이페이지</span>
            </a>
            <div id="collapse1" class="collapse" th:classappend="${currentUri.startsWith('/mypage') ? 'show' : ''}">
                <div class="bg-white py-2 collapse-inner rounded">
                    <a class="collapse-item" th:href="@{/mypage/profile}" th:classappend="${currentUri == '/mypage/profile' ? 'active' : ''}">
                        <i class="fas fa-id-card fa-fw mr-1"></i>
                        회원정보
                    </a>
                    <a class="collapse-item" th:href="@{/mypage/address}" th:classappend="${currentUri == '/mypage/address' ? 'active' : ''}">
                        <i class="fas fa-map-marker-alt fa-fw mr-1"></i>
                        회원주소 관리
                    </a>
                    <a class="collapse-item" th:href="@{/mypage/order}" th:classappend="${currentUri == '/mypage/order' ? 'active' : ''}">
                        <i class="fas fa-box-open fa-fw mr-1"></i>
                        주문/배송 관리
                    </a>
                    <a class="collapse-item" th:href="@{/mypage/refund-history}" th:classappend="${currentUri == '/mypage/refund-history' ? 'active' : ''}">
                        <i class="fas fa-clipboard-list fa-fw mr-1"></i>
                        반품 조회
                    </a>
                    <a class="collapse-item" th:href="@{/mypage/point}" th:classappend="${currentUri == '/mypage/point' ? 'active' : ''}">
                        <i class="fas fa-coins fa-fw mr-1"></i>
                        포인트 내역
                    </a>
                    <a class="collapse-item" th:href="@{/mypage/like}" th:classappend="${currentUri == '/mypage/like' ? 'active' : ''}">
                        <i class="fas fa-heart fa-fw mr-1"></i>
                        좋아요 리스트
                    </a>
                    <a class="collapse-item" th:href="@{/mypage/deactivate}" th:classappend="${currentUri == '/mypage/deactivate' ? 'active' : ''}">
                        <i class="fas fa-user-times fa-fw mr-1"></i>
                        회원 탈퇴
                    </a>
                </div>
            </div>
        </li>

        <hr class="sidebar-divider d-none d-md-block">

        <li class="nav-item">
            <a class="nav-link" href="/admin">
                <i class="fas fa-fw fa-cog"></i>
                <span>관리자 페이지</span>
            </a>
        </li>

        <hr class="sidebar-divider d-none d-md-block">

        <div class="text-center d-none d-md-inline">
            <button class="rounded-circle border-0" id="sidebarToggle"></button>
        </div>

    </ul>
    <div id="content-wrapper" class="d-flex flex-column">

        <div id="content">

            <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">

                <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3">
                    <i class="fa fa-bars"></i>
                </button>

              <form th:action="@{/books/search}" method="get"
                    class="d-none d-sm-inline-block form-inline mr-auto ml-md-3 my-2 my-md-0 mw-100 navbar-search"
                    style="width: 70%; max-width: 40rem;">

                <div class="d-flex align-items-center w-100">
                  <div class="input-group flex-grow-1" style="width: auto;">
                    <input type="text"
                           class="form-control bg-light border-0 small"
                           placeholder="도서 검색..."
                           name="keyword"
                           th:value="${param.keyword}">
                    <div class="input-group-append">
                      <button class="btn btn-primary" type="submit">
                        <i class="fas fa-search fa-sm"></i>
                      </button>
                    </div>
                  </div>

                  <div class="custom-control custom-switch ml-2" style="white-space: nowrap;">
                    <input class="custom-control-input"
                           type="checkbox"
                           id="useSemanticCheck"
                           name="useSemantic"
                           value="true"
                           th:checked="${param.useSemantic}">
                    <label class="custom-control-label small mb-0" for="useSemanticCheck">
                      AI 검색 사용
                    </label>
                  </div>
                </div>
              </form>


                <ul class="navbar-nav ml-auto ">
                    <li class="nav-item dropdown no-arrow mx-1">
                        <a class="nav-link toggle" th:href="@{/cart}">
                            <i class="fas fa-shopping-cart fa-fw"></i>
<!--                            <span class="badge badge-danger badge-counter">3</span>-->
                        </a>
                    </li>

                    <div class="topbar-divider d-none d-sm-block"></div>

                    <li class="nav-item dropdown no-arrow" th:if="${session.accessToken != null}">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                           data-toggle="dropdown">
                            <span class="mr-2 d-none d-lg-inline text-gray-600 small"
                                  th:text="${userName} + 님">유저이름</span>
                        </a>
                        <div class="dropdown-menu dropdown-menu-right shadow animated--grow-in">
                            <a class="dropdown-item" th:href="@{/mypage/profile}">
                                <i class="fas fa-user fa-sm fa-fw mr-2 text-gray-400"></i>
                                마이페이지
                            </a>
                            <a class="dropdown-item" th:href="@{/mypage/order}">
                                <i class="fas fa-cogs fa-sm fa-fw mr-2 text-gray-400"></i> 주문내역
                            </a>
                            <a class="dropdown-item" href="#">
                                <i class="fas fa-list fa-sm fa-fw mr-2 text-gray-400"></i> 내 쿠폰함
                            </a>
                        </div>
                    </li>

                    <li class="nav-item mx-2 d-flex align-items-center" th:if="${session.accessToken == null}">
                        <a class="btn btn-primary btn-sm" th:href="@{/auth/login}">
                            <i class="fas fa-sign-in-alt mr-1"></i> 로그인
                        </a>
                    </li>

                    <li class="nav-item mx-2 d-flex align-items-center" th:if="${session.accessToken != null}">
                        <form th:action="@{/auth/logout}" method="post">
                            <button class="btn btn-danger btn-sm" type="submit">
                                <i class="fas fa-sign-out-alt mr-1"></i> 로그아웃
                            </button>
                        </form>
                    </li>
                </ul>
            </nav>


            <div layout:fragment="content">
                <div class="container-fluid">
                    <div class="row">
                        (여기는 기본 내용입니다)
                    </div>
                </div>
            </div>

        </div>

        <footer class="sticky-footer bg-white">
            <div class="container my-auto">
                <div class="copyright text-center my-auto">
                    © 2025 Team4 4VIDIA | NHN Academy Project
                </div>
            </div>
        </footer>

    </div>
</div>

<a class="scroll-to-top rounded" href="#page-top">
    <i class="fas fa-angle-up"></i>
</a>

<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
<script th:src="@{/js/sb-admin-2.min.js}"></script>

</body>
</html>
