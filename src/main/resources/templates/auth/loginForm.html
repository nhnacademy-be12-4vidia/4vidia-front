<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <title>로그인</title>

    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <link href="/css/sb-admin-2.min.css" rel="stylesheet">
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">

    <style>
        /* [공통] 배경색 설정 */
        body.light-bg {
            background-color: #f8fafc;
            min-height: 100vh;
        }

        /* [카드] 테두리 색상 변경 (민트+에메랄드 톤) */
        .card.o-hidden {
            background-color: #f8fafc !important;
            /* ▼ 여기를 변경했습니다 ▼ */
            /*border: 1px solid #000000 !important; !* 상쾌한 에메랄드 그린, 두께 2px *!*/
            /*box-shadow: none !important;*/
        }

        /* [버튼] 로그인 (인디고 블루) */
        .btn-primary {
            background-color: #49689b !important;
            border-color: #49689b !important;
            font-weight: 800;
        }
        .btn-primary:hover {
            background-color: #324463 !important;
            border-color: #324463 !important;
        }

        /* [버튼] PAYCO (차분한 레드) */
        .btn-payco {
            background-color: #f10000 !important;
            border-color: #b52b27 !important;
            color: #ffffff !important;
            font-weight: 800;
        }
        .btn-payco:hover {
            background-color: #94221f !important;
            border-color: #94221f !important;
            color: #ffffff !important;
        }

        /* 기타 스타일 정리 */
        .login-links a {
            color: #6e707e;
            font-size: 0.85rem;
            text-decoration: none;
            font-weight: 800;
        }
        .login-links a:hover {
            color: #49689b;
            text-decoration: underline;
        }
        .order-guest .h6 {
            font-weight: bold;
            color: #49689b;
            margin-bottom: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .guest-order-toggle { cursor: pointer; transition: color 0.2s; }
        .guest-order-toggle:hover { color: #324463 !important; }
        .guest-order-toggle .fas { transition: transform 0.3s; margin-left: 0.5rem; }
        .guest-order-toggle.opened .fas { transform: rotate(180deg); }
        hr { border-top: 1px solid #e3e6f0; }
        .form-group label { font-size: 0.8rem; font-weight: 800; color: #6e707e; }
        .form-control-user {
            border-radius: 0.6rem !important;
        }

    </style>
</head>

<body class="light-bg">

<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-lg-6 col-md-8">
            <div class="card o-hidden border-0">
                <div class="card-body p-0">
                    <div class="p-5">
                        <div class="text-center">
                            <div class="d-flex align-items-center justify-content-center mb-5">
                                <img src="/img/final_logo.png" alt="로고" style="height: 70px; margin-right: 15px;">
                                <h1 class="h1 text-gray-900 mb-0"><b>4VIDIA</b></h1>
                            </div>
<!--                            <p class="text-gray-600 mb-4">로그인하여 서비스를 이용하세요</p>-->
                        </div>

                        <form class="user" action="/auth/login" method="post">
                            <div th:if="${loginError}" class="alert alert-danger text-center">
                                <span th:text="${loginError}"></span>
                            </div>

                            <div class="form-group">
                                <input type="email" name="email" class="form-control form-control-user" placeholder="Enter Email Address...">
                            </div>
                            <div class="form-group">
                                <input type="password" name="password" class="form-control form-control-user" placeholder="Password">
                            </div>

                            <button type="submit" class="btn btn-primary btn-user btn-block">로그인</button>

                            <a href="/login/payco" class="btn btn-payco btn-user btn-block">
                                <i class="fas fa-sign-in-alt"></i> PAYCO 로그인
                            </a>

                            <a href="/" class="btn btn-secondary btn-user btn-block">메인 페이지로 돌아가기</a>
                        </form>

                        <hr class="my-4">

                        <div class="text-center order-guest">
                            <h6 class="h6 guest-order-toggle">
                                비회원 주문 조회 <i class="fas fa-chevron-down"></i>
                            </h6>
                        </div>

                        <div id="guestOrderFormWrapper" th:style="${errorMessage} ? 'display: block;' : 'display: none;'">
                            <form class="order-guest" action="/orders/guest" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <div class="form-group">
                                    <label>주문 번호</label>
                                    <input type="text" name="orderId" class="form-control form-control-user" placeholder="주문 번호를 입력하세요." required>
                                </div>
                                <div class="form-group">
                                    <label>비밀번호</label>
                                    <input type="password" name="orderPassword" class="form-control form-control-user" placeholder="비밀번호를 입력하세요.">
                                </div>
                                <button type="submit" class="btn btn-info btn-user btn-block mt-3">비회원 주문 조회</button>
                            </form>
                        </div>

                        <div class="text-center mt-4 login-links">
                            <a href="/auth/find-id" class="mx-2">아이디 찾기</a> |
                            <a href="/auth/find-password" class="mx-2">비밀번호 찾기</a> |
                            <a href="/auth/signup" class="mx-2">회원가입</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script>
    $(document).ready(function() {
        const $wrapper = $('#guestOrderFormWrapper');
        const $toggleElement = $('.guest-order-toggle');
        $toggleElement.on('click', function() {
            $wrapper.slideToggle(400, function() {
                $toggleElement.toggleClass('opened');
            });
        });
    });
</script>


<script th:if="${alertMessage}" th:inline="javascript">
    alert([[${alertMessage}]]);
</script>



</body>
</html>
