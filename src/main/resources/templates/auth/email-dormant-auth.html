<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>휴면 계정 메일 인증</title>

    <!-- 파비콘 설정 -->
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">

    <style>
        body.light-bg {
            background-color: #f8fafc;
            min-height: 100vh;
        }

        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            background-color: #ffffff;
        }

        .card-body {
            padding: 2rem;
            color: #2c3e50;
        }

        .text-center { text-align: center; }

        .small-guide {
            font-size: 0.85rem;
            color: #6c757d;
        }

        .btn-user {
            border-radius: 0.35rem;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .btn-primary {
            background-color: #2c3e50;
            border: none;
            color: #fff;
        }

        .btn-primary:hover { background-color: #1a252f; }

        .btn-success {
            background-color: #1cc88a;
            border: none;
            color: #fff;
        }

        .btn-success:hover { background-color: #17a673; }

        .alert { border-radius: 0.5rem; font-weight: 600; }

        @media (max-width: 576px) {
            .card-body { padding: 1.5rem 1rem; }
            .btn-user { font-size: 0.85rem; padding: 0.45rem 0; }
        }
    </style>
</head>

<body class="light-bg">

<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-lg-8 col-md-10">
            <div class="card">
                <div class="card-body">

                    <div class="text-center mb-4">
                        <h1 class="h4 text-gray-900 mb-3">메일로 휴면 인증</h1>
                    </div>

                    <!-- 인증코드 전송 성공 메시지 -->
                    <div th:if="${param.sent}" class="alert alert-info text-center">
                        <i class="fas fa-envelope mr-1"></i>
                        입력하신 메일 주소로 인증코드가 발송되었습니다.
                    </div>

                    <!-- 인증코드 오류 메시지 -->
                    <div th:if="${param.errorMsg}" class="alert alert-danger text-center">
                        <i class="fas fa-exclamation-circle mr-1"></i>
                        <span th:text="${param.errorMsg}"></span>
                    </div>

                    <!-- 인증 성공 메시지 -->
                    <div th:if="${param.success}" class="alert alert-success text-center">
                        <i class="fas fa-check-circle mr-1"></i>
                        휴면 계정 인증이 완료되었습니다!
                        <div class="mt-3">
                            <a href="/auth/login" class="btn btn-success btn-sm">로그인 하러 가기</a>
                        </div>
                    </div>

                    <!-- 이메일 입력 -->
                    <form class="user mb-4"
                          th:action="@{/auth/dormant/send-code/email}"
                          method="post"
                          onsubmit="syncEmail()">

                        <div class="form-group">
                            <input type="email"
                                   id="contactEmail"
                                   name="contactEmail"
                                   class="form-control form-control-user"
                                   placeholder="인증코드를 받을 이메일 입력"
                                   required>
                        </div>

                        <input type="hidden" id="email" name="email"/>

                        <button type="submit" class="btn btn-primary btn-user btn-block">
                            인증코드 전송
                        </button>
                    </form>

                    <hr>

                    <form class="user" th:action="@{/auth/dormant/verify/email}" method="post">
                        <input type="hidden" name="email" th:value="${email}"/>

                        <div class="form-group">
                            <input type="text" name="code"
                                   class="form-control form-control-user"
                                   placeholder="인증코드 입력" maxlength="8" required>
                        </div>

                        <button type="submit" class="btn btn-success btn-user btn-block">
                            휴면 해제하기
                        </button>
                    </form>

                    <hr>

                    <div class="text-center">
                        <a class="small" href="/auth/dormant-auth">
                            Dooray로 인증하기
                        </a>
                    </div>
                    <div class="text-center mt-2">
                        <a class="small" href="/auth/login">로그인 페이지로 돌아가기</a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function syncEmail() {
        const contactEmail = document.getElementById("contactEmail").value;
        document.getElementById("email").value = contactEmail;
    }
</script>
</body>
</html>
