<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Test Page</title>
    <script>
        function fetchData() {
            fetch('/test')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('test').textContent = JSON.stringify(data, null, 2);
                })
                .catch(error => {
                    document.getElementById('test').textContent = 'Error: ' + error;
                });
        }
    </script>
</head>
<body>
<h1>Test API Call</h1>
<button onclick="fetchData()">Fetch JSON</button>
<pre id="test"></pre>
</body>
</html>
