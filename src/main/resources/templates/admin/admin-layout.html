<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="utf-8">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <title>관리자 페이지</title>

    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" />

    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
          rel="stylesheet">
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        /* 1. 전체 화면 레이아웃 고정 (브라우저 스크롤 제거) */
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        #wrapper {
            height: 100vh;
            display: flex;      /* 좌우 배치 */
            overflow: hidden;   /* 자식 요소 스크롤 제어 */
            width: 100%;
        }

        /* 2. 사이드바 독립 스크롤 설정 */
        #accordionSidebar {
            height: 100%;
            width: 14rem;        /* 펼쳤을 때 너비 */
            min-width: 14rem;
            flex-shrink: 0;

            display: flex;
            flex-direction: column;

            overflow-y: auto;    /* 세로 스크롤 허용 */
            overflow-x: hidden;  /* 가로 스크롤 방지 */

            transition: all 0.3s;
            z-index: 10;
        }

        /* 사이드바가 접혔을 때(.toggled) 스타일 */
        #accordionSidebar.toggled {
            width: 6.5rem !important;
            min-width: 6.5rem !important;
            /* 중요: 접혔을 때는 메뉴 팝업이 보여야 하므로 visible로 변경 */
            overflow: visible !important;
        }

        /* 사이드바 스크롤바 디자인 (크롬/사파리) */
        #accordionSidebar::-webkit-scrollbar { width: 5px; }
        #accordionSidebar::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        /* 3. 메인 컨텐츠 영역 독립 스크롤 설정 */
        #content-wrapper {
            flex-grow: 1;
            height: 100%;
            min-width: 0;

            display: flex;
            flex-direction: column;

            overflow-y: auto;    /* 컨텐츠만 따로 스크롤 */
            overflow-x: hidden;
            position: relative;
            background-color: #f8f9fc;
        }

        /* 기존 스타일 유지 */
        /* .sidebar-brand { ... } 부분을 삭제하여 메인 페이지와 동일하게 만듦 */

        .content-inner-padding {
            padding: 2rem;
        }
        .nav-link i {
            margin-right: 0.5rem;
        }

        /* 4VIDIA 로고 텍스트 완전 통일 */
        .brand-4vidia {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont,
            "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 0.05rem;
            text-transform: uppercase;
            line-height: 1;
            color: #fff;
        }
    </style>
</head>

<body id="page-top">
<div id="wrapper">

    <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">
        <a class="sidebar-brand d-flex align-items-center justify-content-center mt-3" href="/">
            <div class="sidebar-brand-icon">
                <img src="/img/logo.png" style="max-height: 65px;" alt="logo">
            </div>
            <div class="sidebar-brand-text mx-1 brand-4vidia">4VIDIA</div>
        </a>

        <hr class="sidebar-divider my-3">

        <div class="sidebar-heading">
            통합 관리
        </div>

        <li class="nav-item" th:classappend="${currentUri != null && currentUri.startsWith('/admin/users')} ? 'active'">
            <a class="nav-link" href="/admin/users">
                <i class="fas fa-fw fa-users"></i>
                <span>회원 관리</span>
            </a>
        </li>

        <li class="nav-item"
            th:with="isBooksActive=${currentUri != null && (currentUri.startsWith('/admin/books') or currentUri.startsWith('/admin/reviews') or currentUri.startsWith('/admin/categories') or currentUri.startsWith('/admin/discount-policies'))}"
            th:classappend="${isBooksActive} ? 'active'">

            <a class="nav-link" th:classappend="${!isBooksActive} ? 'collapsed'"
               href="#"
               data-bs-toggle="collapse" data-bs-target="#collapseBooks"
               th:aria-expanded="${isBooksActive} ? 'true' : 'false'"
               aria-controls="collapseBooks">
                <i class="fas fa-fw fa-book"></i>
                <span>도서 관리</span>
            </a>

            <div id="collapseBooks" class="collapse" th:classappend="${isBooksActive} ? 'show'"
                 aria-labelledby="headingBooks" data-bs-parent="#accordionSidebar">
                <div class="bg-white py-2 collapse-inner rounded">
                    <h6 class="collapse-header">도서 관련 기능:</h6>
                    <a class="collapse-item" href="/admin/books" th:classappend="${currentUri != null && currentUri == '/admin/books'} ? 'active'">도서 등록</a>
                    <a class="collapse-item" href="/admin/discount-policies" th:classappend="${currentUri != null && currentUri.startsWith('/admin/discount-policies')} ? 'active'">도서 할인 정책</a>
                    <a class="collapse-item" href="/admin/categories" th:classappend="${currentUri != null && currentUri.startsWith('/admin/categories')} ? 'active'">카테고리 관리</a>
                    <a class="collapse-item" href="/admin/reviews" th:classappend="${currentUri != null && currentUri.startsWith('/admin/reviews')} ? 'active'">리뷰 관리</a>
                </div>
            </div>
        </li>

        <li class="nav-item"
            th:with="isDeliveryActive=${currentUri != null && (currentUri.startsWith('/admin/delivery') or currentUri.startsWith('/admin/refunds'))}"
            th:classappend="${isDeliveryActive} ? 'active'">

            <a class="nav-link" th:classappend="${!isDeliveryActive} ? 'collapsed'"
               href="#"
               data-bs-toggle="collapse" data-bs-target="#collapseDelivery"
               th:aria-expanded="${isDeliveryActive} ? 'true' : 'false'"
               aria-controls="collapseDelivery">
                <i class="fas fa-fw fa-truck"></i>
                <span>배송 관리</span>
            </a>

            <div id="collapseDelivery" class="collapse" th:classappend="${isDeliveryActive} ? 'show'"
                 aria-labelledby="headingDelivery" data-bs-parent="#accordionSidebar">
                <div class="bg-white py-2 collapse-inner rounded">
                    <h6 class="collapse-header">배송 및 반품:</h6>
                    <a class="collapse-item" href="/admin/delivery" th:classappend="${currentUri != null && currentUri.startsWith('/admin/delivery')} ? 'active'">배송 현황 관리</a>
                    <a class="collapse-item" href="/admin/refunds" th:classappend="${currentUri != null && currentUri.startsWith('/admin/refunds')} ? 'active'">반품 요청 관리</a>
                </div>
            </div>
        </li>

        <li class="nav-item"
            th:with="isMarketingActive=${currentUri != null && (currentUri.startsWith('/admin/points') or currentUri.startsWith('/admin/grades') or currentUri.startsWith('/admin/coupons'))}"
            th:classappend="${isMarketingActive} ? 'active'">

            <a class="nav-link" th:classappend="${!isMarketingActive} ? 'collapsed'"
               href="#"
               data-bs-toggle="collapse" data-bs-target="#collapseMarketing"
               th:aria-expanded="${isMarketingActive} ? 'true' : 'false'"
               aria-controls="collapseMarketing">
                <i class="fas fa-fw fa-coins"></i>
                <span>혜택/마케팅 관리</span>
            </a>

            <div id="collapseMarketing" class="collapse" th:classappend="${isMarketingActive} ? 'show'"
                 aria-labelledby="headingMarketing" data-bs-parent="#accordionSidebar">
                <div class="bg-white py-2 collapse-inner rounded">
                    <h6 class="collapse-header">포인트 및 등급:</h6>
                    <a class="collapse-item" href="/admin/points" th:classappend="${currentUri != null && currentUri.startsWith('/admin/points')} ? 'active'">포인트 관리</a>
                    <a class="collapse-item" href="/admin/grades" th:classappend="${currentUri != null && currentUri.startsWith('/admin/grades')} ? 'active'">등급 적립률 관리</a>
                    <div class="collapse-divider"></div>
                    <h6 class="collapse-header">쿠폰:</h6>
                    <a class="collapse-item" href="/admin/coupons/policies" th:classappend="${currentUri != null && currentUri.startsWith('/admin/coupons')} ? 'active'">쿠폰 정책 관리</a>
                    <a class="collapse-item"
                       href="/admin/coupons/policies/category"
                       th:classappend="${currentUri == '/admin/coupons/policies/category'} ? 'active'">
                        카테고리/전체 정책 생성
                    </a>
                    <a class="collapse-item"
                       href="/admin/coupons/policies/book"
                       th:classappend="${currentUri == '/admin/coupons/policies/book'} ? 'active'">
                        도서 정책 생성
                    </a>
                </div>
            </div>
        </li>

        <hr class="sidebar-divider d-none d-md-block">

        <div class="text-center d-none d-md-inline">
            <button class="rounded-circle border-0" id="sidebarToggle"></button>
        </div>

    </ul>
    <div id="content-wrapper" class="d-flex flex-column">

        <div class="content-inner-padding flex-grow-1">
            <div layout:fragment="pageContent">
            </div>

            <div layout:fragment="pageScript"></div>
        </div>
        <footer class="sticky-footer bg-white">
            <div class="container my-auto">
                <div class="copyright text-center my-auto d-flex flex-column align-items-center">
                    <span class="mb-2">© 2025 Team4 4VIDIA | NHN Academy Project</span>

                    <a href="/docs/index.html" target="_blank" class="text-gray-600 hover-primary">
                        <i class="fas fa-book mr-1"></i>REST API Docs
                    </a>
                </div>
            </div>
        </footer>

    </div>
</div>
<a class="scroll-to-top rounded" href="#page-top">
    <i class="fas fa-angle-up"></i>
</a>

<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
<script th:src="@{/js/sb-admin-2.min.js}"></script>

<script th:src="@{/customJs/get-cookie.js}"></script>

</body>
</html>
