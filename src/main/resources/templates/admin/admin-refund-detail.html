<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/admin-layout}">
<head>
    <meta charset="UTF-8">
    <title>반품 상세</title>
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">

    <style>
        .badge-status {
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
<div layout:fragment="pageContent">

    <div class="d-flex justify-content-between mb-3">
        <h1 class="h3 text-gray-800 mb-0">반품 상세내역</h1>
        <a th:href="@{/admin/refunds(refundStatus=${refund.refundStatus}, page=${page})}"
           class="btn btn-outline-secondary btn-sm">← 목록으로</a>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">

            <table class="table table-bordered mb-4">
                <tbody>
                <tr>
                    <th class="bg-light" style="width: 200px;">반품번호</th>
                    <td th:text="${refund.orderId}"></td>
                </tr>

                <tr>
                    <th class="bg-light" style="width: 200px;">주문번호</th>
                    <td th:text="${refund.orderId}"></td>
                </tr>

                <tr>
                    <th class="bg-light" style="width: 200px;">이메일</th>
                    <td th:text="${refund.email}"></td>
                </tr>

                <tr>
                    <th class="bg-light" style="width: 200px;">이름</th>
                    <td th:text="${refund.name}"></td>
                </tr>

                <tr>
                    <th class="bg-light" style="width: 200px;">반품 사유</th>
                    <td th:text="${refund.description}"></td>
                </tr>

                <tr>
                    <th class="bg-light">반품 상태</th>
                    <td>
                        <span class="badge-status"
                              th:text="${refund.refundStatus}"
                              th:classappend="
                                ${refund.refundStatus} == 'PROCESS'   ? ' bg-secondary text-white' :
                                (${refund.refundStatus} == 'APPROVED' ? ' bg-primary text-white' :
                                (${refund.refundStatus} == 'REJECTED' ? ' bg-success text-white' :
                                ' bg-danger text-white'))
                              ">
                        </span>
                    </td>
                </tr>
                <tr>
                    <th class="bg-light">반품 신청일</th>
                    <td th:text="${#temporals.format(refund.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                </tr>

                <tr>
                    <th class="bg-light">반품 아이템</th>
                    <td>
                        <div class="card-body">
                            <div th:each="item : ${refund.items}" class="row mb-4 border-bottom pb-4 align-items-center">
                                <div class="col-md-2 text-center">
                                    <img th:if="${item.bookImgUrl != null}"
                                         th:src="${item.bookImgUrl}"
                                         class="img-fluid rounded border"
                                         alt="Book Cover" style="max-height: 100px;">
                                    <div th:unless="${item.bookImgUrl != null}" class="bg-light rounded p-3">
                                        <i class="fas fa-book fa-2x text-gray-300"></i>
                                    </div>
                                </div>

                                <div class="col-md-7">
                                    <h5 class="font-weight-bold text-dark mb-1">
                                        <a href="#" th:text="${item.bookTitle}" class="text-dark text-decoration-none">책 제목</a>
                                    </h5>

                                    <div class="d-flex align-items-center mb-2">
                                    <span class="font-weight-bold mr-2"
                                          th:text="|${#numbers.formatInteger(item.salePrice, 0, 'COMMA')}|">₩35,000</span>
                                        <span class="text-xs text-gray-600" th:text="|x ${item.quantity}권|">x 1권</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>

                </tbody>
            </table>

            <!-- 상태 변경 버튼 -->
            <div class="d-flex justify-content-end"
                 th:if="${refund.refundStatus == 'PROCESS'}">

                <!-- 반품 승인 -->
                <form th:action="@{/admin/refunds/{id}(id=${refund.refundId})}"
                      method="post"
                      th:if="${refund.refundStatus == 'PROCESS'}"
                      style="display:inline-block;">

                    <input type="hidden" name="refundStatus" value="APPROVED">
                    <input type="hidden" name="page" th:value="${page}">

                    <button type="submit"
                            class="btn btn-success me-2"
                            onclick="return confirm('반품을 승인하시겠습니까?');">
                        반품 승인
                    </button>
                </form>


                <!-- 반품 거절 -->
                <form th:action="@{/admin/refunds/{id}(id=${refund.refundId})}"
                      method="post"
                      th:if="${refund.refundStatus == 'PROCESS'}"
                      style="display:inline-block;">

                    <input type="hidden" name="refundStatus" value="REJECTED">
                    <input type="hidden" name="rejectDetail" value="">
                    <input type="hidden" name="page" th:value="${page}">

                    <button type="submit"
                            class="btn btn-danger"
                            onclick="return confirm('반품을 거절하시겠습니까?');">
                        반품 거절
                    </button>
                </form>


            </div>


        </div>
    </div>

</div>
</body>
</html>
