<!DOCTYPE html>
<html lang="ko">


<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">

    <script src="/t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
</head>

<body class="bg-gradient-primary">

<div class="container">

    <div class="card o-hidden border-0 shadow-lg my-5">
        <div class="card-body p-0">
            <div class="row">
                <div class="col-lg-7 mx-auto">
                    <div class="p-5">
                        <h1 class="h4 text-gray-900 mb-4">회원가입</h1>

                        <form class="user" th:action="@{/auth/signup}" method="post">
                            <div class="form-group">
                                <input type="text" name="name" class="form-control form-control-user"
                                       placeholder="이름" required>
                            </div>

                            <div class="form-group">
                                <input type="tel" name="phone" class="form-control form-control-user"
                                       placeholder="예: 01012345678"
                                       pattern="01[016789][0-9]{7,8}"
                                       title="숫자만 입력해주세요. 예: 01012345678"
                                       required>
                            </div>


                            <script>
                                function checkEmail() {
                                    const email = document.getElementById('email').value;
                                    const feedback = document.getElementById('emailFeedback');

                                    if (!email) {
                                        feedback.textContent = "이메일을 입력해주세요.";
                                        feedback.style.color = "red";
                                        return;
                                    }

                                    fetch(`/auth/check-email?email=${encodeURIComponent(email)}`, {
                                        method: 'GET',
                                        credentials: 'same-origin'
                                    })
                                        .then(function(res) {
                                            if (!res.ok) {
                                                throw new Error(`서버 응답이 정상적이지 않습니다. 상태: ${res.status}`);
                                            }
                                            return res.json(); // 이 시점에서 반드시 JSON이 와야 함
                                        })
                                        .then(function(exists) {
                                            if (exists) {
                                                feedback.textContent = "이미 사용 중인 이메일입니다.";
                                                feedback.style.color = "red";
                                            } else {
                                                feedback.textContent = "사용 가능한 이메일입니다!";
                                                feedback.style.color = "green";
                                            }
                                        })
                                        .catch(function(err) {
                                            feedback.textContent = "서버와 통신 중 오류가 발생했습니다.";
                                            feedback.style.color = "red";
                                            console.error('email check error:', err);
                                        });
                                }
                            </script>
                            <div class="form-group">
                                <div class="d-flex">
                                    <input type="email" id="email" name="email" class="form-control form-control-user"
                                           placeholder="이메일" required>
                                    <button type="button" class="btn btn-secondary ml-2" onclick="checkEmail()">중복확인</button>
                                </div>
                                <small id="emailFeedback" class="form-text text-muted"></small>
                            </div>

                            <div class="form-group">
                                <input type="password"
                                       name="password"
                                       class="form-control form-control-user"
                                       placeholder="비밀번호"
                                       required
                                       pattern="^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]{8,20}$"
                                       title="비밀번호는 8~20자이며, 소문자, 숫자, 특수문자를 각각 1개 이상 포함해야 합니다.">
                            </div>


                            <div class="form-group">
                                <p>생년월일</p>
                                <input type="date" name="birthDate"
                                       class="form-control form-control-user"
                                       th:max="${T(java.time.LocalDate).now()}"
                                       required>
                            </div>

                            <hr>

                            <button type="submit" class="btn btn-primary btn-user btn-block">
                                회원가입하기
                            </button>
                        </form>

                        <hr>
                        <a th:href="@{/auth/login}" class="small">이미 계정이 있으신가요?</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

</body>

</html>
