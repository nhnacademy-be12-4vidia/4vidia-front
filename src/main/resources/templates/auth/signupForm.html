<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- ✅ 반응형 필수 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>회원가입</title>

    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">

    <script src="/t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <style>
        /* 버튼 텍스트 정렬 완전 고정 */
        .btn,
        .btn-user {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            padding: 0 16px;
            white-space: nowrap;
        }

        body.bg-gradient-primary {
            background: #f8fafc !important;
        }

        .container > .card {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        }

        .container .card .card {
            background: transparent !important;
            box-shadow: none !important;
            border-radius: 0 !important;
            margin: 0 !important;
        }

        .signup-title {
            font-size: 1.7rem;
            font-weight: 800;
            color: #1f2937;
        }

        .signup-sub {
            font-size: 0.9rem;
            color: #6b7280;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #374151;
        }

        .form-control-user {
            height: 48px;
            border-radius: 7px;
            border: 1px solid #e5e7eb;
            background-color: #ffffff;
            font-size: 0.95rem;
            padding: 0 14px;
            transition: all 0.2s ease;
        }

        .form-control-user::placeholder {
            color: #9ca3af;
        }

        .form-control-user:focus {
            border-color: #4e73df;
            box-shadow: 0 0 0 3px rgba(78, 115, 223, 0.15);
        }

        .email-check-wrapper {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .email-input {
            flex: 1;
            min-width: 0;
        }

        #emailDupBtn {
            background: #f1f5f9;
            border: 1px solid #e5e7eb;
            color: #374151;
        }

        #emailDupBtn:hover {
            background: #e5e7eb;
        }

        .check-btn {
            height: 48px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        #signupButton {
            background-color: #4e73df;
            border-color: #4e73df;
            font-size: 1rem;
            border-radius: 12px;
        }

        #signupButton:hover {
            background-color: #2e59d9;
            border-color: #2e59d9;
        }

        #signupButton:disabled {
            background-color: #c7d2fe !important;
            border-color: #c7d2fe !important;
        }

        .password-wrapper {
            position: relative;
        }

        .password-check-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            color: #10b981;
            display: none;
        }

        /* 인증코드 입력 + 타이머 배지 */
        .code-input-wrapper {
            position: relative;
            flex: 1;
            min-width: 0;
        }

        #emailCode {
            padding-right: 70px; /* 타이머 공간 확보 */
        }

        .timer-badge {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.75rem;
            font-weight: 700;
            color: #6b7280;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 999px;
            padding: 4px 8px;
            display: none; /* JS에서 보이게 */
        }

        .timer-badge.danger {
            color: #dc2626;
            border-color: rgba(220, 38, 38, 0.35);
            background: rgba(220, 38, 38, 0.06);
        }

        .email-feedback,
        .form-feedback {
            display: block;
            margin-top: 6px;
            font-size: 0.82rem;
            font-weight: 700;
        }

        /* 링크 */
        a[href*="/auth/login"] {
            font-size: 0.85rem;
            color: #6b7280;
        }

        a[href*="/auth/login"]:hover {
            color: #4e73df;
            text-decoration: underline;
        }

        /* =========================================================
           ✅ 반응형 업그레이드
           ========================================================= */

        /* 태블릿 이하 */
        @media (max-width: 992px) {
            .container {
                padding-left: 14px;
                padding-right: 14px;
            }
            .p-5 {
                padding: 2rem !important;
            }
        }

        /* 모바일 */
        @media (max-width: 768px) {
            /* 카드 여백 줄이기 */
            .card.o-hidden.my-5 {
                margin-top: 1.5rem !important;
                margin-bottom: 1.5rem !important;
            }
            .card.o-hidden.mt-5.mb-5 {
                margin-top: 1.25rem !important;
                margin-bottom: 1.25rem !important;
            }

            .p-5 {
                padding: 1.5rem !important;
            }

            .signup-title {
                font-size: 1.35rem;
            }

            .form-control-user,
            .btn {
                height: 46px;
            }

            /* ✅ 이메일 input + 버튼들 줄바꿈 */
            .email-check-wrapper {
                flex-wrap: wrap;
                gap: 8px;
            }

            .email-check-wrapper .email-input {
                flex: 1 1 100%;
                width: 100%;
            }

            #emailDupBtn,
            #sendOrResendBtn {
                flex: 1 1 calc(50% - 4px);
                width: calc(50% - 4px);
            }

            /* 인증코드 입력/버튼도 줄바꿈 */
            #codeBlock {
                flex-wrap: wrap;
            }

            #codeBlock .code-input-wrapper {
                flex: 1 1 100%;
                width: 100%;
            }

            #verifyCodeBtn {
                flex: 1 1 100%;
                width: 100%;
            }

            #signupButton {
                width: 100%;
                height: 48px;
                font-size: 0.95rem;
            }
        }

        /* 초소형 모바일 */
        @media (max-width: 420px) {
            .p-5 {
                padding: 1.25rem !important;
            }

            #emailDupBtn,
            #sendOrResendBtn {
                flex: 1 1 100%;
                width: 100%;
            }

            .signup-sub {
                font-size: 0.85rem;
            }
        }
    </style>
</head>

<body class="bg-gradient-primary">
<div class="container">
    <div class="card o-hidden border-0 shadow-lg my-5">
        <div class="card o-hidden border-0 mt-5 mb-5">
            <div class="row">
                <div class="col-lg-7 mx-auto">
                    <div class="p-5">

                        <h1 class="h3 text-gray-900 mb-3 signup-title text-center">회원가입</h1>
                        <p class="text-center text-muted mb-4 signup-sub">4VIDIA의 회원이 되어보세요!</p>

                        <form class="user" th:action="@{/auth/signup}" method="post"
                              onsubmit="return validateForm(event)">

                            <div class="form-group">
                                <label for="name">이름</label>
                                <div class="input-wrapper">
                                    <input type="text" id="name" name="name"
                                           class="form-control form-control-user"
                                           placeholder="이름" required
                                           oninput="updateSignupButtonState()">
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="phone">전화번호</label>
                                <div class="input-wrapper">
                                    <input type="tel" id="phone" name="phone"
                                           class="form-control form-control-user"
                                           placeholder="전화번호 (숫자만 입력)" maxlength="13" required
                                           oninput="handlePhoneInput(this)">
                                </div>
                            </div>

                            <!-- 이메일: 중복확인 + 인증코드 발송/확인 -->
                            <div class="form-group">
                                <label for="email">이메일</label>
                                <div class="input-wrapper">

                                    <div class="email-check-wrapper">
                                        <input type="email" id="email" name="email"
                                               class="form-control form-control-user email-input"
                                               placeholder="이메일" required
                                               oninput="resetEmailValidation()">

                                        <button type="button" class="btn btn-secondary check-btn"
                                                id="emailDupBtn" onclick="checkEmail()">중복확인</button>

                                        <button type="button" class="btn btn-outline-primary check-btn"
                                                id="sendOrResendBtn" onclick="sendEmailCode()" disabled>
                                            인증코드 발송
                                        </button>
                                    </div>

                                    <small id="emailFeedback" class="email-feedback"></small>

                                    <div class="email-check-wrapper mt-2" id="codeBlock" style="display:none;">
                                        <div class="code-input-wrapper">
                                            <input type="text" id="emailCode"
                                                   class="form-control form-control-user email-input"
                                                   placeholder="인증코드 6자리 입력"
                                                   maxlength="6"
                                                   oninput="updateSignupButtonState()">
                                            <span id="timerBadge" class="timer-badge">03:00</span>
                                        </div>

                                        <button type="button" class="btn btn-primary check-btn"
                                                id="verifyCodeBtn" onclick="verifyEmailCode()">인증확인</button>
                                    </div>

                                    <small id="codeFeedback" class="form-feedback"></small>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="password">비밀번호</label>
                                <div class="input-wrapper password-wrapper">
                                    <input type="password" id="password" name="password"
                                           class="form-control form-control-user"
                                           placeholder="비밀번호" required
                                           pattern="^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]{8,20}$"
                                           oninput="validatePassword(); updateSignupButtonState()">
                                    <i id="passwordCheckIcon" class="fas fa-check-circle password-check-icon"></i>
                                    <small class="text-muted" style="margin-top:4px; display:block;">
                                        영문, 숫자, 특수문자 포함 8~20자
                                    </small>
                                </div>
                            </div>

                            <!-- 생년월일 -->
                            <div class="form-group">
                                <label for="birthDate">생년월일</label>
                                <div class="input-wrapper">
                                    <input type="date" id="birthDate" name="birthDate"
                                           class="form-control form-control-user"
                                           min="1900-01-01"
                                           required>
                                </div>
                            </div>

                            <button type="submit" id="signupButton"
                                    class="btn btn-primary btn-user btn-block" disabled>
                                회원가입하기
                            </button>
                        </form>

                        <hr>
                        <a th:href="@{/auth/login}">이미 계정이 있으신가요?</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/customJs/signup.js}"></script>
</body>
</html>
