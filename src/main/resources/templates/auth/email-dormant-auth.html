<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>휴면 계정 메일 인증</title>

    <!-- 파비콘 설정 -->
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
</head>
<body class="bg-gradient-primary">

<div class="container">
    <div class="card o-hidden border-0 shadow-lg my-5">
        <div class="card-body p-0">
            <div class="row">
                <div class="col-lg-6 d-none d-lg-block bg-password-image"></div>
                <div class="col-lg-6">
                    <div class="p-5">
                        <!-- 인증코드 전송 성공 메시지 -->
                        <div th:if="${param.sent}" class="alert alert-info">
                            <i class="fas fa-envelope mr-1"></i>
                            입력하신 메일 주소로 인증코드가 발송되었습니다.
                        </div>

                        <!-- 인증코드 오류 메시지 -->
                        <div th:if="${param.errorMsg}" class="alert alert-danger">
                            <i class="fas fa-exclamation-circle mr-1"></i>
                            <span th:text="${param.errorMsg}"></span>
                        </div>

                        <!- 인증 성공 메시지 -->
                        <div th:if="${param.success}" class="alert alert-success text-center">
                            <i class="fas fa-check-circle mr-1"></i>
                            휴면 계정 인증이 완료되었습니다!
                            <div class="mt-3">
                                <a href="/auth/login" class="btn btn-success btn-sm">
                                    로그인 하러 가기
                                </a>
                            </div>
                        </div>

                        <div class="text-center">
                            <h1 class="h4 text-gray-900 mb-4">메일로 휴면 인증</h1>
                        </div>

                        <form class="user mb-4" th:action="@{/auth/dormant/send-code/email}" method="post">
                            <input type="hidden" name="email" th:value="${email}"/>

                            <div class="form-group">
                                <input type="email" name="contactEmail" class="form-control form-control-user"
                                       placeholder="인증코드를 받을 이메일 입력" required>
                            </div>

                            <button type="submit" class="btn btn-primary btn-user btn-block">
                                인증코드 전송
                            </button>
                        </form>

                        <hr>

                        <form class="user" th:action="@{/auth/dormant/verify/email}" method="post">
                            <input type="hidden" name="email" th:value="${email}"/>

                            <div class="form-group">
                                <input type="text" name="code"
                                       class="form-control form-control-user"
                                       placeholder="인증코드 입력" maxlength="8" required>
                            </div>

                            <button type="submit" class="btn btn-success btn-user btn-block">
                                휴면 해제하기
                            </button>
                        </form>

                        <hr>

                        <div class="text-center">
                            <a class="small" href="/auth/dormant-auth" th:href="@{/auth/dormant-auth(email=${email})}">
                                Dooray로 인증하기
                            </a>
                        </div>
                        <div class="text-center">
                            <a class="small" href="/auth/login">로그인 페이지로 돌아가기</a>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
